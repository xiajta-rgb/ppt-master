<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    时间轴模板
    用途: 时序事件展示
    适用场景: 项目里程碑、历史演进、产品路线图
    支持: 6个节点 (推荐3-8个)
    -->
    
    <defs>
        <!-- 节点渐变 -->
        <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
        </linearGradient>
        
        <!-- 节点阴影 -->
        <filter id="nodeShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="3"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.4"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- 卡片阴影 -->
        <filter id="cardShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>产品发展路线图</tspan>
    </text>
    
    <text x="90" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>2024年 - 2026年 · 关键里程碑</tspan>
    </text>
    
    <!-- 时间轴 -->
    <g id="timeline">
        <!-- 主时间线 (y: 360) -->
        <line x1="180" y1="540" x2="1740" y2="540" stroke="#E0E0E0" stroke-width="9" stroke-linecap="round"/>
        
        <!-- 渐变进度条 (已完成部分) -->
        <defs>
            <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
            </linearGradient>
        </defs>
        <line x1="180" y1="540" x2="960" y2="540" stroke="url(#progressGrad)" stroke-width="9" stroke-linecap="round"/>
        
        <!-- 节点位置 (6个节点, 间距 208px) -->
        <!-- x坐标: 120, 328, 536, 744, 952, 1160 -->
        
        <!-- 节点1: 2024 Q1 - 产品立项 (已完成) -->
        <g id="milestone1">
            <circle cx="180" cy="540" r="27" fill="url(#nodeGrad2)" stroke="#FFFFFF" stroke-width="4" filter="url(#nodeShadow)"/>
            <path d="M 172,540 L 177,548 L 188,532" stroke="#FFFFFF" stroke-width="3.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- 卡片 -->
            <rect x="60" y="285" width="240" height="180" rx="12" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3" filter="url(#cardShadow)"/>
            <text x="180" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" font-weight="600" fill="#4CAF50" text-anchor="middle">
                <tspan>2024 Q1</tspan>
            </text>
            <text x="180" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="24" font-weight="bold" fill="#2C3E50" text-anchor="middle">
                <tspan>产品立项</tspan>
            </text>
            <text x="180" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#5D6D7E" text-anchor="middle">
                <tspan>完成需求分析</tspan>
            </text>
            <text x="180" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#5D6D7E" text-anchor="middle">
                <tspan>制定技术方案</tspan>
            </text>
            <line x1="180" y1="465" x2="180" y2="510" stroke="#4CAF50" stroke-width="3" stroke-dasharray="4,4"/>
        </g>
        
        <!-- 节点2: 2024 Q2 - MVP开发 (已完成) -->
        <g id="milestone2">
            <circle cx="492" cy="540" r="27" fill="url(#nodeGrad2)" stroke="#FFFFFF" stroke-width="4" filter="url(#nodeShadow)"/>
            <path d="M 484,540 L 489,548 L 500,532" stroke="#FFFFFF" stroke-width="3.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- 卡片 -->
            <rect x="372" y="645" width="240" height="180" rx="12" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3" filter="url(#cardShadow)"/>
            <text x="492" y="690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" font-weight="600" fill="#4CAF50" text-anchor="middle">
                <tspan>2024 Q2</tspan>
            </text>
            <text x="492" y="728" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="24" font-weight="bold" fill="#2C3E50" text-anchor="middle">
                <tspan>MVP开发</tspan>
            </text>
            <text x="492" y="765" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#5D6D7E" text-anchor="middle">
                <tspan>核心功能上线</tspan>
            </text>
            <text x="492" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#5D6D7E" text-anchor="middle">
                <tspan>内测验证</tspan>
            </text>
            <line x1="492" y1="570" x2="492" y2="615" stroke="#4CAF50" stroke-width="3" stroke-dasharray="4,4"/>
        </g>
        
        <!-- 节点3: 2024 Q3 - 公测上线 (已完成) -->
        <g id="milestone3">
            <circle cx="804" cy="540" r="27" fill="url(#nodeGrad2)" stroke="#FFFFFF" stroke-width="4" filter="url(#nodeShadow)"/>
            <path d="M 796,540 L 801,548 L 812,532" stroke="#FFFFFF" stroke-width="3.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- 卡片 -->
            <rect x="684" y="285" width="240" height="180" rx="12" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3" filter="url(#cardShadow)"/>
            <text x="804" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" font-weight="600" fill="#4CAF50" text-anchor="middle">
                <tspan>2024 Q3</tspan>
            </text>
            <text x="804" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="24" font-weight="bold" fill="#2C3E50" text-anchor="middle">
                <tspan>公测上线</tspan>
            </text>
            <text x="804" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#5D6D7E" text-anchor="middle">
                <tspan>开放用户注册</tspan>
            </text>
            <text x="804" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#5D6D7E" text-anchor="middle">
                <tspan>用户达5000+</tspan>
            </text>
            <line x1="804" y1="465" x2="804" y2="510" stroke="#4CAF50" stroke-width="3" stroke-dasharray="4,4"/>
        </g>
        
        <!-- 节点4: 2024 Q4 - 功能迭代 (进行中) -->
        <g id="milestone4">
            <circle cx="1116" cy="540" r="30" fill="url(#nodeGrad1)" stroke="#FFFFFF" stroke-width="4" filter="url(#nodeShadow)"/>
            <circle cx="1116" cy="540" r="12" fill="#FFFFFF"/>
            
            <!-- 卡片 -->
            <rect x="996" y="645" width="240" height="180" rx="12" fill="#FFFFFF" stroke="#2196F3" stroke-width="3" filter="url(#cardShadow)"/>
            <rect x="996" y="645" width="240" height="9" rx="4" fill="#2196F3"/>
            <text x="1116" y="690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" font-weight="600" fill="#2196F3" text-anchor="middle">
                <tspan>2024 Q4</tspan>
            </text>
            <text x="1116" y="728" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="24" font-weight="bold" fill="#2C3E50" text-anchor="middle">
                <tspan>功能迭代</tspan>
            </text>
            <text x="1116" y="765" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#5D6D7E" text-anchor="middle">
                <tspan>AI功能集成</tspan>
            </text>
            <text x="1116" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#5D6D7E" text-anchor="middle">
                <tspan>多端适配</tspan>
            </text>
            <line x1="1116" y1="570" x2="1116" y2="615" stroke="#2196F3" stroke-width="3" stroke-dasharray="4,4"/>
            
            <!-- 进行中标记 -->
            <rect x="1071" y="852" width="90" height="33" rx="16" fill="#2196F3"/>
            <text x="1116" y="874" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">
                <tspan>进行中</tspan>
            </text>
        </g>
        
        <!-- 节点5: 2025 Q2 - 商业化 (计划中) -->
        <g id="milestone5">
            <circle cx="1428" cy="540" r="24" fill="#E0E0E0" stroke="#FFFFFF" stroke-width="4" filter="url(#nodeShadow)"/>
            <circle cx="1428" cy="540" r="9" fill="#FFFFFF"/>
            
            <!-- 卡片 -->
            <rect x="1308" y="285" width="240" height="180" rx="12" fill="#F8F9FA" stroke="#B0BEC5" stroke-width="3" filter="url(#cardShadow)"/>
            <text x="1428" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" font-weight="600" fill="#607D8B" text-anchor="middle">
                <tspan>2025 Q2</tspan>
            </text>
            <text x="1428" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="24" font-weight="bold" fill="#5D6D7E" text-anchor="middle">
                <tspan>商业化</tspan>
            </text>
            <text x="1428" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#7F8C8D" text-anchor="middle">
                <tspan>会员体系上线</tspan>
            </text>
            <text x="1428" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#7F8C8D" text-anchor="middle">
                <tspan>启动推广</tspan>
            </text>
            <line x1="1428" y1="465" x2="1428" y2="510" stroke="#B0BEC5" stroke-width="3" stroke-dasharray="4,4"/>
        </g>
        
        <!-- 节点6: 2026 Q1 - 规模化 (计划中) -->
        <g id="milestone6">
            <circle cx="1740" cy="540" r="24" fill="#E0E0E0" stroke="#FFFFFF" stroke-width="4" filter="url(#nodeShadow)"/>
            <circle cx="1740" cy="540" r="9" fill="#FFFFFF"/>
            
            <!-- 卡片 -->
            <rect x="1620" y="645" width="240" height="180" rx="12" fill="#F8F9FA" stroke="#B0BEC5" stroke-width="3" filter="url(#cardShadow)"/>
            <text x="1740" y="690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" font-weight="600" fill="#607D8B" text-anchor="middle">
                <tspan>2026 Q1</tspan>
            </text>
            <text x="1740" y="728" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="24" font-weight="bold" fill="#5D6D7E" text-anchor="middle">
                <tspan>规模化</tspan>
            </text>
            <text x="1740" y="765" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#7F8C8D" text-anchor="middle">
                <tspan>国际化扩张</tspan>
            </text>
            <text x="1740" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#7F8C8D" text-anchor="middle">
                <tspan>生态建设</tspan>
            </text>
            <line x1="1740" y1="570" x2="1740" y2="615" stroke="#B0BEC5" stroke-width="3" stroke-dasharray="4,4"/>
        </g>
    </g>
    
    <!-- 图例 -->
    <g id="legend">
        <circle cx="120" cy="952" r="15" fill="url(#nodeGrad2)"/>
        <path d="M 112,952 L 117,960 L 128,938" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
        <text x="150" y="960" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>已完成</tspan>
        </text>
        
        <circle cx="300" cy="952" r="15" fill="url(#nodeGrad1)"/>
        <circle cx="300" cy="952" r="6" fill="#FFFFFF"/>
        <text x="330" y="960" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>进行中</tspan>
        </text>
        
        <circle cx="465" cy="952" r="15" fill="#E0E0E0"/>
        <circle cx="465" cy="952" r="6" fill="#FFFFFF"/>
        <text x="495" y="960" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>计划中</tspan>
        </text>
    </g>
    
    <!-- 数据来源 -->
    <text x="90" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" fill="#95A5A6">
        <tspan>数据来源: 产品管理部门</tspan>
    </text>
</svg>

