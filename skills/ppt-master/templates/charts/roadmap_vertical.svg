<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!--
    纵向路线图模板
    用途: 垂直时间线、里程碑路线图
    适用场景: 年度规划、产品路线图、战略里程碑
    支持: 6节点纵向 (推荐4-8个)
    -->

    <defs>
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#0984E3;stop-opacity:1"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 标题 -->
    <text x="90" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="45" font-weight="700" fill="#1A252F">2025年度战略路线图</text>
    <text x="90" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">Annual Roadmap · 六大关键里程碑</text>

    <!-- 主纵向时间线 (x=180) -->
    <line x1="270" y1="172" x2="270" y2="1035" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
    <!-- 渐变进度覆盖 (已完成部分) -->
    <line x1="270" y1="172" x2="270" y2="600" stroke="url(#lineGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- 节点1: Q1 (已完成) -->
    <circle cx="270" cy="222" r="24" fill="#6C5CE7" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M 262,222 L 267,230 L 278,214" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="330" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#6C5CE7">2025 Q1</text>
    <rect x="330" y="222" width="660" height="93" rx="12" fill="#FFFFFF" stroke="#6C5CE7" stroke-width="2.2" filter="url(#cardShadow)"/>
    <text x="360" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">组织架构升级</text>
    <text x="360" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#7F8C8D">完成事业部制改革，成立三大业务线独立运营单元</text>
    <rect x="870" y="236" width="78" height="30" rx="15" fill="#6C5CE7" fill-opacity="0.1"/>
    <text x="909" y="256" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#6C5CE7">已完成</text>

    <!-- 节点2: Q1末 (已完成) -->
    <circle cx="270" cy="382" r="24" fill="#A29BFE" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M 262,382 L 267,390 L 278,375" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="330" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#A29BFE">2025 Q1末</text>
    <rect x="330" y="382" width="660" height="93" rx="12" fill="#FFFFFF" stroke="#A29BFE" stroke-width="2.2" filter="url(#cardShadow)"/>
    <text x="360" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">A轮融资关闭</text>
    <text x="360" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#7F8C8D">完成A轮¥5000万融资，估值达到¥3亿</text>
    <rect x="870" y="396" width="78" height="30" rx="15" fill="#A29BFE" fill-opacity="0.1"/>
    <text x="909" y="417" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#A29BFE">已完成</text>

    <!-- 节点3: Q2 (进行中) -->
    <circle cx="270" cy="543" r="27" fill="#0984E3" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="270" cy="543" r="10" fill="#FFFFFF"/>
    <text x="330" y="531" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#0984E3">2025 Q2</text>
    <rect x="330" y="543" width="660" height="93" rx="12" fill="#FFFFFF" stroke="#0984E3" stroke-width="3" filter="url(#cardShadow)"/>
    <rect x="330" y="543" width="660" height="8" rx="4" fill="#0984E3"/>
    <text x="360" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">产品V2.0发布</text>
    <text x="360" y="618" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#7F8C8D">集成AI引擎，上线智能推荐和自动化工作流</text>
    <rect x="870" y="561" width="78" height="30" rx="15" fill="#0984E3"/>
    <text x="909" y="582" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="700" fill="#FFFFFF">进行中</text>

    <!-- 右侧卡片 (下方节点换到右侧展示) -->
    <!-- 节点4: Q3 -->
    <circle cx="270" cy="705" r="21" fill="#E0E0E0" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="270" cy="705" r="8" fill="#FFFFFF"/>
    <text x="330" y="693" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="600" fill="#95A5A6">2025 Q3</text>
    <rect x="330" y="705" width="660" height="93" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="360" y="741" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="600" fill="#5F6368">海外市场试水</text>
    <text x="360" y="774" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#95A5A6">东南亚三国试点运营，验证本地化策略</text>

    <!-- 节点5: Q4 -->
    <circle cx="270" cy="866" r="21" fill="#E0E0E0" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="270" cy="866" r="8" fill="#FFFFFF"/>
    <text x="330" y="854" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="600" fill="#95A5A6">2025 Q4</text>
    <rect x="330" y="866" width="660" height="93" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="360" y="902" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="600" fill="#5F6368">B轮融资启动</text>
    <text x="360" y="934" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#95A5A6">目标估值¥10亿，完成规模化扩张资金储备</text>

    <!-- 节点6: 年末 -->
    <circle cx="270" cy="1008" r="21" fill="#E0E0E0" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="270" cy="1008" r="8" fill="#FFFFFF"/>
    <text x="330" y="1008" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="600" fill="#95A5A6">2025 年末</text>
    <text x="510" y="1008" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#95A5A6">· 用户突破500万 · ARR达到¥1.5亿</text>

    <!-- 右侧年度目标面板 -->
    <rect x="1140" y="172" width="690" height="870" rx="18" fill="#F8F9FA" filter="url(#cardShadow)"/>
    <text x="1485" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="700" fill="#1A252F">年度核心目标</text>
    <line x1="1200" y1="258" x2="1770" y2="258" stroke="#E0E0E0" stroke-width="2"/>

    <!-- 目标1 -->
    <circle cx="1215" cy="315" r="12" fill="#6C5CE7"/>
    <text x="1245" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#1A252F">营收目标</text>
    <text x="1245" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="54" font-weight="800" fill="#6C5CE7">¥1.5亿</text>
    <text x="1455" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">ARR</text>

    <!-- 目标2 -->
    <circle cx="1215" cy="435" r="12" fill="#00B894"/>
    <text x="1245" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#1A252F">用户增长</text>
    <text x="1245" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="54" font-weight="800" fill="#00B894">500万</text>
    <text x="1440" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">注册用户</text>

    <!-- 目标3 -->
    <circle cx="1215" cy="555" r="12" fill="#FDCB6E"/>
    <text x="1245" y="562" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#1A252F">团队规模</text>
    <text x="1245" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="54" font-weight="800" fill="#D4A537">300人</text>
    <text x="1410" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">年末编制</text>

    <!-- 核心策略 -->
    <line x1="1200" y1="660" x2="1770" y2="660" stroke="#E0E0E0" stroke-width="2"/>
    <text x="1485" y="705" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">关键策略</text>

    <rect x="1200" y="735" width="570" height="54" rx="12" fill="#6C5CE7" fill-opacity="0.06"/>
    <text x="1215" y="770" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#2C3E50">1. 产品驱动增长 (PLG) 策略</text>
    <rect x="1200" y="804" width="570" height="54" rx="12" fill="#00B894" fill-opacity="0.06"/>
    <text x="1215" y="838" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#2C3E50">2. 企业客户大单突破</text>
    <rect x="1200" y="873" width="570" height="54" rx="12" fill="#FDCB6E" fill-opacity="0.08"/>
    <text x="1215" y="908" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#2C3E50">3. 海外市场 PMF 验证</text>
    <rect x="1200" y="942" width="570" height="54" rx="12" fill="#E17055" fill-opacity="0.06"/>
    <text x="1215" y="976" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#2C3E50">4. AI 技术壁垒构建</text>
</svg>