<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    分组柱状图模板
    用途: 多系列数据对比
    适用场景: 多产品/时期/分类对比、同比环比分析
    支持: 4组 × 3系列（可调整为3-6组，2-4系列）
    与普通柱状图区别: 每个类别下有多个并排柱子，用于对比
    -->
    
    <defs>
        <!-- 系列1渐变（蓝色） -->
        <linearGradient id="groupGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
        </linearGradient>
        
        <!-- 系列2渐变（绿色） -->
        <linearGradient id="groupGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
        </linearGradient>
        
        <!-- 系列3渐变（橙色） -->
        <linearGradient id="groupGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
        </linearGradient>
        
        <!-- 阴影 -->
        <filter id="groupShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.25"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>各季度产品线销售对比</tspan>
    </text>
    
    <text x="90" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>2025年度 · 单位：百万元</tspan>
    </text>
    
    <!-- 图例 -->
    <g id="legend" transform="translate(1350, 105)">
        <rect x="0" y="0" width="30" height="30" rx="4" fill="url(#groupGrad1)"/>
        <text x="45" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="22" fill="#5D6D7E">
            <tspan>产品线A</tspan>
        </text>
        
        <rect x="180" y="0" width="30" height="30" rx="4" fill="url(#groupGrad2)"/>
        <text x="225" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="22" fill="#5D6D7E">
            <tspan>产品线B</tspan>
        </text>
        
        <rect x="360" y="0" width="30" height="30" rx="4" fill="url(#groupGrad3)"/>
        <text x="405" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="22" fill="#5D6D7E">
            <tspan>产品线C</tspan>
        </text>
    </g>
    
    <!-- 图表区域 -->
    <g id="chartArea">
        <!-- Y轴网格线 -->
        <line x1="210" y1="855" x2="1770" y2="855" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="720" x2="1770" y2="720" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="585" x2="1770" y2="585" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="450" x2="1770" y2="450" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="315" x2="1770" y2="315" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- Y轴刻度标签 -->
        <text x="188" y="862" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>0</tspan>
        </text>
        <text x="188" y="728" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>50</tspan>
        </text>
        <text x="188" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>100</tspan>
        </text>
        <text x="188" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>150</tspan>
        </text>
        <text x="188" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>200</tspan>
        </text>
        
        <!-- 坐标轴 -->
        <line x1="210" y1="248" x2="210" y2="855" stroke="#95A5A6" stroke-width="3"/>
        <line x1="210" y1="855" x2="1770" y2="855" stroke="#95A5A6" stroke-width="3"/>
        
        <!-- 
        分组说明：
        - 4个组（Q1-Q4），每组3个柱子
        - 组宽度：240px，组间距：20px
        - 柱宽：60px，柱间距：10px
        - 每组起始：170, 430, 690, 950
        - 每50单位=90px高度
        -->
        
        <!-- Q1 组 -->
        <!-- Q1 产品线A: 120M (高度216px) -->
        <rect x="255" y="531" width="90" height="324" rx="6" fill="url(#groupGrad1)" filter="url(#groupShadow)"/>
        <text x="300" y="513" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>120</tspan>
        </text>
        
        <!-- Q1 产品线B: 85M (高度153px) -->
        <rect x="360" y="626" width="90" height="230" rx="6" fill="url(#groupGrad2)" filter="url(#groupShadow)"/>
        <text x="405" y="608" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>85</tspan>
        </text>
        
        <!-- Q1 产品线C: 65M (高度117px) -->
        <rect x="465" y="680" width="90" height="176" rx="6" fill="url(#groupGrad3)" filter="url(#groupShadow)"/>
        <text x="510" y="662" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>65</tspan>
        </text>
        
        <!-- Q1 标签 -->
        <text x="382" y="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="27" fill="#5D6D7E" text-anchor="middle">
            <tspan>Q1</tspan>
        </text>
        
        <!-- Q2 组 -->
        <!-- Q2 产品线A: 145M (高度261px) -->
        <rect x="645" y="464" width="90" height="392" rx="6" fill="url(#groupGrad1)" filter="url(#groupShadow)"/>
        <text x="690" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>145</tspan>
        </text>
        
        <!-- Q2 产品线B: 98M (高度176px) -->
        <rect x="750" y="591" width="90" height="264" rx="6" fill="url(#groupGrad2)" filter="url(#groupShadow)"/>
        <text x="795" y="573" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>98</tspan>
        </text>
        
        <!-- Q2 产品线C: 78M (高度140px) -->
        <rect x="855" y="645" width="90" height="210" rx="6" fill="url(#groupGrad3)" filter="url(#groupShadow)"/>
        <text x="900" y="627" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>78</tspan>
        </text>
        
        <!-- Q2 标签 -->
        <text x="772" y="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="27" fill="#5D6D7E" text-anchor="middle">
            <tspan>Q2</tspan>
        </text>
        
        <!-- Q3 组 -->
        <!-- Q3 产品线A: 168M (高度302px) -->
        <rect x="1035" y="402" width="90" height="453" rx="6" fill="url(#groupGrad1)" filter="url(#groupShadow)"/>
        <text x="1080" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>168</tspan>
        </text>
        
        <!-- Q3 产品线B: 112M (高度202px) -->
        <rect x="1140" y="552" width="90" height="303" rx="6" fill="url(#groupGrad2)" filter="url(#groupShadow)"/>
        <text x="1185" y="534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>112</tspan>
        </text>
        
        <!-- Q3 产品线C: 92M (高度166px) -->
        <rect x="1245" y="606" width="90" height="249" rx="6" fill="url(#groupGrad3)" filter="url(#groupShadow)"/>
        <text x="1290" y="588" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>92</tspan>
        </text>
        
        <!-- Q3 标签 -->
        <text x="1162" y="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="27" fill="#5D6D7E" text-anchor="middle">
            <tspan>Q3</tspan>
        </text>
        
        <!-- Q4 组 -->
        <!-- Q4 产品线A: 185M (高度333px) -->
        <rect x="1425" y="356" width="90" height="500" rx="6" fill="url(#groupGrad1)" filter="url(#groupShadow)"/>
        <text x="1470" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>185</tspan>
        </text>
        
        <!-- Q4 产品线B: 125M (高度225px) -->
        <rect x="1530" y="518" width="90" height="338" rx="6" fill="url(#groupGrad2)" filter="url(#groupShadow)"/>
        <text x="1575" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>125</tspan>
        </text>
        
        <!-- Q4 产品线C: 108M (高度194px) -->
        <rect x="1635" y="564" width="90" height="291" rx="6" fill="url(#groupGrad3)" filter="url(#groupShadow)"/>
        <text x="1680" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>108</tspan>
        </text>
        
        <!-- Q4 标签 -->
        <text x="1552" y="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="27" fill="#5D6D7E" text-anchor="middle">
            <tspan>Q4</tspan>
        </text>
    </g>
    
    <!-- 趋势总结卡片 -->
    <g id="summaryCard">
        <rect x="90" y="945" width="600" height="90" rx="12" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="2"/>
        <text x="120" y="982" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>年度总计:</tspan>
        </text>
        <text x="240" y="982" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#2196F3">
            <tspan>618M</tspan>
        </text>
        <text x="330" y="982" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>|</tspan>
        </text>
        <text x="360" y="982" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#4CAF50">
            <tspan>420M</tspan>
        </text>
        <text x="450" y="982" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>|</tspan>
        </text>
        <text x="480" y="982" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#FF9800">
            <tspan>343M</tspan>
        </text>
        
        <text x="120" y="1012" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#95A5A6">
            <tspan>同比增长: +15.2%</tspan>
        </text>
    </g>
    
    <!-- 数据来源 -->
    <text x="1830" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#95A5A6" text-anchor="end">
        <tspan>数据来源: 销售部门</tspan>
    </text>
</svg>

