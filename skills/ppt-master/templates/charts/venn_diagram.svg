<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    韦恩关系图模板
    用途: 集合关系、交叉领域、共性分析
    适用场景: 能力交叉分析、部门协作关系、产品定位
    支持: 3圆交叉 (经典三元韦恩)
    -->
    
    <defs>
        <!-- 卡片阴影 -->
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.12"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题区域 -->
    <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="700" fill="#1A252F" letter-spacing="-0.8">核心能力交叉分析</text>
    <text x="90" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" fill="#7F8C8D">Core Competency Intersection · 三大领域的协同关系</text>
    
    <!-- 韦恩图主体 (中心 x=480, y=400) -->
    <!-- 圆A: 技术 (左上) -->
    <circle cx="630" cy="525" r="262" fill="#3498DB" fill-opacity="0.15" stroke="#3498DB" stroke-width="3.8" stroke-opacity="0.6"/>
    <text x="510" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="30" font-weight="700" fill="#2980B9">技术</text>
    <text x="510" y="458" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#7F8C8D">Technology</text>
    
    <!-- 圆B: 市场 (右上) -->
    <circle cx="810" cy="525" r="262" fill="#E74C3C" fill-opacity="0.15" stroke="#E74C3C" stroke-width="3.8" stroke-opacity="0.6"/>
    <text x="930" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="30" font-weight="700" fill="#C0392B">市场</text>
    <text x="930" y="458" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#7F8C8D">Market</text>
    
    <!-- 圆C: 运营 (下方) -->
    <circle cx="720" cy="690" r="262" fill="#2ECC71" fill-opacity="0.15" stroke="#2ECC71" stroke-width="3.8" stroke-opacity="0.6"/>
    <text x="720" y="840" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="30" font-weight="700" fill="#27AE60">运营</text>
    <text x="720" y="878" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#7F8C8D">Operations</text>
    
    <!-- A∩B 交叉标签 (技术+市场) -->
    <text x="720" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" font-weight="600" fill="#8E44AD">产品创新</text>
    
    <!-- A∩C 交叉标签 (技术+运营) -->
    <text x="622" y="660" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" font-weight="600" fill="#16A085">技术运维</text>
    
    <!-- B∩C 交叉标签 (市场+运营) -->
    <text x="818" y="660" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" font-weight="600" fill="#D35400">客户运营</text>
    
    <!-- 中心交叉 (核心竞争力) -->
    <text x="720" y="582" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="22" font-weight="800" fill="#2C3E50">核心竞争力</text>
    
    <!-- 右侧说明面板 -->
    <g filter="url(#cardShadow)">
        <rect x="1110" y="210" width="720" height="135" rx="15" fill="#FFFFFF"/>
        <rect x="1110" y="210" width="9" height="135" rx="4" fill="#3498DB"/>
        <circle cx="1152" cy="252" r="15" fill="#3498DB" fill-opacity="0.2"/>
        <circle cx="1152" cy="252" r="8" fill="#3498DB"/>
        <text x="1185" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="700" fill="#1A252F">技术能力</text>
        <text x="1152" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">自主研发引擎 · AI算法 · 云原生架构</text>
    </g>
    
    <g filter="url(#cardShadow)">
        <rect x="1110" y="372" width="720" height="135" rx="15" fill="#FFFFFF"/>
        <rect x="1110" y="372" width="9" height="135" rx="4" fill="#E74C3C"/>
        <circle cx="1152" cy="414" r="15" fill="#E74C3C" fill-opacity="0.2"/>
        <circle cx="1152" cy="414" r="8" fill="#E74C3C"/>
        <text x="1185" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="700" fill="#1A252F">市场洞察</text>
        <text x="1152" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">全渠道覆盖 · 品牌认知领先 · 用户增长飞轮</text>
    </g>
    
    <g filter="url(#cardShadow)">
        <rect x="1110" y="534" width="720" height="135" rx="15" fill="#FFFFFF"/>
        <rect x="1110" y="534" width="9" height="135" rx="4" fill="#2ECC71"/>
        <circle cx="1152" cy="576" r="15" fill="#2ECC71" fill-opacity="0.2"/>
        <circle cx="1152" cy="576" r="8" fill="#2ECC71"/>
        <text x="1185" y="582" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="700" fill="#1A252F">运营效率</text>
        <text x="1152" y="624" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">供应链优化 · 智能仓储 · 精细化成本管控</text>
    </g>
    
    <!-- 核心交叉说明 -->
    <g filter="url(#cardShadow)">
        <rect x="1110" y="720" width="720" height="120" rx="15" fill="#F8F9FA"/>
        <rect x="1110" y="720" width="720" height="9" rx="4" fill="#8E44AD"/>
        <text x="1470" y="772" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="700" fill="#8E44AD">核心竞争力 = 技术 × 市场 × 运营</text>
        <text x="1470" y="810" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">三大能力的深度融合构成不可复制的竞争壁垒</text>
    </g>

    <!-- 底部注释 -->
    <text x="90" y="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" fill="#BDC3C7">圆形面积表示能力覆盖范围，交叉区域表示协同价值</text>
</svg>