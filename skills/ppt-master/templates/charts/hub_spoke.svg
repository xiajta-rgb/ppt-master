<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!--
    中心辐射图模板 (Hub & Spoke)
    用途: 中心主题与外围要素关系、核心-卫星结构
    适用场景: 核心能力与支撑要素、平台生态、核心产品与衍生服务
    支持: 1中心+6外围 (推荐4-8个)
    -->

    <defs>
        <filter id="hubShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
            <feOffset dx="0" dy="4" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="spokeShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#0984E3;stop-opacity:1"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 标题 -->
    <text x="960" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="45" font-weight="700" fill="#1A252F">智慧企业能力中台</text>
    <text x="960" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">Hub &amp; Spoke · 核心平台驱动六大能力域</text>

    <!-- 连接线(辐射线) 从中心(640,390)到6个外围节点 -->
    <!-- 上 -->
    <line x1="960" y1="495" x2="960" y2="248" stroke="#6C5CE7" stroke-width="3.8" stroke-opacity="0.2"/>
    <line x1="960" y1="495" x2="960" y2="248" stroke="#6C5CE7" stroke-width="9" stroke-opacity="0.06"/>
    <!-- 右上 -->
    <line x1="1035" y1="518" x2="1440" y2="262" stroke="#00B894" stroke-width="3.8" stroke-opacity="0.2"/>
    <line x1="1035" y1="518" x2="1440" y2="262" stroke="#00B894" stroke-width="9" stroke-opacity="0.06"/>
    <!-- 右下 -->
    <line x1="1042" y1="630" x2="1462" y2="810" stroke="#FDCB6E" stroke-width="3.8" stroke-opacity="0.2"/>
    <line x1="1042" y1="630" x2="1462" y2="810" stroke="#FDCB6E" stroke-width="9" stroke-opacity="0.06"/>
    <!-- 下 -->
    <line x1="960" y1="675" x2="960" y2="915" stroke="#E17055" stroke-width="3.8" stroke-opacity="0.2"/>
    <line x1="960" y1="675" x2="960" y2="915" stroke="#E17055" stroke-width="9" stroke-opacity="0.06"/>
    <!-- 左下 -->
    <line x1="878" y1="630" x2="458" y2="810" stroke="#A29BFE" stroke-width="3.8" stroke-opacity="0.2"/>
    <line x1="878" y1="630" x2="458" y2="810" stroke="#A29BFE" stroke-width="9" stroke-opacity="0.06"/>
    <!-- 左上 -->
    <line x1="885" y1="518" x2="480" y2="262" stroke="#74B9FF" stroke-width="3.8" stroke-opacity="0.2"/>
    <line x1="885" y1="518" x2="480" y2="262" stroke="#74B9FF" stroke-width="9" stroke-opacity="0.06"/>

    <!-- 中心Hub -->
    <circle cx="960" cy="585" r="105" fill="url(#hubGrad)" filter="url(#hubShadow)"/>
    <circle cx="960" cy="585" r="82" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.3"/>
    <text x="960" y="574" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="800" fill="#FFFFFF">智慧</text>
    <text x="960" y="610" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="800" fill="#FFFFFF">中台</text>

    <!-- Spoke 1: 数据能力 (正上) -->
    <g filter="url(#spokeShadow)">
        <rect x="832" y="150" width="255" height="102" rx="18" fill="#FFFFFF" stroke="#6C5CE7" stroke-width="3"/>
        <circle cx="878" cy="201" r="24" fill="#6C5CE7"/>
        <rect x="867" y="192" width="21" height="6" rx="3" fill="#FFFFFF"/>
        <rect x="867" y="202" width="15" height="6" rx="3" fill="#FFFFFF"/>
        <text x="918" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="21" font-weight="700" fill="#1A252F">数据能力</text>
        <text x="918" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="16" fill="#7F8C8D">数据湖 + 实时分析</text>
    </g>

    <!-- Spoke 2: AI引擎 (右上) -->
    <g filter="url(#spokeShadow)">
        <rect x="1320" y="172" width="255" height="102" rx="18" fill="#FFFFFF" stroke="#00B894" stroke-width="3"/>
        <circle cx="1365" cy="224" r="24" fill="#00B894"/>
        <text x="1365" y="231" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" font-weight="700" fill="#FFFFFF">AI</text>
        <text x="1406" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="21" font-weight="700" fill="#1A252F">AI引擎</text>
        <text x="1406" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="16" fill="#7F8C8D">模型训练 + 推理服务</text>
    </g>

    <!-- Spoke 3: 业务引擎 (右下) -->
    <g filter="url(#spokeShadow)">
        <rect x="1342" y="735" width="255" height="102" rx="18" fill="#FFFFFF" stroke="#D4A537" stroke-width="3"/>
        <circle cx="1388" cy="786" r="24" fill="#D4A537"/>
        <polygon points="1378,777 1378,795 1395,786" fill="#FFFFFF"/>
        <text x="1428" y="777" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="21" font-weight="700" fill="#1A252F">业务引擎</text>
        <text x="1428" y="807" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="16" fill="#7F8C8D">工作流 + 规则引擎</text>
    </g>

    <!-- Spoke 4: 集成能力 (正下) -->
    <g filter="url(#spokeShadow)">
        <rect x="832" y="885" width="255" height="102" rx="18" fill="#FFFFFF" stroke="#E17055" stroke-width="3"/>
        <circle cx="878" cy="936" r="24" fill="#E17055"/>
        <rect x="866" y="927" width="9" height="21" rx="3" fill="#FFFFFF"/>
        <rect x="879" y="921" width="9" height="33" rx="3" fill="#FFFFFF"/>
        <text x="918" y="927" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="21" font-weight="700" fill="#1A252F">集成能力</text>
        <text x="918" y="957" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="16" fill="#7F8C8D">API网关 + 消息总线</text>
    </g>

    <!-- Spoke 5: 安全能力 (左下) -->
    <g filter="url(#spokeShadow)">
        <rect x="322" y="735" width="255" height="102" rx="18" fill="#FFFFFF" stroke="#A29BFE" stroke-width="3"/>
        <circle cx="368" cy="786" r="24" fill="#A29BFE"/>
        <rect x="356" y="774" width="24" height="27" rx="4" fill="none" stroke="#FFFFFF" stroke-width="3"/>
        <text x="408" y="777" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="21" font-weight="700" fill="#1A252F">安全能力</text>
        <text x="408" y="807" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="16" fill="#7F8C8D">IAM + 零信任架构</text>
    </g>

    <!-- Spoke 6: 用户体验 (左上) -->
    <g filter="url(#spokeShadow)">
        <rect x="345" y="172" width="255" height="102" rx="18" fill="#FFFFFF" stroke="#74B9FF" stroke-width="3"/>
        <circle cx="390" cy="224" r="24" fill="#74B9FF"/>
        <circle cx="390" cy="219" r="9" fill="none" stroke="#FFFFFF" stroke-width="3"/>
        <line x1="390" y1="228" x2="390" y2="237" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        <text x="430" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="21" font-weight="700" fill="#1A252F">用户体验</text>
        <text x="430" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="16" fill="#7F8C8D">低代码 + 设计系统</text>
    </g>

    <!-- 装饰性背景环 -->
    <circle cx="960" cy="585" r="270" fill="none" stroke="#E8E8E8" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="960" cy="585" r="172" fill="none" stroke="#E8E8E8" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- 底部总结 -->
    <text x="960" y="1050" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#BDC3C7">核心中台连接六大能力域，形成统一的企业数字化底座</text>
</svg>