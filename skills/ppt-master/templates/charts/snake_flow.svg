<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!--
    蛇形流程图模板
    用途: S型蜿蜒步骤、长流程展示
    适用场景: 用户旅程、客户生命周期、多阶段流程
    支持: 8步蛇形 (推荐6-10步)
    -->

    <defs>
        <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 标题 -->
    <text x="960" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="45" font-weight="700" fill="#1A252F">客户生命周期旅程</text>
    <text x="960" y="123" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">Customer Journey · 8个关键触点的蛇形流程</text>

    <!-- 蛇形连接线 -->
    <!-- 第一行: 左→右 (y=195) -->
    <line x1="292" y1="292" x2="1628" y2="292" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
    <!-- 折返1: 右侧下行 -->
    <path d="M 1628,292 Q 1710,292 1710,405 Q 1710,518 1628,518" stroke="#E0E0E0" stroke-width="4" fill="none"/>
    <!-- 第二行: 右→左 (y=345) -->
    <line x1="1628" y1="518" x2="292" y2="518" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
    <!-- 折返2: 左侧下行 -->
    <path d="M 292,518 Q 210,518 210,630 Q 210,742 292,742" stroke="#E0E0E0" stroke-width="4" fill="none"/>
    <!-- 第三行: 左→右 (y=495) -->
    <line x1="292" y1="742" x2="1185" y2="742" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>

    <!-- 节点+箭头 -->
    <!-- 第一行 4个: x=195,492,789,1086 -->
    <polygon points="510,292 492,278 492,308" fill="#D5D8DC"/>
    <polygon points="956,292 938,278 938,308" fill="#D5D8DC"/>
    <polygon points="1401,292 1383,278 1383,308" fill="#D5D8DC"/>

    <!-- 第二行反向 4个: x=1086,789,492,195 -->
    <polygon points="1410,518 1428,502 1428,532" fill="#D5D8DC"/>
    <polygon points="964,518 982,502 982,532" fill="#D5D8DC"/>
    <polygon points="519,518 537,502 537,532" fill="#D5D8DC"/>

    <!-- 第三行 2个: x=195,492 -->
    <polygon points="510,742 492,728 492,758" fill="#D5D8DC"/>
    <polygon points="956,742 938,728 938,758" fill="#D5D8DC"/>

    <!-- 步骤1 -->
    <circle cx="292" cy="292" r="45" fill="#6C5CE7" filter="url(#nodeShadow)"/>
    <text x="292" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="800" fill="#FFFFFF">01</text>
    <text x="292" y="372" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#1A252F">品牌认知</text>
    <text x="292" y="399" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">广告触达用户</text>

    <!-- 步骤2 -->
    <circle cx="738" cy="292" r="45" fill="#A29BFE" filter="url(#nodeShadow)"/>
    <text x="738" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="800" fill="#FFFFFF">02</text>
    <text x="738" y="372" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#1A252F">兴趣激发</text>
    <text x="738" y="399" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">内容种草引导</text>

    <!-- 步骤3 -->
    <circle cx="1184" cy="292" r="45" fill="#74B9FF" filter="url(#nodeShadow)"/>
    <text x="1184" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="800" fill="#FFFFFF">03</text>
    <text x="1184" y="372" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#1A252F">考虑对比</text>
    <text x="1184" y="399" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">产品评测对比</text>

    <!-- 步骤4 -->
    <circle cx="1629" cy="292" r="45" fill="#00B894" filter="url(#nodeShadow)"/>
    <text x="1629" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="800" fill="#FFFFFF">04</text>
    <text x="1629" y="372" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#1A252F">首次购买</text>
    <text x="1629" y="399" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">下单转化</text>

    <!-- 步骤5 (第二行右起) -->
    <circle cx="1629" cy="518" r="45" fill="#55EFC4" filter="url(#nodeShadow)"/>
    <text x="1629" y="525" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="800" fill="#FFFFFF">05</text>
    <text x="1629" y="597" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#1A252F">使用体验</text>
    <text x="1629" y="624" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">产品交付使用</text>

    <!-- 步骤6 -->
    <circle cx="1184" cy="518" r="45" fill="#FDCB6E" filter="url(#nodeShadow)"/>
    <text x="1184" y="525" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="800" fill="#FFFFFF">06</text>
    <text x="1184" y="597" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#1A252F">售后服务</text>
    <text x="1184" y="624" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">问题响应解决</text>

    <!-- 步骤7 -->
    <circle cx="738" cy="518" r="45" fill="#E17055" filter="url(#nodeShadow)"/>
    <text x="738" y="525" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="800" fill="#FFFFFF">07</text>
    <text x="738" y="597" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#1A252F">忠诚复购</text>
    <text x="738" y="624" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">二次购买转化</text>

    <!-- 步骤8 -->
    <circle cx="292" cy="518" r="45" fill="#D63031" filter="url(#nodeShadow)"/>
    <text x="292" y="525" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="800" fill="#FFFFFF">08</text>
    <text x="292" y="597" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#1A252F">口碑传播</text>
    <text x="292" y="624" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">裂变推荐新客</text>

    <!-- 底部总结 -->
    <rect x="180" y="840" width="1560" height="98" rx="15" fill="#F8F9FA"/>
    <text x="960" y="885" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">全生命周期闭环</text>
    <text x="960" y="918" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#7F8C8D">从品牌认知到口碑传播，形成自增长飞轮，平均客户 LTV 提升 3.2 倍</text>

    <text x="960" y="1035" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#BDC3C7">每个触点的体验优化都会提升整体转化漏斗效率</text>
</svg>