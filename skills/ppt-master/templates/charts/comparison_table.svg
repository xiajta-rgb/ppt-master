<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!--
    多维特性对比表模板
    用途: 多方案/产品横向对比、特性矩阵
    适用场景: 产品选型、竞品对比、服务套餐比较
    支持: 3列×6行 (推荐2-4列, 4-8行)
    -->

    <defs>
        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 标题 -->
    <text x="960" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="45" font-weight="700" fill="#1A252F">解决方案对比评估</text>
    <text x="960" y="123" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">Comparison Matrix · 三大方案核心指标横向对比</text>

    <!-- 表头行 -->
    <rect x="90" y="158" width="360" height="82" rx="12" fill="#F8F9FA"/>
    <text x="270" y="208" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#5F6368">评估维度</text>

    <!-- 方案A列头 -->
    <rect x="480" y="158" width="420" height="82" rx="12" fill="#6C5CE7" filter="url(#cardShadow)"/>
    <text x="690" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#FFFFFF">方案 A</text>
    <text x="690" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#FFFFFF" fill-opacity="0.8">自建私有化部署</text>

    <!-- 方案B列头 (推荐) -->
    <rect x="930" y="150" width="420" height="93" rx="12" fill="#00B894" filter="url(#cardShadow)"/>
    <rect x="1125" y="138" width="84" height="30" rx="15" fill="#FDCB6E"/>
    <text x="1167" y="158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="700" fill="#FFFFFF">推荐</text>
    <text x="1140" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#FFFFFF">方案 B</text>
    <text x="1140" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#FFFFFF" fill-opacity="0.8">混合云架构</text>

    <!-- 方案C列头 -->
    <rect x="1380" y="158" width="420" height="82" rx="12" fill="#0984E3" filter="url(#cardShadow)"/>
    <text x="1590" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#FFFFFF">方案 C</text>
    <text x="1590" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#FFFFFF" fill-opacity="0.8">纯SaaS订阅</text>

    <!-- 数据行 (6行, 每行高82, 起始y=175) -->
    <!-- 行1: 部署成本 -->
    <rect x="90" y="262" width="360" height="112" rx="9" fill="#F8F9FA"/>
    <text x="270" y="327" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#2C3E50">部署成本</text>
    <rect x="480" y="262" width="420" height="112" rx="9" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
    <text x="690" y="315" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="33" font-weight="700" fill="#1A252F">¥500万</text>
    <text x="690" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#E74C3C">偏高</text>
    <rect x="930" y="262" width="420" height="112" rx="9" fill="#00B894" fill-opacity="0.05" stroke="#00B894" stroke-width="2.2"/>
    <text x="1140" y="315" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="33" font-weight="700" fill="#1A252F">¥180万</text>
    <text x="1140" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#00B894">最优</text>
    <rect x="1380" y="262" width="420" height="112" rx="9" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
    <text x="1590" y="315" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="33" font-weight="700" fill="#1A252F">¥80万/年</text>
    <text x="1590" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#FDCB6E">中等</text>

    <!-- 行2: 数据安全 -->
    <rect x="90" y="390" width="360" height="112" rx="9" fill="#F8F9FA"/>
    <text x="270" y="454" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#2C3E50">数据安全</text>
    <rect x="480" y="390" width="420" height="112" rx="9" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
    <text x="690" y="454" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#00B894">★★★★★</text>
    <rect x="930" y="390" width="420" height="112" rx="9" fill="#00B894" fill-opacity="0.05" stroke="#00B894" stroke-width="2.2"/>
    <text x="1140" y="454" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#00B894">★★★★☆</text>
    <rect x="1380" y="390" width="420" height="112" rx="9" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
    <text x="1590" y="454" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#E74C3C">★★★☆☆</text>

    <!-- 行3: 扩展能力 -->
    <rect x="90" y="518" width="360" height="112" rx="9" fill="#F8F9FA"/>
    <text x="270" y="582" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#2C3E50">弹性扩展</text>
    <rect x="480" y="518" width="420" height="112" rx="9" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
    <text x="690" y="582" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#E74C3C">★★☆☆☆</text>
    <rect x="930" y="518" width="420" height="112" rx="9" fill="#00B894" fill-opacity="0.05" stroke="#00B894" stroke-width="2.2"/>
    <text x="1140" y="582" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#00B894">★★★★★</text>
    <rect x="1380" y="518" width="420" height="112" rx="9" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
    <text x="1590" y="582" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#00B894">★★★★★</text>

    <!-- 行4: 上线周期 -->
    <rect x="90" y="645" width="360" height="112" rx="9" fill="#F8F9FA"/>
    <text x="270" y="710" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#2C3E50">上线周期</text>
    <rect x="480" y="645" width="420" height="112" rx="9" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
    <text x="690" y="710" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="700" fill="#1A252F">6-12个月</text>
    <rect x="930" y="645" width="420" height="112" rx="9" fill="#00B894" fill-opacity="0.05" stroke="#00B894" stroke-width="2.2"/>
    <text x="1140" y="710" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="700" fill="#1A252F">3-5个月</text>
    <rect x="1380" y="645" width="420" height="112" rx="9" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
    <text x="1590" y="710" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="700" fill="#1A252F">1-2个月</text>

    <!-- 行5: 定制化 -->
    <rect x="90" y="772" width="360" height="112" rx="9" fill="#F8F9FA"/>
    <text x="270" y="837" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#2C3E50">定制化程度</text>
    <rect x="480" y="772" width="420" height="112" rx="9" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
    <text x="690" y="837" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#00B894">★★★★★</text>
    <rect x="930" y="772" width="420" height="112" rx="9" fill="#00B894" fill-opacity="0.05" stroke="#00B894" stroke-width="2.2"/>
    <text x="1140" y="837" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#00B894">★★★★☆</text>
    <rect x="1380" y="772" width="420" height="112" rx="9" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>
    <text x="1590" y="837" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="600" fill="#E74C3C">★★☆☆☆</text>

    <!-- 底部总评 -->
    <rect x="90" y="915" width="360" height="105" rx="12" fill="#F8F9FA"/>
    <text x="270" y="975" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#2C3E50">综合评分</text>
    <rect x="480" y="915" width="420" height="105" rx="12" fill="#6C5CE7" fill-opacity="0.08"/>
    <text x="690" y="978" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="42" font-weight="800" fill="#6C5CE7">72</text>
    <rect x="930" y="915" width="420" height="105" rx="12" fill="#00B894" fill-opacity="0.1"/>
    <text x="1140" y="978" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="42" font-weight="800" fill="#00B894">91</text>
    <rect x="1380" y="915" width="420" height="105" rx="12" fill="#0984E3" fill-opacity="0.08"/>
    <text x="1590" y="978" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="42" font-weight="800" fill="#0984E3">68</text>
</svg>