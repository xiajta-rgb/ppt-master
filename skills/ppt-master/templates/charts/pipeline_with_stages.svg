  <text x="1012" y="402" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#C00000">结构化与口径对齐</text>

  <rect x="891" y="444" width="9" height="9" fill="#C00000"/>
  <text x="912" y="456" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1A252F">反规范化建模</text>
  <text x="912" y="483" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#566573">维度补齐 · 粒度聚合</text>

  <rect x="891" y="516" width="9" height="9" fill="#C00000"/>
  <text x="912" y="528" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1A252F">派生指标计算</text>
  <text x="912" y="555" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#566573">统一指标口径</text>

  <rect x="891" y="588" width="9" height="9" fill="#C00000"/>
  <text x="912" y="600" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1A252F">主题宽表产出</text>
  <text x="912" y="627" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#566573">可复用 · 可下钻</text>

  <rect x="891" y="690" width="243" height="123" fill="#F7F9FC"/>
  <text x="1012" y="717" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#7F8C8D">产物 · Output</text>
  <line x1="912" y1="729" x2="1113" y2="729" stroke="#E7E6E6" stroke-width="2"/>
  <text x="1012" y="765" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#C00000">Wide Tables</text>
  <text x="1012" y="795" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#7F8C8D">主题宽表</text>

  <!-- ==================== 阶段 4: 增强 ==================== -->
  <rect x="1215" y="300" width="285" height="540" fill="#FFFFFF" stroke="#5B9BD5" stroke-width="2"/>
  <rect x="1215" y="300" width="285" height="72" fill="#5B9BD5"/>
  <rect x="1233" y="315" width="42" height="42" fill="#FFFFFF"/>
  <text x="1254" y="345" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#5B9BD5">04</text>
