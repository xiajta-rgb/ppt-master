<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!--
  数据/处理管道图模板 (Pipeline with Stages)
  用途: 水平依次经过的多个阶段，每个阶段承载标题 + 描述 + 输入输出
  适用场景: 数据管道、ETL 流程、编译/构建流水线、审批流
  支持: 3-5 阶段 (推荐 4-5)
  关键约定:
    - 每个阶段卡 = 编号徽章 + 阶段标题 + 职责定位 + 2 条要点描述 + 产物 / Output
    - 阶段间用手绘三角箭头 (非 marker) 展示单向流动
    - 左侧行标签 "流水阶段" 统一框住全部阶段
    - 底部"产物流向"带用两个强调色块标出起点与终点
    - 若阶段缺少"产物"或缺少描述，应退回 process_flow 或 numbered_steps
  注意: 中文字符实际渲染宽度约 1em，卡片内文本按每卡 ≤ 12 个字符估算，超过请精简表达
  -->

  <!-- 背景 -->
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

  <!-- 标题 -->
  <rect x="45" y="33" width="15" height="60" fill="#C00000"/>
  <text x="78" y="82" font-family="Microsoft YaHei, sans-serif" font-size="45" font-weight="700" fill="#C00000">数据处理管道全流程</text>

  <!-- 副标题带 -->
  <rect x="45" y="117" width="1830" height="69" fill="#F2F2F2"/>
  <text x="960" y="148" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1A252F">
    <tspan x="960" dy="0">从原始数据到业务产出的五阶段流水 · 每阶段的产物即下一阶段的输入</tspan>
    <tspan x="960" dy="33" fill="#7F8C8D" font-weight="400">阶段卡 = 编号 + 标题 + 职责定位 + 要点描述 + 产物；缺产物或缺描述请改用 process_flow 或 numbered_steps</tspan>
  </text>

  <!-- ==================== 左侧行标签 ==================== -->
  <rect x="45" y="225" width="45" height="45" fill="#C00000"/>
  <text x="68" y="258" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">⟶</text>
  <text x="48" y="330" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#1A252F">流水</text>
  <text x="48" y="369" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#1A252F">阶段</text>
  <text x="48" y="408" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#7F8C8D">Pipeline</text>
  <text x="48" y="432" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#7F8C8D">Stages</text>

  <!-- ==================== 流水线整体外框 ==================== -->
  <rect x="150" y="225" width="1725" height="645" fill="none" stroke="#C00000" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="150" y="225" width="1725" height="48" fill="#FDF3EB"/>
  <text x="1012" y="258" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1A252F">五阶段串行流水 · Raw → Clean → Wide → Enriched → Products</text>

  <!--
  阶段卡布局计算:
    可用宽: 1150 - 2*20 (内边距) = 1110
    5 卡 + 4 箭头区, 每箭头区 40, 每卡 (1110 - 4*40) / 5 = 190
    卡 x: 120, 350, 580, 810, 1040 (间距 230 = 卡 190 + 箭头区 40)
    卡 y: 200 - 560, 高 360
  -->

  <!-- ==================== 阶段 1: 采集 ==================== -->
  <rect x="180" y="300" width="285" height="540" fill="#FFFFFF" stroke="#2E75B6" stroke-width="2"/>
  <rect x="180" y="300" width="285" height="72" fill="#2E75B6"/>
  <rect x="198" y="315" width="42" height="42" fill="#FFFFFF"/>
  <text x="219" y="345" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2E75B6">01</text>
  <text x="258" y="345" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">采集</text>
  <text x="258" y="366" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#FFFFFF" fill-opacity="0.85">Ingest</text>

  <rect x="180" y="372" width="285" height="45" fill="#EAF1F8"/>
  <text x="322" y="402" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#2E75B6">多源接入与实时抓取</text>

  <rect x="201" y="444" width="9" height="9" fill="#2E75B6"/>
  <text x="222" y="456" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1A252F">多通道接入</text>
  <text x="222" y="483" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#566573">埋点 · CDC · 文件同步</text>

  <rect x="201" y="516" width="9" height="9" fill="#2E75B6"/>
  <text x="222" y="528" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1A252F">统一协议</text>
  <text x="222" y="555" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#566573">队列缓冲 · 背压控制</text>

  <rect x="201" y="588" width="9" height="9" fill="#2E75B6"/>
  <text x="222" y="600" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1A252F">弹性吞吐</text>
  <text x="222" y="627" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#566573">分片并行 · 自动扩缩</text>

  <rect x="201" y="690" width="243" height="123" fill="#F7F9FC"/>
  <text x="322" y="717" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#7F8C8D">产物 · Output</text>
  <line x1="222" y1="729" x2="423" y2="729" stroke="#E7E6E6" stroke-width="2"/>
  <text x="322" y="765" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#2E75B6">Raw Events</text>
  <text x="322" y="795" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#7F8C8D">原始事件流</text>

  <!-- ==================== 阶段 2: 校验 ==================== -->
  <rect x="525" y="300" width="285" height="540" fill="#FFFFFF" stroke="#2E75B6" stroke-width="2"/>
  <rect x="525" y="300" width="285" height="72" fill="#2E75B6"/>
  <rect x="543" y="315" width="42" height="42" fill="#FFFFFF"/>
  <text x="564" y="345" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2E75B6">02</text>
  <text x="603" y="345" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">校验</text>
  <text x="603" y="366" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#FFFFFF" fill-opacity="0.85">Validate</text>

  <rect x="525" y="372" width="285" height="45" fill="#EAF1F8"/>
  <text x="668" y="402" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#2E75B6">规则校验与脏数据隔离</text>

  <rect x="546" y="444" width="9" height="9" fill="#2E75B6"/>
  <text x="567" y="456" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1A252F">格式与范围校验</text>
  <text x="567" y="483" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#566573">字段类型 · 取值域</text>

  <rect x="546" y="516" width="9" height="9" fill="#2E75B6"/>
  <text x="567" y="528" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1A252F">业务规则校验</text>
  <text x="567" y="555" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#566573">唯一性 · 引用完整性</text>

  <rect x="546" y="588" width="9" height="9" fill="#2E75B6"/>
  <text x="567" y="600" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1A252F">异常隔离告警</text>
  <text x="567" y="627" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#566573">死信队列 · 触发重试</text>

  <rect x="546" y="690" width="243" height="123" fill="#F7F9FC"/>
  <text x="668" y="717" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#7F8C8D">产物 · Output</text>
  <line x1="567" y1="729" x2="768" y2="729" stroke="#E7E6E6" stroke-width="2"/>
  <text x="668" y="765" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#2E75B6">Clean Events</text>
  <text x="668" y="795" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#7F8C8D">合规事件流</text>

  <!-- ==================== 阶段 3: 转换 ==================== -->
  <rect x="870" y="300" width="285" height="540" fill="#FFFFFF" stroke="#C00000" stroke-width="2"/>
  <rect x="870" y="300" width="285" height="72" fill="#C00000"/>
  <rect x="888" y="315" width="42" height="42" fill="#FFFFFF"/>
  <text x="909" y="345" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#C00000">03</text>
