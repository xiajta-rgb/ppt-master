<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!--
    鱼骨因果图模板 (石川图/Ishikawa)
    用途: 根因分析、问题诊断、因果关系梳理
    适用场景: 质量管理、故障分析、6M分析法
    支持: 6分支鱼骨 (推荐4-6分支)
    -->

    <defs>
        <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 标题 -->
    <text x="960" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="45" font-weight="700" fill="#1A252F">客户流失根因分析</text>
    <text x="960" y="116" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">Fishbone Diagram · 六大维度系统化诊断</text>

    <!-- 主脊骨 (水平线) -->
    <line x1="90" y1="570" x2="1680" y2="570" stroke="#2C3E50" stroke-width="6" stroke-linecap="round"/>
    <!-- 鱼头 (右端三角+结果) -->
    <polygon points="1680,570 1770,510 1770,630" fill="#E74C3C"/>
    <rect x="1770" y="510" width="135" height="120" rx="9" fill="#E74C3C"/>
    <text x="1838" y="561" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="800" fill="#FFFFFF">客户</text>
    <text x="1838" y="594" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="800" fill="#FFFFFF">流失</text>

    <!-- 上方3根鱼骨 (斜向上) -->
    <!-- 骨1: 产品 (x=240) -->
    <line x1="360" y1="570" x2="240" y2="240" stroke="#6C5CE7" stroke-width="3.8"/>
    <rect x="150" y="165" width="180" height="60" rx="30" fill="#6C5CE7" filter="url(#nodeShadow)"/>
    <text x="240" y="204" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="700" fill="#FFFFFF">产品</text>
    <!-- 子因 -->
    <line x1="318" y1="360" x2="240" y2="360" stroke="#6C5CE7" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="222" y="356" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">功能缺失</text>
    <line x1="300" y1="435" x2="222" y2="435" stroke="#6C5CE7" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="204" y="430" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">体验差</text>
    <line x1="334" y1="292" x2="256" y2="292" stroke="#6C5CE7" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="238" y="288" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">Bug太多</text>

    <!-- 骨2: 服务 (x=520) -->
    <line x1="780" y1="570" x2="660" y2="240" stroke="#00B894" stroke-width="3.8"/>
    <rect x="570" y="165" width="180" height="60" rx="30" fill="#00B894" filter="url(#nodeShadow)"/>
    <text x="660" y="204" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="700" fill="#FFFFFF">服务</text>
    <line x1="738" y1="360" x2="660" y2="360" stroke="#00B894" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="642" y="356" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">响应慢</text>
    <line x1="720" y1="435" x2="642" y2="435" stroke="#00B894" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="624" y="430" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">态度差</text>
    <line x1="754" y1="292" x2="676" y2="292" stroke="#00B894" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="658" y="288" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">流程繁琐</text>

    <!-- 骨3: 价格 (x=800) -->
    <line x1="1200" y1="570" x2="1080" y2="240" stroke="#FDCB6E" stroke-width="3.8"/>
    <rect x="990" y="165" width="180" height="60" rx="30" fill="#D4A537" filter="url(#nodeShadow)"/>
    <text x="1080" y="204" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="700" fill="#FFFFFF">价格</text>
    <line x1="1158" y1="360" x2="1080" y2="360" stroke="#D4A537" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="1062" y="356" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">性价比低</text>
    <line x1="1140" y1="435" x2="1062" y2="435" stroke="#D4A537" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="1044" y="430" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">涨价频繁</text>
    <line x1="1174" y1="292" x2="1096" y2="292" stroke="#D4A537" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="1078" y="288" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">隐性收费</text>

    <!-- 下方3根鱼骨 (斜向下) -->
    <!-- 骨4: 竞品 (x=240) -->
    <line x1="360" y1="570" x2="240" y2="900" stroke="#0984E3" stroke-width="3.8"/>
    <rect x="150" y="900" width="180" height="60" rx="30" fill="#0984E3" filter="url(#nodeShadow)"/>
    <text x="240" y="939" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="700" fill="#FFFFFF">竞品</text>
    <line x1="318" y1="780" x2="240" y2="780" stroke="#0984E3" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="222" y="776" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">对手创新快</text>
    <line x1="300" y1="705" x2="222" y2="705" stroke="#0984E3" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="204" y="700" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">切换成本低</text>
    <line x1="334" y1="848" x2="256" y2="848" stroke="#0984E3" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="238" y="843" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">价格战</text>

    <!-- 骨5: 运营 (x=520) -->
    <line x1="780" y1="570" x2="660" y2="900" stroke="#E17055" stroke-width="3.8"/>
    <rect x="570" y="900" width="180" height="60" rx="30" fill="#E17055" filter="url(#nodeShadow)"/>
    <text x="660" y="939" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="700" fill="#FFFFFF">运营</text>
    <line x1="738" y1="780" x2="660" y2="780" stroke="#E17055" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="642" y="776" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">触达不足</text>
    <line x1="720" y1="705" x2="642" y2="705" stroke="#E17055" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="624" y="700" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">预警缺失</text>
    <line x1="754" y1="848" x2="676" y2="848" stroke="#E17055" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="658" y="843" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">续费引导差</text>

    <!-- 骨6: 口碑 (x=800) -->
    <line x1="1200" y1="570" x2="1080" y2="900" stroke="#A29BFE" stroke-width="3.8"/>
    <rect x="990" y="900" width="180" height="60" rx="30" fill="#A29BFE" filter="url(#nodeShadow)"/>
    <text x="1080" y="939" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="700" fill="#FFFFFF">口碑</text>
    <line x1="1158" y1="780" x2="1080" y2="780" stroke="#A29BFE" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="1062" y="776" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">负面评价多</text>
    <line x1="1140" y1="705" x2="1062" y2="705" stroke="#A29BFE" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="1044" y="700" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">社区维护差</text>
    <line x1="1174" y1="848" x2="1096" y2="848" stroke="#A29BFE" stroke-width="2.2" stroke-opacity="0.5"/>
    <text x="1078" y="843" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">成功案例少</text>

    <!-- 底部注释 -->
    <text x="960" y="1035" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#BDC3C7">鱼骨图（石川图）: 系统化梳理问题的各维度根因</text>
</svg>