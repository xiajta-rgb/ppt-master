<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    箱线图模板
    用途: 数据分布可视化、统计分析
    适用场景: 薪资分布、成绩分析、质量控制、异常值检测
    支持: 5组箱线图对比
    -->
    
    <defs>
        <!-- 箱体渐变 -->
        <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#BA68C8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="boxGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#EF5350;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
        </linearGradient>
        
        <!-- 阴影 -->
        <filter id="boxShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>各部门薪资分布分析</tspan>
    </text>
    
    <text x="90" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>2025年度薪酬报告 · 单位：万元/年</tspan>
    </text>
    
    <!-- 图表区域 -->
    <g id="chartArea">
        <!-- Y轴网格线 -->
        <line x1="210" y1="825" x2="1500" y2="825" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="720" x2="1500" y2="720" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="615" x2="1500" y2="615" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="510" x2="1500" y2="510" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="405" x2="1500" y2="405" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="300" x2="1500" y2="300" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="195" x2="1500" y2="195" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- Y轴刻度标签 -->
        <text x="188" y="832" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>0</tspan></text>
        <text x="188" y="728" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>10</tspan></text>
        <text x="188" y="622" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>20</tspan></text>
        <text x="188" y="518" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>30</tspan></text>
        <text x="188" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>40</tspan></text>
        <text x="188" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>50</tspan></text>
        <text x="188" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>60</tspan></text>
        
        <!-- Y轴标题 -->
        <text x="68" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="22" fill="#5D6D7E" text-anchor="middle" transform="rotate(-135, 68, 510)">
            <tspan>年薪（万元）</tspan>
        </text>
        
        <!-- 坐标轴 -->
        <line x1="210" y1="195" x2="210" y2="825" stroke="#95A5A6" stroke-width="3"/>
        <line x1="210" y1="825" x2="1500" y2="825" stroke="#95A5A6" stroke-width="3"/>
        
        <!-- 
        箱线图说明：
        - 每个箱体宽度: 80px
        - 箱体间距: 100px
        - 每10万=70px
        
        数据（最小值, Q1, 中位数, Q3, 最大值）：
        技术部: 15, 25, 35, 45, 58 + 异常值 8
        产品部: 12, 22, 28, 38, 50
        设计部: 10, 18, 24, 32, 42
        市场部: 8, 15, 22, 30, 45 + 异常值 55
        运营部: 8, 14, 20, 26, 38
        -->
        
        <!-- 箱线图1: 技术部 (蓝色) -->
        <g id="box1" transform="translate(345, 0)">
            <!-- 上须线 (max=58) -->
            <line x1="0" y1="215.1" x2="0" y2="352" stroke="#1976D2" stroke-width="3"/>
            <line x1="-30" y1="215.1" x2="30" y2="215.1" stroke="#1976D2" stroke-width="3"/>
            
            <!-- 箱体 (Q1=25到Q3=45) -->
            <rect x="-60" y="352" width="120" height="210" rx="6" fill="url(#boxGrad1)" filter="url(#boxShadow)"/>
            
            <!-- 中位数线 (median=35) -->
            <line x1="-60" y1="458" x2="60" y2="458" stroke="#FFFFFF" stroke-width="4"/>
            
            <!-- 下须线 (min=15) -->
            <line x1="0" y1="562" x2="0" y2="668" stroke="#1976D2" stroke-width="3"/>
            <line x1="-30" y1="668" x2="30" y2="668" stroke="#1976D2" stroke-width="3"/>
            
            <!-- 异常值 (outlier=8) -->
            <circle cx="0" cy="741" r="9" fill="#FFFFFF" stroke="#1976D2" stroke-width="3"/>
            
            <!-- 标签 -->
            <text x="0" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="22" font-weight="600" fill="#1976D2" text-anchor="middle"><tspan>技术部</tspan></text>
            
            <!-- 数值标注 -->
            <text x="75" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="16" fill="#7F8C8D"><tspan>58</tspan></text>
            <text x="75" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="16" fill="#7F8C8D"><tspan>45</tspan></text>
            <text x="75" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="16" fill="#2196F3"><tspan>35</tspan></text>
            <text x="75" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="16" fill="#7F8C8D"><tspan>25</tspan></text>
            <text x="75" y="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="16" fill="#7F8C8D"><tspan>15</tspan></text>
        </g>
        
        <!-- 箱线图2: 产品部 (绿色) -->
        <g id="box2" transform="translate(600, 0)">
            <!-- 上须线 (max=50) -->
            <line x1="0" y1="300" x2="0" y2="426" stroke="#388E3C" stroke-width="3"/>
            <line x1="-30" y1="300" x2="30" y2="300" stroke="#388E3C" stroke-width="3"/>
            
            <!-- 箱体 (Q1=22到Q3=38) -->
            <rect x="-60" y="426" width="120" height="168" rx="6" fill="url(#boxGrad2)" filter="url(#boxShadow)"/>
            
            <!-- 中位数线 (median=28) -->
            <line x1="-60" y1="531" x2="60" y2="531" stroke="#FFFFFF" stroke-width="4"/>
            
            <!-- 下须线 (min=12) -->
            <line x1="0" y1="594" x2="0" y2="699" stroke="#388E3C" stroke-width="3"/>
            <line x1="-30" y1="699" x2="30" y2="699" stroke="#388E3C" stroke-width="3"/>
            
            <!-- 标签 -->
            <text x="0" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="22" font-weight="600" fill="#388E3C" text-anchor="middle"><tspan>产品部</tspan></text>
        </g>
        
        <!-- 箱线图3: 设计部 (橙色) -->
        <g id="box3" transform="translate(855, 0)">
            <!-- 上须线 (max=42) -->
            <line x1="0" y1="384" x2="0" y2="489" stroke="#F57C00" stroke-width="3"/>
            <line x1="-30" y1="384" x2="30" y2="384" stroke="#F57C00" stroke-width="3"/>
            
            <!-- 箱体 (Q1=18到Q3=32) -->
            <rect x="-60" y="489" width="120" height="147" rx="6" fill="url(#boxGrad3)" filter="url(#boxShadow)"/>
            
            <!-- 中位数线 (median=24) -->
            <line x1="-60" y1="573" x2="60" y2="573" stroke="#FFFFFF" stroke-width="4"/>
            
            <!-- 下须线 (min=10) -->
            <line x1="0" y1="636" x2="0" y2="720" stroke="#F57C00" stroke-width="3"/>
            <line x1="-30" y1="720" x2="30" y2="720" stroke="#F57C00" stroke-width="3"/>
            
            <!-- 标签 -->
            <text x="0" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="22" font-weight="600" fill="#F57C00" text-anchor="middle"><tspan>设计部</tspan></text>
        </g>
        
        <!-- 箱线图4: 市场部 (紫色) -->
        <g id="box4" transform="translate(1110, 0)">
            <!-- 上须线 (max=45) -->
            <line x1="0" y1="352" x2="0" y2="510" stroke="#7B1FA2" stroke-width="3"/>
            <line x1="-30" y1="352" x2="30" y2="352" stroke="#7B1FA2" stroke-width="3"/>
            
            <!-- 箱体 (Q1=15到Q3=30) -->
            <rect x="-60" y="510" width="120" height="158" rx="6" fill="url(#boxGrad4)" filter="url(#boxShadow)"/>
            
            <!-- 中位数线 (median=22) -->
            <line x1="-60" y1="594" x2="60" y2="594" stroke="#FFFFFF" stroke-width="4"/>
            
            <!-- 下须线 (min=8) -->
            <line x1="0" y1="668" x2="0" y2="741" stroke="#7B1FA2" stroke-width="3"/>
            <line x1="-30" y1="741" x2="30" y2="741" stroke="#7B1FA2" stroke-width="3"/>
            
            <!-- 异常值 (outlier=55) -->
            <circle cx="0" cy="248" r="9" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="3"/>
            
            <!-- 标签 -->
            <text x="0" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="22" font-weight="600" fill="#7B1FA2" text-anchor="middle"><tspan>市场部</tspan></text>
        </g>
        
        <!-- 箱线图5: 运营部 (红色) -->
        <g id="box5" transform="translate(1365, 0)">
            <!-- 上须线 (max=38) -->
            <line x1="0" y1="426" x2="0" y2="552" stroke="#D32F2F" stroke-width="3"/>
            <line x1="-30" y1="426" x2="30" y2="426" stroke="#D32F2F" stroke-width="3"/>
            
            <!-- 箱体 (Q1=14到Q3=26) -->
            <rect x="-60" y="552" width="120" height="126" rx="6" fill="url(#boxGrad5)" filter="url(#boxShadow)"/>
            
            <!-- 中位数线 (median=20) -->
            <line x1="-60" y1="615" x2="60" y2="615" stroke="#FFFFFF" stroke-width="4"/>
            
            <!-- 下须线 (min=8) -->
            <line x1="0" y1="678" x2="0" y2="741" stroke="#D32F2F" stroke-width="3"/>
            <line x1="-30" y1="741" x2="30" y2="741" stroke="#D32F2F" stroke-width="3"/>
            
            <!-- 标签 -->
            <text x="0" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="22" font-weight="600" fill="#D32F2F" text-anchor="middle"><tspan>运营部</tspan></text>
        </g>
    </g>
    
    <!-- 箱线图说明 -->
    <g id="boxLegend" transform="translate(1560, 195)">
        <rect x="0" y="0" width="300" height="360" rx="12" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="2"/>
        
        <text x="150" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle"><tspan>图例说明</tspan></text>
        
        <line x1="22" y1="63" x2="278" y2="63" stroke="#E0E0E0" stroke-width="2"/>
        
        <!-- 示意图 -->
        <g transform="translate(45, 90)">
            <!-- 上须线 -->
            <line x1="45" y1="0" x2="45" y2="38" stroke="#5D6D7E" stroke-width="3"/>
            <line x1="30" y1="0" x2="60" y2="0" stroke="#5D6D7E" stroke-width="3"/>
            <text x="105" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="16" fill="#7F8C8D"><tspan>最大值</tspan></text>
            
            <!-- 箱体 -->
            <rect x="15" y="38" width="60" height="90" rx="4" fill="#BDC3C7"/>
            <text x="105" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="16" fill="#7F8C8D"><tspan>Q3 (75%)</tspan></text>
            
            <!-- 中位数 -->
            <line x1="15" y1="82" x2="75" y2="82" stroke="#2C3E50" stroke-width="3"/>
            <text x="105" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="16" fill="#2C3E50"><tspan>中位数</tspan></text>
            
            <text x="105" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="16" fill="#7F8C8D"><tspan>Q1 (25%)</tspan></text>
            
            <!-- 下须线 -->
            <line x1="45" y1="128" x2="45" y2="165" stroke="#5D6D7E" stroke-width="3"/>
            <line x1="30" y1="165" x2="60" y2="165" stroke="#5D6D7E" stroke-width="3"/>
            <text x="105" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="16" fill="#7F8C8D"><tspan>最小值</tspan></text>
            
            <!-- 异常值 -->
            <circle cx="45" cy="202" r="8" fill="#FFFFFF" stroke="#5D6D7E" stroke-width="3"/>
            <text x="105" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="16" fill="#E91E63"><tspan>异常值</tspan></text>
        </g>
        
        <text x="22" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="15" fill="#95A5A6"><tspan>IQR = Q3 - Q1</tspan></text>
        <text x="22" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="15" fill="#95A5A6"><tspan>异常值 > Q3+1.5*IQR</tspan></text>
    </g>
    
    <!-- 统计摘要 -->
    <g id="statsSummary" transform="translate(1560, 585)">
        <rect x="0" y="0" width="300" height="240" rx="12" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
        
        <text x="22" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" font-weight="600" fill="#2E7D32"><tspan>📊 统计摘要</tspan></text>
        
        <text x="22" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E"><tspan>最高中位数: 技术部 35万</tspan></text>
        <text x="22" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E"><tspan>最低中位数: 运营部 20万</tspan></text>
        <text x="22" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E"><tspan>分布最广: 技术部</tspan></text>
        <text x="22" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E"><tspan>分布最集中: 运营部</tspan></text>
        <text x="22" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#E91E63"><tspan>发现异常值: 2个</tspan></text>
    </g>
    
    <!-- 数据来源 -->
    <text x="90" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#95A5A6">
        <tspan>数据来源: 人力资源部门薪酬统计</tspan>
    </text>
</svg>

