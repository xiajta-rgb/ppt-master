<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!--
    同心圆/靶心图模板
    用途: 层级聚焦、影响力/优先级圈层、核心-外围展示
    适用场景: 目标聚焦分析、利益相关者圈层、核心-拓展-生态
    支持: 4层同心圆 (推荐3-5层)
    -->

    <defs>
        <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
            <feOffset dx="0" dy="4" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 标题 -->
    <text x="90" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="45" font-weight="700" fill="#1A252F">产品战略优先级圈层</text>
    <text x="90" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">Concentric Model · 从核心到外围的四层聚焦</text>

    <!-- 同心圆 (居左偏, 圆心 450,395) -->
    <!-- 第4层 (最外, 生态) -->
    <circle cx="675" cy="592" r="435" fill="#0984E3" fill-opacity="0.06" stroke="#0984E3" stroke-width="2.2" stroke-opacity="0.2"/>
    <text x="675" y="192" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="600" fill="#0984E3" fill-opacity="0.6">生态拓展 Ecosystem</text>

    <!-- 第3层 (拓展) -->
    <circle cx="675" cy="592" r="315" fill="#00B894" fill-opacity="0.08" stroke="#00B894" stroke-width="2.2" stroke-opacity="0.25"/>
    <text x="675" y="312" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="600" fill="#00B894" fill-opacity="0.7">增长引擎 Growth</text>

    <!-- 第2层 (核心外围) -->
    <circle cx="675" cy="592" r="202" fill="#FDCB6E" fill-opacity="0.1" stroke="#FDCB6E" stroke-width="3" stroke-opacity="0.3"/>
    <text x="675" y="423" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="600" fill="#D4A537" fill-opacity="0.8">核心支撑 Core Support</text>

    <!-- 第1层 (核心, 最内) -->
    <circle cx="675" cy="592" r="98" fill="#6C5CE7" filter="url(#ringGlow)"/>
    <text x="675" y="582" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="26" font-weight="800" fill="#FFFFFF">核心</text>
    <text x="675" y="615" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="26" font-weight="800" fill="#FFFFFF">产品</text>

    <!-- 右侧说明面板 -->
    <!-- 层级1 -->
    <g filter="url(#cardShadow)">
        <rect x="1200" y="172" width="630" height="150" rx="15" fill="#FFFFFF"/>
        <rect x="1200" y="172" width="9" height="150" rx="4" fill="#6C5CE7"/>
        <circle cx="1245" cy="218" r="21" fill="#6C5CE7"/>
        <text x="1245" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" font-weight="700" fill="#FFFFFF">1</text>
        <text x="1284" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="24" font-weight="700" fill="#1A252F">核心产品 · 最高优先级</text>
        <text x="1245" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" fill="#5F6368">用户核心体验功能，直接影响留存和付费转化</text>
        <text x="1245" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" fill="#95A5A6">投入60%资源 · 每双周迭代</text>
    </g>

    <!-- 层级2 -->
    <g filter="url(#cardShadow)">
        <rect x="1200" y="352" width="630" height="150" rx="15" fill="#FFFFFF"/>
        <rect x="1200" y="352" width="9" height="150" rx="4" fill="#D4A537"/>
        <circle cx="1245" cy="398" r="21" fill="#D4A537"/>
        <text x="1245" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" font-weight="700" fill="#FFFFFF">2</text>
        <text x="1284" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="24" font-weight="700" fill="#1A252F">核心支撑 · 高优先级</text>
        <text x="1245" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" fill="#5F6368">性能优化、安全合规、基础平台能力</text>
        <text x="1245" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" fill="#95A5A6">投入25%资源 · 月度迭代</text>
    </g>

    <!-- 层级3 -->
    <g filter="url(#cardShadow)">
        <rect x="1200" y="532" width="630" height="150" rx="15" fill="#FFFFFF"/>
        <rect x="1200" y="532" width="9" height="150" rx="4" fill="#00B894"/>
        <circle cx="1245" cy="578" r="21" fill="#00B894"/>
        <text x="1245" y="585" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" font-weight="700" fill="#FFFFFF">3</text>
        <text x="1284" y="584" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="24" font-weight="700" fill="#1A252F">增长引擎 · 中优先级</text>
        <text x="1245" y="622" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" fill="#5F6368">获客渠道建设、运营工具、商业化能力</text>
        <text x="1245" y="652" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" fill="#95A5A6">投入10%资源 · 季度规划</text>
    </g>

    <!-- 层级4 -->
    <g filter="url(#cardShadow)">
        <rect x="1200" y="712" width="630" height="150" rx="15" fill="#FFFFFF"/>
        <rect x="1200" y="712" width="9" height="150" rx="4" fill="#0984E3"/>
        <circle cx="1245" cy="758" r="21" fill="#0984E3"/>
        <text x="1245" y="765" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" font-weight="700" fill="#FFFFFF">4</text>
        <text x="1284" y="764" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="24" font-weight="700" fill="#1A252F">生态拓展 · 探索优先级</text>
        <text x="1245" y="802" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" fill="#5F6368">开放平台、ISV合作、行业解决方案</text>
        <text x="1245" y="832" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18" fill="#95A5A6">投入5%资源 · 半年度评审</text>
    </g>

    <!-- 底部注释 -->
    <text x="960" y="1035" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#BDC3C7">越靠近圆心优先级越高，资源投入越集中</text>
</svg>