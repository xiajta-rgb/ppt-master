<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!--
    客户端-服务端交互图模板 (Client-Server Flow)
    用途: 左侧客户端群 + 右侧服务端群，中间用双向箭头标注关键交互动作
    适用场景: 请求-响应架构、前后端交互图、C/S 协议栈、API 调用关系
    支持: 左侧 2-3 个客户端模块 + 右侧 2-4 个服务端模块 + 中间 3-5 条关键交互
    关键约定: 每个模块卡 = 模块名 + 1 行描述；每条交互箭头 = 动作标签 (例如 "Login" / "Return JWT")；切勿只画箭头不写动作
    -->

    <defs>
        <marker id="csArrowRight" markerWidth="10" markerHeight="10" refX="9" refY="5"
                orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L15,8 L0,15 Z" fill="#4A6FDC"/>
        </marker>
        <marker id="csArrowLeft" markerWidth="10" markerHeight="10" refX="9" refY="5"
                orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L15,8 L0,15 Z" fill="#2E9E4A"/>
        </marker>
        <filter id="csShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="4"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 标题 -->
    <text x="90" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="42" font-weight="700" fill="#1A252F">客户端-服务端交互</text>
    <text x="90" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">Client-Server Flow · 左侧终端发起请求，右侧服务端分层响应</text>

    <!-- 左侧: Client 分组 -->
    <rect x="90" y="195" width="480" height="780" rx="24" fill="#EEF3FF" stroke="#BBD0FF" stroke-width="2.2"/>
    <rect x="90" y="195" width="480" height="66" rx="24" fill="#4A6FDC"/>
    <rect x="90" y="237" width="480" height="24" fill="#4A6FDC"/>
    <text x="330" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="700" fill="#FFFFFF">CLIENT · 客户端</text>

    <!-- 客户端模块 1: Web -->
    <g filter="url(#csShadow)">
        <rect x="135" y="300" width="390" height="150" rx="15" fill="#FFFFFF" stroke="#D4DFF7" stroke-width="2"/>
    </g>
    <rect x="135" y="300" width="9" height="150" fill="#4A6FDC"/>
    <text x="168" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">Web 浏览器</text>
    <text x="168" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">React SPA，负责 UI 渲染与用户交互</text>
    <text x="168" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">通过 HTTPS + JWT 与后端通信</text>
    <text x="168" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">协议: HTTPS / WebSocket</text>

    <!-- 客户端模块 2: Mobile -->
    <g filter="url(#csShadow)">
        <rect x="135" y="480" width="390" height="150" rx="15" fill="#FFFFFF" stroke="#D4DFF7" stroke-width="2"/>
    </g>
    <rect x="135" y="480" width="9" height="150" fill="#4A6FDC"/>
    <text x="168" y="522" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">移动端 App</text>
    <text x="168" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">iOS / Android 双端，支持离线缓存</text>
    <text x="168" y="588" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">关键接口通过 HTTP/2 多路复用</text>
    <text x="168" y="615" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">协议: HTTP/2 / Push</text>

    <!-- 客户端模块 3: Third-party -->
    <g filter="url(#csShadow)">
        <rect x="135" y="660" width="390" height="150" rx="15" fill="#FFFFFF" stroke="#D4DFF7" stroke-width="2"/>
    </g>
    <rect x="135" y="660" width="9" height="150" fill="#4A6FDC"/>
    <text x="168" y="702" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">第三方集成</text>
    <text x="168" y="738" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">合作方服务器通过开放 API 接入</text>
    <text x="168" y="768" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">使用 API Key 或 OAuth2 客户端凭证</text>
    <text x="168" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">协议: HTTPS / Webhook</text>

    <!-- 右侧: Server 分组 -->
    <rect x="1350" y="195" width="480" height="780" rx="24" fill="#EFF9F1" stroke="#BEE6C6" stroke-width="2.2"/>
    <rect x="1350" y="195" width="480" height="66" rx="24" fill="#2E9E4A"/>
    <rect x="1350" y="237" width="480" height="24" fill="#2E9E4A"/>
    <text x="1590" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="700" fill="#FFFFFF">SERVER · 服务端</text>

    <!-- 服务端模块 1: Gateway -->
    <g filter="url(#csShadow)">
        <rect x="1395" y="300" width="390" height="150" rx="15" fill="#FFFFFF" stroke="#CDEAD3" stroke-width="2"/>
    </g>
    <rect x="1395" y="300" width="9" height="150" fill="#2E9E4A"/>
    <text x="1428" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">API 网关</text>
    <text x="1428" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">统一入口，负责鉴权、限流、路由</text>
    <text x="1428" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">日志采集与链路追踪注入</text>
    <text x="1428" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">Kong / Envoy</text>

    <!-- 服务端模块 2: Services -->
    <g filter="url(#csShadow)">
        <rect x="1395" y="480" width="390" height="150" rx="15" fill="#FFFFFF" stroke="#CDEAD3" stroke-width="2"/>
    </g>
    <rect x="1395" y="480" width="9" height="150" fill="#2E9E4A"/>
    <text x="1428" y="522" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">业务微服务</text>
    <text x="1428" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">按领域拆分的服务集群</text>
    <text x="1428" y="588" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">内部通过 gRPC 互相调用</text>
    <text x="1428" y="615" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">Go / Java / Node</text>

    <!-- 服务端模块 3: Data -->
    <g filter="url(#csShadow)">
        <rect x="1395" y="660" width="390" height="150" rx="15" fill="#FFFFFF" stroke="#CDEAD3" stroke-width="2"/>
    </g>
    <rect x="1395" y="660" width="9" height="150" fill="#2E9E4A"/>
    <text x="1428" y="702" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">数据存储</text>
    <text x="1428" y="738" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">主库 + 只读副本 + 缓存三级结构</text>
    <text x="1428" y="768" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">冷热分层，归档到对象存储</text>
    <text x="1428" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">PostgreSQL / Redis / S3</text>

    <!-- 中间通信通道标签 -->
    <text x="960" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="700" fill="#2C3E50">关键交互</text>
    <text x="960" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#7F8C8D">Key Interactions</text>

    <!-- 交互 1: 登录请求 -->
    <line x1="570" y1="375" x2="1389" y2="375" stroke="#4A6FDC" stroke-width="3.8" marker-end="url(#csArrowRight)"/>
    <rect x="750" y="339" width="420" height="33" rx="16" fill="#FFFFFF" stroke="#4A6FDC" stroke-width="2"/>
    <text x="960" y="363" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" font-weight="700" fill="#4A6FDC">① 登录请求 · POST /auth/login</text>

    <!-- 交互 2: 返回 Token -->
    <line x1="1389" y1="435" x2="576" y2="435" stroke="#2E9E4A" stroke-width="3.8" marker-end="url(#csArrowLeft)"/>
    <rect x="750" y="453" width="420" height="33" rx="16" fill="#FFFFFF" stroke="#2E9E4A" stroke-width="2"/>
    <text x="960" y="477" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" font-weight="700" fill="#2E9E4A">② 返回 JWT Token · 2xx Response</text>

    <!-- 交互 3: 业务调用 -->
    <line x1="570" y1="555" x2="1389" y2="555" stroke="#4A6FDC" stroke-width="3.8" marker-end="url(#csArrowRight)"/>
    <rect x="750" y="519" width="420" height="33" rx="16" fill="#FFFFFF" stroke="#4A6FDC" stroke-width="2"/>
    <text x="960" y="543" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" font-weight="700" fill="#4A6FDC">③ 业务调用 · GET /api/resources</text>

    <!-- 交互 4: 数据返回 -->
    <line x1="1389" y1="615" x2="576" y2="615" stroke="#2E9E4A" stroke-width="3.8" marker-end="url(#csArrowLeft)"/>
    <rect x="750" y="633" width="420" height="33" rx="16" fill="#FFFFFF" stroke="#2E9E4A" stroke-width="2"/>
    <text x="960" y="657" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" font-weight="700" fill="#2E9E4A">④ 数据返回 · JSON Payload</text>

    <!-- 交互 5: 推送 -->
    <line x1="1389" y1="735" x2="576" y2="735" stroke="#2E9E4A" stroke-width="3.8" marker-end="url(#csArrowLeft)"/>
    <rect x="750" y="753" width="420" height="33" rx="16" fill="#FFFFFF" stroke="#2E9E4A" stroke-width="2"/>
    <text x="960" y="777" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" font-weight="700" fill="#2E9E4A">⑤ 实时推送 · WebSocket / SSE</text>

    <!-- 底部注释 -->
    <text x="90" y="1028" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#7F8C8D">蓝色箭头 = 客户端发起；绿色箭头 = 服务端响应；每条交互箭头必须带动作标签，不要只画线</text>
</svg>
