<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    水平条形图模板
    用途: 类别排名、数值对比（适合类别名称较长的场景）
    适用场景: 销售排行榜、品牌认知度、满意度评分
    支持: 8个条形（可调整为5-12个）
    与柱状图区别: 水平展示，更适合排名和类别名较长的数据
    -->
    
    <defs>
        <!-- 条形渐变 -->
        <linearGradient id="hbarGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="hbarGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="hbarGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:1" />
        </linearGradient>
        
        <!-- 阴影 -->
        <filter id="hbarShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="2" dy="0"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>品牌认知度排行榜</tspan>
    </text>
    
    <text x="90" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>2025年消费者调研报告 · 样本量 N=5,000</tspan>
    </text>
    
    <!-- 图表区域 -->
    <g id="chartArea">
        <!-- X轴网格线 -->
        <line x1="450" y1="210" x2="450" y2="930" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="720" y1="210" x2="720" y2="930" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="990" y1="210" x2="990" y2="930" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="1260" y1="210" x2="1260" y2="930" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="1530" y1="210" x2="1530" y2="930" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="1800" y1="210" x2="1800" y2="930" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- X轴刻度标签 -->
        <text x="450" y="975" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>0%</tspan>
        </text>
        <text x="720" y="975" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>20%</tspan>
        </text>
        <text x="990" y="975" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>40%</tspan>
        </text>
        <text x="1260" y="975" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>60%</tspan>
        </text>
        <text x="1530" y="975" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>80%</tspan>
        </text>
        <text x="1800" y="975" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>100%</tspan>
        </text>
        
        <!-- Y轴基线 -->
        <line x1="450" y1="210" x2="450" y2="930" stroke="#95A5A6" stroke-width="3"/>
        <line x1="450" y1="930" x2="1800" y2="930" stroke="#95A5A6" stroke-width="3"/>
        
        <!-- 条形数据 (条高36px, 间距24px, 总间距60px) -->
        
        <!-- 条形1: 品牌A - 92% (第1名，蓝色) -->
        <text x="435" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50" text-anchor="end">
            <tspan>品牌A (市场领导者)</tspan>
        </text>
        <rect x="450" y="232" width="1242" height="54" rx="6" fill="url(#hbarGrad1)" filter="url(#hbarShadow)"/>
        <text x="1707" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50">
            <tspan>92%</tspan>
        </text>
        
        <!-- 条形2: 品牌B - 78% (第2名，蓝色) -->
        <text x="435" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50" text-anchor="end">
            <tspan>品牌B (新锐品牌)</tspan>
        </text>
        <rect x="450" y="322" width="1053" height="54" rx="6" fill="url(#hbarGrad1)" filter="url(#hbarShadow)"/>
        <text x="1518" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50">
            <tspan>78%</tspan>
        </text>
        
        <!-- 条形3: 品牌C - 65% (第3名，蓝色) -->
        <text x="435" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50" text-anchor="end">
            <tspan>品牌C (经典品牌)</tspan>
        </text>
        <rect x="450" y="412" width="878" height="54" rx="6" fill="url(#hbarGrad1)" filter="url(#hbarShadow)"/>
        <text x="1342" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50">
            <tspan>65%</tspan>
        </text>
        
        <!-- 条形4: 品牌D - 52% (第4名，绿色) -->
        <text x="435" y="532" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50" text-anchor="end">
            <tspan>品牌D (区域品牌)</tspan>
        </text>
        <rect x="450" y="502" width="702" height="54" rx="6" fill="url(#hbarGrad2)" filter="url(#hbarShadow)"/>
        <text x="1167" y="538" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50">
            <tspan>52%</tspan>
        </text>
        
        <!-- 条形5: 品牌E - 45% (第5名，绿色) -->
        <text x="435" y="622" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50" text-anchor="end">
            <tspan>品牌E (性价比品牌)</tspan>
        </text>
        <rect x="450" y="592" width="608" height="54" rx="6" fill="url(#hbarGrad2)" filter="url(#hbarShadow)"/>
        <text x="1072" y="628" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50">
            <tspan>45%</tspan>
        </text>
        
        <!-- 条形6: 品牌F - 38% (第6名，绿色) -->
        <text x="435" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50" text-anchor="end">
            <tspan>品牌F (高端品牌)</tspan>
        </text>
        <rect x="450" y="682" width="513" height="54" rx="6" fill="url(#hbarGrad2)" filter="url(#hbarShadow)"/>
        <text x="978" y="718" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50">
            <tspan>38%</tspan>
        </text>
        
        <!-- 条形7: 品牌G - 25% (第7名，橙色) -->
        <text x="435" y="802" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50" text-anchor="end">
            <tspan>品牌G (新进入者)</tspan>
        </text>
        <rect x="450" y="772" width="338" height="54" rx="6" fill="url(#hbarGrad3)" filter="url(#hbarShadow)"/>
        <text x="802" y="808" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50">
            <tspan>25%</tspan>
        </text>
        
        <!-- 条形8: 其他 - 12% (第8名，橙色) -->
        <text x="435" y="892" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50" text-anchor="end">
            <tspan>其他品牌</tspan>
        </text>
        <rect x="450" y="862" width="162" height="54" rx="6" fill="url(#hbarGrad3)" filter="url(#hbarShadow)"/>
        <text x="627" y="898" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50">
            <tspan>12%</tspan>
        </text>
    </g>
    
    <!-- 图例 -->
    <g id="legend">
        <rect x="90" y="990" width="24" height="24" rx="3" fill="url(#hbarGrad1)"/>
        <text x="128" y="1010" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>高认知度 (≥50%)</tspan>
        </text>
        
        <rect x="360" y="990" width="24" height="24" rx="3" fill="url(#hbarGrad2)"/>
        <text x="398" y="1010" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>中等认知度 (30-50%)</tspan>
        </text>
        
        <rect x="675" y="990" width="24" height="24" rx="3" fill="url(#hbarGrad3)"/>
        <text x="712" y="1010" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>低认知度 (&lt;30%)</tspan>
        </text>
    </g>
    
    <!-- 数据来源 -->
    <text x="1830" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#95A5A6" text-anchor="end">
        <tspan>数据来源: 市场研究部门</tspan>
    </text>
</svg>

