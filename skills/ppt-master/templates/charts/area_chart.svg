<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    面积图模板
    用途: 趋势变化、累积数据展示
    适用场景: 流量趋势、销售累积、库存变化、用户增长
    支持: 12个时间点 × 2系列（可调整）
    与折线图区别: 填充面积，更强调量的累积和变化
    -->
    
    <defs>
        <!-- 面积填充渐变（蓝色系列） -->
        <linearGradient id="areaGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.6" />
            <stop offset="100%" style="stop-color:#2196F3;stop-opacity:0.1" />
        </linearGradient>
        
        <!-- 面积填充渐变（绿色系列） -->
        <linearGradient id="areaGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.5" />
            <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:0.05" />
        </linearGradient>
        
        <!-- 数据点阴影 -->
        <filter id="dotShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>网站流量趋势分析</tspan>
    </text>
    
    <text x="90" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>2025年度月度数据 · 单位：万次访问</tspan>
    </text>
    
    <!-- 图例 -->
    <g id="legend" transform="translate(1425, 105)">
        <line x1="0" y1="15" x2="45" y2="15" stroke="#2196F3" stroke-width="4"/>
        <circle cx="22" cy="15" r="8" fill="#2196F3"/>
        <text x="60" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="22" fill="#5D6D7E">
            <tspan>PC端访问</tspan>
        </text>
        
        <line x1="225" y1="15" x2="270" y2="15" stroke="#4CAF50" stroke-width="4"/>
        <circle cx="248" cy="15" r="8" fill="#4CAF50"/>
        <text x="285" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="22" fill="#5D6D7E">
            <tspan>移动端访问</tspan>
        </text>
    </g>
    
    <!-- 图表区域 -->
    <g id="chartArea">
        <!-- Y轴网格线 -->
        <line x1="180" y1="840" x2="1800" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="180" y1="705" x2="1800" y2="705" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="180" y1="570" x2="1800" y2="570" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="180" y1="435" x2="1800" y2="435" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="180" y1="300" x2="1800" y2="300" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- Y轴刻度标签 -->
        <text x="158" y="848" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>0</tspan>
        </text>
        <text x="158" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>200</tspan>
        </text>
        <text x="158" y="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>400</tspan>
        </text>
        <text x="158" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>600</tspan>
        </text>
        <text x="158" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>800</tspan>
        </text>
        
        <!-- 坐标轴 -->
        <line x1="180" y1="240" x2="180" y2="840" stroke="#95A5A6" stroke-width="3"/>
        <line x1="180" y1="840" x2="1800" y2="840" stroke="#95A5A6" stroke-width="3"/>
        
        <!-- X轴标签（12个月） -->
        <!-- 每个月间距: (1200-120)/12 = 90px -->
        <text x="248" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>1月</tspan></text>
        <text x="382" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>2月</tspan></text>
        <text x="518" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>3月</tspan></text>
        <text x="652" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>4月</tspan></text>
        <text x="788" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>5月</tspan></text>
        <text x="922" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>6月</tspan></text>
        <text x="1058" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>7月</tspan></text>
        <text x="1192" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>8月</tspan></text>
        <text x="1328" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>9月</tspan></text>
        <text x="1462" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>10月</tspan></text>
        <text x="1598" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>11月</tspan></text>
        <text x="1732" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>12月</tspan></text>
        
        <!-- 
        数据点计算：
        X: 165, 255, 345, 435, 525, 615, 705, 795, 885, 975, 1065, 1155
        Y: 560 - (数值/200)*90  (每200单位=90px)
        
        PC端数据: 320, 280, 350, 420, 480, 520, 580, 620, 550, 490, 460, 520
        移动端数据: 180, 160, 210, 280, 350, 420, 480, 540, 500, 460, 430, 490
        -->
        
        <!-- 面积1: PC端（蓝色） -->
        <path d="M 248,840 
                 L 248,624 L 382,651 L 518,603.8 L 652,556 L 788,516 L 922,489 L 1058,448 L 1192,422 L 1328,468.8 L 1462,509.2 L 1598,530 L 1732,489 
                 L 1732,840 Z" 
              fill="url(#areaGrad1)"/>
        
        <!-- 折线1: PC端 -->
        <path d="M 248,624 L 382,651 L 518,603.8 L 652,556 L 788,516 L 922,489 L 1058,448 L 1192,422 L 1328,468.8 L 1462,509.2 L 1598,530 L 1732,489" 
              fill="none" stroke="#2196F3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- 面积2: 移动端（绿色） -->
        <path d="M 248,840 
                 L 248,718 L 382,732 L 518,698.2 L 652,651 L 788,603.8 L 922,556 L 1058,516 L 1192,476 L 1328,502 L 1462,530 L 1598,549.8 L 1732,509.2 
                 L 1732,840 Z" 
              fill="url(#areaGrad2)"/>
        
        <!-- 折线2: 移动端 -->
        <path d="M 248,718 L 382,732 L 518,698.2 L 652,651 L 788,603.8 L 922,556 L 1058,516 L 1192,476 L 1328,502 L 1462,530 L 1598,549.8 L 1732,509.2" 
              fill="none" stroke="#4CAF50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- PC端数据点 -->
        <circle cx="248" cy="624" r="8" fill="#FFFFFF" stroke="#2196F3" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="382" cy="651" r="8" fill="#FFFFFF" stroke="#2196F3" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="518" cy="603.8" r="8" fill="#FFFFFF" stroke="#2196F3" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="652" cy="556" r="8" fill="#FFFFFF" stroke="#2196F3" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="788" cy="516" r="8" fill="#FFFFFF" stroke="#2196F3" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="922" cy="489" r="8" fill="#FFFFFF" stroke="#2196F3" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1058" cy="448" r="8" fill="#FFFFFF" stroke="#2196F3" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1192" cy="422" r="9" fill="#2196F3" stroke="#FFFFFF" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1328" cy="468.8" r="8" fill="#FFFFFF" stroke="#2196F3" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1462" cy="509.2" r="8" fill="#FFFFFF" stroke="#2196F3" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1598" cy="530" r="8" fill="#FFFFFF" stroke="#2196F3" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1732" cy="489" r="8" fill="#FFFFFF" stroke="#2196F3" stroke-width="3" filter="url(#dotShadow)"/>
        
        <!-- 移动端数据点 -->
        <circle cx="248" cy="718" r="8" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="382" cy="732" r="8" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="518" cy="698.2" r="8" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="652" cy="651" r="8" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="788" cy="603.8" r="8" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="922" cy="556" r="8" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1058" cy="516" r="8" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1192" cy="476" r="9" fill="#4CAF50" stroke="#FFFFFF" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1328" cy="502" r="8" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1462" cy="530" r="8" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1598" cy="549.8" r="8" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1732" cy="509.2" r="8" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3" filter="url(#dotShadow)"/>
        
        <!-- 峰值标注（8月） -->
        <g>
            <rect x="1132" y="338" width="120" height="68" rx="9" fill="#2196F3"/>
            <text x="1192" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="middle">
                <tspan>峰值</tspan>
            </text>
            <text x="1192" y="393" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#FFFFFF" text-anchor="middle">
                <tspan>620万</tspan>
            </text>
            <path d="M 1192,405 L 1185,422 L 1200,422 Z" fill="#2196F3"/>
        </g>
    </g>
    
    <!-- 统计卡片 -->
    <g id="statsCards" transform="translate(90, 930)">
        <!-- 卡片1: 总访问量 -->
        <rect x="0" y="0" width="300" height="105" rx="12" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="2"/>
        <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#7F8C8D">
            <tspan>年度总访问量</tspan>
        </text>
        <text x="30" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="36" font-weight="bold" fill="#2C3E50">
            <tspan>10,240万</tspan>
        </text>
        
        <!-- 卡片2: PC端占比 -->
        <rect x="330" y="0" width="270" height="105" rx="12" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
        <text x="360" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#1976D2">
            <tspan>PC端占比</tspan>
        </text>
        <text x="360" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="36" font-weight="bold" fill="#2196F3">
            <tspan>55.8%</tspan>
        </text>
        
        <!-- 卡片3: 移动端占比 -->
        <rect x="630" y="0" width="270" height="105" rx="12" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
        <text x="660" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#388E3C">
            <tspan>移动端占比</tspan>
        </text>
        <text x="660" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="36" font-weight="bold" fill="#4CAF50">
            <tspan>44.2%</tspan>
        </text>
        
        <!-- 卡片4: 同比增长 -->
        <rect x="930" y="0" width="270" height="105" rx="12" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
        <text x="960" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#F57C00">
            <tspan>同比增长</tspan>
        </text>
        <text x="960" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="36" font-weight="bold" fill="#FF9800">
            <tspan>+23.5%</tspan>
        </text>
    </g>
    
    <!-- 数据来源 -->
    <text x="1830" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#95A5A6" text-anchor="end">
        <tspan>数据来源: 网站分析平台</tspan>
    </text>
</svg>

