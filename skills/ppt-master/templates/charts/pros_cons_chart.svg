<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    优劣势对比模板
    用途: 双向对比、利弊分析、方案评估
    适用场景: 产品对比、方案优劣势、决策支持
    支持: 左右对称 3+3 项 (推荐2-5项)
    -->
    
    <defs>
        <!-- 卡片阴影 -->
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.12"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题区域 -->
    <text x="960" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="700" fill="#1A252F" letter-spacing="-0.8">方案优劣势对比</text>
    <text x="960" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" fill="#7F8C8D">Pros vs Cons Analysis · 客观评估决策依据</text>
    
    <!-- 中间分隔标签 -->
    <rect x="882" y="180" width="156" height="60" rx="30" fill="#27AE60"/>
    <text x="960" y="219" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" font-weight="700" fill="#FFFFFF">PROS</text>
    <polygon points="882,210 852,192 852,228" fill="#27AE60"/>

    <rect x="882" y="258" width="156" height="60" rx="30" fill="#E74C3C"/>
    <text x="960" y="297" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" font-weight="700" fill="#FFFFFF">CONS</text>
    <polygon points="1038,288 1068,270 1068,306" fill="#E74C3C"/>
    
    <!-- 左侧标题 (优势) -->
    <text x="420" y="219" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="33" font-weight="700" fill="#27AE60">优势</text>
    
    <!-- 右侧标题 (劣势) -->
    <text x="1500" y="219" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="33" font-weight="700" fill="#E74C3C">劣势</text>
    
    <!-- 优势卡片 1 -->
    <g filter="url(#cardShadow)">
        <rect x="90" y="345" width="765" height="150" rx="15" fill="#FFFFFF"/>
        <rect x="90" y="345" width="9" height="150" rx="4" fill="#27AE60"/>
        <circle cx="144" cy="402" r="27" fill="#27AE60" fill-opacity="0.12"/>
        <text x="144" y="411" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#27AE60">✓</text>
        <text x="192" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#1A252F">产品质量领先</text>
        <text x="192" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">核心技术自主可控，用户满意度持续高于行业均值15%</text>
    </g>
    
    <!-- 优势卡片 2 -->
    <g filter="url(#cardShadow)">
        <rect x="90" y="522" width="765" height="150" rx="15" fill="#FFFFFF"/>
        <rect x="90" y="522" width="9" height="150" rx="4" fill="#27AE60"/>
        <circle cx="144" cy="579" r="27" fill="#27AE60" fill-opacity="0.12"/>
        <text x="144" y="588" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#27AE60">✓</text>
        <text x="192" y="579" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#1A252F">品牌认知度高</text>
        <text x="192" y="621" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">全渠道覆盖率85%，品牌知名度位列细分市场TOP3</text>
    </g>
    
    <!-- 优势卡片 3 -->
    <g filter="url(#cardShadow)">
        <rect x="90" y="699" width="765" height="150" rx="15" fill="#FFFFFF"/>
        <rect x="90" y="699" width="9" height="150" rx="4" fill="#27AE60"/>
        <circle cx="144" cy="756" r="27" fill="#27AE60" fill-opacity="0.12"/>
        <text x="144" y="765" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#27AE60">✓</text>
        <text x="192" y="756" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#1A252F">用户生态完善</text>
        <text x="192" y="798" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">用户留存率/分享率/复购率远超行业平均水平</text>
    </g>
    
    <!-- 劣势卡片 1 -->
    <g filter="url(#cardShadow)">
        <rect x="1065" y="345" width="765" height="150" rx="15" fill="#FFFFFF"/>
        <rect x="1821" y="345" width="9" height="150" rx="4" fill="#E74C3C"/>
        <circle cx="1776" cy="402" r="27" fill="#E74C3C" fill-opacity="0.12"/>
        <text x="1776" y="411" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#E74C3C">✗</text>
        <text x="1095" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#1A252F">产品迭代周期长</text>
        <text x="1095" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">从用户反馈到功能上线平均需12周，竞品仅需6-8周</text>
    </g>
    
    <!-- 劣势卡片 2 -->
    <g filter="url(#cardShadow)">
        <rect x="1065" y="522" width="765" height="150" rx="15" fill="#FFFFFF"/>
        <rect x="1821" y="522" width="9" height="150" rx="4" fill="#E74C3C"/>
        <circle cx="1776" cy="579" r="27" fill="#E74C3C" fill-opacity="0.12"/>
        <text x="1776" y="588" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#E74C3C">✗</text>
        <text x="1095" y="579" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#1A252F">下沉市场薄弱</text>
        <text x="1095" y="621" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">二三线城市渗透率仅23%，经销商网络覆盖不足</text>
    </g>
    
    <!-- 劣势卡片 3 -->
    <g filter="url(#cardShadow)">
        <rect x="1065" y="699" width="765" height="150" rx="15" fill="#FFFFFF"/>
        <rect x="1821" y="699" width="9" height="150" rx="4" fill="#E74C3C"/>
        <circle cx="1776" cy="756" r="27" fill="#E74C3C" fill-opacity="0.12"/>
        <text x="1776" y="765" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#E74C3C">✗</text>
        <text x="1095" y="756" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#1A252F">服务响应待提升</text>
        <text x="1095" y="798" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">售后工单平均响应时长48h，客户流失风险增大</text>
    </g>
    
    <!-- 底部建议栏 -->
    <rect x="90" y="915" width="1740" height="105" rx="15" fill="#F8F9FA"/>
    <text x="960" y="963" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="22" font-weight="700" fill="#1A252F">建议策略</text>
    <text x="960" y="998" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#7F8C8D">巩固产品与品牌优势，同步加速迭代节奏、拓展下沉渠道、强化售后响应体系</text>
    
    <!-- 底部装饰条 -->
    <rect x="90" y="1044" width="870" height="6" rx="3" fill="#27AE60" fill-opacity="0.25"/>
    <rect x="960" y="1044" width="870" height="6" rx="3" fill="#E74C3C" fill-opacity="0.25"/>
</svg>