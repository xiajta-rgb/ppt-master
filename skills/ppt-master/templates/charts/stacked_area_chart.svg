<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    堆叠面积图模板
    用途: 多系列累积趋势、构成变化
    适用场景: 收入构成变化、流量来源趋势、市场份额演进
    支持: 4个系列 × 12个时间点
    -->
    
    <defs>
        <!-- 系列1渐变（蓝色） -->
        <linearGradient id="stackGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.85" />
            <stop offset="100%" style="stop-color:#2196F3;stop-opacity:0.6" />
        </linearGradient>
        
        <!-- 系列2渐变（绿色） -->
        <linearGradient id="stackGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.85" />
            <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:0.6" />
        </linearGradient>
        
        <!-- 系列3渐变（橙色） -->
        <linearGradient id="stackGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FF9800;stop-opacity:0.85" />
            <stop offset="100%" style="stop-color:#FF9800;stop-opacity:0.6" />
        </linearGradient>
        
        <!-- 系列4渐变（紫色） -->
        <linearGradient id="stackGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:0.85" />
            <stop offset="100%" style="stop-color:#9C27B0;stop-opacity:0.6" />
        </linearGradient>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>营收来源构成趋势</tspan>
    </text>
    
    <text x="90" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>2025年度月度数据 · 单位：百万元</tspan>
    </text>
    
    <!-- 图例 -->
    <g id="legend" transform="translate(1200, 90)">
        <rect x="0" y="0" width="24" height="24" rx="4" fill="#2196F3"/>
        <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E"><tspan>订阅收入</tspan></text>
        
        <rect x="165" y="0" width="24" height="24" rx="4" fill="#4CAF50"/>
        <text x="201" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E"><tspan>广告收入</tspan></text>
        
        <rect x="330" y="0" width="24" height="24" rx="4" fill="#FF9800"/>
        <text x="366" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E"><tspan>增值服务</tspan></text>
        
        <rect x="495" y="0" width="24" height="24" rx="4" fill="#9C27B0"/>
        <text x="531" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E"><tspan>其他</tspan></text>
    </g>
    
    <!-- 图表区域 -->
    <g id="chartArea">
        <!-- Y轴网格线 -->
        <line x1="150" y1="825" x2="1770" y2="825" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="150" y1="690" x2="1770" y2="690" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="150" y1="555" x2="1770" y2="555" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="150" y1="420" x2="1770" y2="420" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="150" y1="285" x2="1770" y2="285" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- Y轴刻度标签 -->
        <text x="128" y="832" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>0</tspan></text>
        <text x="128" y="698" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>50</tspan></text>
        <text x="128" y="562" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>100</tspan></text>
        <text x="128" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>150</tspan></text>
        <text x="128" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>200</tspan></text>
        
        <!-- 坐标轴 -->
        <line x1="150" y1="225" x2="150" y2="825" stroke="#95A5A6" stroke-width="3"/>
        <line x1="150" y1="825" x2="1770" y2="825" stroke="#95A5A6" stroke-width="3"/>
        
        <!-- X轴标签（12个月） -->
        <!-- 每月间距: 90px -->
        <text x="218" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>1月</tspan></text>
        <text x="352" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>2月</tspan></text>
        <text x="488" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>3月</tspan></text>
        <text x="622" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>4月</tspan></text>
        <text x="758" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>5月</tspan></text>
        <text x="892" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>6月</tspan></text>
        <text x="1028" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>7月</tspan></text>
        <text x="1162" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>8月</tspan></text>
        <text x="1298" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>9月</tspan></text>
        <text x="1432" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>10月</tspan></text>
        <text x="1568" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>11月</tspan></text>
        <text x="1702" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>12月</tspan></text>
        
        <!-- 
        数据说明（从下到上堆叠）：
        X坐标: 145, 235, 325, 415, 505, 595, 685, 775, 865, 955, 1045, 1135
        Y: 550 - value * 1.8
        
        系列1 订阅收入: 45, 48, 52, 55, 58, 62, 68, 72, 70, 68, 75, 82
        系列2 广告收入: 25, 28, 30, 32, 35, 38, 42, 45, 43, 40, 45, 50
        系列3 增值服务: 15, 16, 18, 20, 22, 25, 28, 30, 28, 26, 30, 35
        系列4 其他: 8, 8, 10, 10, 12, 12, 15, 15, 14, 14, 15, 18
        
        累计:
        L1底: 0
        L1顶: 45, 48, 52, 55, 58, 62, 68, 72, 70, 68, 75, 82
        L2顶: 70, 76, 82, 87, 93, 100, 110, 117, 113, 108, 120, 132
        L3顶: 85, 92, 100, 107, 115, 125, 138, 147, 141, 134, 150, 167
        L4顶: 93, 100, 110, 117, 127, 137, 153, 162, 155, 148, 165, 185
        -->
        
        <!-- 系列4: 其他（最上层，紫色） -->
        <path d="M 218,825 
                 L 218,573.9 L 352,555 L 488,528 L 622,509.1 L 758,482.1 L 892,455.1 L 1028,411.9 L 1162,387.6 L 1298,406 L 1432,425.4 L 1568,380 L 1702,326
                 L 1702,374.1 L 1568,420 L 1432,463.2 L 1298,444.3 L 1162,428.1 L 1028,452.4 L 892,488 L 758,514 L 622,536.1 L 488,555 L 352,576.6 L 218,596
                 Z" fill="url(#stackGrad4)"/>
        
        <!-- 系列3: 增值服务（橙色） -->
        <path d="M 218,825 
                 L 218,596 L 352,576.6 L 488,555 L 622,536.1 L 758,514 L 892,488 L 1028,452.4 L 1162,428.1 L 1298,444.3 L 1432,463.2 L 1568,420 L 1702,374.1
                 L 1702,468.6 L 1568,501 L 1432,533.4 L 1298,513.9 L 1162,506 L 1028,528.6 L 892,561 L 758,580 L 622,597.9 L 488,609 L 352,619.8 L 218,636
                 Z" fill="url(#stackGrad3)"/>
        
        <!-- 系列2: 广告收入（绿色） -->
        <path d="M 218,825 
                 L 218,636 L 352,619.8 L 488,609 L 622,597.9 L 758,580 L 892,561 L 1028,528.6 L 1162,506 L 1298,513.9 L 1432,533.4 L 1568,501 L 1702,468.6
                 L 1702,603.6 L 1568,622 L 1432,641.4 L 1298,636 L 1162,627.9 L 1028,636 L 892,654.9 L 758,668 L 622,676 L 488,684.6 L 352,695.4 L 218,704
                 Z" fill="url(#stackGrad2)"/>
        
        <!-- 系列1: 订阅收入（蓝色，最底层） -->
        <path d="M 218,825 
                 L 218,704 L 352,695.4 L 488,684.6 L 622,676 L 758,668 L 892,654.9 L 1028,636 L 1162,627.9 L 1298,636 L 1432,641.4 L 1568,622 L 1702,603.6
                 L 1702,825 Z" fill="url(#stackGrad1)"/>
        
        <!-- 顶部边线 -->
        <path d="M 218,573.9 L 352,555 L 488,528 L 622,509.1 L 758,482.1 L 892,455.1 L 1028,411.9 L 1162,387.6 L 1298,406 L 1432,425.4 L 1568,380 L 1702,326" 
              fill="none" stroke="#9C27B0" stroke-width="3"/>
    </g>
    
    <!-- 标注（8月峰值） -->
    <g id="annotation">
        <rect x="1095" y="292" width="135" height="75" rx="9" fill="#9C27B0"/>
        <text x="1162" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>峰值月份</tspan></text>
        <text x="1162" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#FFFFFF" text-anchor="middle"><tspan>162M</tspan></text>
        <path d="M 1162,368 L 1155,387.6 L 1170,387.6 Z" fill="#9C27B0"/>
    </g>
    
    <!-- 统计卡片 -->
    <g id="statsCards" transform="translate(90, 915)">
        <!-- 卡片1 -->
        <rect x="0" y="0" width="300" height="120" rx="12" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
        <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#1976D2"><tspan>订阅收入</tspan></text>
        <text x="30" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="33" font-weight="bold" fill="#2196F3"><tspan>755M</tspan></text>
        <text x="30" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D"><tspan>占比 48.5% ↑12%</tspan></text>
        
        <!-- 卡片2 -->
        <rect x="330" y="0" width="300" height="120" rx="12" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
        <text x="360" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#388E3C"><tspan>广告收入</tspan></text>
        <text x="360" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="33" font-weight="bold" fill="#4CAF50"><tspan>453M</tspan></text>
        <text x="360" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D"><tspan>占比 29.1% ↑8%</tspan></text>
        
        <!-- 卡片3 -->
        <rect x="660" y="0" width="300" height="120" rx="12" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
        <text x="690" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#F57C00"><tspan>增值服务</tspan></text>
        <text x="690" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="33" font-weight="bold" fill="#FF9800"><tspan>293M</tspan></text>
        <text x="690" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D"><tspan>占比 18.8% ↑15%</tspan></text>
        
        <!-- 卡片4 -->
        <rect x="990" y="0" width="300" height="120" rx="12" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
        <text x="1020" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#7B1FA2"><tspan>其他收入</tspan></text>
        <text x="1020" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="33" font-weight="bold" fill="#9C27B0"><tspan>56M</tspan></text>
        <text x="1020" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D"><tspan>占比 3.6% ↑5%</tspan></text>
        
        <!-- 总计 -->
        <rect x="1320" y="0" width="300" height="120" rx="12" fill="#F8F9FA" stroke="#2C3E50" stroke-width="3"/>
        <text x="1350" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>年度总营收</tspan></text>
        <text x="1350" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="33" font-weight="bold" fill="#2C3E50"><tspan>1,557M</tspan></text>
        <text x="1350" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#27AE60"><tspan>同比增长 +11.2%</tspan></text>
    </g>
    
    <!-- 数据来源 -->
    <text x="1830" y="1050" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#95A5A6" text-anchor="end">
        <tspan>数据来源: 财务部门</tspan>
    </text>
</svg>

