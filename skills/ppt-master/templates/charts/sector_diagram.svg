<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!--
    扇形放射图模板
    用途: 中心主题放射、半圆分布、服务体系展示
    适用场景: 核心能力放射、服务矩阵、生态体系
    支持: 6扇区半圆 (推荐4-8个)
    -->

    <defs>
        <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 标题 -->
    <text x="960" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="45" font-weight="700" fill="#1A252F">企业服务生态体系</text>
    <text x="960" y="116" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">Service Ecosystem · 六大核心服务能力环绕中心平台</text>

    <!-- 半圆底座辅助 -->
    <path d="M 285,870 A 675,675 0 0,2 1635,870" fill="none" stroke="#E8E8E8" stroke-width="2.2" stroke-dasharray="6,4"/>
    <path d="M 465,870 A 495,495 0 0,2 1455,870" fill="none" stroke="#E8E8E8" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- 连接线 (从中心到各节点) -->
    <!-- 中心(640,540) -->
    <line x1="960" y1="735" x2="960" y2="240" stroke="#6C5CE7" stroke-width="3" stroke-opacity="0.25"/>
    <line x1="915" y1="742" x2="435" y2="330" stroke="#00B894" stroke-width="3" stroke-opacity="0.25"/>
    <line x1="1005" y1="742" x2="1485" y2="330" stroke="#E17055" stroke-width="3" stroke-opacity="0.25"/>
    <line x1="885" y1="765" x2="255" y2="630" stroke="#74B9FF" stroke-width="3" stroke-opacity="0.25"/>
    <line x1="1035" y1="765" x2="1665" y2="630" stroke="#FDCB6E" stroke-width="3" stroke-opacity="0.25"/>
    <line x1="870" y1="795" x2="360" y2="870" stroke="#A29BFE" stroke-width="3" stroke-opacity="0.25"/>

    <!-- 中心节点 -->
    <circle cx="960" cy="810" r="82" fill="#2C3E50" filter="url(#nodeShadow)"/>
    <text x="960" y="800" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="800" fill="#FFFFFF">核心</text>
    <text x="960" y="832" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="800" fill="#FFFFFF">平台</text>

    <!-- 节点1 (顶部正上方) -->
    <circle cx="960" cy="218" r="63" fill="#6C5CE7" filter="url(#nodeShadow)"/>
    <text x="960" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#FFFFFF">数据</text>
    <text x="960" y="237" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#FFFFFF">智能</text>
    <rect x="840" y="297" width="240" height="72" rx="12" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <text x="960" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">AI分析引擎</text>
    <text x="960" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#95A5A6">实时数据洞察与预测</text>

    <!-- 节点2 (左上) -->
    <circle cx="435" cy="315" r="63" fill="#00B894" filter="url(#nodeShadow)"/>
    <text x="435" y="308" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#FFFFFF">技术</text>
    <text x="435" y="334" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#FFFFFF">研发</text>
    <rect x="315" y="394" width="240" height="72" rx="12" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <text x="435" y="428" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">全栈技术能力</text>
    <text x="435" y="453" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#95A5A6">云原生+微服务架构</text>

    <!-- 节点3 (右上) -->
    <circle cx="1485" cy="315" r="63" fill="#E17055" filter="url(#nodeShadow)"/>
    <text x="1485" y="308" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#FFFFFF">客户</text>
    <text x="1485" y="334" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#FFFFFF">成功</text>
    <rect x="1365" y="394" width="240" height="72" rx="12" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <text x="1485" y="428" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">专属客户经理</text>
    <text x="1485" y="453" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#95A5A6">7×24小时响应保障</text>

    <!-- 节点4 (左中) -->
    <circle cx="248" cy="615" r="63" fill="#74B9FF" filter="url(#nodeShadow)"/>
    <text x="248" y="608" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#FFFFFF">安全</text>
    <text x="248" y="634" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#FFFFFF">合规</text>
    <rect x="128" y="694" width="240" height="72" rx="12" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <text x="248" y="728" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">等保三级认证</text>
    <text x="248" y="753" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#95A5A6">SOC2/GDPR/ISO27001</text>

    <!-- 节点5 (右中) -->
    <circle cx="1672" cy="615" r="63" fill="#D4A537" filter="url(#nodeShadow)"/>
    <text x="1672" y="608" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#FFFFFF">生态</text>
    <text x="1672" y="634" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#FFFFFF">集成</text>
    <rect x="1552" y="694" width="240" height="72" rx="12" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <text x="1672" y="728" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">200+ API接口</text>
    <text x="1672" y="753" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#95A5A6">主流系统无缝对接</text>

    <!-- 节点6 (左下) -->
    <circle cx="360" cy="862" r="63" fill="#A29BFE" filter="url(#nodeShadow)"/>
    <text x="360" y="855" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#FFFFFF">培训</text>
    <text x="360" y="882" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" fill="#FFFFFF">赋能</text>
    <rect x="240" y="938" width="240" height="72" rx="12" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <text x="360" y="970" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#5F6368">线上线下培训</text>
    <text x="360" y="996" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#95A5A6">认证体系与知识库</text>
</svg>