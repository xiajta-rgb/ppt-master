<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!--
    垂直列表模板
    用途: 纵向编号列表、特性/优势罗列、要点展示
    适用场景: 核心优势、关键发现、特性清单、要点总结
    支持: 5项纵向 (推荐3-6项)
    -->

    <defs>
        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 标题 -->
    <text x="90" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="45" font-weight="700" fill="#1A252F">五大核心竞争优势</text>
    <text x="90" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">Core Strengths · 构建差异化护城河的关键能力</text>

    <!-- 主竖线 -->
    <line x1="240" y1="172" x2="240" y2="1020" stroke="#E8E8E8" stroke-width="4" stroke-linecap="round"/>

    <!-- 项目1 -->
    <circle cx="240" cy="232" r="36" fill="#6C5CE7" filter="url(#cardShadow)"/>
    <text x="240" y="242" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="800" fill="#FFFFFF">01</text>
    <line x1="276" y1="232" x2="345" y2="232" stroke="#6C5CE7" stroke-width="3" stroke-opacity="0.4"/>
    <rect x="345" y="180" width="1470" height="105" rx="15" fill="#6C5CE7" fill-opacity="0.04" filter="url(#cardShadow)"/>
    <rect x="345" y="180" width="8" height="105" rx="4" fill="#6C5CE7"/>
    <text x="387" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="700" fill="#1A252F">品牌影响力</text>
    <text x="387" y="261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#7F8C8D">行业领先的品牌认知度与美誉度，覆盖全国主要市场，品牌价值连续三年位居行业 TOP3</text>
    <text x="1770" y="240" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="36" font-weight="800" fill="#6C5CE7" fill-opacity="0.12">BRAND</text>

    <!-- 项目2 -->
    <circle cx="240" cy="398" r="36" fill="#00B894" filter="url(#cardShadow)"/>
    <text x="240" y="406" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="800" fill="#FFFFFF">02</text>
    <line x1="276" y1="398" x2="345" y2="398" stroke="#00B894" stroke-width="3" stroke-opacity="0.4"/>
    <rect x="345" y="345" width="1470" height="105" rx="15" fill="#00B894" fill-opacity="0.04" filter="url(#cardShadow)"/>
    <rect x="345" y="345" width="8" height="105" rx="4" fill="#00B894"/>
    <text x="387" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="700" fill="#1A252F">技术研发能力</text>
    <text x="387" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#7F8C8D">持续高研发投入占比 15%+，拥有 500+ 核心自主专利，AI 与大数据双引擎驱动创新</text>
    <text x="1770" y="405" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="36" font-weight="800" fill="#00B894" fill-opacity="0.12">TECH</text>

    <!-- 项目3 -->
    <circle cx="240" cy="562" r="36" fill="#0984E3" filter="url(#cardShadow)"/>
    <text x="240" y="572" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="800" fill="#FFFFFF">03</text>
    <line x1="276" y1="562" x2="345" y2="562" stroke="#0984E3" stroke-width="3" stroke-opacity="0.4"/>
    <rect x="345" y="510" width="1470" height="105" rx="15" fill="#0984E3" fill-opacity="0.04" filter="url(#cardShadow)"/>
    <rect x="345" y="510" width="8" height="105" rx="4" fill="#0984E3"/>
    <text x="387" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="700" fill="#1A252F">供应链管理</text>
    <text x="387" y="591" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#7F8C8D">全球化供应链布局与智能仓储物流体系，覆盖 300+ 城市，平均交付时效缩短 40%</text>
    <text x="1770" y="570" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="36" font-weight="800" fill="#0984E3" fill-opacity="0.12">SUPPLY</text>

    <!-- 项目4 -->
    <circle cx="240" cy="728" r="36" fill="#D4A537" filter="url(#cardShadow)"/>
    <text x="240" y="736" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="800" fill="#FFFFFF">04</text>
    <line x1="276" y1="728" x2="345" y2="728" stroke="#D4A537" stroke-width="3" stroke-opacity="0.4"/>
    <rect x="345" y="675" width="1470" height="105" rx="15" fill="#D4A537" fill-opacity="0.04" filter="url(#cardShadow)"/>
    <rect x="345" y="675" width="8" height="105" rx="4" fill="#D4A537"/>
    <text x="387" y="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="700" fill="#1A252F">客户服务体系</text>
    <text x="387" y="756" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#7F8C8D">7×24 小时快速响应机制，客户满意度持续保持在 96% 以上，NPS 行业领先</text>
    <text x="1770" y="735" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="36" font-weight="800" fill="#D4A537" fill-opacity="0.12">SERVICE</text>

    <!-- 项目5 -->
    <circle cx="240" cy="892" r="36" fill="#E17055" filter="url(#cardShadow)"/>
    <text x="240" y="902" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="800" fill="#FFFFFF">05</text>
    <line x1="276" y1="892" x2="345" y2="892" stroke="#E17055" stroke-width="3" stroke-opacity="0.4"/>
    <rect x="345" y="840" width="1470" height="105" rx="15" fill="#E17055" fill-opacity="0.04" filter="url(#cardShadow)"/>
    <rect x="345" y="840" width="8" height="105" rx="4" fill="#E17055"/>
    <text x="387" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="700" fill="#1A252F">创新与智能化</text>
    <text x="387" y="921" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#7F8C8D">AI 与大数据赋能业务决策，每年推出 10+ 创新产品与解决方案，引领行业技术变革</text>
    <text x="1770" y="900" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="36" font-weight="800" fill="#E17055" fill-opacity="0.12">INNOVATION</text>

    <!-- 底部箭头指示 -->
    <polygon points="240,1002 255,1020 225,1020" fill="#E0E0E0"/>

    <!-- 底部注释 -->
    <text x="960" y="1065" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#BDC3C7">左侧编号轴标注顺序，右侧卡片展开要点详情，适合优势清单与要点罗列</text>
</svg>