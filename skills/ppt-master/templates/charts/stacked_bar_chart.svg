<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    堆叠柱状图模板
    用途: 多类别构成对比、占比趋势分析
    适用场景: 收入构成、成本分解、市场份额变化
    支持: 5组数据 × 4个类别（可调整）
    -->
    
    <defs>
        <!-- 阴影 -->
        <filter id="stackShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>各季度收入构成分析</tspan>
    </text>
    
    <text x="90" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>2024-2025年度 · 单位：百万元</tspan>
    </text>
    
    <!-- 图表区域 -->
    <g id="chartArea">
        <!-- Y轴网格线 -->
        <line x1="210" y1="825" x2="1650" y2="825" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="705" x2="1650" y2="705" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="585" x2="1650" y2="585" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="465" x2="1650" y2="465" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="345" x2="1650" y2="345" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="225" x2="1650" y2="225" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- Y轴刻度标签 -->
        <text x="188" y="832" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>0</tspan>
        </text>
        <text x="188" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>100</tspan>
        </text>
        <text x="188" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>200</tspan>
        </text>
        <text x="188" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>300</tspan>
        </text>
        <text x="188" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>400</tspan>
        </text>
        <text x="188" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>500</tspan>
        </text>
        
        <!-- X轴和Y轴 -->
        <line x1="210" y1="225" x2="210" y2="825" stroke="#95A5A6" stroke-width="3"/>
        <line x1="210" y1="825" x2="1650" y2="825" stroke="#95A5A6" stroke-width="3"/>
        
        <!-- 堆叠柱子 - Q1 2024 (总高320, 按比例: 产品A 120, 产品B 100, 产品C 60, 产品D 40) -->
        <g filter="url(#stackShadow)">
            <rect x="300" y="633" width="120" height="192" fill="#2196F3"/>
            <rect x="300" y="513" width="120" height="120" fill="#4CAF50"/>
            <rect x="300" y="441" width="120" height="72" fill="#FF9800"/>
            <rect x="300" y="393" width="120" height="48" fill="#9C27B0"/>
        </g>
        <text x="360" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>Q1'24</tspan>
        </text>
        <text x="360" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>320</tspan>
        </text>
        
        <!-- 堆叠柱子 - Q2 2024 (总高360) -->
        <g filter="url(#stackShadow)">
            <rect x="570" y="609" width="120" height="216" fill="#2196F3"/>
            <rect x="570" y="477" width="120" height="132" fill="#4CAF50"/>
            <rect x="570" y="393" width="120" height="84" fill="#FF9800"/>
            <rect x="570" y="333" width="120" height="60" fill="#9C27B0"/>
        </g>
        <text x="630" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>Q2'24</tspan>
        </text>
        <text x="630" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>360</tspan>
        </text>
        
        <!-- 堆叠柱子 - Q3 2024 (总高400) -->
        <g filter="url(#stackShadow)">
            <rect x="840" y="585" width="120" height="240" fill="#2196F3"/>
            <rect x="840" y="441" width="120" height="144" fill="#4CAF50"/>
            <rect x="840" y="345" width="120" height="96" fill="#FF9800"/>
            <rect x="840" y="273" width="120" height="72" fill="#9C27B0"/>
        </g>
        <text x="900" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>Q3'24</tspan>
        </text>
        <text x="900" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>400</tspan>
        </text>
        
        <!-- 堆叠柱子 - Q4 2024 (总高420) -->
        <g filter="url(#stackShadow)">
            <rect x="1110" y="573" width="120" height="252" fill="#2196F3"/>
            <rect x="1110" y="417" width="120" height="156" fill="#4CAF50"/>
            <rect x="1110" y="309" width="120" height="108" fill="#FF9800"/>
            <rect x="1110" y="237" width="120" height="72" fill="#9C27B0"/>
        </g>
        <text x="1170" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>Q4'24</tspan>
        </text>
        <text x="1170" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>420</tspan>
        </text>
        
        <!-- 堆叠柱子 - Q1 2025 (总高480) -->
        <g filter="url(#stackShadow)">
            <rect x="1380" y="537" width="120" height="288" fill="#2196F3"/>
            <rect x="1380" y="369" width="120" height="168" fill="#4CAF50"/>
            <rect x="1380" y="249" width="120" height="120" fill="#FF9800"/>
            <rect x="1380" y="165" width="120" height="84" fill="#9C27B0"/>
        </g>
        <text x="1440" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>Q1'25</tspan>
        </text>
        <text x="1440" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>480</tspan>
        </text>
    </g>
    
    <!-- 图例 -->
    <g id="legend" transform="translate(1680, 300)">
        <rect x="0" y="0" width="210" height="270" rx="12" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="2"/>
        
        <text x="105" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>收入类别</tspan>
        </text>
        
        <rect x="22" y="75" width="30" height="24" rx="3" fill="#2196F3"/>
        <text x="68" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5D6D7E">
            <tspan>产品销售</tspan>
        </text>
        
        <rect x="22" y="120" width="30" height="24" rx="3" fill="#4CAF50"/>
        <text x="68" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5D6D7E">
            <tspan>服务收入</tspan>
        </text>
        
        <rect x="22" y="165" width="30" height="24" rx="3" fill="#FF9800"/>
        <text x="68" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5D6D7E">
            <tspan>订阅收入</tspan>
        </text>
        
        <rect x="22" y="210" width="30" height="24" rx="3" fill="#9C27B0"/>
        <text x="68" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5D6D7E">
            <tspan>其他收入</tspan>
        </text>
    </g>
    
    <!-- 数据来源 -->
    <text x="90" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" fill="#95A5A6">
        <tspan>数据来源: 财务部门报表</tspan>
    </text>
</svg>

