<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    双Y轴折线图模板
    用途: 展示两个不同量纲指标的时序变化
    场景: 温湿度监控、销量与利润率对比、流量与转化率分析等
    示例数据: 温度(°C) + 相对湿度(%)
    配色: 黑白专业风格 | 左轴:圆点实线 | 右轴:方块虚线
    画布: 1920×1080 (16:9)
    -->
    
    <defs>
        <!-- 数据点阴影 -->
        <filter id="dotShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="bold" fill="#000000">
        <tspan>温湿度测试循环曲线</tspan>
    </text>
    
    <text x="90" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" fill="#666666">
        <tspan>环境测试 · 总时长：720分钟（12小时）</tspan>
    </text>
    
    <!-- 阶段标注背景 -->
    <rect x="210" y="195" width="237" height="60" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="2" rx="6"/>
    <rect x="447" y="195" width="356" height="60" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="2" rx="6"/>
    <rect x="802" y="195" width="237" height="60" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="2" rx="6"/>
    <rect x="1040" y="195" width="356" height="60" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="2" rx="6"/>
    <rect x="1395" y="195" width="237" height="60" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="2" rx="6"/>
    
    <!-- 阶段文字标注 -->
    <text x="328" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" font-weight="600" fill="#333333" text-anchor="middle">
        <tspan>1.升温(60min)</tspan>
    </text>
    
    <text x="624.8" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" font-weight="600" fill="#333333" text-anchor="middle">
        <tspan>2.高温保持(240min)</tspan>
    </text>
    
    <text x="921" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" font-weight="600" fill="#333333" text-anchor="middle">
        <tspan>3.降温(120min)</tspan>
    </text>
    
    <text x="1217.2" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" font-weight="600" fill="#333333" text-anchor="middle">
        <tspan>4.低温保持(240min)</tspan>
    </text>
    
    <text x="1514" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" font-weight="600" fill="#333333" text-anchor="middle">
        <tspan>5.复位(60min)</tspan>
    </text>
    
    <!-- 图表区域 -->
    <g id="chartArea">
        <!-- 阶段分隔线 -->
        <line x1="447" y1="285" x2="447" y2="870" stroke="#BDBDBD" stroke-width="2.2" stroke-dasharray="5,5"/>
        <line x1="802" y1="285" x2="802" y2="870" stroke="#BDBDBD" stroke-width="2.2" stroke-dasharray="5,5"/>
        <line x1="1040" y1="285" x2="1040" y2="870" stroke="#BDBDBD" stroke-width="2.2" stroke-dasharray="5,5"/>
        <line x1="1395" y1="285" x2="1395" y2="870" stroke="#BDBDBD" stroke-width="2.2" stroke-dasharray="5,5"/>
        
        <!-- 水平网格线（与刻度精确对齐）-->
        <!-- 底部：-60°C / 0% -->
        <line x1="210" y1="870" x2="1632" y2="870" stroke="#E0E0E0" stroke-width="2.2"/>
        <!-- -30°C / 20% -->
        <line x1="210" y1="753" x2="1632" y2="753" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <!-- 0°C / 40% -->
        <line x1="210" y1="636" x2="1632" y2="636" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <!-- 30°C / 60% -->
        <line x1="210" y1="519" x2="1632" y2="519" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <!-- 60°C / 80% -->
        <line x1="210" y1="402" x2="1632" y2="402" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <!-- 顶部：90°C / 100% -->
        <line x1="210" y1="285" x2="1632" y2="285" stroke="#E0E0E0" stroke-width="2.2"/>
        
        <!-- 左Y轴 - 温度刻度 (°C，间距30度) -->
        <text x="75" y="878" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#000000" text-anchor="middle">
            <tspan>-60</tspan>
        </text>
        <text x="75" y="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#333333" text-anchor="middle">
              <tspan>-30</tspan>
        </text>
        <text x="75" y="644" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#333333" text-anchor="middle">
            <tspan>0</tspan>
        </text>
        <text x="75" y="526" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#333333" text-anchor="middle">
            <tspan>30</tspan>
        </text>
        <text x="75" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#333333" text-anchor="middle">
            <tspan>60</tspan>
        </text>
        <text x="75" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#000000" text-anchor="middle">
            <tspan>90</tspan>
        </text>
        
        <!-- 左Y轴标题 -->
        <text x="45" y="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#000000" text-anchor="middle" transform="rotate(-135, 45, 578)">
            <tspan>温度 (℃)</tspan>
        </text>
        
        <!-- 右Y轴 - 湿度刻度 (%，间距20%) -->
        <text x="1785" y="878" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#000000" text-anchor="middle">
            <tspan>0%</tspan>
        </text>
        <text x="1785" y="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#555555" text-anchor="middle">
            <tspan>20%</tspan>
        </text>
        <text x="1785" y="644" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#555555" text-anchor="middle">
            <tspan>40%</tspan>
        </text>
        <text x="1785" y="526" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#555555" text-anchor="middle">
            <tspan>60%</tspan>
        </text>
        <text x="1785" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#555555" text-anchor="middle">
            <tspan>80%</tspan>
        </text>
        <text x="1785" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#000000" text-anchor="middle">
            <tspan>100%</tspan>
        </text>
        
        <!-- 右Y轴标题 -->
        <text x="1875" y="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#000000" text-anchor="middle" transform="rotate(135, 1875, 578)">
            <tspan>相对湿度 (%)</tspan>
        </text>
        
        <!-- 坐标轴 -->
        <line x1="210" y1="285" x2="210" y2="870" stroke="#616161" stroke-width="3"/>
        <line x1="210" y1="870" x2="1632" y2="870" stroke="#616161" stroke-width="3"/>
        <line x1="1632" y1="285" x2="1632" y2="870" stroke="#616161" stroke-width="3"/>
        
        <!-- X轴时间标签 -->
        <text x="210" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#333333" text-anchor="middle">
            <tspan>0</tspan>
        </text>
        <text x="447" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#333333" text-anchor="middle">
            <tspan>60</tspan>
        </text>
        <text x="802" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#333333" text-anchor="middle">
            <tspan>300</tspan>
        </text>
        <text x="1040" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#333333" text-anchor="middle">
            <tspan>420</tspan>
        </text>
        <text x="1395" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#333333" text-anchor="middle">
            <tspan>660</tspan>
        </text>
        <text x="1632" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#333333" text-anchor="middle">
            <tspan>720</tspan>
        </text>
        
        <!-- X轴标题 -->
        <text x="921" y="960" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#000000" text-anchor="middle">
            <tspan>时间 (min)</tspan>
        </text>
        
        <!-- 温度曲线（黑色实线+圆点）-->
        <!-- 数据点坐标精确计算：
             温度范围：-60°C到90°C，跨度150°C
             Y = 580 - ((temp+60)/150)*390
             20°C → Y = 580 - (80/150)*390 = 580 - 208 = 372
             85°C → Y = 580 - (145/150)*390 = 580 - 377 = 203
             -40°C → Y = 580 - (20/150)*390 = 580 - 52 = 528
        -->
        <polyline points="210,558 447,304 802,304 1040,792 1395,792 1632,558" 
                  fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- 温度数据点（圆点）-->
        <circle cx="210" cy="558" r="8" fill="#000000" stroke="#FFFFFF" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="447" cy="304" r="8" fill="#000000" stroke="#FFFFFF" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="802" cy="304" r="8" fill="#000000" stroke="#FFFFFF" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1040" cy="792" r="8" fill="#000000" stroke="#FFFFFF" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1395" cy="792" r="8" fill="#000000" stroke="#FFFFFF" stroke-width="3" filter="url(#dotShadow)"/>
        <circle cx="1632" cy="558" r="8" fill="#000000" stroke="#FFFFFF" stroke-width="3" filter="url(#dotShadow)"/>
        
        <!-- 湿度曲线（深灰色虚线+方块点）-->
        <!-- 数据点坐标计算（0%-100%范围）：
             Y = 580 - (湿度% / 100) * 390
             65% → Y=327, 85% → Y=248, 30% → Y=463
        -->
        <polyline points="210,490 447,372 802,372 1040,694 1395,694 1632,490" 
                  fill="none" stroke="#666666" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8,5"/>
        
        <!-- 湿度数据点（方块）-->
        <rect x="202" y="483" width="15" height="15" fill="#666666" stroke="#FFFFFF" stroke-width="3" filter="url(#dotShadow)"/>
        <rect x="440" y="364" width="15" height="15" fill="#666666" stroke="#FFFFFF" stroke-width="3" filter="url(#dotShadow)"/>
        <rect x="795" y="364" width="15" height="15" fill="#666666" stroke="#FFFFFF" stroke-width="3" filter="url(#dotShadow)"/>
        <rect x="1032" y="687" width="15" height="15" fill="#666666" stroke="#FFFFFF" stroke-width="3" filter="url(#dotShadow)"/>
        <rect x="1388" y="687" width="15" height="15" fill="#666666" stroke="#FFFFFF" stroke-width="3" filter="url(#dotShadow)"/>
        <rect x="1624" y="483" width="15" height="15" fill="#666666" stroke="#FFFFFF" stroke-width="3" filter="url(#dotShadow)"/>
        
        <!-- 关键数据标注（带背景框，避免重叠，与曲线坐标对齐）-->
        
        <!-- 起始点 (x=140, 温度y=372) - 温度 -->
        <rect x="218" y="536" width="63" height="30" fill="#FFFFFF" stroke="#000000" stroke-width="0.8" rx="4" opacity="0.9"/>
        <text x="249" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#000000" text-anchor="middle">
            <tspan>20℃</tspan>
        </text>
        
        <!-- 起始点 (x=140, 湿度y=327) - 湿度 -->
        <rect x="218" y="468" width="63" height="30" fill="#FFFFFF" stroke="#666666" stroke-width="0.8" rx="4" opacity="0.9"/>
        <text x="249" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#666666" text-anchor="middle">
            <tspan>65%</tspan>
        </text>
        
        <!-- 高温点 (x=298, y=203) - 温度 -->
        <rect x="454" y="282" width="63" height="30" fill="#FFFFFF" stroke="#000000" stroke-width="0.8" rx="4" opacity="0.9"/>
        <text x="486" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#000000" text-anchor="middle">
            <tspan>85℃</tspan>
        </text>
        
        <!-- 高湿点 (y=248) - 湿度 -->
        <rect x="592" y="350" width="63" height="30" fill="#FFFFFF" stroke="#666666" stroke-width="0.8" rx="4" opacity="0.9"/>
        <text x="624" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#666666" text-anchor="middle">
            <tspan>85%</tspan>
        </text>
        
        <!-- 低温点 (x=693, y=528) - 温度 -->
        <rect x="1047" y="770" width="72" height="30" fill="#FFFFFF" stroke="#000000" stroke-width="0.8" rx="4" opacity="0.9"/>
        <text x="1083" y="789" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#000000" text-anchor="middle">
            <tspan>-40℃</tspan>
        </text>
        
        <!-- 低湿点 (y=463) - 湿度 -->
        <rect x="1185" y="672" width="63" height="30" fill="#FFFFFF" stroke="#666666" stroke-width="0.8" rx="4" opacity="0.9"/>
        <text x="1216" y="692" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#666666" text-anchor="middle">
            <tspan>30%</tspan>
        </text>
        
        <!-- 复位点 (x=1088, 温度y=372) - 温度 -->
        <rect x="1530" y="536" width="63" height="30" fill="#FFFFFF" stroke="#000000" stroke-width="0.8" rx="4" opacity="0.9"/>
        <text x="1562" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#000000" text-anchor="middle">
            <tspan>20℃</tspan>
        </text>
        
        <!-- 复位点 (湿度y=327) - 湿度 -->
        <rect x="1530" y="468" width="63" height="30" fill="#FFFFFF" stroke="#666666" stroke-width="0.8" rx="4" opacity="0.9"/>
        <text x="1562" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#666666" text-anchor="middle">
            <tspan>65%</tspan>
        </text>
    </g>
    
    <!-- 图例 -->
    <g id="legend">
        <rect x="630" y="990" width="660" height="68" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="2" rx="9"/>
        
        <!-- 温度图例（黑色实线+圆点）-->
        <line x1="675" y1="1023" x2="735" y2="1023" stroke="#000000" stroke-width="4"/>
        <circle cx="705" cy="1023" r="8" fill="#000000" stroke="#FFFFFF" stroke-width="3"/>
        <text x="758" y="1030" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="600" fill="#000000">
            <tspan>温度 (℃)</tspan>
        </text>
        
        <!-- 湿度图例（深灰虚线+方块）-->
        <line x1="975" y1="1023" x2="1035" y2="1023" stroke="#666666" stroke-width="3.8" stroke-dasharray="8,5"/>
        <rect x="998" y="1016" width="15" height="15" fill="#666666" stroke="#FFFFFF" stroke-width="3"/>
        <text x="1058" y="1030" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="600" fill="#666666">
            <tspan>相对湿度 (%)</tspan>
        </text>
    </g>
</svg>

