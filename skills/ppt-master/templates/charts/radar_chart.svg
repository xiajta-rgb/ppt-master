<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    雷达图模板
    用途: 多维度能力评估、综合对比分析
    适用场景: 能力评估、竞品对比、绩效分析
    支持: 6个维度（可调整为4-8个）
    -->
    
    <defs>
        <!-- 数据区域渐变 -->
        <linearGradient id="radarGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.6" />
            <stop offset="100%" style="stop-color:#1976D2;stop-opacity:0.4" />
        </linearGradient>
        
        <linearGradient id="radarGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.5" />
            <stop offset="100%" style="stop-color:#388E3C;stop-opacity:0.3" />
        </linearGradient>
        
        <!-- 阴影 -->
        <filter id="radarShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="3"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>综合能力评估对比</tspan>
    </text>
    
    <text x="90" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>产品 A vs 产品 B · 六维度分析</tspan>
    </text>
    
    <!-- 雷达图区域 - 中心点 (640, 400), 半径 220 -->
    <g id="radarChart" transform="translate(960, 600)">
        
        <!-- 背景网格 - 5层同心六边形 -->
        <!-- 第5层 (100%) -->
        <polygon points="0,-330 285.8,-165 285.8,165 0,330 -285.8,165 -285.8,-165" 
                 fill="none" stroke="#E0E0E0" stroke-width="2"/>
        <!-- 第4层 (80%) -->
        <polygon points="0,-264 228.6,-132 228.6,132 0,264 -228.6,132 -228.6,-132" 
                 fill="none" stroke="#E0E0E0" stroke-width="2"/>
        <!-- 第3层 (60%) -->
        <polygon points="0,-198 171.4,-99 171.4,99 0,198 -171.4,99 -171.4,-99" 
                 fill="none" stroke="#E0E0E0" stroke-width="2"/>
        <!-- 第2层 (40%) -->
        <polygon points="0,-132 114.3,-66 114.3,66 0,132 -114.3,66 -114.3,-66" 
                 fill="none" stroke="#E0E0E0" stroke-width="2"/>
        <!-- 第1层 (20%) -->
        <polygon points="0,-66 57.2,-33 57.2,33 0,66 -57.2,33 -57.2,-33" 
                 fill="none" stroke="#E0E0E0" stroke-width="2"/>
        
        <!-- 轴线 -->
        <line x1="0" y1="0" x2="0" y2="-330" stroke="#BDC3C7" stroke-width="2"/>
        <line x1="0" y1="0" x2="285.8" y2="-165" stroke="#BDC3C7" stroke-width="2"/>
        <line x1="0" y1="0" x2="285.8" y2="165" stroke="#BDC3C7" stroke-width="2"/>
        <line x1="0" y1="0" x2="0" y2="330" stroke="#BDC3C7" stroke-width="2"/>
        <line x1="0" y1="0" x2="-285.8" y2="165" stroke="#BDC3C7" stroke-width="2"/>
        <line x1="0" y1="0" x2="-285.8" y2="-165" stroke="#BDC3C7" stroke-width="2"/>
        
        <!-- 数据区域 1 - 产品 A (蓝色) -->
        <!-- 数值: 性能90%, 安全85%, 易用75%, 价格70%, 服务80%, 创新88% -->
        <polygon points="0,-297 243,-140.2 214,116 0,231 -228.6,132 -250.8,-145.2" 
                 fill="url(#radarGrad1)" stroke="#2196F3" stroke-width="3.8" filter="url(#radarShadow)"/>
        
        <!-- 数据点 - 产品 A -->
        <circle cx="0" cy="-297" r="9" fill="#2196F3" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="243" cy="-140.2" r="9" fill="#2196F3" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="214" cy="116" r="9" fill="#2196F3" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="0" cy="231" r="9" fill="#2196F3" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="-228.6" cy="132" r="9" fill="#2196F3" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="-250.8" cy="-145.2" r="9" fill="#2196F3" stroke="#FFFFFF" stroke-width="3"/>
        
        <!-- 数据区域 2 - 产品 B (绿色) -->
        <!-- 数值: 性能75%, 安全90%, 易用85%, 价格80%, 服务70%, 创新65% -->
        <polygon points="0,-248 257.2,-148 243,140.2 0,264 -200.1,116 -186,-107.2" 
                 fill="url(#radarGrad2)" stroke="#4CAF50" stroke-width="3.8"/>
        
        <!-- 数据点 - 产品 B -->
        <circle cx="0" cy="-248" r="9" fill="#4CAF50" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="257.2" cy="-148" r="9" fill="#4CAF50" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="243" cy="140.2" r="9" fill="#4CAF50" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="0" cy="264" r="9" fill="#4CAF50" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="-200.1" cy="116" r="9" fill="#4CAF50" stroke="#FFFFFF" stroke-width="3"/>
        <circle cx="-186" cy="-107.2" r="9" fill="#4CAF50" stroke="#FFFFFF" stroke-width="3"/>
    </g>
    
    <!-- 维度标签 -->
    <text x="960" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" font-weight="600" fill="#2C3E50" text-anchor="middle">
        <tspan>性能</tspan>
    </text>
    <text x="1305" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" font-weight="600" fill="#2C3E50" text-anchor="start">
        <tspan>安全性</tspan>
    </text>
    <text x="1305" y="810" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" font-weight="600" fill="#2C3E50" text-anchor="start">
        <tspan>易用性</tspan>
    </text>
    <text x="960" y="990" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" font-weight="600" fill="#2C3E50" text-anchor="middle">
        <tspan>价格竞争力</tspan>
    </text>
    <text x="615" y="810" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" font-weight="600" fill="#2C3E50" text-anchor="end">
        <tspan>售后服务</tspan>
    </text>
    <text x="615" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" font-weight="600" fill="#2C3E50" text-anchor="end">
        <tspan>创新能力</tspan>
    </text>
    
    <!-- 图例 -->
    <g id="legend" transform="translate(1530, 225)">
        <rect x="0" y="0" width="300" height="180" rx="12" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="2"/>
        
        <text x="150" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>图例</tspan>
        </text>
        
        <rect x="30" y="75" width="36" height="18" rx="3" fill="#2196F3" opacity="0.7"/>
        <text x="82" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>产品 A</tspan>
        </text>
        
        <rect x="30" y="120" width="36" height="18" rx="3" fill="#4CAF50" opacity="0.6"/>
        <text x="82" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>产品 B</tspan>
        </text>
    </g>
    
    <!-- 数据来源 -->
    <text x="90" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" fill="#95A5A6">
        <tspan>数据来源: 产品评估报告 2025</tspan>
    </text>
</svg>

