<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <defs>
        <linearGradient id="chapterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2E5C8E" />
            <stop offset="100%" style="stop-color:#1E3A5F" />
        </linearGradient>
    </defs>

    <!-- 背景渐变 -->
    <rect width="1920" height="1080" fill="url(#chapterGradient)" />

    <!-- 装饰同心圆 -->
    <circle cx="1650" cy="225" r="300" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1" />
    <circle cx="1650" cy="225" r="225" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1" />
    <circle cx="1650" cy="225" r="150" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1" />
    <circle cx="270" cy="900" r="180" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1" />
    <circle cx="270" cy="900" r="120" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1" />

    <!-- 装饰斜线 -->
    <line x1="0" y1="300" x2="450" y2="525" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="0" y1="375" x2="375" y2="600" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="1470" y1="1080" x2="1920" y2="780" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="1545" y1="1080" x2="1920" y2="855" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />

    <!-- 大号章节编号（背景） -->
    <text x="960" y="330" font-family="system-ui, sans-serif" font-size="180" font-weight="bold" fill="#FFFFFF"
        fill-opacity="0.15" text-anchor="middle">
        {{CHAPTER_NUM}}
    </text>

    <!-- 章节标签 -->
    <rect x="840" y="420" width="240" height="60" rx="30" fill="#FFFFFF" fill-opacity="0.2" />
    <text x="960" y="460" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#FFFFFF"
        text-anchor="middle">
        CHAPTER {{CHAPTER_NUM}}
    </text>

    <!-- 章节标题 -->
    <text x="960" y="585" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="72" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle">
        {{CHAPTER_TITLE}}
    </text>

    <!-- 英文副标题 -->
    <text x="960" y="660" font-family="system-ui, sans-serif" font-size="36" fill="#94A3B8" text-anchor="middle">
        {{CHAPTER_EN}}
    </text>

    <!-- 装饰线 -->
    <rect x="810" y="705" width="300" height="4" rx="2.2" fill="#E07843" />

    <!-- 引言卡片 -->
    <rect x="360" y="765" width="1200" height="150" rx="18" fill="#FFFFFF" fill-opacity="0.1" />
    <rect x="360" y="765" width="6" height="150" rx="3" fill="#3D8B7A" />

    <text x="405" y="825" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="27" fill="#E5E7EB"
        font-style="italic">
        "{{QUOTE}}"
    </text>
    <text x="405" y="878" font-family="system-ui, sans-serif" font-size="21" fill="#94A3B8">
        —— {{QUOTE_AUTHOR}}
    </text>

    <!-- 关键词标签 -->
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#CBD5E1">
        <rect x="585" y="960" width="150" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.1" />
        <text x="660" y="988" text-anchor="middle">{{TAG_1}}</text>

        <rect x="765" y="960" width="120" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.1" />
        <text x="825" y="988" text-anchor="middle">{{TAG_2}}</text>

        <rect x="915" y="960" width="150" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.1" />
        <text x="990" y="988" text-anchor="middle">{{TAG_3}}</text>

        <rect x="1095" y="960" width="180" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.1" />
        <text x="1185" y="988" text-anchor="middle">{{TAG_4}}</text>
    </g>

    <!-- 页码 -->
    <text x="1830" y="1028" font-family="system-ui, sans-serif" font-size="21" fill="#64748B"
        text-anchor="end">{{PAGE_NUM}}</text>
</svg>