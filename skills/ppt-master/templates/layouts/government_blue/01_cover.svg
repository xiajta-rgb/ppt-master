<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
    <!-- 模板: 封面页 - 政府蓝风格 (优化版) -->

    <defs>
        <!-- 深蓝渐变背景 -->
        <linearGradient id="coverBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0050B3;stop-opacity:1" />
            <stop offset="40%" style="stop-color:#003D8F;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#001F4D;stop-opacity:1" />
        </linearGradient>
        <!-- 顶部装饰渐变 -->
        <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0050B3;stop-opacity:1" />
        </linearGradient>
        <!-- 左侧装饰渐变 -->
        <linearGradient id="sideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#0077B6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00B4D8;stop-opacity:1" />
        </linearGradient>
        <!-- 网格图案 -->
        <pattern id="gridPattern" width="90" height="90" patternUnits="userSpaceOnUse">
            <path d="M 90 0 L 0 0 0 90" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.08"/>
        </pattern>
    </defs>

    <!-- 背景 -->
    <rect x="0" y="0" width="1920" height="1080" fill="url(#coverBgGrad)" />
    
    <!-- 科技网格纹理 -->
    <rect x="0" y="0" width="1920" height="1080" fill="url(#gridPattern)" />

    <!-- 装饰元素 - 几何图案 -->
    <circle cx="1725" cy="180" r="300" fill="#FFFFFF" fill-opacity="0.03" />
    <circle cx="1800" cy="120" r="180" fill="#00B4D8" fill-opacity="0.05" />
    <circle cx="225" cy="900" r="375" fill="#FFFFFF" fill-opacity="0.02" />
    <circle cx="120" cy="975" r="225" fill="#00B4D8" fill-opacity="0.04" />

    <!-- 对角线装饰 -->
    <line x1="1350" y1="0" x2="1920" y2="570" stroke="#00B4D8" stroke-width="2" stroke-opacity="0.15" />
    <line x1="1425" y1="0" x2="1920" y2="495" stroke="#00B4D8" stroke-width="2" stroke-opacity="0.1" />

    <!-- 顶部渐变装饰线 -->
    <rect x="0" y="0" width="1920" height="9" fill="url(#topGrad)" />

    <!-- 左侧装饰竖条 -->
    <rect x="0" y="270" width="12" height="540" fill="url(#sideGrad)" />
    <rect x="24" y="330" width="4" height="420" fill="#00B4D8" fill-opacity="0.5" />

    <!-- 主标题区域背景 -->
    <rect x="0" y="390" width="1350" height="270" fill="#000000" fill-opacity="0.25" />
    <rect x="0" y="390" width="12" height="270" fill="#00B4D8" />

    <!-- 主标题 -->
    <text x="90" y="510" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="78" font-weight="bold" fill="#FFFFFF">
        {{TITLE}}
    </text>

    <!-- 副标题 -->
    <text x="90" y="600" font-family="Microsoft YaHei, Arial, sans-serif" font-size="39" fill="#90E0EF">
        {{SUBTITLE}}
    </text>

    <!-- 分隔线 -->
    <line x1="90" y1="720" x2="600" y2="720" stroke="#00B4D8" stroke-width="3" stroke-opacity="0.8" />

    <!-- 汇报人信息 -->
    <text x="90" y="795" font-family="Microsoft YaHei, sans-serif" font-size="30" fill="#FFFFFF" fill-opacity="0.9">
        汇报人：{{PRESENTER}}
    </text>

    <!-- 单位名称 -->
    <text x="90" y="855" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#FFFFFF" fill-opacity="0.7">
        {{ORGANIZATION}}
    </text>

    <!-- 日期 -->
    <text x="90" y="915" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" fill="#90E0EF" fill-opacity="0.8">
        {{DATE}}
    </text>

    <!-- 底部装饰区域 -->
    <rect x="0" y="1050" width="1920" height="30" fill="#003366" />
    <rect x="0" y="1050" width="600" height="30" fill="url(#topGrad)" fill-opacity="0.6" />

    <!-- 右下角Logo区域 -->
    <text x="1800" y="1020" text-anchor="end" font-family="Arial, sans-serif" font-size="21" fill="#FFFFFF" fill-opacity="0.5">
        {{ORG_SHORT}}
    </text>

</svg>
