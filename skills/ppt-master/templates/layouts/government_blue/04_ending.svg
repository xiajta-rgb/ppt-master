<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 结束页 - 政府蓝风格 (优化版) -->

    <defs>
        <!-- 深蓝背景渐变 -->
        <linearGradient id="endBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0050B3;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#003D8F;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#001F4D;stop-opacity:1" />
        </linearGradient>
        <!-- 顶部装饰渐变 -->
        <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0050B3;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 背景 -->
    <rect x="0" y="0" width="1920" height="1080" fill="url(#endBgGrad)" />

    <!-- 装饰元素 - 几何图案 -->
    <circle cx="150" cy="180" r="300" fill="#FFFFFF" fill-opacity="0.02" />
    <circle cx="1770" cy="900" r="375" fill="#FFFFFF" fill-opacity="0.02" />
    <circle cx="960" cy="540" r="525" fill="#00B4D8" fill-opacity="0.02" />

    <!-- 顶部渐变装饰线 -->
    <rect x="0" y="0" width="1920" height="9" fill="url(#topGrad)" />

    <!-- 网格装饰 -->
    <line x1="0" y1="270" x2="1920" y2="270" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="0" y1="810" x2="1920" y2="810" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="480" y1="0" x2="480" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="960" y1="0" x2="960" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />

    <!-- 波浪曲线装饰 -->
    <path d="M 0 870 Q 480 930 960 870 T 1920 870" fill="none" stroke="#00B4D8" stroke-width="3" stroke-opacity="0.2"/>
    <path d="M 0 900 Q 480 960 960 900 T 1920 900" fill="none" stroke="#00B4D8" stroke-width="2" stroke-opacity="0.15"/>
    <path d="M 0 930 Q 480 990 960 930 T 1920 930" fill="none" stroke="#90E0EF" stroke-width="2" stroke-opacity="0.1"/>

    <!-- 左侧装饰竖条 -->
    <rect x="150" y="360" width="9" height="360" fill="#00B4D8" fill-opacity="0.6" />
    <rect x="168" y="390" width="4" height="300" fill="#90E0EF" fill-opacity="0.4" />

    <!-- 感谢语（中文） -->
    <text x="960" y="450" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="96" font-weight="bold" fill="#FFFFFF" letter-spacing="12">
        {{THANK_YOU}}
    </text>

    <!-- 感谢语（英文） -->
    <text x="960" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" fill="#90E0EF" letter-spacing="9">
        {{THANK_YOU_EN}}
    </text>

    <!-- 分隔线 -->
    <line x1="735" y1="600" x2="900" y2="600" stroke="#00B4D8" stroke-width="3"/>
    <circle cx="960" cy="600" r="6" fill="#00B4D8"/>
    <line x1="1020" y1="600" x2="1185" y2="600" stroke="#00B4D8" stroke-width="3"/>

    <!-- 欢迎指正 -->
    <text x="960" y="690" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="42" fill="#FFFFFF" fill-opacity="0.9">
        欢迎批评指正
    </text>

    <!-- 单位信息 -->
    <text x="960" y="780" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#FFFFFF" fill-opacity="0.7">
        {{ORGANIZATION}}
    </text>

    <!-- 联系信息 -->
    <text x="960" y="840" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#90E0EF" fill-opacity="0.8">
        {{CONTACT_INFO}}
    </text>

    <!-- 底部装饰区域 -->
    <rect x="0" y="1020" width="1920" height="60" fill="#001F4D" fill-opacity="0.6" />
    <rect x="0" y="1020" width="600" height="60" fill="url(#topGrad)" fill-opacity="0.3" />

</svg>
