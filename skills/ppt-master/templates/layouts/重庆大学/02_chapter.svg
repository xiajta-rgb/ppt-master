<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
  <defs>
    <!-- 天际渐变 -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A9BD9"/>
      <stop offset="100%" stop-color="#006BB7" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  
  <!-- 深邃蓝全屏背景 -->
  <rect width="1920" height="1080" fill="#004A82"/>
  
  <!-- 右上角斜切浅色区域（天际） -->
  <polygon points="1050,0 1920,0 1920,600 1500,0" fill="url(#skyGradient)" fill-opacity="0.3"/>
  <polygon points="1275,0 1920,0 1920,420" fill="#3A9BD9" fill-opacity="0.15"/>
  
  <!-- 底部波浪装饰 -->
  <path d="M0,1020 Q300,990 600,1020 T1200,990 T1800,1020 L1920,1020 L1920,1080 L0,1080 Z" fill="#006BB7" fill-opacity="0.3"/>
  <path d="M0,1042 Q300,1020 600,1042 T1200,1020 T1800,1042 L1920,1042 L1920,1080 L0,1080 Z" fill="#FFFFFF" fill-opacity="0.05"/>
  
  <!-- 左侧大号半透明章节编号 -->
  <text x="90" y="870" fill="#FFFFFF" fill-opacity="0.06" font-family="Arial, sans-serif" font-size="600" font-weight="bold">{{CHAPTER_NUM}}</text>
  
  <!-- 金色装饰竖线 -->
  <rect x="90" y="300" width="6" height="180" fill="#D4A84B"/>
  
  <!-- CHAPTER 标签 -->
  <text x="120" y="360" fill="#D4A84B" font-family="Arial, sans-serif" font-size="24" font-weight="bold" letter-spacing="6">CHAPTER</text>
  
  <!-- 章节编号 -->
  <text x="120" y="450" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="108" font-weight="bold">{{CHAPTER_NUM}}</text>
  
  <!-- 金色装饰横线 -->
  <rect x="120" y="495" width="150" height="4" fill="#D4A84B"/>
  
  <!-- 章节主标题 -->
  <text x="120" y="630" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="66" font-weight="bold">{{CHAPTER_TITLE}}</text>
  
  <!-- 章节描述 -->
  <text x="120" y="720" fill="#FFFFFF" fill-opacity="0.7" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27">{{CHAPTER_DESC}}</text>
  
  <!-- 金色光点装饰 -->
  <circle cx="1725" cy="150" r="6" fill="#D4A84B" fill-opacity="0.6"/>
  <circle cx="1800" cy="225" r="4" fill="#D4A84B" fill-opacity="0.4"/>
  <circle cx="1650" cy="270" r="8" fill="#D4A84B" fill-opacity="0.5"/>
  
  <!-- 右下角 Logo（白色版本） -->
  <image x="1530" y="960" width="330" height="90" xlink:href="重庆大学logo2.png" preserveAspectRatio="xMidYMid meet"/>
  
  <!-- 底部金色装饰线 -->
  <rect x="120" y="960" width="300" height="3" fill="#D4A84B" fill-opacity="0.5"/>
</svg>
