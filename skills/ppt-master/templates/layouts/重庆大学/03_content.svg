<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
  <defs>
    <!-- 顶部斜切渐变 -->
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004A82"/>
      <stop offset="100%" stop-color="#006BB7"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#FAFCFF"/>
  
  <!-- 顶部斜切蓝色装饰带（左高右低） -->
  <polygon points="0,0 1920,0 1920,105 0,135" fill="url(#headerGradient)"/>
  
  <!-- 斜切带下方的浅色过渡 -->
  <polygon points="0,135 1920,105 1920,128 0,158" fill="#E3F2FD"/>
  
  <!-- 页面标题 -->
  <text x="90" y="82" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="36" font-weight="bold">{{PAGE_TITLE}}</text>
  
  <!-- Logo（右上角，在斜切带上） -->
  <image x="1560" y="18" width="300" height="75" xlink:href="重庆大学logo2.png" preserveAspectRatio="xMidYMid meet"/>
  
  <!-- 左侧金色装饰竖线（贯穿内容区） -->
  <rect x="60" y="195" width="4" height="720" fill="#D4A84B" fill-opacity="0.6"/>
  
  <!-- 核心观点条 -->
  <rect x="90" y="180" width="1740" height="75" fill="#E3F2FD" rx="9"/>
  <rect x="90" y="180" width="6" height="75" fill="#006BB7"/>
  <text x="120" y="228" fill="#006BB7" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold">核心观点</text>
  <text x="255" y="228" fill="#333D4A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22">{{KEY_MESSAGE}}</text>
  
  <!-- 内容区域占位 -->
  <rect x="90" y="285" width="1740" height="660" fill="#FFFFFF" stroke="#E3F2FD" stroke-width="3" rx="12"/>
  <text x="960" y="615" text-anchor="middle" fill="#B0C4D4" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24">{{CONTENT_AREA}}</text>
  
  <!-- 底部波浪装饰 -->
  <path d="M0,1035 Q240,1020 480,1035 T960,1020 T1440,1035 T1920,1020 L1920,1080 L0,1080 Z" fill="#006BB7" fill-opacity="0.05"/>
  
  <!-- 页脚区域 -->
  <rect x="0" y="975" width="1920" height="105" fill="#FAFCFF"/>
  
  <!-- 页脚左侧：数据来源 -->
  <text x="90" y="1028" fill="#6B7B8C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">数据来源：{{SOURCE}}</text>
  
  <!-- 页脚中部：章节名称 -->
  <text x="960" y="1028" text-anchor="middle" fill="#6B7B8C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">{{SECTION_NAME}}</text>
  
  <!-- 页脚右侧：页码（金色装饰） -->
  <rect x="1770" y="998" width="60" height="42" fill="#006BB7" rx="6"/>
  <text x="1800" y="1028" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="bold">{{PAGE_NUM}}</text>
  
  <!-- 左下角金色光点 -->
  <circle cx="75" cy="1005" r="4" fill="#D4A84B" fill-opacity="0.5"/>
</svg>
