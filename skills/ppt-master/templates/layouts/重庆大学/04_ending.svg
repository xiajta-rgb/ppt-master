<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
  <defs>
    <!-- 底部渐变 -->
    <linearGradient id="bottomBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003D6B"/>
      <stop offset="100%" stop-color="#006BB7"/>
    </linearGradient>
    <!-- 金色渐变 -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#D4A84B"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  
  <!-- 顶部细线装饰 -->
  <rect x="0" y="0" width="1920" height="9" fill="#006BB7"/>
  <rect x="0" y="9" width="1920" height="3" fill="#D4A84B"/>
  
  <!-- 中央 Logo（大尺寸） -->
  <image x="585" y="240" width="750" height="225" xlink:href="重庆大学logo.png" preserveAspectRatio="xMidYMid meet"/>
  
  <!-- 金色装饰分隔线 -->
  <rect x="735" y="510" width="450" height="3" fill="url(#goldAccent)"/>
  <circle cx="735" cy="512" r="6" fill="#D4A84B"/>
  <circle cx="1185" cy="512" r="6" fill="#D4A84B"/>
  
  <!-- 感谢语 -->
  <text x="960" y="630" text-anchor="middle" fill="#1A2E44" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="72" font-weight="bold">{{THANK_YOU}}</text>
  
  <!-- 副标语 -->
  <text x="960" y="712" text-anchor="middle" fill="#006BB7" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27">{{ENDING_SUBTITLE}}</text>
  
  <!-- 底部色块 -->
  <rect x="0" y="840" width="1920" height="240" fill="url(#bottomBar)"/>
  
  <!-- 底部色块顶部金色装饰线 -->
  <rect x="0" y="837" width="1920" height="4" fill="#D4A84B"/>
  
  <!-- 底部白色装饰纹理 -->
  <line x1="0" y1="900" x2="1920" y2="900" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05"/>
  <line x1="0" y1="975" x2="1920" y2="975" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03"/>
  
  <!-- 联系信息（在底部色块上） -->
  <text x="960" y="922" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold">{{CONTACT_INFO}}</text>
  <text x="960" y="975" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.85" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">{{EMAIL}}</text>
  
  <!-- 版权信息 -->
  <text x="960" y="1042" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.5" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">{{COPYRIGHT}}</text>
  
  <!-- 页码 -->
  <text x="1830" y="1042" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.5" font-family="Arial, sans-serif" font-size="16">{{PAGE_NUM}}</text>
  
  <!-- 左侧 CQU 水印 -->
  <text x="120" y="990" fill="#FFFFFF" fill-opacity="0.08" font-family="Arial, sans-serif" font-size="120" font-weight="bold">CQU</text>
  
  <!-- 右下角装饰 -->
  <polygon points="1920,840 1920,1080 1680,1080" fill="#FFFFFF" fill-opacity="0.03"/>
</svg>
