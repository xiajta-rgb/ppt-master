<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 封面页 (Premium Tech Style) -->

    <defs>
        <!-- 主背景渐变: 深蓝 -> 科技蓝 -->
        <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#001F4D;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#004098;stop-opacity:1" />
        </linearGradient>
        <!-- 装饰线渐变: 透明 -> 白 -> 透明 -->
        <linearGradient id="gradLine" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0" />
            <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.5" />
            <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
        </linearGradient>
    </defs>

    <!-- 背景图片层 (全屏铺底) -->
    <image href="../images/{{COVER_BG_IMAGE}}" x="0" y="0" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>

    <!-- 渐变遮罩层 (增强文字可读性，右下角加深) -->
    <rect x="0" y="0" width="1920" height="1080" fill="url(#gradMain)" fill-opacity="0.85" />

    <!-- 装饰元素: 科技几何线条 (Tech Lines) -->
    <!-- 左上角装饰圆环 -->
    <circle cx="0" cy="0" r="450" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="3"/>
    <circle cx="0" cy="0" r="420" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
    
    <!-- 右下角动态曲线 (模拟) -->
    <path d="M1200,1080 Q1500,750 1920,675 L1920,1080 Z" fill="#FFFFFF" fill-opacity="0.05"/>
    <path d="M1350,1080 Q1650,825 1920,750 L1920,1080 Z" fill="#FFFFFF" fill-opacity="0.03"/>

    <!-- 顶部亮色条 -->
    <rect x="0" y="0" width="1920" height="9" fill="#0050B3" />

    <!-- 内容区域: 左对齐布局 -->
    <g transform="translate(150, 0)">
        
        <!-- Logo (左上) -->
        <image href="../images/{{LOGO_LARGE}}" x="0" y="120" width="300" height="120" preserveAspectRatio="xMidYMid meet"/>
        
        <!-- 主标题 (大号加粗, 白色) -->
        <text x="0" y="480" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="96" font-weight="bold" fill="#FFFFFF" letter-spacing="3">
            {{TITLE}}
        </text>

        <!-- 装饰短横线 -->
        <rect x="0" y="525" width="180" height="9" fill="#D32F2F" />

        <!-- 副标题 (中号, 半透明白) -->
        <text x="0" y="630" font-family="Microsoft YaHei, Arial, sans-serif" font-size="48" font-weight="normal" fill="#FFFFFF" fill-opacity="0.9">
            {{SUBTITLE}}
        </text>

        <!-- 汇报信息区 (底部) -->
        <g transform="translate(0, 870)">
            <text x="0" y="0" font-family="Microsoft YaHei, sans-serif" font-size="30" fill="#FFFFFF" fill-opacity="0.7">
                汇报人 / 部门
            </text>
            <text x="0" y="52" font-family="Microsoft YaHei, sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF">
                {{AUTHOR}}
            </text>
            
            <text x="450" y="0" font-family="Microsoft YaHei, sans-serif" font-size="30" fill="#FFFFFF" fill-opacity="0.7">
                日期
            </text>
            <text x="450" y="52" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF">
                {{DATE}}
            </text>
        </g>
    </g>

    <!-- 右侧装饰元素 (虚线网格) -->
    <g transform="translate(1200, 150)">
        <line x1="0" y1="0" x2="600" y2="0" stroke="#FFFFFF" stroke-opacity="0.1" stroke-dasharray="4,4"/>
        <line x1="0" y1="75" x2="600" y2="75" stroke="#FFFFFF" stroke-opacity="0.1" stroke-dasharray="4,4"/>
        <line x1="0" y1="150" x2="600" y2="150" stroke="#FFFFFF" stroke-opacity="0.1" stroke-dasharray="4,4"/>
        <line x1="0" y1="0" x2="0" y2="150" stroke="#FFFFFF" stroke-opacity="0.1" stroke-dasharray="4,4"/>
        <line x1="600" y1="0" x2="600" y2="150" stroke="#FFFFFF" stroke-opacity="0.1" stroke-dasharray="4,4"/>
    </g>

</svg>
