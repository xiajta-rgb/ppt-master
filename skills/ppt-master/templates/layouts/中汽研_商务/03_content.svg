<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 内容页 (Premium Tech Style) -->

    <defs>
        <!-- 头部微渐变 -->
        <linearGradient id="gradHeader" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#F9FAFB;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F3F4F6;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 背景: 纯白 -->
    <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" />

    <!-- 顶部彩条 (品牌识别) -->
    <rect x="0" y="0" width="1920" height="9" fill="#003366" />

    <!-- 头部区域 (背景) -->
    <rect x="0" y="9" width="1920" height="126" fill="url(#gradHeader)" />

    <!-- 章节标记 (左上角徽章) -->
    <g transform="translate(90, 39)">
        <!-- 徽章底色 -->
        <rect x="0" y="0" width="75" height="75" rx="6" fill="#003366" />
        <!-- 章节数字 -->
        <text x="38" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF">
            {{CHAPTER_NUM}}
        </text>
    </g>

    <!-- 页面标题 -->
    <text x="195" y="93" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="42" font-weight="bold" fill="#1F2937">
        {{PAGE_TITLE}}
    </text>

    <!-- Logo (右上角) -->
    <image href="../images/{{LOGO_HEADER}}" x="1650" y="39" width="180" height="75" preserveAspectRatio="xMidYMid meet"/>
    
    <!-- 头部底部分隔线 -->
    <line x1="0" y1="135" x2="1920" y2="135" stroke="#E5E7EB" stroke-width="2" />

    <!-- 内容区域 (示宽虚线框 - Executor 会替换) -->
    <rect x="90" y="165" width="1740" height="840" fill="none" stroke="#E5E7EB" stroke-width="3" stroke-dasharray="8,8" rx="12"/>
    
    <text x="960" y="570" text-anchor="middle" fill="#9CA3AF" font-size="27" font-family="Microsoft YaHei, sans-serif">
        {{CONTENT_AREA}}
    </text>

    <!-- 右下角水印 Logo (极淡) - 增强品牌感 -->
    <image href="../images/{{LOGO_LARGE}}" x="1500" y="900" width="300" height="120" preserveAspectRatio="xMidYMid meet"/>
    <rect x="1500" y="900" width="300" height="120" fill="#FFFFFF" fill-opacity="0.97"/>

    <!-- 底部装饰线 -->
    <rect x="0" y="1071" width="1920" height="9" fill="#003366" />
    
    <!-- 页码 -->
    <text x="1830" y="1050" text-anchor="end" font-family="Arial, sans-serif" font-size="21" fill="#9CA3AF">
        {{PAGE_NUM}}
    </text>

</svg>
