<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 目录页 (Premium Tech Style) -->

    <defs>
        <!-- 头部渐变 -->
        <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#003366;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0050B3;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 背景: 浅灰 -->
    <rect x="0" y="0" width="1920" height="1080" fill="#F0F2F5" />
    
    <!-- 顶部装饰条 -->
    <rect x="0" y="0" width="1920" height="9" fill="#003366" />

    <!-- 页面标题区 -->
    <text x="150" y="120" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#E0E0E0">02</text>
    <text x="300" y="120" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="54" font-weight="bold" fill="#003366">目录 CONTENTS</text>
    <line x1="150" y1="150" x2="1770" y2="150" stroke="#D1D5DB" stroke-width="2" />

    <!-- Logo (右上) -->
    <image href="../images/{{LOGO_HEADER}}" x="1650" y="45" width="180" height="75" preserveAspectRatio="xMidYMid meet"/>

    <!-- 目录列表区域 (卡片式) -->
    <g transform="translate(150, 210)">
        
        <!-- Chapter 1 -->
        <g transform="translate(0, 0)">
            <!-- 阴影模拟 -->
            <rect x="6" y="6" width="780" height="150" fill="#000000" fill-opacity="0.05" rx="6"/>
            <!-- 卡片主体 -->
            <rect x="0" y="0" width="780" height="150" fill="#FFFFFF" rx="6"/>
            <!-- 左侧色条 -->
            <rect x="0" y="0" width="12" height="150" fill="#003366" rx="3"/>
            <!-- 序号 -->
            <text x="60" y="98" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#E5E7EB">01</text>
            <!-- 标题 -->
            <text x="180" y="68" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#1F2937">
                {{TOC_ITEM_1_TITLE}}
            </text>
            <text x="180" y="112" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#6B7280">
                {{TOC_ITEM_1_DESC}}
            </text>
        </g>

        <!-- Chapter 2 -->
        <g transform="translate(840, 0)">
             <rect x="6" y="6" width="780" height="150" fill="#000000" fill-opacity="0.05" rx="6"/>
            <rect x="0" y="0" width="780" height="150" fill="#FFFFFF" rx="6"/>
            <rect x="0" y="0" width="12" height="150" fill="#004098" rx="3"/>
            <text x="60" y="98" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#E5E7EB">02</text>
            <text x="180" y="68" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#1F2937">
                {{TOC_ITEM_2_TITLE}}
            </text>
            <text x="180" y="112" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#6B7280">
                {{TOC_ITEM_2_DESC}}
            </text>
        </g>

        <!-- Chapter 3 -->
        <g transform="translate(0, 210)">
             <rect x="6" y="6" width="780" height="150" fill="#000000" fill-opacity="0.05" rx="6"/>
            <rect x="0" y="0" width="780" height="150" fill="#FFFFFF" rx="6"/>
            <rect x="0" y="0" width="12" height="150" fill="#0050B3" rx="3"/>
            <text x="60" y="98" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#E5E7EB">03</text>
            <text x="180" y="68" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#1F2937">
                {{TOC_ITEM_3_TITLE}}
            </text>
             <text x="180" y="112" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#6B7280">
                {{TOC_ITEM_3_DESC}}
            </text>
        </g>

        <!-- Chapter 4 -->
        <g transform="translate(840, 210)">
             <rect x="6" y="6" width="780" height="150" fill="#000000" fill-opacity="0.05" rx="6"/>
            <rect x="0" y="0" width="780" height="150" fill="#FFFFFF" rx="6"/>
            <rect x="0" y="0" width="12" height="150" fill="#0066CC" rx="3"/>
            <text x="60" y="98" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#E5E7EB">04</text>
            <text x="180" y="68" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#1F2937">
                {{TOC_ITEM_4_TITLE}}
            </text>
             <text x="180" y="112" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#6B7280">
                {{TOC_ITEM_4_DESC}}
            </text>
        </g>

         <!-- Chapter 5 (Bottom Centered) -->
        <g transform="translate(420, 420)">
             <rect x="6" y="6" width="780" height="150" fill="#000000" fill-opacity="0.05" rx="6"/>
            <rect x="0" y="0" width="780" height="150" fill="#FFFFFF" rx="6"/>
            <rect x="0" y="0" width="12" height="150" fill="#007ACC" rx="3"/>
            <text x="60" y="98" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#E5E7EB">05</text>
            <text x="180" y="68" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#1F2937">
                {{TOC_ITEM_5_TITLE}}
            </text>
             <text x="180" y="112" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#6B7280">
                {{TOC_ITEM_5_DESC}}
            </text>
        </g>

    </g>

    <!-- 底部装饰 -->
    <rect x="0" y="1065" width="1920" height="15" fill="#003366" />

</svg>
