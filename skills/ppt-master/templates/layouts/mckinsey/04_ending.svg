<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 结束页 - 麦肯锡风格 (精装版) -->
    
    <defs>
        <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#005587"/>
            <stop offset="100%" style="stop-color:#0076A8"/>
        </linearGradient>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FAFBFC"/>
            <stop offset="100%" style="stop-color:#F1F3F4"/>
        </linearGradient>
    </defs>
    
    <!-- 白色背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 顶部渐变装饰条 -->
    <rect x="0" y="0" width="1920" height="9" fill="url(#headerGrad)"/>

    <!-- 背景装饰 -->
    <rect x="0" y="0" width="600" height="1080" fill="#005587" fill-opacity="0.02"/>
    <rect x="1320" y="0" width="600" height="1080" fill="#005587" fill-opacity="0.02"/>
    
    <!-- 几何装饰 -->
    <rect x="120" y="150" width="270" height="270" fill="none" stroke="#005587" stroke-width="2" stroke-opacity="0.08"/>
    <rect x="180" y="210" width="150" height="150" fill="#005587" fill-opacity="0.03"/>
    
    <rect x="1530" y="630" width="270" height="270" fill="none" stroke="#005587" stroke-width="2" stroke-opacity="0.08"/>
    <rect x="1590" y="690" width="150" height="150" fill="#005587" fill-opacity="0.03"/>

    <!-- 主感谢语 -->
    <text x="960" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#005587" letter-spacing="6">
        THANK YOU
    </text>
    
    <text x="960" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="78" font-weight="bold" fill="#2C3E50">
        {{THANK_YOU}}
    </text>

    <!-- 装饰分隔线 -->
    <line x1="720" y1="510" x2="900" y2="510" stroke="#005587" stroke-width="4"/>
    <circle cx="960" cy="510" r="12" fill="#F5A623"/>
    <line x1="1020" y1="510" x2="1200" y2="510" stroke="#005587" stroke-width="4"/>

    <!-- 副标语 -->
    <text x="960" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#5D6D7E">
        {{ENDING_SUBTITLE}}
    </text>

    <!-- 联系信息卡片 -->
    <rect x="585" y="660" width="750" height="225" fill="url(#cardGrad)" stroke="#E5E7EB" stroke-width="2.2" rx="12"/>
    <rect x="585" y="660" width="9" height="225" fill="#005587" rx="4"/>
    
    <!-- 联系人信息 -->
    <text x="960" y="728" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C3E50">
        {{CONTACT_INFO}}
    </text>
    <text x="960" y="772" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#7F8C8D">
        {{CONTACT_TITLE}}
    </text>
    
    <line x1="720" y1="802" x2="1200" y2="802" stroke="#E5E7EB" stroke-width="2"/>
    
    <text x="840" y="848" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#005587">📧 {{CONTACT_EMAIL}}</text>
    <text x="1140" y="848" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#005587">📞 {{CONTACT_PHONE}}</text>

    <!-- 底部信息区 -->
    <rect x="0" y="960" width="1920" height="120" fill="#FAFBFC"/>
    <line x1="0" y1="960" x2="1920" y2="960" stroke="#E5E7EB" stroke-width="2"/>
    
    <!-- 版权信息 -->
    <text x="960" y="1012" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#95A5A6">
        {{COPYRIGHT}}
    </text>

    <!-- 机密标识 -->
    <rect x="1620" y="982" width="210" height="42" fill="#005587" fill-opacity="0.08" rx="6"/>
    <text x="1725" y="1012" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#005587" letter-spacing="2">
        CONFIDENTIAL
    </text>

    <!-- 页码 -->
    <text x="90" y="1058" font-family="Arial, sans-serif" font-size="21" fill="#7F8C8D">{{PAGE_NUM}}</text>

</svg>
