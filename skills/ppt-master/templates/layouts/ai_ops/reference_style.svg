  <!-- Subtitle -->
  <rect x="45" y="120" width="1830" height="90" fill="#F2F2F2" />
  <text x="960" y="158" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="bold" fill="#000000" text-anchor="middle">
    <tspan x="960" dy="0">聚焦用户故障压降，提升优化一键诊断能力，实现降本提质；深入系统架构具备一键故障定位；借助大数据核心网实现网络效能提升；通过能</tspan>
    <tspan x="960" dy="38">力封装、跨域拉通、知识沉淀、智能编排、开放共享等五大举措，深化AI大模型应用，重塑故障诊断处置流程，做深做实1-5-10</tspan>
  </text>
  
  <!-- Large Triangle Background (simplified to a polygon) -->
  <polygon points="960,240 45,510 1875,510" fill="#F8CBAD" fill-opacity="0.3" stroke="none" />
  
