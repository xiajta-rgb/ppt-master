<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" />

  <!-- Top Red Strip -->
  <rect x="0" y="0" width="1920" height="12" fill="#C00000" />

  <!-- Left Decorative Block (mirror of cover) -->
  <rect x="0" y="0" width="90" height="540" fill="#C00000" />
  <rect x="0" y="540" width="90" height="540" fill="#2E75B6" />

  <!-- Central Warm Panel -->
  <rect x="420" y="300" width="1080" height="480" fill="#FDF3EB" stroke="#F8CBAD" stroke-width="3" />

  <!-- Thank You Text -->
  <text x="960" y="465" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="96" font-weight="bold" fill="#C00000" text-anchor="middle">{{THANK_YOU}}</text>

  <!-- English Tagline -->
  <text x="960" y="555" font-family="Arial, sans-serif" font-size="33" fill="#2E75B6" text-anchor="middle" letter-spacing="9">{{ENDING_SUBTITLE}}</text>

  <!-- Separator -->
  <line x1="720" y1="600" x2="1200" y2="600" stroke="#E7E6E6" stroke-width="2" />

  <!-- Contact Info -->
  <text x="960" y="675" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="27" fill="#666666" text-anchor="middle">{{CONTACT_INFO}}</text>

  <!-- Copyright -->
  <text x="960" y="735" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="21" fill="#999999" text-anchor="middle">{{COPYRIGHT}}</text>

  <!-- Bottom Accent (mirror of cover) -->
  <rect x="0" y="1020" width="1920" height="15" fill="#FDF3EB" />
  <rect x="0" y="1035" width="1920" height="45" fill="#2E75B6" />

  <!-- Decorative Numbered Badges (echoing cover) -->
  <rect x="450" y="870" width="45" height="45" fill="#C00000" />
  <text x="472" y="903" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>

  <rect x="750" y="870" width="45" height="45" fill="#C00000" />
  <text x="772" y="903" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <rect x="1050" y="870" width="45" height="45" fill="#C00000" />
  <text x="1072" y="903" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <rect x="1350" y="870" width="45" height="45" fill="#C00000" />
  <text x="1372" y="903" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- Blue Label Tags (echoing cover) -->
  <rect x="510" y="870" width="150" height="45" fill="#5B9BD5" />
  <text x="585" y="902" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">能力封装</text>

  <rect x="810" y="870" width="150" height="45" fill="#5B9BD5" />
  <text x="885" y="902" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">跨域拉通</text>

  <rect x="1110" y="870" width="150" height="45" fill="#5B9BD5" />
  <text x="1185" y="902" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">知识沉淀</text>

  <rect x="1410" y="870" width="150" height="45" fill="#5B9BD5" />
  <text x="1485" y="902" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">开放共享</text>
</svg>
