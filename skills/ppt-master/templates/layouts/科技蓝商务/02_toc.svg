<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  
  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" />
  
  <!-- Left Side: Title Area with Gradient -->
