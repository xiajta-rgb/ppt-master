<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002E5D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#bgGradient)" />
  
  <!-- Decorative Circles -->
  <circle cx="-150" cy="1080" r="750" fill="#FFFFFF" fill-opacity="0.03" />
  <circle cx="2100" cy="-150" r="600" fill="#FFFFFF" fill-opacity="0.03" />
  <circle cx="1650" cy="900" r="300" fill="#FFFFFF" fill-opacity="0.02" />

  <!-- Bottom Wave Decoration -->
  <path d="M0,930 C300,870 600,990 960,900 C1320,810 1650,960 1920,870 L1920,1080 L0,1080 Z" fill="#002E5D" fill-opacity="0.5" />
  <path d="M0,990 C300,930 600,1050 960,960 C1320,870 1650,1020 1920,930 L1920,1080 L0,1080 Z" fill="#4CA1E7" fill-opacity="0.4" />
  <path d="M0,1035 C300,1005 600,1080 960,1020 C1320,960 1650,1065 1920,1005 L1920,1080 L0,1080 Z" fill="#FFFFFF" fill-opacity="0.1" />

  <!-- Left Side Content Area -->
  <rect x="90" y="300" width="900" height="6" fill="#4CA1E7" />
  
  <!-- Main Title -->
  <text x="90" y="450" font-family="Microsoft YaHei" font-size="84" font-weight="bold" fill="#FFFFFF">{{TITLE}}</text>
  <text x="90" y="555" font-family="Microsoft YaHei" font-size="48" fill="#A0C4E3">{{SUBTITLE}}</text>

  <!-- Divider Line -->
  <rect x="90" y="630" width="300" height="3" fill="#FFFFFF" fill-opacity="0.5" />

  <!-- Author and Date -->
  <text x="90" y="720" font-family="Microsoft YaHei" font-size="30" fill="#FFFFFF" fill-opacity="0.9">{{AUTHOR}}</text>
  <text x="90" y="780" font-family="Microsoft YaHei" font-size="27" fill="#A0C4E3">{{DATE}}</text>

  <!-- Right Side Decorative Pattern -->
  <rect x="1125" y="270" width="600" height="525" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8,8" stroke-opacity="0.2" rx="15" />
  <rect x="1170" y="315" width="510" height="435" fill="none" stroke="#4CA1E7" stroke-width="2" stroke-opacity="0.3" rx="12" />
  
  <!-- Hexagon Pattern (Tech Feel) -->
  <polygon points="1425,420 1500,465 1500,555 1425,600 1350,555 1350,465" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
  <polygon points="1530,510 1605,555 1605,645 1530,690 1455,645 1455,555" fill="none" stroke="#4CA1E7" stroke-width="2" stroke-opacity="0.3" />
  <polygon points="1320,510 1395,555 1395,645 1320,690 1245,645 1245,555" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.15" />

  <!-- Logo Area -->
  <rect x="1680" y="75" width="180" height="60" fill="#FFFFFF" fill-opacity="0.1" rx="6" />
  <text x="1770" y="116" font-family="Microsoft YaHei" font-size="21" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">{{LOGO}}</text>

  <!-- Bottom Tagline -->
  <text x="960" y="1020" font-family="Microsoft YaHei" font-size="21" fill="#FFFFFF" fill-opacity="0.5" text-anchor="middle">产品全生命周期管理 · 规范 · 高效 · 可追溯</text>

</svg>
