<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="endGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002E5D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#endGradient)" />

  <!-- Decorative Circles -->
  <circle cx="-150" cy="600" r="600" fill="#FFFFFF" fill-opacity="0.03" />
  <circle cx="2070" cy="450" r="525" fill="#FFFFFF" fill-opacity="0.03" />
  <circle cx="960" cy="1200" r="450" fill="#4CA1E7" fill-opacity="0.05" />

  <!-- Hexagon Pattern -->
  <polygon points="225,300 300,255 375,300 375,390 300,435 225,390" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1" />
  <polygon points="1545,675 1620,630 1695,675 1695,765 1620,810 1545,765" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1" />
  <polygon points="300,750 375,705 450,750 450,840 375,885 300,840" fill="none" stroke="#4CA1E7" stroke-width="2" stroke-opacity="0.15" />

  <!-- Top Decorative Line -->
  <rect x="810" y="270" width="300" height="4" fill="#4CA1E7" rx="2" />

  <!-- Main Content -->
  <text x="960" y="450" font-family="Microsoft YaHei" font-size="108" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="18">{{THANK_YOU}}</text>
  
  <!-- English Subtitle -->
  <text x="960" y="540" font-family="Arial" font-size="36" fill="#A0C4E3" text-anchor="middle" letter-spacing="6">{{ENDING_SUBTITLE}}</text>

  <!-- Divider -->
  <rect x="810" y="600" width="300" height="3" fill="#FFFFFF" fill-opacity="0.3" />

  <!-- Q&A Section -->
  <rect x="810" y="660" width="300" height="90" fill="#4CA1E7" fill-opacity="0.2" rx="45" />
  <text x="960" y="720" font-family="Arial" font-size="42" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Q &amp; A</text>

  <!-- Contact Info Area -->
  <rect x="510" y="810" width="900" height="150" fill="#FFFFFF" fill-opacity="0.05" rx="15" />
  
  <text x="960" y="870" font-family="Microsoft YaHei" font-size="24" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">{{CLOSING_MESSAGE}}</text>
  <text x="960" y="922" font-family="Arial" font-size="21" fill="#A0C4E3" text-anchor="middle">{{CONTACT_INFO}}</text>

  <!-- Bottom Wave -->
  <path d="M0,975 C300,915 600,1020 960,945 C1320,870 1650,1005 1920,930 L1920,1080 L0,1080 Z" fill="#002E5D" fill-opacity="0.4" />
  <path d="M0,1020 C300,975 600,1065 960,1005 C1320,945 1650,1050 1920,990 L1920,1080 L0,1080 Z" fill="#4CA1E7" fill-opacity="0.3" />
  <path d="M0,1050 C300,1020 600,1080 960,1042 C1320,1005 1650,1072 1920,1035 L1920,1080 L0,1080 Z" fill="#FFFFFF" fill-opacity="0.08" />

  <!-- Website -->
  <text x="960" y="1058" font-family="Arial" font-size="18" fill="#FFFFFF" fill-opacity="0.5" text-anchor="middle">{{WEBSITE}}</text>

</svg>
