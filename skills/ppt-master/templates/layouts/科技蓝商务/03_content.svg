<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  
  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" />

  <!-- Decor Header -->
  <rect x="60" y="60" width="15" height="60" fill="#0078D7" />
  
  <!-- Title -->
  <text x="105" y="105" font-family="Microsoft YaHei" font-size="54" font-weight="bold" fill="#002E5D">{{PAGE_TITLE}}</text>

  <!-- Top Right Logo/Context -->
  <text x="1860" y="90" font-family="Microsoft YaHei" font-size="24" fill="#999999" text-anchor="end">维链医疗云</text>
  <line x1="60" y1="150" x2="1860" y2="150" stroke="#E0E0E0" stroke-width="2" />

  <!-- Main Content Area (Layout guide) -->
  <!-- This is a flexible area. We use a dashed rect to indicate the safe zone for dynamic content -->
  <rect x="90" y="210" width="1740" height="750" fill="none" stroke="#A0C4E3" stroke-width="3" stroke-dasharray="8,8" rx="15" opacity="0.3" />
  
  <!-- Placeholder Text for guidance (will be replaced by actual content) -->
  <text x="960" y="585" font-family="Microsoft YaHei" font-size="36" fill="#CCCCCC" text-anchor="middle">{{CONTENT_AREA}}</text>

  <!-- Footer -->
  <rect x="0" y="1035" width="1920" height="45" fill="#F5F5F5" />
  <text x="1860" y="1065" font-family="Arial" font-size="21" fill="#666666" text-anchor="end">{{PAGE_NUM}}</text>
  <text x="60" y="1065" font-family="Microsoft YaHei" font-size="21" fill="#999999">CONFIDENTIAL - INTERNAL USE ONLY</text>

</svg>
