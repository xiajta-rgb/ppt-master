<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="chapterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002E5D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#chapterGradient)" />

  <!-- Decorative Circles -->
  <circle cx="-225" cy="1080" r="675" fill="#FFFFFF" fill-opacity="0.03" />
  <circle cx="2100" cy="-75" r="525" fill="#FFFFFF" fill-opacity="0.03" />
  <circle cx="300" cy="150" r="225" fill="#4CA1E7" fill-opacity="0.05" />
  <circle cx="1650" cy="825" r="270" fill="#4CA1E7" fill-opacity="0.04" />

  <!-- Hexagon Pattern (Background) -->
  <polygon points="150,450 225,405 300,450 300,540 225,585 150,540" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1" />
  <polygon points="1620,600 1695,555 1770,600 1770,690 1695,735 1620,690" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1" />

  <!-- Center Content -->
  <!-- Large Number Background -->
  <text x="960" y="630" font-family="Arial" font-size="420" font-weight="bold" fill="#FFFFFF" fill-opacity="0.05" text-anchor="middle">{{CHAPTER_NUM}}</text>
  
  <!-- Part Label -->
  <rect x="810" y="390" width="300" height="60" fill="#4CA1E7" fill-opacity="0.3" rx="30" />
  <text x="960" y="432" font-family="Arial" font-size="27" fill="#FFFFFF" text-anchor="middle" letter-spacing="9">PART {{CHAPTER_NUM}}</text>
  
  <!-- Divider Line -->
  <rect x="660" y="480" width="600" height="4" fill="#4CA1E7" rx="2" />

  <!-- Main Title -->
  <text x="960" y="630" font-family="Microsoft YaHei" font-size="96" font-weight="bold" fill="#FFFFFF" text-anchor="middle">{{CHAPTER_TITLE}}</text>

  <!-- Subtitle/Description -->
  <text x="960" y="720" font-family="Microsoft YaHei" font-size="30" fill="#A0C4E3" text-anchor="middle">{{CHAPTER_DESC}}</text>

  <!-- Bottom Wave -->
  <path d="M0,990 C480,930 960,1050 1440,960 C1680,915 1800,975 1920,960 L1920,1080 L0,1080 Z" fill="#FFFFFF" fill-opacity="0.05" />

  <!-- Decorative Dots -->
  <circle cx="750" y="825" r="6" fill="#4CA1E7" fill-opacity="0.6" />
  <circle cx="795" y="825" r="6" fill="#4CA1E7" fill-opacity="0.4" />
  <circle cx="840" y="825" r="6" fill="#4CA1E7" fill-opacity="0.2" />
  <circle cx="1080" cy="825" r="6" fill="#4CA1E7" fill-opacity="0.2" />
  <circle cx="1125" cy="825" r="6" fill="#4CA1E7" fill-opacity="0.4" />
  <circle cx="1170" cy="825" r="6" fill="#4CA1E7" fill-opacity="0.6" />

</svg>
