<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1920" height="45" fill="#C8152D"/>
  <defs>
    <linearGradient id="accentFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8152D;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#C8152D;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="45" width="270" height="6" fill="url(#accentFade)"/>
  <image href="logo_dark.png" x="1410" y="63" width="420" height="72" preserveAspectRatio="xMidYMid meet"/>


  <text x="108" y="132" fill="#1F1F1F" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="39" font-weight="700">
    目录 / CONTENTS
  </text>
  <line x1="108" y1="165" x2="1815" y2="165" stroke="#E3E3E3" stroke-width="3"/>
  <line x1="108" y1="189" x2="375" y2="189" stroke="#C8152D" stroke-width="4"/>

  <!--
      AI 灵活布局区
      可用空间: x=72, y=140, w=1138, h=540

      推荐布局模式（按章节数量自由选择）：
      - 2-3 章: 单列纵排，每项间距 120px
      - 4 章:   2×2 矩阵 或 单列紧凑排列
      - 5-6 章: 2×3 矩阵 或 3 列布局
      - 7+ 章:  紧凑列表，减小编号字号

      设计元素参考：
      编号:     <text fill="#C8152D" font-size="66" font-weight="700"/> (品牌红)
                <text fill="#2175D9" font-size="66" font-weight="700"/> (金融蓝-交替)
      标题:     <text fill="#1F1F1F" font-size="36" font-weight="700"/>
      描述:     <text fill="#666666" font-size="22"/>
      分隔线:   <line stroke="#ECECEC" stroke-width="2.2"/>
      列分隔:   <line stroke="#EFEFEF" stroke-width="3"/> (纵向)
  -->
  <text x="962" y="600" text-anchor="middle" fill="#D8D8D8" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="4">
    {{CONTENT_AREA}}
  </text>
  <text x="962" y="654" text-anchor="middle" fill="#E6E6E6" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="21">
    Content Area: 1138 × 540 px
  </text>

</svg>

