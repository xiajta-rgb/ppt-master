<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1920" height="45" fill="#C8152D"/>
  <defs>
    <linearGradient id="accentFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C8152D;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#C8152D;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="45" width="270" height="6" fill="url(#accentFade)"/>
  <image href="logo_dark.png" x="1410" y="63" width="420" height="72" preserveAspectRatio="xMidYMid meet"/>


  <text x="108" y="126" fill="#1F1F1F" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="39" font-weight="700">
    {{PAGE_TITLE}}
  </text>
  <line x1="108" y1="147" x2="429" y2="147" stroke="#C8152D" stroke-width="4"/>

  <rect x="108" y="168" width="165" height="42" rx="21" fill="#C8152D"/>
  <text x="190" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" font-weight="700">
    {{SECTION_NAME}}
  </text>

  <rect x="108" y="237" width="6" height="39" fill="#C8152D"/>
  <text x="135" y="266" fill="#666666" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24">
    {{KEY_MESSAGE}}
  </text>
  <line x1="108" y1="306" x2="1815" y2="306" stroke="#E9E9E9" stroke-width="3"/>
  <rect x="108" y="318" width="198" height="6" fill="#C8152D" fill-opacity="0.1"/>

  <path d="M108 354 L129 354 M108 354 L108 375" stroke="#C8152D" stroke-width="3" stroke-opacity="0.6"/>
  <path d="M1815 354 L1794 354 M1815 354 L1815 375" stroke="#C8152D" stroke-width="3" stroke-opacity="0.6"/>
  <path d="M108 960 L129 960 M108 960 L108 939" stroke="#C8152D" stroke-width="3" stroke-opacity="0.35"/>
  <path d="M1815 960 L1794 960 M1815 960 L1815 939" stroke="#C8152D" stroke-width="3" stroke-opacity="0.35"/>

  <!--
      AI 灵活布局区
      可用空间: x=72, y=236, w=1138, h=404

      推荐布局模式：
      - 左右分栏 (540+540, gap=24 或 380+700)
      - 上下两段
      - 2×2 矩阵 (270×190 每格, gap=20)
      - 3 列卡片 (356×360, gap=24)
      - 数据卡片组合 (160×120 每个)
      - 横向流程 (全宽, 高度 100-140px, 3-6 节点)

      常用设计元素：
      数据卡片: <rect fill="#FFFFFF" stroke="#E9E9E9" stroke-width="2.2" rx="9"/>
                <rect width="6" fill="#C8152D"/> (左侧品牌装饰条)
      关键数据: <text fill="#C8152D" font-size="66" font-weight="bold"/> (品牌红-正向)
                <text fill="#2175D9" font-size="66" font-weight="bold"/> (金融蓝-对比)
      分隔线:   <line stroke="#E9E9E9" stroke-width="2"/>
  -->
  <text x="962" y="675" text-anchor="middle" fill="#D8D8D8" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="4">
    {{CONTENT_AREA}}
  </text>
  <text x="962" y="729" text-anchor="middle" fill="#E6E6E6" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="21">
    Content Area: 1138 × 404 px
  </text>

  <line x1="108" y1="1011" x2="1815" y2="1011" stroke="#E5E5E5" stroke-width="2.2"/>
  <line x1="108" y1="993" x2="276" y2="993" stroke="#C8152D" stroke-width="3" stroke-opacity="0.2"/>
  <text x="108" y="1047" fill="#8A8A8A" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">
    数据来源：{{SOURCE}}
  </text>
  <text x="1815" y="1047" text-anchor="end" fill="#777777" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="21">
    {{PAGE_NUM}}
  </text>
</svg>
