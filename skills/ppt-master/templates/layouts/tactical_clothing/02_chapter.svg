<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <text x="960" y="300" text-anchor="middle" fill="rgba(201,169,98,0.4)" font-family="Space Grotesk, Inter, sans-serif" font-size="180" font-weight="700">{{CHAPTER_NUM}}</text>

  <text x="960" y="480" text-anchor="middle" fill="#c9a962" font-family="Space Grotesk, Inter, sans-serif" font-size="18" font-weight="600" letter-spacing="6">CHAPTER {{CHAPTER_NUM}}</text>

  <text x="960" y="585" text-anchor="middle" fill="#f5f5f7" font-family="Space Grotesk, Inter, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">{{CHAPTER_TITLE}}</text>

  <text x="960" y="690" text-anchor="middle" fill="#86868b" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="400" max-width="600">{{CHAPTER_DESC}}</text>
</svg>