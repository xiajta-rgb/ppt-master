<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a962"/>
      <stop offset="100%" stop-color="#e0c882"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="-20%" r="80%">
      <stop offset="0%" stop-color="rgba(201,169,98,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <pattern id="gridPattern" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M 90 0 L 0 0 0 90" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="2"/>
    </pattern>
    <mask id="gridMask">
      <ellipse cx="960" cy="300" rx="900" ry="450" fill="white"/>
    </mask>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  <ellipse cx="960" cy="0" rx="1200" ry="750" fill="url(#heroGlow)"/>
  <g mask="url(#gridMask)">
    <rect width="1920" height="1080" fill="url(#gridPattern)"/>
  </g>

  <g transform="translate(960, 420)">
    <g fill="none" stroke="rgba(201,169,98,0.3)" stroke-width="2" rx="150" ry="150">
      <rect x="-120" y="-45" width="240" height="90" rx="45"/>
    </g>
    <text x="0" y="8" text-anchor="middle" fill="#c9a962" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" letter-spacing="3">INDUSTRY RESEARCH · 2025</text>
  </g>

  <text x="960" y="570" text-anchor="middle" fill="#f5f5f7" font-family="Space Grotesk, Inter, sans-serif" font-size="78" font-weight="700" letter-spacing="-3">
    {{TITLE_LINE1}}
  </text>
  <text x="960" y="675" text-anchor="middle" fill="url(#accentGradient)" font-family="Space Grotesk, Inter, sans-serif" font-size="78" font-weight="700" letter-spacing="-3">
    {{TITLE_LINE2}}
  </text>

  <text x="960" y="780" text-anchor="middle" fill="#86868b" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="400">
    {{SUBTITLE}}
  </text>

  <g transform="translate(960, 900)" fill="#6e6e73" font-family="Inter, -apple-system, sans-serif" font-size="20">
    <text x="0" y="0" text-anchor="middle">
      <tspan dx="-180">{{DATE}}</tspan>
      <tspan dx="90">|</tspan>
      <tspan dx="90">Amazon US Market</tspan>
      <tspan dx="90">|</tspan>
      <tspan dx="90">Market Research Report</tspan>
    </text>
  </g>
</svg>