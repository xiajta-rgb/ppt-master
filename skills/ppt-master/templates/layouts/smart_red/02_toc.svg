<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect x="0" y="0" width="1920" height="1080" fill="#F5F5F7" />

    <!-- 1. Left Red Panel -->
    <path d="M0 0 L600 0 L450 1080 L0 1080 Z" fill="#DE3545" />
    
    <!-- 2. Bottom Left Accent (Dark Grey) -->
    <path d="M0 1080 L270 1080 L0 825 Z" fill="#4A4A4A" />
    <path d="M0 1080 L120 1080 L0 960 Z" fill="#666666" />

    <!-- 3. Bottom Right Red Triangle Accent -->
    <path d="M1920 1080 L1920 870 L1710 1080 Z" fill="#DE3545" />
    <path d="M1920 1080 L1920 975 L1815 1080 Z" fill="#E97983" />
    
    <!-- 4. Top Right small accent -->
    <path d="M1920 0 L1830 0 L1920 90 Z" fill="#E97983" />

    <!-- Title Area (Left, on Red Panel) -->
    <g transform="translate(90, 300)">
        <text x="0" y="0" font-family="'Microsoft YaHei', sans-serif" font-size="108" font-weight="bold" fill="#FFFFFF">目录</text>
        <text x="0" y="60" font-family="Arial, sans-serif" font-size="36" letter-spacing="6" fill="#FFC1C1">CATALOGUE</text>
        <!-- Decorative line -->
        <line x1="0" y1="105" x2="150" y2="105" stroke="#FFFFFF" stroke-width="6" />
    </g>

    <!-- TOC Items (Right) -->
    <g transform="translate(720, 225)">
        
        <!-- Item 1 -->
        <g transform="translate(0, 0)">
            <circle cx="60" cy="60" r="48" fill="#FFFFFF" stroke="#DE3545" stroke-width="4" />
            <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#DE3545">01</text>
            <text x="142" y="68" font-family="'Microsoft YaHei', sans-serif" font-size="48" font-weight="bold" fill="#333333">{{TOC_ITEM_1_TITLE}}</text>
        </g>

        <!-- Item 2 -->
        <g transform="translate(0, 165)">
            <circle cx="60" cy="60" r="48" fill="#DE3545" />
            <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF">02</text>
            <text x="142" y="68" font-family="'Microsoft YaHei', sans-serif" font-size="48" font-weight="bold" fill="#333333">{{TOC_ITEM_2_TITLE}}</text>
        </g>

        <!-- Item 3 -->
        <g transform="translate(0, 330)">
            <circle cx="60" cy="60" r="48" fill="#FFFFFF" stroke="#DE3545" stroke-width="4" />
            <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#DE3545">03</text>
            <text x="142" y="68" font-family="'Microsoft YaHei', sans-serif" font-size="48" font-weight="bold" fill="#333333">{{TOC_ITEM_3_TITLE}}</text>
        </g>

        <!-- Item 4 -->
        <g transform="translate(0, 495)">
            <circle cx="60" cy="60" r="48" fill="#DE3545" />
            <text x="60" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF">04</text>
            <text x="142" y="68" font-family="'Microsoft YaHei', sans-serif" font-size="48" font-weight="bold" fill="#333333">{{TOC_ITEM_4_TITLE}}</text>
        </g>

    </g>
</svg>
