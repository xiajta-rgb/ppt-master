<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#F5F5F7" />

  <!-- Top Left Accent -->
  <path d="M0 0 L270 0 L0 270 Z" fill="#DE3545" />
  <path d="M0 0 L120 0 L0 120 Z" fill="#F5A0A8" />
  
  <!-- Bottom Right Accent -->
  <path d="M1920 1080 L1650 1080 L1920 810 Z" fill="#DE3545" />
  <path d="M1920 1080 L1770 1080 L1920 930 Z" fill="#F5A0A8" />
  
  <!-- Content Group -->
  <g transform="translate(960, 540)" text-anchor="middle">
      
      <!-- Chapter Number (watermark style) -->
      <text x="0" y="-60" font-family="Arial, sans-serif" font-size="210" font-weight="bold" fill="none" stroke="#F8D0D3" stroke-width="4">{{CHAPTER_NUM}}</text>
      <text x="0" y="-60" font-family="Arial, sans-serif" font-size="210" font-weight="bold" fill="#FADCDE">{{CHAPTER_NUM}}</text>
      
      <!-- Chapter Title -->
      <text x="0" y="45" font-family="'Microsoft YaHei', sans-serif" font-size="96" font-weight="bold" fill="#333333">{{CHAPTER_TITLE}}</text>
      
      <!-- Decor Line -->
      <line x1="-150" y1="105" x2="150" y2="105" stroke="#DE3545" stroke-width="6" />
      
      <!-- English Title -->
      <text x="0" y="180" font-family="Arial, sans-serif" font-size="36" fill="#999999" letter-spacing="9">CHAPTER SUMMARY</text>
  </g>
</svg>
