<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 内容页 - 中汽研风格 -->

    <!-- 白色背景 -->
    <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" />

    <!-- 顶部深蓝色装饰线 -->
    <rect x="0" y="0" width="1920" height="6" fill="#004098" />

    <!-- 页眉导航栏 -->
    <!-- 章节序号块 - 深蓝色正方形 -->
    <rect x="90" y="45" width="75" height="75" fill="#004098" />
    <text x="128" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold"
        fill="#FFFFFF">{{CHAPTER_NUM}}</text>

    <!-- 页面标题 -->
    <text x="195" y="98" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="42" font-weight="bold"
        fill="#333333">{{PAGE_TITLE}}</text>

    <!-- 右上角Logo -->
    <image href="../images/{{LOGO_HEADER}}" x="1660" y="45" width="170" height="75"
        preserveAspectRatio="xMidYMid meet" />

    <!-- 内容区域 - 灵活布局，由 Executor 根据实际内容自由设计 -->
    <!-- 可使用的布局模式：
       - 单栏文字列表
       - 左右双栏对比
       - 卡片式分块（如 2×2 四宫格）
       - 图文混排（左图右文、上图下文、通栏图）
       - 表格
       - 时间轴
       - 流程图
  -->
    <rect x="90" y="150" width="1740" height="855" fill="none" stroke="#E0E0E0" stroke-width="3"
        stroke-dasharray="8,8" />
    <text x="960" y="548" text-anchor="middle" fill="#CBD5E1" font-size="27" font-family="Microsoft YaHei, sans-serif">
        {{CONTENT_AREA}}
    </text>
    <text x="960" y="600" text-anchor="middle" fill="#CBD5E1" font-size="21" font-family="Microsoft YaHei, sans-serif">
        (由 Executor 根据实际内容自由布局)
    </text>

    <!-- 常用设计元素参考 -->
    <!-- 色块容器: <rect fill="#F5F5F5" rx="6"/> -->
    <!-- 强调色块: <rect fill="#004098"/> -->
    <!-- 圆点列表: <circle r="8" fill="#004098"/> -->
    <!-- 分隔线: <line stroke="#E0E0E0" stroke-width="2"/> -->

    <!-- 底部装饰线 -->
    <rect x="0" y="1074" width="1920" height="6" fill="#004098" />

    <!-- 页码 -->
    <text x="1830" y="1058" text-anchor="end" font-family="Arial, sans-serif" font-size="21"
        fill="#999999">{{PAGE_NUM}}</text>

</svg>
