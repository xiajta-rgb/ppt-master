<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 封面页 - 中汽研风格 -->

    <!-- 背景层 - 使用封面背景图（AI生成或用户提供） -->
    <image href="../images/{{COVER_BG_IMAGE}}" x="0" y="0" width="1920" height="1080"
        preserveAspectRatio="xMidYMid slice" />

    <!-- 半透明遮罩层 - 增强文字可读性 -->
    <rect x="0" y="0" width="1920" height="1080" fill="#001F4D" fill-opacity="0.4" />

    <!-- 顶部装饰线 -->
    <rect x="0" y="0" width="1920" height="6" fill="#FFFFFF" fill-opacity="0.3" />

    <!-- 大型Logo - 居中偏上 -->
    <image href="../images/{{LOGO_LARGE}}" x="516" y="180" width="888" height="357"
        preserveAspectRatio="xMidYMid meet" />

    <!-- 主标题区域 -->
    <text x="960" y="660" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="72"
        font-weight="bold" fill="#FFFFFF">
        {{TITLE}}
    </text>

    <!-- 副标题 -->
    <text x="960" y="750" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="39"
        fill="#FFFFFF" fill-opacity="0.85">
        {{SUBTITLE}}
    </text>

    <!-- 分隔线 -->
    <line x1="660" y1="810" x2="1260" y2="810" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4" />

    <!-- 单位名称（中文） -->
    <text x="960" y="885" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="33"
        fill="#FFFFFF" fill-opacity="0.9">
        {{AUTHOR}}
    </text>

    <!-- 单位名称（英文） - 可选 -->
    <text x="960" y="938" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF"
        fill-opacity="0.7">
        {{AUTHOR_EN}}
    </text>

    <!-- 底部装饰线 -->
    <rect x="0" y="1074" width="1920" height="6" fill="#004098" />

</svg>
