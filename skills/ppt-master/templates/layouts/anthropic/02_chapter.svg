<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 章节页 - Anthropic 风格 -->
    
    <defs>
        <!-- 背景渐变 -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1A1A2E"/>
            <stop offset="50%" style="stop-color:#16213E"/>
            <stop offset="100%" style="stop-color:#0F0F1A"/>
        </linearGradient>
        <!-- 橙色渐变 -->
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#D97757"/>
            <stop offset="100%" style="stop-color:#E8956F"/>
        </linearGradient>
        <!-- 光晕 -->
        <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#D97757;stop-opacity:0.25"/>
            <stop offset="100%" style="stop-color:#D97757;stop-opacity:0"/>
        </radialGradient>
    </defs>
    
    <!-- 渐变背景 -->
    <rect width="1920" height="1080" fill="url(#bgGradient)"/>
    
    <!-- 网格装饰线 -->
    <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="2">
        <line x1="0" y1="270" x2="1920" y2="270"/>
        <line x1="0" y1="540" x2="1920" y2="540"/>
        <line x1="0" y1="810" x2="1920" y2="810"/>
        <line x1="480" y1="0" x2="480" y2="1080"/>
        <line x1="960" y1="0" x2="960" y2="1080"/>
        <line x1="1440" y1="0" x2="1440" y2="1080"/>
    </g>
    
    <!-- 光晕效果 -->
    <ellipse cx="960" cy="540" rx="600" ry="450" fill="url(#glowOrange)"/>
    
    <!-- 装饰圆形 -->
    <circle cx="300" cy="300" r="120" fill="#4A90D9" fill-opacity="0.05"/>
    <circle cx="1620" cy="780" r="150" fill="#D97757" fill-opacity="0.05"/>
    
    <!-- 章节编号背景 -->
    <text x="960" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="300" font-weight="bold" fill="#FFFFFF" fill-opacity="0.03">
        {{CHAPTER_NUM}}
    </text>
    
    <!-- SECTION 标签 -->
    <text x="960" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#D97757" letter-spacing="6">
        SECTION {{CHAPTER_NUM}}
    </text>
    
    <!-- 装饰线 -->
    <rect x="810" y="480" width="300" height="4" fill="url(#accentGradient)" rx="2.2"/>
    
    <!-- 章节标题 -->
    <text x="960" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">
        {{CHAPTER_TITLE}}
    </text>
    
    <!-- 章节描述 -->
    <text x="960" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" fill="#FFFFFF" fill-opacity="0.7">
        {{CHAPTER_DESC}}
    </text>
    
    <!-- 底部装饰线 -->
    <rect x="90" y="975" width="1740" height="2" fill="#FFFFFF" fill-opacity="0.1"/>
    
    <!-- 页码 -->
    <text x="960" y="1035" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#64748B">
        {{PAGE_NUM}} / {{TOTAL_PAGES}}
    </text>

</svg>
