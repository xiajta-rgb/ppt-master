<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 内容页 - Anthropic 风格 -->
    
    <defs>
        <!-- 卡片渐变 -->
        <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FFFFFF"/>
            <stop offset="100%" style="stop-color:#F8FAFC"/>
        </linearGradient>
    </defs>
    
    <!-- 白色背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 顶部橙色装饰条 -->
    <rect x="0" y="0" width="1920" height="9" fill="#D97757"/>
    
    <!-- 页面标签 -->
    <text x="90" y="82" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#D97757" letter-spacing="3">
        {{PAGE_LABEL}}
    </text>
    
    <!-- 页面标题（核心观点） -->
    <text x="90" y="150" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#1A1A2E">
        {{PAGE_TITLE}}
    </text>
    <text x="90" y="202" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#1A1A2E">
        {{PAGE_TITLE_LINE2}}
    </text>
    
    <!-- 三列卡片布局 -->
    <!-- 卡片1 - 绿色（推荐/成功） -->
    <g>
        <rect x="90" y="270" width="540" height="630" fill="url(#cardGradient)" stroke="#E2E8F0" stroke-width="2" rx="18"/>
        <rect x="90" y="270" width="540" height="9" fill="#10B981" rx="4"/>
        
        <!-- 图标背景 -->
        <circle cx="195" cy="375" r="52" fill="#10B981" fill-opacity="0.1"/>
        <!-- 图标占位 -->
        <text x="195" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#10B981">💡</text>
        
        <!-- 卡片标题 -->
        <text x="135" y="480" font-family="Arial, sans-serif" font-size="33" font-weight="bold" fill="#1A1A2E">{{CARD_1_TITLE}}</text>
        <text x="135" y="522" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#64748B">{{CARD_1_SUBTITLE}}</text>
        
        <!-- 卡片内容 -->
        <text x="135" y="600" font-family="Arial, sans-serif" font-size="24" fill="#1A1A2E">{{CARD_1_LINE1}}</text>
        <text x="135" y="642" font-family="Arial, sans-serif" font-size="24" fill="#1A1A2E">{{CARD_1_LINE2}}</text>
        <text x="135" y="705" font-family="Arial, sans-serif" font-size="22" fill="#64748B">{{CARD_1_NOTE1}}</text>
        <text x="135" y="741" font-family="Arial, sans-serif" font-size="22" fill="#64748B">{{CARD_1_NOTE2}}</text>
        
        <!-- 标签 -->
        <rect x="135" y="818" width="120" height="42" fill="#10B981" fill-opacity="0.1" rx="21"/>
        <text x="195" y="846" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#10B981">{{CARD_1_TAG}}</text>
    </g>
    
    <!-- 卡片2 - 蓝色（流程/架构） -->
    <g>
        <rect x="690" y="270" width="540" height="630" fill="url(#cardGradient)" stroke="#E2E8F0" stroke-width="2" rx="18"/>
        <rect x="690" y="270" width="540" height="9" fill="#4A90D9" rx="4"/>
        
        <!-- 图标背景 -->
        <circle cx="795" cy="375" r="52" fill="#4A90D9" fill-opacity="0.1"/>
        <!-- 图标占位 -->
        <text x="795" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#4A90D9">⚡</text>
        
        <!-- 卡片标题 -->
        <text x="735" y="480" font-family="Arial, sans-serif" font-size="33" font-weight="bold" fill="#1A1A2E">{{CARD_2_TITLE}}</text>
        <text x="735" y="522" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#64748B">{{CARD_2_SUBTITLE}}</text>
        
        <!-- 卡片内容 -->
        <text x="735" y="600" font-family="Arial, sans-serif" font-size="24" fill="#1A1A2E">{{CARD_2_LINE1}}</text>
        <text x="735" y="642" font-family="Arial, sans-serif" font-size="24" fill="#1A1A2E">{{CARD_2_LINE2}}</text>
        <text x="735" y="705" font-family="Arial, sans-serif" font-size="22" fill="#64748B">{{CARD_2_NOTE1}}</text>
        <text x="735" y="741" font-family="Arial, sans-serif" font-size="22" fill="#64748B">{{CARD_2_NOTE2}}</text>
        
        <!-- 标签 -->
        <rect x="735" y="818" width="120" height="42" fill="#4A90D9" fill-opacity="0.1" rx="21"/>
        <text x="795" y="846" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#4A90D9">{{CARD_2_TAG}}</text>
    </g>
    
    <!-- 卡片3 - 橙色（关键洞察） -->
    <g>
        <rect x="1290" y="270" width="540" height="630" fill="url(#cardGradient)" stroke="#E2E8F0" stroke-width="2" rx="18"/>
        <rect x="1290" y="270" width="540" height="9" fill="#D97757" rx="4"/>
        
        <!-- 图标背景 -->
        <circle cx="1395" cy="375" r="52" fill="#D97757" fill-opacity="0.1"/>
        <!-- 图标占位 -->
        <text x="1395" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#D97757">⚙️</text>
        
        <!-- 卡片标题 -->
        <text x="1335" y="480" font-family="Arial, sans-serif" font-size="33" font-weight="bold" fill="#1A1A2E">{{CARD_3_TITLE}}</text>
        <text x="1335" y="522" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#64748B">{{CARD_3_SUBTITLE}}</text>
        
        <!-- 卡片内容 -->
        <text x="1335" y="600" font-family="Arial, sans-serif" font-size="24" fill="#1A1A2E">{{CARD_3_LINE1}}</text>
        <text x="1335" y="642" font-family="Arial, sans-serif" font-size="24" fill="#1A1A2E">{{CARD_3_LINE2}}</text>
        <text x="1335" y="705" font-family="Arial, sans-serif" font-size="22" fill="#64748B">{{CARD_3_NOTE1}}</text>
        <text x="1335" y="741" font-family="Arial, sans-serif" font-size="22" fill="#64748B">{{CARD_3_NOTE2}}</text>
        
        <!-- 标签 -->
        <rect x="1335" y="818" width="120" height="42" fill="#D97757" fill-opacity="0.1" rx="21"/>
        <text x="1395" y="846" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#D97757">{{CARD_3_TAG}}</text>
    </g>
    
    <!-- Executor 自由布局锚点 -->
    <text x="960" y="938" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#CBD5E1">
        {{CONTENT_AREA}}
    </text>

    <!-- 页码 -->
    <text x="960" y="1020" font-family="Arial, sans-serif" font-size="21" fill="#64748B" text-anchor="middle">
        {{PAGE_NUM}} / {{TOTAL_PAGES}}
    </text>

</svg>
