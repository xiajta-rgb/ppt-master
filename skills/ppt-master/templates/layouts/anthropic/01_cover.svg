<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 封面页 - Anthropic 风格 -->
    
    <defs>
        <!-- 背景渐变 -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1A1A2E"/>
            <stop offset="50%" style="stop-color:#16213E"/>
            <stop offset="100%" style="stop-color:#0F0F1A"/>
        </linearGradient>
        <!-- 橙色渐变 -->
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#D97757"/>
            <stop offset="100%" style="stop-color:#E8956F"/>
        </linearGradient>
        <!-- 光晕效果 -->
        <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#D97757;stop-opacity:0.3"/>
            <stop offset="100%" style="stop-color:#D97757;stop-opacity:0"/>
        </radialGradient>
        <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:0.2"/>
            <stop offset="100%" style="stop-color:#4A90D9;stop-opacity:0"/>
        </radialGradient>
    </defs>
    
    <!-- 渐变背景 -->
    <rect width="1920" height="1080" fill="url(#bgGradient)"/>
    
    <!-- 网格装饰线 -->
    <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="2">
        <line x1="0" y1="270" x2="1920" y2="270"/>
        <line x1="0" y1="540" x2="1920" y2="540"/>
        <line x1="0" y1="810" x2="1920" y2="810"/>
        <line x1="480" y1="0" x2="480" y2="1080"/>
        <line x1="960" y1="0" x2="960" y2="1080"/>
        <line x1="1440" y1="0" x2="1440" y2="1080"/>
    </g>
    
    <!-- 光晕效果 -->
    <ellipse cx="1650" cy="225" rx="450" ry="300" fill="url(#glowOrange)"/>
    <ellipse cx="300" cy="825" rx="375" ry="270" fill="url(#glowBlue)"/>
    
    <!-- 神经网络连接线 -->
    <g stroke="#4A90D9" stroke-opacity="0.4" stroke-width="2" fill="none">
        <path d="M150,300 Q375,225 525,330"/>
        <path d="M525,330 Q675,420 750,300"/>
        <path d="M1350,720 Q1500,630 1650,720"/>
        <path d="M1650,720 Q1725,825 1800,750"/>
    </g>
    
    <!-- 蓝色节点 -->
    <g fill="#4A90D9" fill-opacity="0.6">
        <circle cx="150" cy="300" r="6"/>
        <circle cx="525" cy="330" r="9"/>
        <circle cx="750" cy="300" r="6"/>
        <circle cx="1350" cy="720" r="8"/>
        <circle cx="1650" cy="720" r="10"/>
        <circle cx="1800" cy="750" r="6"/>
    </g>
    
    <!-- 橙色节点 -->
    <g fill="#D97757" fill-opacity="0.7">
        <circle cx="1575" cy="270" r="12"/>
        <circle cx="1725" cy="180" r="8"/>
        <circle cx="270" cy="780" r="9"/>
    </g>
    
    <!-- 左上角装饰短线 -->
    <rect x="90" y="90" width="120" height="6" fill="url(#accentGradient)" rx="3"/>
    
    <!-- 品牌标识 -->
    <text x="90" y="150" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#D97757" letter-spacing="3">
        {{BRAND_LABEL}}
    </text>
    
    <!-- 主标题 -->
    <text x="960" y="450" font-family="Arial, sans-serif" font-size="84" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
        {{TITLE}}
    </text>
    
    <!-- 副标题 -->
    <text x="960" y="548" font-family="Arial, sans-serif" font-size="39" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">
        {{SUBTITLE}}
    </text>
    
    <!-- 装饰分隔线 -->
    <rect x="810" y="600" width="300" height="4" fill="url(#accentGradient)" rx="2.2"/>
    
    <!-- 引用语 -->
    <text x="960" y="698" font-family="Arial, sans-serif" font-size="27" fill="#FFFFFF" fill-opacity="0.7" text-anchor="middle">
        "{{COVER_QUOTE}}"
    </text>
    
    <!-- 底部信息 -->
    <rect x="90" y="975" width="1740" height="2" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="90" y="1020" font-family="Arial, sans-serif" font-size="21" fill="#64748B">
        {{DATE}}
    </text>
    <text x="1830" y="1020" text-anchor="end" font-family="Arial, sans-serif" font-size="21" fill="#64748B">
        {{SOURCE}}
    </text>

</svg>
