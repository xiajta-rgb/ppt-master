<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 结束页 - 重庆两江新区发改委风格 -->

    <defs>
        <!-- 深蓝背景渐变 -->
        <linearGradient id="endingBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#003366;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#002244;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#001a33;stop-opacity:1" />
        </linearGradient>
        <!-- 顶部装饰渐变 -->
        <linearGradient id="topDecoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 深蓝色背景 -->
    <rect x="0" y="0" width="1920" height="1080" fill="url(#endingBgGrad)" />

    <!-- 装饰元素 - 几何图案（低透明度圆形） -->
    <circle cx="150" cy="150" r="375" fill="#FFFFFF" fill-opacity="0.02" />
    <circle cx="1800" cy="900" r="525" fill="#FFFFFF" fill-opacity="0.02" />
    <circle cx="960" cy="540" r="675" fill="#FFFFFF" fill-opacity="0.015" />

    <!-- 顶部金红渐变装饰线 -->
    <rect x="0" y="0" width="1920" height="9" fill="url(#topDecoGrad)" />

    <!-- 网格装饰 - 营造专业氛围 -->
    <line x1="0" y1="270" x2="1920" y2="270" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="0" y1="810" x2="1920" y2="810" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="480" y1="0" x2="480" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="960" y1="0" x2="960" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />

    <!-- 左侧装饰竖条 -->
    <rect x="150" y="330" width="9" height="420" fill="#DAA520" fill-opacity="0.6" />

    <!-- 感谢语（中文） -->
    <text x="960" y="450" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="96" font-weight="bold" fill="#FFFFFF">
        {{THANK_YOU}}
    </text>

    <!-- 感谢语（英文） -->
    <text x="960" y="540" text-anchor="middle" font-family="Arial, Georgia, serif" font-size="39" fill="#FFFFFF" fill-opacity="0.6" letter-spacing="6">
        {{THANK_YOU_EN}}
    </text>

    <!-- 分隔线 -->
    <line x1="735" y1="600" x2="1185" y2="600" stroke="#DAA520" stroke-width="3" stroke-opacity="0.8" />

    <!-- 单位信息（中文） -->
    <text x="960" y="705" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="33" fill="#FFFFFF" fill-opacity="0.9">
        {{AUTHOR}}
    </text>

    <!-- 单位信息（英文） -->
    <text x="960" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" fill-opacity="0.5">
        {{AUTHOR_EN}}
    </text>

    <!-- 联系信息 -->
    <text x="960" y="855" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#FFFFFF" fill-opacity="0.6">
        {{CONTACT_INFO}}
    </text>

    <!-- 底部信息区 -->
    <rect x="0" y="1020" width="1920" height="60" fill="#8B0000" fill-opacity="0.8" />
    <text x="960" y="1060" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#FFFFFF" fill-opacity="0.9">
        {{ENDING_SUBTITLE}}
    </text>

</svg>
