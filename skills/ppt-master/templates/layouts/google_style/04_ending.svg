<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 结束页 - Google 风格 -->

    <defs>
        <!-- 背景渐变 -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#F8F9FA;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#E8F5E9;stop-opacity:0.5" />
        </linearGradient>

        <!-- 标题渐变 -->
        <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#1A73E8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 渐变背景 -->
    <rect width="1920" height="1080" fill="url(#bgGradient)" />

    <!-- 装饰圆形 -->
    <circle cx="150" cy="150" r="90" fill="#4285F4" fill-opacity="0.12" />
    <circle cx="1770" cy="150" r="68" fill="#EA4335" fill-opacity="0.12" />
    <circle cx="150" cy="930" r="75" fill="#FBBC04" fill-opacity="0.12" />
    <circle cx="1770" cy="930" r="82" fill="#34A853" fill-opacity="0.12" />

    <!-- 中央内容卡片 -->
    <rect x="360" y="210" width="1200" height="660" rx="36" fill="#FFFFFF" stroke="#E8EAED" stroke-width="2" />

    <!-- Thank You 标题 -->
    <text x="960" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="700" fill="url(#textGradient)" text-anchor="middle">
        {{THANK_YOU}}
    </text>

    <!-- 副标题 -->
    <text x="960" y="435" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="400" fill="#5F6368" text-anchor="middle">
        {{ENDING_SUBTITLE}}
    </text>

    <!-- 四色分隔线 -->
    <g transform="translate(960, 480)">
        <line x1="-180" y1="0" x2="-60" y2="0" stroke="#4285F4" stroke-width="6" stroke-linecap="round" />
        <line x1="-45" y1="0" x2="45" y2="0" stroke="#EA4335" stroke-width="6" stroke-linecap="round" />
        <line x1="60" y1="0" x2="180" y2="0" stroke="#34A853" stroke-width="6" stroke-linecap="round" />
    </g>

    <!-- 感谢列表 -->
    <g transform="translate(450, 555)">
        <!-- 感谢项 1 -->
        <circle cx="30" cy="0" r="15" fill="#4285F4" />
        <text x="68" y="8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#1A237E">
            {{THANKS_PERSON_1}}
        </text>
        <text x="68" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#5F6368">
            {{THANKS_REASON_1}}
        </text>
    </g>

    <g transform="translate(450, 675)">
        <!-- 感谢项 2 -->
        <circle cx="30" cy="0" r="15" fill="#34A853" />
        <text x="68" y="8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#1A237E">
            {{THANKS_PERSON_2}}
        </text>
        <text x="68" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#5F6368">
            {{THANKS_REASON_2}}
        </text>
    </g>

    <g transform="translate(450, 795)">
        <!-- 感谢项 3 -->
        <circle cx="30" cy="0" r="15" fill="#FBBC04" />
        <text x="68" y="8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="600" fill="#1A237E">
            {{THANKS_PERSON_3}}
        </text>
        <text x="68" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#5F6368">
            {{THANKS_REASON_3}}
        </text>
    </g>

    <!-- 结语 -->
    <text x="960" y="975" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#5F6368" text-anchor="middle">
        {{CONTACT_INFO}}
    </text>

    <!-- 底部四色圆点装饰 -->
    <g transform="translate(960, 1035)">
        <circle cx="-90" cy="0" r="9" fill="#4285F4" />
        <circle cx="-45" cy="0" r="9" fill="#EA4335" />
        <circle cx="0" cy="0" r="9" fill="#FBBC04" />
        <circle cx="45" cy="0" r="9" fill="#34A853" />
        <circle cx="90" cy="0" r="9" fill="#4285F4" />
    </g>

</svg>
