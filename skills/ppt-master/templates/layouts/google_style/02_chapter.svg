<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 章节页 - Google 风格 -->

    <defs>
        <!-- 深色背景渐变 -->
        <linearGradient id="bgDarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1A237E;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
        </linearGradient>

        <!-- 章节编号渐变 -->
        <linearGradient id="numGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1A73E8;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 深色渐变背景 -->
    <rect width="1920" height="1080" fill="url(#bgDarkGradient)" />

    <!-- 装饰圆形 - 增加视觉层次 -->
    <circle cx="1650" cy="225" r="300" fill="#FFFFFF" fill-opacity="0.03" />
    <circle cx="1725" cy="900" r="375" fill="#FFFFFF" fill-opacity="0.02" />
    <circle cx="150" cy="975" r="225" fill="#FFFFFF" fill-opacity="0.02" />

    <!-- 左侧四色竖条装饰 -->
    <rect x="90" y="300" width="12" height="120" fill="#4285F4" />
    <rect x="90" y="435" width="12" height="120" fill="#EA4335" />
    <rect x="90" y="570" width="12" height="120" fill="#FBBC04" />
    <rect x="90" y="705" width="12" height="120" fill="#34A853" />

    <!-- 大号章节编号 -->
    <text x="180" y="570" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="270" font-weight="700" fill="url(#numGradient)" fill-opacity="0.9">
        {{CHAPTER_NUM}}
    </text>

    <!-- 章节标题 -->
    <text x="180" y="750" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">
        {{CHAPTER_TITLE}}
    </text>

    <!-- 英文副标题 -->
    <text x="180" y="840" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="400" fill="#FFFFFF" fill-opacity="0.7">
        {{CHAPTER_TITLE_EN}}
    </text>

    <!-- 底部四色圆点装饰 -->
    <g transform="translate(960, 1020)">
        <circle cx="-90" cy="0" r="9" fill="#4285F4" />
        <circle cx="-45" cy="0" r="9" fill="#EA4335" />
        <circle cx="0" cy="0" r="9" fill="#FBBC04" />
        <circle cx="45" cy="0" r="9" fill="#34A853" />
        <circle cx="90" cy="0" r="9" fill="#4285F4" />
    </g>

    <!-- 右下角装饰线 -->
    <line x1="1500" y1="975" x2="1650" y2="975" stroke="#4285F4" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="1665" y1="975" x2="1740" y2="975" stroke="#EA4335" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="1755" y1="975" x2="1830" y2="975" stroke="#34A853" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6" />

</svg>
