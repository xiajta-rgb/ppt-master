<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 目录页 - Google 风格 -->

    <defs>
        <!-- 顶部四色渐变条 -->
        <linearGradient id="topGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
            <stop offset="33%" style="stop-color:#EA4335;stop-opacity:1" />
            <stop offset="66%" style="stop-color:#FBBC04;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#34A853;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 白色背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF" />

    <!-- 顶部四色渐变条 -->
    <rect x="0" y="0" width="1920" height="9" fill="url(#topGradient)" />

    <!-- 页面标题 -->
    <text x="90" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="69" font-weight="700" fill="#1A237E">
        Contents
    </text>

    <!-- 蓝色标题下划线 -->
    <rect x="90" y="150" width="180" height="6" rx="3" fill="#4285F4" />

    <!-- 章节列表区域 -->
    <g transform="translate(90, 240)">
        <!-- 章节 1 -->
        <g transform="translate(0, 0)">
            <circle cx="30" cy="45" r="24" fill="#4285F4" />
            <text x="30" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">01</text>
            <text x="82" y="57" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" fill="#1A237E">{{TOC_ITEM_1_TITLE}}</text>
        </g>

        <!-- 章节 2 -->
        <g transform="translate(0, 120)">
            <circle cx="30" cy="45" r="24" fill="#EA4335" />
            <text x="30" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">02</text>
            <text x="82" y="57" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" fill="#1A237E">{{TOC_ITEM_2_TITLE}}</text>
        </g>

        <!-- 章节 3 -->
        <g transform="translate(0, 240)">
            <circle cx="30" cy="45" r="24" fill="#FBBC04" />
            <text x="30" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" fill="#1A237E" text-anchor="middle">03</text>
            <text x="82" y="57" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" fill="#1A237E">{{TOC_ITEM_3_TITLE}}</text>
        </g>

        <!-- 章节 4 -->
        <g transform="translate(0, 360)">
            <circle cx="30" cy="45" r="24" fill="#34A853" />
            <text x="30" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">04</text>
            <text x="82" y="57" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" fill="#1A237E">{{TOC_ITEM_4_TITLE}}</text>
        </g>

        <!-- 章节 5 (可选) -->
        <g transform="translate(0, 480)">
            <circle cx="30" cy="45" r="24" fill="#4285F4" />
            <text x="30" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">05</text>
            <text x="82" y="57" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" fill="#1A237E">{{TOC_ITEM_5_TITLE}}</text>
        </g>
    </g>

    <!-- 右侧装饰区域 - 可用于放置统计数据或装饰图形 -->
    <g transform="translate(1125, 270)">
        <!-- 装饰圆形 -->
        <circle cx="300" cy="225" r="270" fill="#4285F4" fill-opacity="0.05" />
        <circle cx="330" cy="270" r="180" fill="#34A853" fill-opacity="0.05" />
        <circle cx="270" cy="330" r="120" fill="#FBBC04" fill-opacity="0.08" />
        
        <!-- 可选：右侧统计信息 -->
        <rect x="90" y="450" width="600" height="225" rx="18" fill="#F8F9FA" />
        <text x="390" y="525" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#5F6368" text-anchor="middle">{{STATS_AREA}}</text>
        <text x="390" y="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#9AA0A6" text-anchor="middle">(可选统计区域)</text>
    </g>

    <!-- 底部四色圆点装饰 -->
    <g transform="translate(960, 1020)">
        <circle cx="-90" cy="0" r="9" fill="#4285F4" />
        <circle cx="-45" cy="0" r="9" fill="#EA4335" />
        <circle cx="0" cy="0" r="9" fill="#FBBC04" />
        <circle cx="45" cy="0" r="9" fill="#34A853" />
        <circle cx="90" cy="0" r="9" fill="#4285F4" />
    </g>

</svg>
