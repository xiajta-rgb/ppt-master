<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF" />

    <!-- ==================== 顶部装饰区域 ==================== -->
    <!-- 医学蓝主横条 -->
    <rect x="0" y="0" width="1920" height="150" fill="#0066B3" />
    <!-- 左侧橙色竖条装饰 -->
    <rect x="0" y="0" width="9" height="150" fill="#FF6B35" />

    <!-- 顶部装饰：心电图波形线（医疗元素） -->
    <path d="M60 75 L150 75 L180 30 L210 120 L240 60 L270 90 L300 75 L420 75" stroke="#FFFFFF" stroke-width="3"
        stroke-opacity="0.3" fill="none" />

    <!-- 右上角 Logo/校徽区域占位 -->
    <rect x="1620" y="38" width="240" height="75" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3"
        rx="6" />
    <text x="1740" y="87" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="24" font-weight="bold">
        {{LOGO}}
    </text>

    <!-- ==================== 主内容区域 ==================== -->
    <!-- 主标题 -->
    <text x="960" y="480" text-anchor="middle" fill="#004080" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="78" font-weight="bold">
        {{TITLE}}
    </text>

    <!-- 副标题 -->
    <text x="960" y="578" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="39">
        {{SUBTITLE}}
    </text>

    <!-- 装饰分割线 -->
    <line x1="630" y1="638" x2="1290" y2="638" stroke="#0066B3" stroke-width="3" />
    <circle cx="960" cy="638" r="9" fill="#00A86B" />
    <!-- 左右装饰小圆点 -->
    <circle cx="630" cy="638" r="6" fill="#0066B3" />
    <circle cx="1290" cy="638" r="6" fill="#0066B3" />

    <!-- ==================== 汇报人信息区域 ==================== -->
    <!-- 汇报人 -->
    <text x="960" y="735" text-anchor="middle" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="33">
        汇报人：{{AUTHOR}}
    </text>

    <!-- 科室/导师 -->
    <text x="960" y="792" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="27">
        {{DEPARTMENT}}　｜　指导老师：{{ADVISOR}}
    </text>

    <!-- 机构名称 -->
    <text x="960" y="855" text-anchor="middle" fill="#0066B3" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="30" font-weight="bold">
        {{INSTITUTION}}
    </text>

    <!-- ==================== 底部信息 ==================== -->
    <rect x="0" y="998" width="1920" height="82" fill="#F5F7FA" />
    <!-- 底部装饰线 -->
    <rect x="0" y="998" width="1920" height="4" fill="#0066B3" />
    <text x="960" y="1050" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="21">
        {{DATE}}
    </text>
</svg>