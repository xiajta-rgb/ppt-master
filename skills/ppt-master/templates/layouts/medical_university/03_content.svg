<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF" />

    <!-- ==================== 页眉区域 ==================== -->
    <!-- 医学蓝页眉背景 -->
    <rect x="0" y="0" width="1920" height="105" fill="#0066B3" />
    <!-- 左侧橙色竖条装饰 -->
    <rect x="0" y="0" width="9" height="105" fill="#FF6B35" />

    <!-- 章节编号 + 页面标题 -->
    <text x="60" y="69" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="39"
        font-weight="bold">
        {{SECTION_NUM}} {{PAGE_TITLE}}
    </text>

    <!-- 右上角 Logo -->
    <rect x="1650" y="30" width="210" height="45" fill="none" />
    <text x="1830" y="69" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="24" font-weight="bold">
        {{LOGO}}
    </text>

    <!-- ==================== 核心观点条 ==================== -->
    <rect x="0" y="105" width="1920" height="75" fill="#E6F3FA" />
    <rect x="0" y="105" width="9" height="75" fill="#00A86B" />
    <text x="60" y="153" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27">
        {{KEY_MESSAGE}}
    </text>

    <!-- ==================== 内容区域 ==================== -->
    <!-- 
    AI 灵活布局区
    可用空间: x=40, y=135, width=1200, height=515
    适用布局：病例展示、数据卡片、图文混排、时间线、流程图等
  -->
    <rect x="60" y="202" width="1800" height="772" fill="#FFFFFF" rx="6" />
    <rect x="60" y="202" width="1800" height="772" fill="none" stroke="#D0D7E0" stroke-width="2" rx="6"
        stroke-dasharray="8,4" />

    <!-- 内容区域占位符 -->
    <text x="960" y="578" text-anchor="middle" fill="#CBD5E1" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="24">
        {{CONTENT_AREA}}
    </text>

    <!-- 布局说明 -->
    <text x="960" y="622" text-anchor="middle" fill="#CBD5E1" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="21">
        可用布局：病例展示、检验结果、影像资料、治疗方案、数据图表等
    </text>

    <!-- 示例数据卡片区域（虚线框） -->
    <rect x="120" y="270" width="270" height="150" fill="none" stroke="#D0D7E0" stroke-width="2" stroke-dasharray="4,4"
        rx="12" />
    <text x="255" y="352" text-anchor="middle" fill="#D0D7E0" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="18">数据卡片</text>

    <rect x="420" y="270" width="270" height="150" fill="none" stroke="#D0D7E0" stroke-width="2" stroke-dasharray="4,4"
        rx="12" />
    <text x="555" y="352" text-anchor="middle" fill="#D0D7E0" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="18">数据卡片</text>

    <!-- ==================== 页脚区域 ==================== -->
    <line x1="60" y1="998" x2="1860" y2="998" stroke="#E6F3FA" stroke-width="2" />
    <text x="60" y="1042" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">
        数据来源：{{SOURCE}}
    </text>
    <text x="960" y="1042" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="18">
        {{SECTION_NAME}}
    </text>
    <text x="1830" y="1042" text-anchor="end" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="21">
        {{PAGE_NUM}}
    </text>
</svg>