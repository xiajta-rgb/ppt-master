<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF" />

    <!-- ==================== 顶部装饰区域 ==================== -->
    <rect x="0" y="0" width="1920" height="150" fill="#0066B3" />
    <rect x="0" y="0" width="9" height="150" fill="#FF6B35" />

    <!-- 顶部装饰：心电图波形 -->
    <path d="M60 75 L150 75 L180 30 L210 120 L240 60 L270 90 L300 75 L420 75" stroke="#FFFFFF" stroke-width="3"
        stroke-opacity="0.3" fill="none" />

    <!-- 右上角 Logo -->
    <text x="1800" y="87" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="24" font-weight="bold">
        {{LOGO}}
    </text>

    <!-- ==================== 主内容区域 ==================== -->
    <!-- 感谢语 -->
    <text x="960" y="420" text-anchor="middle" fill="#004080" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="78" font-weight="bold">
        {{THANK_YOU}}
    </text>

    <!-- 副标语 -->
    <text x="960" y="510" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="33">
        {{ENDING_SUBTITLE}}
    </text>

    <!-- 装饰分割线 -->
    <line x1="690" y1="570" x2="1230" y2="570" stroke="#0066B3" stroke-width="3" />
    <circle cx="960" cy="570" r="9" fill="#00A86B" />
    <circle cx="690" cy="570" r="6" fill="#0066B3" />
    <circle cx="1230" cy="570" r="6" fill="#0066B3" />

    <!-- ==================== 联系信息区域 ==================== -->
    <rect x="510" y="630" width="900" height="225" fill="#F5F7FA" rx="12" />
    <!-- 左侧装饰条 -->
    <rect x="510" y="630" width="9" height="225" fill="#0066B3" rx="4" />

    <!-- 联系信息 -->
    <text x="960" y="705" text-anchor="middle" fill="#004080" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="30" font-weight="bold">
        {{INSTITUTION}}
    </text>
    <text x="960" y="765" text-anchor="middle" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="24">
        {{DEPARTMENT}}
    </text>
    <text x="960" y="818" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="21">
        {{CONTACT_INFO}}
    </text>

    <!-- ==================== 装饰元素 ==================== -->
    <!-- 左侧医疗十字装饰 -->
    <rect x="180" y="570" width="90" height="22" fill="#00A86B" fill-opacity="0.15" rx="4" />
    <rect x="213" y="537" width="22" height="90" fill="#00A86B" fill-opacity="0.15" rx="4" />

    <!-- 右侧医疗十字装饰 -->
    <rect x="1650" y="570" width="90" height="22" fill="#00A86B" fill-opacity="0.15" rx="4" />
    <rect x="1683" y="537" width="22" height="90" fill="#00A86B" fill-opacity="0.15" rx="4" />

    <!-- ==================== 底部信息 ==================== -->
    <rect x="0" y="998" width="1920" height="82" fill="#F5F7FA" />
    <rect x="0" y="998" width="1920" height="4" fill="#0066B3" />

    <text x="960" y="1050" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="21">
        {{COPYRIGHT}}
    </text>
    <text x="1830" y="1050" text-anchor="end" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="21">
        {{PAGE_NUM}}
    </text>
</svg>
