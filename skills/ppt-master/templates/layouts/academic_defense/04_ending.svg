<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  
  <!-- ==================== 顶部装饰区域 ==================== -->
  <rect x="0" y="0" width="1920" height="150" fill="#003366"/>
  <rect x="0" y="0" width="9" height="150" fill="#CC0000"/>
  
  <!-- 右上角 Logo -->
  <text x="1800" y="87" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="bold">
    {{LOGO}}
  </text>
  
  <!-- ==================== 主内容区域 ==================== -->
  <!-- 感谢语 -->
  <text x="960" y="450" text-anchor="middle" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="84" font-weight="bold">
    {{THANK_YOU}}
  </text>
  
  <!-- 副标语 -->
  <text x="960" y="548" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36">
    {{ENDING_SUBTITLE}}
  </text>
  
  <!-- 装饰分割线 -->
  <line x1="690" y1="608" x2="1230" y2="608" stroke="#0066CC" stroke-width="3"/>
  <circle cx="960" cy="608" r="8" fill="#CC0000"/>
  
  <!-- ==================== 联系信息区域 ==================== -->
  <rect x="540" y="668" width="840" height="195" fill="#F5F7FA" rx="12"/>
  
  <!-- 联系方式 -->
  <text x="960" y="735" text-anchor="middle" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27">
    {{CONTACT_INFO}}
  </text>
  <text x="960" y="788" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24">
    {{EMAIL}}
  </text>
  <text x="960" y="832" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24">
    {{INSTITUTION}}
  </text>
  
  <!-- ==================== 底部信息 ==================== -->
  <rect x="0" y="998" width="1920" height="82" fill="#F5F7FA"/>
  <text x="960" y="1047" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">
    {{COPYRIGHT}}
  </text>
  <text x="1830" y="1047" text-anchor="end" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">
    {{PAGE_NUM}}
  </text>
</svg>
