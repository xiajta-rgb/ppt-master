<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 目录页 - 顶级咨询风格 (Exhibit Style) -->
  
    <!-- 深色背景 -->
    <rect x="0" y="0" width="1920" height="1080" fill="#0D1117"/>
  
    <!-- 顶部渐变条 -->
    <defs>
        <linearGradient id="top-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#1E40AF"/>
            <stop offset="100%" style="stop-color:#7C3AED"/>
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="1920" height="9" fill="url(#top-gradient)"/>
  
    <!-- Exhibit 标题条 -->
    <rect x="60" y="45" width="1800" height="90" fill="#1F2937"/>
    <rect x="60" y="45" width="9" height="90" fill="#D4AF37"/>
    <text x="105" y="105" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" letter-spacing="3">AGENDA</text>
    <text x="330" y="105" font-family="Arial, sans-serif" font-size="24" fill="#9CA3AF">汇报提纲</text>
  
    <!-- 目录网格 - 2x2 布局 -->
    <!-- 目录项 01 -->
    <g>
        <rect x="90" y="180" width="840" height="195" fill="#1F2937" rx="12"/>
        <text x="150" y="262" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#1E40AF" fill-opacity="0.3">01</text>
        <text x="270" y="255" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" letter-spacing="2">{{TOC_ITEM_1_TITLE}}</text>
        <text x="270" y="300" font-family="Arial, sans-serif" font-size="21" fill="#9CA3AF">{{TOC_ITEM_1_DESC}}</text>
        <line x1="270" y1="330" x2="840" y2="330" stroke="#374151" stroke-width="2"/>
    </g>
  
    <!-- 目录项 02 -->
    <g>
        <rect x="990" y="180" width="840" height="195" fill="#1F2937" rx="12"/>
        <text x="1050" y="262" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#7C3AED" fill-opacity="0.3">02</text>
        <text x="1170" y="255" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" letter-spacing="2">{{TOC_ITEM_2_TITLE}}</text>
        <text x="1170" y="300" font-family="Arial, sans-serif" font-size="21" fill="#9CA3AF">{{TOC_ITEM_2_DESC}}</text>
        <line x1="1170" y1="330" x2="1740" y2="330" stroke="#374151" stroke-width="2"/>
    </g>
  
    <!-- 目录项 03 -->
    <g>
        <rect x="90" y="405" width="840" height="195" fill="#1F2937" rx="12"/>
        <text x="150" y="488" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#1E40AF" fill-opacity="0.3">03</text>
        <text x="270" y="480" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" letter-spacing="2">{{TOC_ITEM_3_TITLE}}</text>
        <text x="270" y="525" font-family="Arial, sans-serif" font-size="21" fill="#9CA3AF">{{TOC_ITEM_3_DESC}}</text>
        <line x1="270" y1="555" x2="840" y2="555" stroke="#374151" stroke-width="2"/>
    </g>
  
    <!-- 目录项 04 -->
    <g>
        <rect x="990" y="405" width="840" height="195" fill="#1F2937" rx="12"/>
        <text x="1050" y="488" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#7C3AED" fill-opacity="0.3">04</text>
        <text x="1170" y="480" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" letter-spacing="2">{{TOC_ITEM_4_TITLE}}</text>
        <text x="1170" y="525" font-family="Arial, sans-serif" font-size="21" fill="#9CA3AF">{{TOC_ITEM_4_DESC}}</text>
        <line x1="1170" y1="555" x2="1740" y2="555" stroke="#374151" stroke-width="2"/>
    </g>
  
    <!-- 目录项 05 (可选) -->
    <g>
        <rect x="90" y="630" width="840" height="195" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4,4" rx="12"/>
        <text x="150" y="712" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#374151" fill-opacity="0.3">05</text>
        <text x="270" y="735" font-family="Arial, sans-serif" font-size="24" fill="#6B7280">{{TOC_ITEM_5_TITLE}}</text>
    </g>
  
    <!-- 目录项 06 (可选) -->
    <g>
        <rect x="990" y="630" width="840" height="195" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="4,4" rx="12"/>
        <text x="1050" y="712" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#374151" fill-opacity="0.3">06</text>
        <text x="1170" y="735" font-family="Arial, sans-serif" font-size="24" fill="#6B7280">{{TOC_ITEM_6_TITLE}}</text>
    </g>
  
    <!-- 底部分隔线 -->
    <line x1="90" y1="900" x2="1830" y2="900" stroke="#374151" stroke-width="2"/>
  
    <!-- 底部信息 -->
    <text x="90" y="1020" font-family="Arial, sans-serif" font-size="18" fill="#6B7280">{{DATE}}</text>
    <text x="960" y="1020" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#D4AF37">CONFIDENTIAL</text>
    <text x="1830" y="1020" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#6B7280">{{PAGE_NUM}}</text>
  
</svg>
