<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
    <!-- 模板: 章节过渡页 (Future Tech Motion) -->

    <defs>
        <radialGradient id="gradChap" cx="0%" cy="50%" r="100%" fx="0%" fy="50%">
            <stop offset="0%" style="stop-color:#002B52;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#001529;stop-opacity:1" />
        </radialGradient>
        
        <!-- 倾斜条纹填充 -->
        <pattern id="patternStripe" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="3" height="30" fill="#FFFFFF" fill-opacity="0.05"/>
        </pattern>
    </defs>

    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#gradChap)"/>
    
    <!-- 右侧装饰 - 科技条纹 -->
    <rect x="1200" y="0" width="720" height="1080" fill="url(#patternStripe)" />
    
    <!-- 巨大的背景数字 (Stroke Only) -->
    <text x="1800" y="900" text-anchor="end" font-family="Arial, sans-serif" font-size="750" font-weight="bold" 
          fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="6">
        {{CHAPTER_NUM}}
    </text>

    <!-- 中央内容容器 - 带倾斜感 -->
    <g transform="translate(150, 540)">
        
        <!-- 装饰短条 -->
        <rect x="0" y="-180" width="120" height="12" fill="#1890FF" />
        
        <!-- 章节标签 -->
        <text x="0" y="-120" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#00E5FF" letter-spacing="6">
            CHAPTER {{CHAPTER_NUM}}
        </text>

        <!-- 标题 -->
        <text x="0" y="0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="90" font-weight="bold" fill="#FFFFFF">
            {{CHAPTER_TITLE}}
        </text>
        
        <!-- 英文副标题 -->
        <text x="0" y="90" font-family="Roboto, Arial, sans-serif" font-size="42" fill="#A0AEC0">
            {{CHAPTER_SUBTITLE}}
        </text>

        <!-- 装饰线 -->
        <line x1="0" y1="150" x2="900" y2="150" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3" />
        <circle cx="900" cy="150" r="6" fill="#00E5FF" />
    </g>

</svg>
