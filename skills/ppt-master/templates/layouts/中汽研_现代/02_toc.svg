<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
    <!-- 模板: 目录页 (Future Tech Timeline Style) -->

    <defs>
        <linearGradient id="gradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#001529;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#002140;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="gradNeon" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1890FF;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00E5FF;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 背景分割: 左 1/3 深蓝, 右 2/3 极浅灰 -->
    <rect x="0" y="0" width="675" height="1080" fill="url(#gradLeft)" />
    <rect x="675" y="0" width="1245" height="1080" fill="#F7F9FC" />

    <!-- 左侧内容 -->
    <g transform="translate(90, 0)">
        <!-- Logo -->
        <image href="../images/{{LOGO_LARGE}}" x="0" y="90" width="300" height="120" preserveAspectRatio="xMidYMid meet"/>
        
        <!-- 大标题 -->
        <text x="0" y="360" font-family="Arial, sans-serif" font-size="180" font-weight="bold" fill="#FFFFFF" opacity="0.1">02</text>
        <text x="15" y="450" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">目录</text>
        <text x="18" y="525" font-family="Arial, sans-serif" font-size="36" fill="#00E5FF" letter-spacing="6">CONTENTS</text>
        
        <!-- 装饰线 -->
        <line x1="18" y1="570" x2="168" y2="570" stroke="#1890FF" stroke-width="6" />
        
        <!-- 底部标语 -->
         <text x="18" y="975" font-family="Arial" font-size="21" fill="#FFFFFF" opacity="0.4">
            CATARC TECHNOLOGY PRESENTATION
        </text>
    </g>

    <!-- 右侧内容 (Timeline Style) -->
    <!-- 垂直轴线 -->
    <line x1="840" y1="150" x2="840" y2="930" stroke="#E5E7EB" stroke-width="3" />

    <g transform="translate(840, 210)">
        
        <!-- Chapter 1 -->
        <g transform="translate(0, 0)">
            <!-- 节点 -->
            <circle cx="0" cy="30" r="12" fill="#FFFFFF" stroke="#1890FF" stroke-width="4" />
            <!-- 内容 -->
            <text x="60" y="22" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1890FF">01</text>
            <text x="135" y="22" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#1F2937">{{TOC_ITEM_1_TITLE}}</text>
            <text x="135" y="68" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#6B7280">{{TOC_ITEM_1_DESC}}</text>
        </g>

        <!-- Chapter 2 -->
        <g transform="translate(0, 165)">
             <circle cx="0" cy="30" r="12" fill="#FFFFFF" stroke="#1890FF" stroke-width="4" />
            <text x="60" y="22" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1890FF">02</text>
            <text x="135" y="22" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#1F2937">{{TOC_ITEM_2_TITLE}}</text>
            <text x="135" y="68" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#6B7280">{{TOC_ITEM_2_DESC}}</text>
        </g>

        <!-- Chapter 3 -->
        <g transform="translate(0, 330)">
             <circle cx="0" cy="30" r="12" fill="#FFFFFF" stroke="#1890FF" stroke-width="4" />
            <text x="60" y="22" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1890FF">03</text>
            <text x="135" y="22" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#1F2937">{{TOC_ITEM_3_TITLE}}</text>
            <text x="135" y="68" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#6B7280">{{TOC_ITEM_3_DESC}}</text>
        </g>

        <!-- Chapter 4 -->
        <g transform="translate(0, 495)">
             <circle cx="0" cy="30" r="12" fill="#FFFFFF" stroke="#1890FF" stroke-width="4" />
            <text x="60" y="22" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1890FF">04</text>
            <text x="135" y="22" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#1F2937">{{TOC_ITEM_4_TITLE}}</text>
            <text x="135" y="68" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#6B7280">{{TOC_ITEM_4_DESC}}</text>
        </g>
        
        <!-- Chapter 5 -->
        <g transform="translate(0, 660)">
             <circle cx="0" cy="30" r="12" fill="#FFFFFF" stroke="#1890FF" stroke-width="4" />
            <text x="60" y="22" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1890FF">05</text>
            <text x="135" y="22" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#1F2937">{{TOC_ITEM_5_TITLE}}</text>
            <text x="135" y="68" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#6B7280">{{TOC_ITEM_5_DESC}}</text>
        </g>
    </g>
    
    <!-- 右下角页码 -->
    <text x="1800" y="1020" text-anchor="end" font-family="Arial" font-size="21" fill="#9CA3AF">02</text>

</svg>
