<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 内容页 - 中国电建现代风 (POWERCHINA Modern) -->

    <defs>
        <!-- 标签背景渐变 -->
        <linearGradient id="tagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#00418D;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#003270;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 背景: 工程白 -->
    <rect width="1920" height="1080" fill="#F8F9FA"/>
    
    <!-- 装饰网格 (Subtle Grid) -->
    <defs>
        <pattern id="lightGrid" x="0" y="0" width="150" height="150" patternUnits="userSpaceOnUse">
            <line x1="150" y1="0" x2="150" y2="150" stroke="#000000" stroke-opacity="0.03" stroke-width="2"/>
            <line x1="0" y1="150" x2="150" y2="150" stroke="#000000" stroke-opacity="0.03" stroke-width="2"/>
        </pattern>
    </defs>
    <rect width="1920" height="1080" fill="url(#lightGrid)"/>

    <!-- 顶部导航栏 (Console Style) -->
    <rect width="1920" height="90" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="2"/>
    <rect width="1920" height="6" fill="#00418D"/>

    <!-- 章节标签 (Tag) -->
    <path d="M60,0 L240,0 L210,75 L60,75 Z" fill="url(#tagGrad)"/>
    <text x="150" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">
        0{{CHAPTER_NUM}}
    </text>

    <!-- 页面标题 -->
    <text x="270" y="57" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="42" font-weight="bold" fill="#1A202C">
        {{PAGE_TITLE}}
    </text>

    <!-- 装饰分隔符 -->
    <rect x="240" y="22" width="3" height="45" fill="#C41E3A"/>

    <!-- Logo (右上角) -->
    <rect x="1650" y="15" width="240" height="60" fill="#F1F3F5" rx="6"/>
    <text x="1770" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#495057">
        POWERCHINA
    </text>

    <!-- 内容区域框架 (Frame) -->
    <rect x="60" y="120" width="1800" height="870" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="2" rx="6"/>
    
    <!-- 瞄准框装饰 (Corner Marks) -->
    <path d="M60,150 L60,120 L90,120" fill="none" stroke="#00418D" stroke-width="4"/>
    <path d="M1860,150 L1860,120 L1830,120" fill="none" stroke="#00418D" stroke-width="4"/>
    <path d="M60,960 L60,990 L90,990" fill="none" stroke="#00418D" stroke-width="4"/>
    <path d="M1860,960 L1860,990 L1830,990" fill="none" stroke="#00418D" stroke-width="4"/>

    <!-- 内容区文字 -->
    <text x="960" y="540" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#CED4DA">
        {{CONTENT_AREA}}
    </text>

    <!-- 底部状态栏 -->
    <rect x="0" y="1020" width="1920" height="60" fill="#F8F9FA"/>
    <rect x="0" y="1020" width="450" height="6" fill="#0066CC"/>
    
    <!-- 页码 -->
    <text x="1860" y="1058" text-anchor="end" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#495057">
        {{PAGE_NUM}}
    </text>

    <!-- 来源 -->
    <text x="60" y="1058" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#ADB5BD">
        来源：{{SOURCE}}
    </text>

</svg>
