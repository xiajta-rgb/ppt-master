<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
    <!-- 模板: 封面页 - 中国电建现代风 (POWERCHINA Modern) -->
    
    <defs>
        <!-- 主背景渐变: 深海蓝 -> 科技蓝 -->
        <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#001F45;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#003270;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00418D;stop-opacity:1" />
        </linearGradient>
        
        <!-- 装饰渐变: 亮蓝 -> 透明 -->
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00418D;stop-opacity:0" />
        </linearGradient>

        <!-- 地球经纬网格 (Global Grid) -->
        <pattern id="grid" x="0" y="0" width="150" height="75" patternUnits="userSpaceOnUse">
            <path d="M 150 0 L 0 0 0 75" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
        </pattern>
    </defs>

    <!-- 背景层 -->
    <rect width="1920" height="1080" fill="url(#mainGrad)"/>
    <rect width="1920" height="1080" fill="url(#grid)"/>

    <!-- 底部基石 (Foundation Block) -->
    <!-- 象征大坝地基或坚实基础 -->
    <path d="M0,870 L1920,750 L1920,1080 L0,1080 Z" fill="#001533" fill-opacity="0.6"/>
    <rect x="0" y="1020" width="1920" height="60" fill="#000F24"/>

    <!-- 装饰线条 (Construction Lines) -->
    <!-- 对角线切角，体现切割感 -->
    <path d="M0,0 L600,0 L450,1080 L0,1080 Z" fill="#FFFFFF" fill-opacity="0.02"/>
    <line x1="450" y1="0" x2="450" y2="1080" stroke="#FFFFFF" stroke-opacity="0.05" stroke-dasharray="10,5"/>

    <!-- 顶部 Logo 区域 (右上角) -->
    <rect x="1500" y="0" width="420" height="120" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="1710" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF" letter-spacing="3">
        POWERCHINA
    </text>

    <!-- 装饰红条 (点睛) -->
    <rect x="1500" y="0" width="12" height="120" fill="#C41E3A"/>

    <!-- 主标题区域 (居中偏左) -->
    <g transform="translate(150, 390)">
        
        <!-- 巨大装饰年份或序号 -->
        <text x="-30" y="-90" font-family="Arial, sans-serif" font-size="270" font-weight="bold" fill="#FFFFFF" fill-opacity="0.03">
            2026
        </text>

        <!-- 主标题 -->
        <text x="0" y="0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="96" font-weight="bold" fill="#FFFFFF" letter-spacing="3">
            {{TITLE}}
        </text>
        
        <!-- 下划线装饰 -->
        <rect x="0" y="38" width="180" height="12" fill="#0066CC"/>
        <rect x="180" y="38" width="1200" height="3" fill="#FFFFFF" fill-opacity="0.3"/>

        <!-- 副标题 -->
        <text x="0" y="120" font-family="Microsoft YaHei, Arial, sans-serif" font-size="48" fill="#B0C4DE" font-weight="normal">
            {{SUBTITLE}}
        </text>

        <!-- 汇报信息组 -->
        <g transform="translate(0, 240)">
            <!-- 左侧竖线 -->
            <rect x="0" y="0" width="6" height="120" fill="#C41E3A"/>
            
            <text x="30" y="45" font-family="Microsoft YaHei, sans-serif" font-size="36" fill="#FFFFFF">
                {{AUTHOR}}
            </text>
            <text x="30" y="105" font-family="Microsoft YaHei, sans-serif" font-size="30" fill="#FFFFFF" fill-opacity="0.7">
                汇报人：{{PRESENTER}} | {{DATE}}
            </text>
        </g>

    </g>

    <!-- 底部公司全称 -->
    <text x="960" y="1062" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#FFFFFF" fill-opacity="0.4" letter-spacing="2">
        中国电力建设集团有限公司 · POWERCHINA CONSTRUCTION CORPORATION
    </text>

</svg>
