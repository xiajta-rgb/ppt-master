<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
    <!-- 模板: 章节页 - 中国电建现代风 (POWERCHINA Modern) -->

    <defs>
        <!-- 背景渐变: 深海蓝 -> 科技蓝 -->
        <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#001F45;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#003270;stop-opacity:1" />
        </linearGradient>

        <!-- 透视网格 -->
        <pattern id="grid" x="0" y="0" width="150" height="75" patternUnits="userSpaceOnUse">
             <path d="M 0 0 L 150 0 L 150 75" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
        </pattern>
    </defs>

    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#mainGrad)"/>
    <rect width="1200" height="1080" fill="url(#grid)" x="720"/>

    <!-- 装饰元素: 巨型文字作为背景 -->
    <text x="-75" y="900" font-family="Arial, sans-serif" font-size="600" font-weight="bold" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="6">
        0{{CHAPTER_NUM}}
    </text>

    <!-- 左侧红条装饰 (Brand Line) -->
    <rect x="0" y="150" width="30" height="780" fill="#C41E3A"/>

    <!-- 中央内容容器 -->
    <g transform="translate(150, 300)">
        
        <!-- 章节数字 -->
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="300" font-weight="bold" fill="#FFFFFF">
            {{CHAPTER_NUM}}
        </text>
        
        <!-- 装饰小字 -->
        <text x="0" y="-60" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#0066CC" letter-spacing="6">
            CHAPTER NO.
        </text>

        <!-- 标题区域 -->
        <line x1="390" y1="-120" x2="390" y2="60" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>

        <g transform="translate(450, -120)">
             <text x="0" y="60" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="96" font-weight="bold" fill="#FFFFFF" letter-spacing="3">
                {{CHAPTER_TITLE}}
            </text>
            <text x="0" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="48" fill="#B0C4DE" letter-spacing="2">
                {{CHAPTER_SUBTITLE}}
            </text>
        </g>
        
    </g>

    <!-- 底部装饰线 -->
    <line x1="0" y1="960" x2="1920" y2="960" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="10,5"/>
    <text x="1800" y="1005" text-anchor="end" font-family="Arial, sans-serif" font-size="21" fill="#6C757D">POWERCHINA ENGINEERING</text>

</svg>
