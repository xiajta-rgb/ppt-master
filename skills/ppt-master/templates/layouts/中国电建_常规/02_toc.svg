<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 目录页 - 中国电建经典风格 -->

    <defs>
        <!-- 顶部装饰渐变 -->
        <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00418D;stop-opacity:1" />
        </linearGradient>
        <!-- 左侧装饰渐变 -->
        <linearGradient id="sideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00418D;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 白色背景 -->
    <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 顶部渐变装饰线 -->
    <rect x="0" y="0" width="1920" height="9" fill="url(#topGrad)"/>

    <!-- 左侧装饰区域 -->
    <rect x="0" y="0" width="420" height="1080" fill="#00418D" fill-opacity="0.03"/>
    <rect x="0" y="0" width="12" height="1080" fill="url(#sideGrad)"/>
    <rect x="24" y="150" width="4" height="780" fill="#4A90D9" fill-opacity="0.5"/>

    <!-- 页面标题 -->
    <text x="90" y="120" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="54" font-weight="bold" fill="#00418D">
        目 录
    </text>
    <text x="90" y="165" font-family="Arial, sans-serif" font-size="24" fill="#4A90D9" letter-spacing="4">
        CONTENTS
    </text>

    <!-- 装饰分隔线 -->
    <line x1="90" y1="195" x2="270" y2="195" stroke="#00418D" stroke-width="4"/>
    <line x1="270" y1="195" x2="330" y2="195" stroke="#C41E3A" stroke-width="3"/>

    <!-- 目录项 1 -->
    <g>
        <text x="480" y="300" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#00418D">01</text>
        <rect x="585" y="262" width="4" height="60" fill="#00418D"/>
        <text x="615" y="292" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_1_TITLE}}</text>
        <text x="615" y="330" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#718096">{{TOC_ITEM_1_DESC}}</text>
        <line x1="615" y1="352" x2="1200" y2="352" stroke="#E4E7EB" stroke-width="2"/>
    </g>

    <!-- 目录项 2 -->
    <g>
        <text x="480" y="450" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#00418D">02</text>
        <rect x="585" y="412" width="4" height="60" fill="#00418D"/>
        <text x="615" y="442" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_2_TITLE}}</text>
        <text x="615" y="480" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#718096">{{TOC_ITEM_2_DESC}}</text>
        <line x1="615" y1="502" x2="1200" y2="502" stroke="#E4E7EB" stroke-width="2"/>
    </g>

    <!-- 目录项 3 -->
    <g>
        <text x="480" y="600" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#00418D">03</text>
        <rect x="585" y="562" width="4" height="60" fill="#00418D"/>
        <text x="615" y="592" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_3_TITLE}}</text>
        <text x="615" y="630" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#718096">{{TOC_ITEM_3_DESC}}</text>
        <line x1="615" y1="652" x2="1200" y2="652" stroke="#E4E7EB" stroke-width="2"/>
    </g>

    <!-- 目录项 4 -->
    <g>
        <text x="480" y="750" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#00418D">04</text>
        <rect x="585" y="712" width="4" height="60" fill="#00418D"/>
        <text x="615" y="742" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_4_TITLE}}</text>
        <text x="615" y="780" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#718096">{{TOC_ITEM_4_DESC}}</text>
        <line x1="615" y1="802" x2="1200" y2="802" stroke="#E4E7EB" stroke-width="2"/>
    </g>

    <!-- 目录项 5 -->
    <g>
        <text x="480" y="900" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#00418D">05</text>
        <rect x="585" y="862" width="4" height="60" fill="#00418D"/>
        <text x="615" y="892" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_5_TITLE}}</text>
        <text x="615" y="930" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#718096">{{TOC_ITEM_5_DESC}}</text>
    </g>

    <!-- 右侧数据展示区 -->
    <rect x="1320" y="240" width="510" height="690" fill="#F4F6F8" rx="12"/>
    <rect x="1320" y="240" width="9" height="690" fill="#00418D"/>
    
    <!-- 企业数据 -->
    <text x="1575" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="108" font-weight="bold" fill="#00418D" fill-opacity="0.15">{{STAT_1}}</text>
    <text x="1575" y="450" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#4A5568">{{STAT_1_LABEL}}</text>
    
    <line x1="1380" y1="510" x2="1770" y2="510" stroke="#E4E7EB" stroke-width="2"/>
    
    <text x="1575" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="108" font-weight="bold" fill="#C41E3A" fill-opacity="0.15">{{STAT_2}}</text>
    <text x="1575" y="690" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#4A5568">{{STAT_2_LABEL}}</text>
    
    <line x1="1380" y1="750" x2="1770" y2="750" stroke="#E4E7EB" stroke-width="2"/>
    
    <text x="1575" y="855" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#00418D" fill-opacity="0.12">{{STAT_3}}</text>
    <text x="1575" y="900" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#4A5568">{{STAT_3_LABEL}}</text>

    <!-- 底部装饰线 -->
    <rect x="0" y="1074" width="1920" height="6" fill="#00418D"/>

    <!-- 页码 -->
    <text x="960" y="1042" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#718096">{{PAGE_NUM}}</text>

    <!-- 企业标识 -->
    <text x="1830" y="1042" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#718096">POWERCHINA</text>

</svg>
