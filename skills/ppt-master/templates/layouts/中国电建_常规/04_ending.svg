<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
    <!-- 模板: 结束页 - 中国电建经典风格 -->

    <defs>
        <!-- 深蓝背景渐变 -->
        <linearGradient id="endBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00418D;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#003270;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#001F45;stop-opacity:1" />
        </linearGradient>
        <!-- 顶部装饰渐变 -->
        <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00418D;stop-opacity:1" />
        </linearGradient>
        <!-- 斜线图案 -->
        <pattern id="diagLines" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="90" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.02"/>
        </pattern>
    </defs>

    <!-- 背景 -->
    <rect x="0" y="0" width="1920" height="1080" fill="url(#endBgGrad)" />

    <!-- 工程感斜线纹理 -->
    <rect x="0" y="0" width="1920" height="1080" fill="url(#diagLines)" />

    <!-- 装饰元素 - 几何图案 -->
    <circle cx="150" cy="180" r="300" fill="#FFFFFF" fill-opacity="0.02" />
    <circle cx="1770" cy="900" r="375" fill="#FFFFFF" fill-opacity="0.02" />
    <circle cx="960" cy="540" r="525" fill="#4A90D9" fill-opacity="0.02" />

    <!-- 顶部渐变装饰线 -->
    <rect x="0" y="0" width="1920" height="9" fill="url(#topGrad)" />

    <!-- 网格装饰 -->
    <line x1="0" y1="270" x2="1920" y2="270" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="0" y1="810" x2="1920" y2="810" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="480" y1="0" x2="480" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="960" y1="0" x2="960" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03" />

    <!-- 左侧装饰竖条 -->
    <rect x="150" y="330" width="12" height="420" fill="#4A90D9" fill-opacity="0.6" />
    <rect x="171" y="360" width="4" height="360" fill="#C41E3A" fill-opacity="0.5" />

    <!-- 企业Logo区域占位 -->
    <rect x="735" y="210" width="450" height="120" fill="#FFFFFF" fill-opacity="0.1" rx="6"/>
    <text x="960" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF" letter-spacing="9">
        POWERCHINA
    </text>

    <!-- 感谢语（中文） -->
    <text x="960" y="480" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="96" font-weight="bold" fill="#FFFFFF" letter-spacing="12">
        {{THANK_YOU}}
    </text>

    <!-- 感谢语（英文） -->
    <text x="960" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" fill="#4A90D9" letter-spacing="9">
        {{THANK_YOU_EN}}
    </text>

    <!-- 分隔线 -->
    <line x1="735" y1="630" x2="870" y2="630" stroke="#4A90D9" stroke-width="3"/>
    <rect x="885" y="622" width="150" height="15" fill="#C41E3A"/>
    <line x1="1050" y1="630" x2="1185" y2="630" stroke="#4A90D9" stroke-width="3"/>

    <!-- 欢迎指正 -->
    <text x="960" y="720" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="39" fill="#FFFFFF" fill-opacity="0.9">
        欢迎批评指正
    </text>

    <!-- 单位信息 -->
    <text x="960" y="810" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#FFFFFF" fill-opacity="0.7">
        {{AUTHOR}}
    </text>

    <!-- 联系信息 -->
    <text x="960" y="870" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#4A90D9" fill-opacity="0.8">
        {{CONTACT_INFO}}
    </text>

    <!-- 底部装饰区域 -->
    <rect x="0" y="1020" width="1920" height="60" fill="#001F45" fill-opacity="0.6" />
    <rect x="0" y="1020" width="300" height="60" fill="#C41E3A" fill-opacity="0.8" />
    <text x="960" y="1060" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#FFFFFF" fill-opacity="0.7">
        中国电力建设集团有限公司
    </text>

</svg>
