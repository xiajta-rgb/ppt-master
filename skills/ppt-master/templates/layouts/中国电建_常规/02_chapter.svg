<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
    <!-- 模板: 章节页 - 中国电建经典风格 -->

    <defs>
        <!-- 深蓝背景渐变 -->
        <linearGradient id="gradChapter" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00418D;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#003270;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#001F45;stop-opacity:1" />
        </linearGradient>
        <!-- 顶部装饰渐变 -->
        <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00418D;stop-opacity:1" />
        </linearGradient>
        <!-- 斜线图案 -->
        <pattern id="diagLines" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="90" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.02"/>
        </pattern>
    </defs>

    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#gradChapter)"/>

    <!-- 工程感斜线纹理 -->
    <rect width="1920" height="1080" fill="url(#diagLines)"/>

    <!-- 装饰元素 - 几何图案 -->
    <circle cx="1800" cy="150" r="450" fill="#FFFFFF" fill-opacity="0.02"/>
    <circle cx="150" cy="930" r="375" fill="#FFFFFF" fill-opacity="0.02"/>
    <circle cx="1650" cy="225" r="225" fill="#4A90D9" fill-opacity="0.03"/>

    <!-- 顶部渐变装饰线 -->
    <rect x="0" y="0" width="1920" height="9" fill="url(#topGrad)"/>

    <!-- 网格装饰线 -->
    <line x1="0" y1="360" x2="1920" y2="360" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.04"/>
    <line x1="0" y1="720" x2="1920" y2="720" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.04"/>
    <line x1="639" y1="0" x2="639" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.04"/>
    <line x1="1281" y1="0" x2="1281" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.04"/>

    <!-- 左侧装饰竖条 -->
    <rect x="120" y="390" width="12" height="300" fill="#4A90D9"/>
    <rect x="141" y="420" width="4" height="240" fill="#C41E3A" fill-opacity="0.8"/>

    <!-- 章节内容 -->
    <g transform="translate(960, 540)">
        <!-- 章节编号 - 大号半透明背景 -->
        <text x="0" y="-75" text-anchor="middle" font-family="Arial" font-size="300" font-weight="bold" fill="#FFFFFF" fill-opacity="0.04">
            0{{CHAPTER_NUM}}
        </text>
        
        <!-- 章节编号描边效果 -->
        <text x="0" y="-75" text-anchor="middle" font-family="Arial" font-size="300" font-weight="bold" fill="none" stroke="#4A90D9" stroke-width="2" stroke-opacity="0.15">
            0{{CHAPTER_NUM}}
        </text>
        
        <!-- 装饰方块组 -->
        <rect x="-120" y="15" width="240" height="9" fill="#4A90D9"/>
        <rect x="-90" y="33" width="180" height="4" fill="#C41E3A" fill-opacity="0.8"/>
        
        <!-- 章节标题 -->
        <text x="0" y="120" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">
            {{CHAPTER_TITLE}}
        </text>
        
        <!-- 英文标题/副标题 -->
        <text x="0" y="195" text-anchor="middle" font-family="Arial" font-size="33" fill="#4A90D9" letter-spacing="6">
            {{CHAPTER_SUBTITLE}}
        </text>
    </g>

    <!-- 底部装饰 -->
    <rect x="0" y="1020" width="1920" height="60" fill="#001F45" fill-opacity="0.6"/>
    <rect x="0" y="1020" width="300" height="60" fill="#C41E3A" fill-opacity="0.8"/>
    <text x="960" y="1060" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" fill="#FFFFFF" fill-opacity="0.7">
        POWERCHINA · 中国电力建设集团有限公司
    </text>

</svg>
