<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 模板: 章节页 - 像素复古风格 -->
  
  <defs>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- 深空黑背景 -->
  <rect width="1920" height="1080" fill="#0D1117" />
  
  <!-- 背景扫描线（低透明度） -->
  <line x1="0" y1="150" x2="1920" y2="150" stroke="#39FF14" stroke-width="2" stroke-opacity="0.05" />
  <line x1="0" y1="300" x2="1920" y2="300" stroke="#39FF14" stroke-width="2" stroke-opacity="0.05" />
  <line x1="0" y1="450" x2="1920" y2="450" stroke="#39FF14" stroke-width="2" stroke-opacity="0.05" />
  <line x1="0" y1="600" x2="1920" y2="600" stroke="#39FF14" stroke-width="2" stroke-opacity="0.05" />
  <line x1="0" y1="750" x2="1920" y2="750" stroke="#39FF14" stroke-width="2" stroke-opacity="0.05" />
  <line x1="0" y1="900" x2="1920" y2="900" stroke="#39FF14" stroke-width="2" stroke-opacity="0.05" />
  
  <!-- 顶部装饰线（粗） -->
  <rect x="0" y="0" width="1920" height="12" fill="#39FF14" fill-opacity="0.8" />
  <rect x="0" y="12" width="1920" height="6" fill="#39FF14" fill-opacity="0.4" />
  
  <!-- 左侧装饰竖线 -->
  <rect x="90" y="150" width="6" height="780" fill="#39FF14" fill-opacity="0.3" />
  <rect x="120" y="225" width="3" height="630" fill="#00D4FF" fill-opacity="0.2" />
  
  <!-- 大号章节编号区域 -->
  <g transform="translate(225, 300)">
    <!-- 编号背景框 -->
    <rect x="0" y="0" width="300" height="300" fill="#161B22" stroke="#39FF14" stroke-width="6" />
    <!-- 像素角装饰 -->
    <rect x="-12" y="-12" width="36" height="12" fill="#39FF14" />
    <rect x="-12" y="-12" width="12" height="36" fill="#39FF14" />
    <rect x="276" y="-12" width="36" height="12" fill="#39FF14" />
    <rect x="300" y="-12" width="12" height="36" fill="#39FF14" />
    <rect x="-12" y="300" width="36" height="12" fill="#39FF14" />
    <rect x="-12" y="276" width="12" height="36" fill="#39FF14" />
    <rect x="276" y="300" width="36" height="12" fill="#39FF14" />
    <rect x="300" y="276" width="12" height="36" fill="#39FF14" />
    <!-- 章节编号 -->
    <text x="150" y="210" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="144" font-weight="bold" fill="#39FF14" filter="url(#glowGreen)">
      {{CHAPTER_NUM}}
    </text>
  </g>
  
  <!-- 章节标题区域 -->
  <g transform="translate(630, 360)">
    <!-- 标题标签 -->
    <rect x="0" y="0" width="180" height="45" fill="#39FF14" />
    <text x="90" y="33" text-anchor="middle" font-family="Consolas, monospace" font-size="21" font-weight="bold" fill="#0D1117">CHAPTER</text>
    
    <!-- 主标题 -->
    <text x="0" y="135" font-family="Consolas, Monaco, monospace" font-size="72" font-weight="bold" fill="#FFFFFF">
      {{CHAPTER_TITLE}}
    </text>
    
    <!-- 英文副标题 -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" fill="#8B949E">
      {{CHAPTER_TITLE_EN}}
    </text>
    
    <!-- 装饰线 -->
    <rect x="0" y="240" width="600" height="4" fill="#00D4FF" fill-opacity="0.6" />
  </g>
  
  <!-- 右侧装饰元素 -->
  <g transform="translate(1500, 225)">
    <!-- 像素方块矩阵 -->
    <rect x="0" y="0" width="30" height="30" fill="#39FF14" fill-opacity="0.8" />
    <rect x="38" y="0" width="30" height="30" fill="#39FF14" fill-opacity="0.5" />
    <rect x="75" y="0" width="30" height="30" fill="#39FF14" fill-opacity="0.3" />
    <rect x="0" y="38" width="30" height="30" fill="#39FF14" fill-opacity="0.5" />
    <rect x="38" y="38" width="30" height="30" fill="#39FF14" fill-opacity="0.3" />
    <rect x="0" y="75" width="30" height="30" fill="#39FF14" fill-opacity="0.3" />
    
    <!-- 粉色像素矩阵 -->
    <rect x="225" y="450" width="30" height="30" fill="#FF2E97" fill-opacity="0.3" />
    <rect x="262" y="450" width="30" height="30" fill="#FF2E97" fill-opacity="0.5" />
    <rect x="300" y="450" width="30" height="30" fill="#FF2E97" fill-opacity="0.8" />
    <rect x="262" y="488" width="30" height="30" fill="#FF2E97" fill-opacity="0.3" />
    <rect x="300" y="488" width="30" height="30" fill="#FF2E97" fill-opacity="0.5" />
    <rect x="300" y="525" width="30" height="30" fill="#FF2E97" fill-opacity="0.3" />
  </g>
  
  <!-- 底部信息栏 -->
  <g transform="translate(90, 870)">
    <!-- 进度条背景 -->
    <rect x="0" y="0" width="1740" height="60" fill="#161B22" stroke="#30363D" stroke-width="2" />
    <!-- 进度填充（示例为章节1，20%） -->
    <rect x="3" y="3" width="348" height="54" fill="#39FF14" fill-opacity="0.3" />
    <!-- 章节指示器 -->
    <circle cx="174" cy="30" r="12" fill="#39FF14" />
    <text x="174" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#0D1117" font-weight="bold">1</text>
    
    <circle cx="522" cy="30" r="12" fill="#30363D" />
    <text x="522" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#8B949E">2</text>
    
    <circle cx="870" cy="30" r="12" fill="#30363D" />
    <text x="870" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#8B949E">3</text>
    
    <circle cx="1218" cy="30" r="12" fill="#30363D" />
    <text x="1218" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#8B949E">4</text>
    
    <circle cx="1566" cy="30" r="12" fill="#30363D" />
    <text x="1566" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#8B949E">5</text>
  </g>
  
  <!-- 底部装饰线 -->
  <rect x="0" y="1068" width="1920" height="6" fill="#39FF14" fill-opacity="0.4" />
  <rect x="0" y="1074" width="1920" height="6" fill="#39FF14" fill-opacity="0.8" />
  
  <!-- 页码 -->
  <text x="90" y="1020" font-family="Consolas, monospace" font-size="21" fill="#8B949E">{{PAGE_NUM}}/{{TOTAL_PAGES}}</text>
  <text x="1830" y="1020" text-anchor="end" font-family="Consolas, monospace" font-size="21" fill="#39FF14">LOADING...</text>

</svg>
