<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 模板: 目录页 - 像素复古风格 -->
  
  <defs>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- 深空黑背景 -->
  <rect width="1920" height="1080" fill="#0D1117" />
  
  <!-- 顶部装饰线 -->
  <rect x="0" y="0" width="1920" height="6" fill="#39FF14" fill-opacity="0.8" />
  <rect x="0" y="6" width="1920" height="3" fill="#39FF14" fill-opacity="0.4" />
  
  <!-- 页面标题 -->
  <text x="90" y="105" font-family="Consolas, Monaco, monospace" font-size="54" font-weight="bold" fill="#39FF14" filter="url(#glowGreen)">
    📍 {{PAGE_TITLE}}
  </text>
  <text x="90" y="150" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="27" fill="#8B949E">
    {{PAGE_TITLE_EN}}
  </text>
  
  <!-- 分隔线 -->
  <rect x="90" y="180" width="300" height="3" fill="#30363D" />
  
  <!-- 目录区域 -->
  <g transform="translate(90, 240)">
    
    <!-- 第一章节 - 关键必学 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="840" height="120" fill="#161B22" stroke="#39FF14" stroke-width="3" />
      <!-- 重要度标签 -->
      <rect x="0" y="0" width="150" height="36" fill="#FF2E97" />
      <text x="75" y="26" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#FFFFFF" font-weight="bold">🔴 关键必学</text>
      <!-- 章节序号 -->
      <rect x="30" y="52" width="60" height="60" fill="#39FF14" />
      <text x="60" y="93" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="bold" fill="#0D1117">01</text>
      <!-- 章节标题 -->
      <text x="120" y="90" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="30" fill="#E6EDF3">{{TOC_ITEM_1_TITLE}}</text>
    </g>
    
    <!-- 第二章节 -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="840" height="120" fill="#161B22" stroke="#00D4FF" stroke-width="3" />
      <rect x="0" y="0" width="150" height="36" fill="#FF2E97" />
      <text x="75" y="26" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#FFFFFF" font-weight="bold">🔴 关键必学</text>
      <rect x="30" y="52" width="60" height="60" fill="#00D4FF" />
      <text x="60" y="93" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="bold" fill="#0D1117">02</text>
      <text x="120" y="90" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="30" fill="#E6EDF3">{{TOC_ITEM_2_TITLE}}</text>
    </g>
    
    <!-- 第三章节 - 建议了解 -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="840" height="120" fill="#161B22" stroke="#FFD700" stroke-width="3" />
      <rect x="0" y="0" width="150" height="36" fill="#FFD700" />
      <text x="75" y="26" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#0D1117" font-weight="bold">🟡 建议了解</text>
      <rect x="30" y="52" width="60" height="60" fill="#FFD700" />
      <text x="60" y="93" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="bold" fill="#0D1117">03</text>
      <text x="120" y="90" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="30" fill="#E6EDF3">{{TOC_ITEM_3_TITLE}}</text>
    </g>
    
    <!-- 第四章节 - 可选内容 -->
    <g transform="translate(0, 450)">
      <rect x="0" y="0" width="840" height="120" fill="#161B22" stroke="#8B949E" stroke-width="3" />
      <rect x="0" y="0" width="150" height="36" fill="#238636" />
      <text x="75" y="26" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#FFFFFF" font-weight="bold">🟢 可选内容</text>
      <rect x="30" y="52" width="60" height="60" fill="#238636" />
      <text x="60" y="93" text-anchor="middle" font-family="Consolas, monospace" font-size="36" font-weight="bold" fill="#FFFFFF">04</text>
      <text x="120" y="90" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="30" fill="#8B949E">{{TOC_ITEM_4_TITLE}}</text>
    </g>
    
  </g>
  
  <!-- 右侧装饰区域 -->
  <g transform="translate(1020, 240)">
    <rect x="0" y="0" width="810" height="570" fill="#161B22" stroke="#30363D" stroke-width="3" stroke-dasharray="8 4" />
    
    <!-- 进度指示 -->
    <text x="405" y="75" text-anchor="middle" font-family="Consolas, monospace" font-size="30" fill="#00D4FF">📊 学习进度</text>
    
    <!-- 进度条 -->
    <rect x="60" y="120" width="690" height="45" fill="#0D1117" stroke="#30363D" stroke-width="2" />
    <rect x="63" y="123" width="0" height="39" fill="#39FF14" fill-opacity="0.8" />
    <text x="405" y="153" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#8B949E">0% 完成</text>
    
    <!-- 统计信息 -->
    <g transform="translate(60, 210)">
      <rect x="0" y="0" width="210" height="120" fill="#0D1117" stroke="#39FF14" stroke-width="3" />
      <text x="105" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="48" font-weight="bold" fill="#39FF14">{{STAT_1}}</text>
      <text x="105" y="90" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="21" fill="#8B949E">关键内容</text>
    </g>
    <g transform="translate(240, 210)">
      <rect x="0" y="0" width="210" height="120" fill="#0D1117" stroke="#FFD700" stroke-width="3" />
      <text x="105" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="48" font-weight="bold" fill="#FFD700">{{STAT_2}}</text>
      <text x="105" y="90" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="21" fill="#8B949E">建议了解</text>
    </g>
    <g transform="translate(480, 210)">
      <rect x="0" y="0" width="210" height="120" fill="#0D1117" stroke="#238636" stroke-width="3" />
      <text x="105" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="48" font-weight="bold" fill="#238636">{{STAT_3}}</text>
      <text x="105" y="90" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="21" fill="#8B949E">可选内容</text>
    </g>
    
    <!-- 提示信息 -->
    <text x="405" y="420" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#8B949E">
      █ 点击章节开始学习
    </text>
    
    <!-- 开始按钮 -->
    <g transform="translate(255, 450)">
      <rect x="0" y="0" width="300" height="75" fill="#39FF14" />
      <text x="150" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="27" font-weight="bold" fill="#0D1117">▶ START</text>
    </g>
  </g>
  
  <!-- 底部装饰线 -->
  <rect x="0" y="1068" width="1920" height="6" fill="#39FF14" fill-opacity="0.4" />
  <rect x="0" y="1074" width="1920" height="6" fill="#39FF14" fill-opacity="0.8" />
  
  <!-- 页码 -->
  <text x="90" y="1035" font-family="Consolas, monospace" font-size="21" fill="#8B949E">02/{{TOTAL_PAGES}}</text>
  <text x="1830" y="1035" text-anchor="end" font-family="Consolas, monospace" font-size="21" fill="#8B949E">Table of Contents</text>

</svg>
