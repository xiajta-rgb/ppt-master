<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    Dumbbell Chart / Dot Plot Template
    Purpose: Multi-dimensional score comparison, index ranking
    Scenarios: Country rankings, competitor evaluation, composite index display
    Support: 8-12 categories x 3-5 dimensions
    -->
    
    <!-- Background -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- Title -->
    <text x="90" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="42" font-weight="bold" fill="#1A1A1A">
        <tspan>AI Economic Impact Index Rankings</tspan>
    </text>
    
    <text x="90" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="24" fill="#666666">
        <tspan>Potential to realize AI benefits by economy - 2025 Report</tspan>
    </text>
    
    <!-- Legend -->
    <g id="legend" transform="translate(90, 165)">
        <circle cx="12" cy="12" r="9" fill="#1A1A1A"/>
        <text x="33" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#333333">
            <tspan>Overall Score</tspan>
        </text>
        
        <circle cx="207" cy="12" r="9" fill="#E91E8C"/>
        <text x="228" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#333333">
