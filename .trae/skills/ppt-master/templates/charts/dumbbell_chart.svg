            <tspan>Diffusion</tspan>
        </text>
        
        <circle cx="522" cy="12" r="9" fill="#FFD600"/>
        <text x="543" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#333333">
            <tspan>Adaptation</tspan>
        </text>
    </g>
    
