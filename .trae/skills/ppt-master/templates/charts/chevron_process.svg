<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!--
    箭头链流程模板 (Chevron Process)
    用途: 线性阶段流程、逐步推进、方法论展示、整块阶段箭头参考
    适用场景: 销售漏斗阶段、项目阶段、方法论步骤
    支持: 5阶段横向箭头 (推荐3-6)
    复用建议:
      - 当页面需要“整块粗箭头”表达阶段推进时，优先参考此模板中的 polygon 箭头结构
      - 不要用 marker-end 模拟这类宽箭身箭头

    可复用片段 1: 五边形 chevron（阶段箭头）
      <polygon points="60,0 330,0 390,72 330,144 60,144 120,72"
               fill="#6C5CE7"/>

    可复用片段 2: 带长箭头头部的 block arrow（结论指向）
      <path d="M90,15 H450 V-54 L705,120 L450,294 V225 H90 Z"
            fill="#5D96E4" stroke="#3F76C8" stroke-width="6"/>
    -->

    <defs>
        <filter id="chevronShadow" x="-10%" y="-20%" width="120%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="3" dy="4" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 标题 -->
    <text x="960" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="45" font-weight="700" fill="#1A252F">数字化转型方法论</text>
    <text x="960" y="123" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">Chevron Process · 五阶段递进推进框架</text>

    <!-- 箭头1 (最左) -->
    <polygon points="60,330 300,330 345,398 300,465 60,465" fill="#6C5CE7" filter="url(#chevronShadow)"/>
    <text x="195" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="700" fill="#FFFFFF">诊断评估</text>
    <text x="195" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" fill="#FFFFFF" fill-opacity="0.8">PHASE 01</text>

    <!-- 箭头2 -->
    <polygon points="352,330 600,330 645,398 600,465 352,465 398,398" fill="#A29BFE" filter="url(#chevronShadow)"/>
    <text x="495" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="700" fill="#FFFFFF">规划设计</text>
    <text x="495" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" fill="#FFFFFF" fill-opacity="0.8">PHASE 02</text>

    <!-- 箭头3 -->
    <polygon points="652,330 915,330 960,398 915,465 652,465 698,398" fill="#0984E3" filter="url(#chevronShadow)"/>
    <text x="800" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="700" fill="#FFFFFF">试点验证</text>
    <text x="800" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" fill="#FFFFFF" fill-opacity="0.8">PHASE 03</text>

    <!-- 箭头4 -->
    <polygon points="968,330 1245,330 1290,398 1245,465 968,465 1012,398" fill="#00B894" filter="url(#chevronShadow)"/>
    <text x="1122" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="700" fill="#FFFFFF">规模推广</text>
    <text x="1122" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" fill="#FFFFFF" fill-opacity="0.8">PHASE 04</text>

    <!-- 箭头5 -->
    <polygon points="1298,330 1590,330 1635,398 1590,465 1298,465 1342,398" fill="#E17055" filter="url(#chevronShadow)"/>
    <text x="1460" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="700" fill="#FFFFFF">持续优化</text>
    <text x="1460" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" fill="#FFFFFF" fill-opacity="0.8">PHASE 05</text>

    <!-- 阶段时长条 -->
    <rect x="60" y="488" width="285" height="30" rx="6" fill="#6C5CE7" fill-opacity="0.15"/>
    <text x="202" y="508" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#6C5CE7">2-4周</text>
    <rect x="368" y="488" width="292" height="30" rx="6" fill="#A29BFE" fill-opacity="0.15"/>
    <text x="513" y="508" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#A29BFE">4-6周</text>
    <rect x="675" y="488" width="292" height="30" rx="6" fill="#0984E3" fill-opacity="0.15"/>
    <text x="820" y="508" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#0984E3">8-12周</text>
    <rect x="982" y="488" width="315" height="30" rx="6" fill="#00B894" fill-opacity="0.15"/>
    <text x="1140" y="508" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#00B894">12-16周</text>
    <rect x="1312" y="488" width="322" height="30" rx="6" fill="#E17055" fill-opacity="0.15"/>
    <text x="1473" y="508" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#E17055">持续</text>

    <!-- 详情卡片行 -->
    <!-- 卡片1 -->
    <g filter="url(#cardShadow)">
        <rect x="60" y="555" width="285" height="435" rx="15" fill="#FFFFFF"/>
        <rect x="60" y="555" width="285" height="8" rx="4" fill="#6C5CE7"/>
        <text x="202" y="608" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="22" font-weight="700" fill="#1A252F">诊断评估</text>
        <line x1="98" y1="630" x2="308" y2="630" stroke="#F0F0F0" stroke-width="2"/>
        <text x="90" y="668" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#5F6368">· 现状能力评估</text>
        <text x="90" y="702" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#5F6368">· 痛点问题识别</text>
        <text x="90" y="736" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#5F6368">· 成熟度测评</text>
