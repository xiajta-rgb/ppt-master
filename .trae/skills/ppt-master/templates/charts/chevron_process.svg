        <line x1="98" y1="802" x2="308" y2="802" stroke="#F0F0F0" stroke-width="2"/>
        <text x="90" y="840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#6C5CE7">交付物:</text>
        <text x="90" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#95A5A6">诊断报告</text>
        <text x="90" y="897" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#95A5A6">能力成熟度评分卡</text>
    </g>

    <!-- 卡片2 -->
    <g filter="url(#cardShadow)">
