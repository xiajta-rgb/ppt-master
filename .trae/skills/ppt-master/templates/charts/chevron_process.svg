        <text x="405" y="702" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#5F6368">· 技术选型评估</text>
        <text x="405" y="736" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#5F6368">· 路线图编制</text>
        <text x="405" y="771" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#5F6368">· 投资回报测算</text>
        <line x1="412" y1="802" x2="622" y2="802" stroke="#F0F0F0" stroke-width="2"/>
        <text x="405" y="840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#A29BFE">交付物:</text>
        <text x="405" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#95A5A6">转型蓝图</text>
        <text x="405" y="897" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#95A5A6">ROI分析报告</text>
    </g>

    <!-- 卡片3 -->
    <g filter="url(#cardShadow)">
        <rect x="690" y="555" width="285" height="435" rx="15" fill="#FFFFFF"/>
        <rect x="690" y="555" width="285" height="8" rx="4" fill="#0984E3"/>
        <text x="832" y="608" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="22" font-weight="700" fill="#1A252F">试点验证</text>
        <line x1="728" y1="630" x2="938" y2="630" stroke="#F0F0F0" stroke-width="2"/>
        <text x="720" y="668" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#5F6368">· 选定试点场景</text>
        <text x="720" y="702" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#5F6368">· MVP快速上线</text>
        <text x="720" y="736" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#5F6368">· 效果数据采集</text>
        <text x="720" y="771" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#5F6368">· 用户反馈迭代</text>
        <line x1="728" y1="802" x2="938" y2="802" stroke="#F0F0F0" stroke-width="2"/>
        <text x="720" y="840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#0984E3">交付物:</text>
        <text x="720" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#95A5A6">试点总结报告</text>
        <text x="720" y="897" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#95A5A6">推广可行性评估</text>
    </g>

    <!-- 卡片4 -->
    <g filter="url(#cardShadow)">
        <rect x="1005" y="555" width="285" height="435" rx="15" fill="#FFFFFF"/>
        <rect x="1005" y="555" width="285" height="8" rx="4" fill="#00B894"/>
        <text x="1148" y="608" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="22" font-weight="700" fill="#1A252F">规模推广</text>
        <line x1="1042" y1="630" x2="1252" y2="630" stroke="#F0F0F0" stroke-width="2"/>
        <text x="1035" y="668" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#5F6368">· 全业务线推广</text>
        <text x="1035" y="702" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#5F6368">· 组织变革配套</text>
        <text x="1035" y="736" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#5F6368">· 培训赋能计划</text>
        <text x="1035" y="771" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#5F6368">· 标准化流程建设</text>
        <line x1="1042" y1="802" x2="1252" y2="802" stroke="#F0F0F0" stroke-width="2"/>
        <text x="1035" y="840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#00B894">交付物:</text>
        <text x="1035" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#95A5A6">推广实施方案</text>
        <text x="1035" y="897" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#95A5A6">组织能力建设手册</text>
