<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    进度条图模板
    用途: 目标完成进度、多项指标对比
    适用场景: OKR进度、项目完成度、KPI达成、预算执行
    支持: 6个进度条，带目标线和状态标签
    -->
    
    <defs>
        <!-- 进度条渐变（蓝色-默认） -->
        <linearGradient id="progressBlue" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
        </linearGradient>
        
        <!-- 进度条渐变（绿色-完成/超额） -->
        <linearGradient id="progressGreen" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
        </linearGradient>
        
        <!-- 进度条渐变（橙色-进行中） -->
        <linearGradient id="progressOrange" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:1" />
        </linearGradient>
        
        <!-- 进度条渐变（红色-落后） -->
        <linearGradient id="progressRed" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#f44336;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#EF5350;stop-opacity:1" />
        </linearGradient>
        
        <!-- 进度条阴影 -->
        <filter id="progressShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>2025年Q4 OKR进度追踪</tspan>
    </text>
    
    <text x="90" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>截止日期: 2025年12月31日 · 剩余 20 天</tspan>
    </text>
    
    <!-- 总体进度概览 -->
    <g id="overallProgress" transform="translate(1350, 75)">
        <rect x="0" y="0" width="480" height="90" rx="12" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="2"/>
        <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#7F8C8D">
            <tspan>整体完成度</tspan>
        </text>
        <text x="30" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="36" font-weight="bold" fill="#2196F3">
            <tspan>73.5%</tspan>
        </text>
        <text x="165" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#7F8C8D">
            <tspan>/ 目标 100%</tspan>
        </text>
        
        <!-- 迷你进度条 -->
        <rect x="300" y="30" width="150" height="36" rx="18" fill="#E0E0E0"/>
        <rect x="300" y="30" width="110.2" height="36" rx="18" fill="url(#progressBlue)"/>
    </g>
    
    <!-- 进度条区域 -->
    <g id="progressBars">
        <!-- 
        每个进度条：
        - 总宽度: 700px (从x=360到x=1060)
        - 高度: 32px
        - 垂直间距: 85px
        -->
        
        <!-- 进度条1: 营收目标 92% (超额完成) -->
        <g transform="translate(90, 225)">
            <!-- 标签区 -->
            <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="27" font-weight="600" fill="#2C3E50">
                <tspan>营收目标</tspan>
            </text>
            <text x="0" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="21" fill="#7F8C8D">
                <tspan>目标: 5000万 | 实际: 4600万</tspan>
            </text>
            
            <!-- 背景条 -->
            <rect x="450" y="12" width="1050" height="48" rx="24" fill="#EEEEEE"/>
            
            <!-- 进度条 92% -->
            <rect x="450" y="12" width="966" height="48" rx="24" fill="url(#progressGreen)" filter="url(#progressShadow)"/>
            
            <!-- 目标线 (100% = 700px) -->
            <line x1="1500" y1="3" x2="1500" y2="69" stroke="#2C3E50" stroke-width="3" stroke-dasharray="4,2"/>
            <text x="1500" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="18" fill="#7F8C8D" text-anchor="middle"><tspan>目标</tspan></text>
            
            <!-- 百分比 -->
            <text x="1575" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="30" font-weight="bold" fill="#4CAF50">
                <tspan>92%</tspan>
            </text>
            
            <!-- 状态标签 -->
            <rect x="1665" y="12" width="105" height="48" rx="24" fill="#E8F5E9"/>
            <text x="1718" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="20" fill="#4CAF50" text-anchor="middle">
                <tspan>超前</tspan>
            </text>
        </g>
        
        <!-- 进度条2: 新客户获取 85% -->
        <g transform="translate(90, 352)">
            <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="27" font-weight="600" fill="#2C3E50">
                <tspan>新客户获取</tspan>
            </text>
            <text x="0" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="21" fill="#7F8C8D">
                <tspan>目标: 200家 | 实际: 170家</tspan>
            </text>
            
            <rect x="450" y="12" width="1050" height="48" rx="24" fill="#EEEEEE"/>
            <rect x="450" y="12" width="892" height="48" rx="24" fill="url(#progressGreen)" filter="url(#progressShadow)"/>
            
            <line x1="1500" y1="3" x2="1500" y2="69" stroke="#2C3E50" stroke-width="3" stroke-dasharray="4,2"/>
            
            <text x="1575" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="30" font-weight="bold" fill="#4CAF50">
                <tspan>85%</tspan>
            </text>
            
            <rect x="1665" y="12" width="105" height="48" rx="24" fill="#E8F5E9"/>
            <text x="1718" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="20" fill="#4CAF50" text-anchor="middle">
                <tspan>达标</tspan>
            </text>
        </g>
        
        <!-- 进度条3: 产品发布 75% -->
        <g transform="translate(90, 480)">
            <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="27" font-weight="600" fill="#2C3E50">
                <tspan>产品发布</tspan>
            </text>
            <text x="0" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="21" fill="#7F8C8D">
                <tspan>目标: 4个功能 | 实际: 3个功能</tspan>
            </text>
            
            <rect x="450" y="12" width="1050" height="48" rx="24" fill="#EEEEEE"/>
            <rect x="450" y="12" width="788" height="48" rx="24" fill="url(#progressBlue)" filter="url(#progressShadow)"/>
            
            <line x1="1500" y1="3" x2="1500" y2="69" stroke="#2C3E50" stroke-width="3" stroke-dasharray="4,2"/>
            
            <text x="1575" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="30" font-weight="bold" fill="#2196F3">
                <tspan>75%</tspan>
            </text>
            
            <rect x="1665" y="12" width="105" height="48" rx="24" fill="#E3F2FD"/>
            <text x="1718" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="20" fill="#2196F3" text-anchor="middle">
                <tspan>进行中</tspan>
            </text>
        </g>
        
        <!-- 进度条4: 团队扩张 68% -->
        <g transform="translate(90, 608)">
            <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="27" font-weight="600" fill="#2C3E50">
                <tspan>团队扩张</tspan>
            </text>
            <text x="0" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="21" fill="#7F8C8D">
                <tspan>目标: 25人 | 实际: 17人</tspan>
            </text>
            
            <rect x="450" y="12" width="1050" height="48" rx="24" fill="#EEEEEE"/>
            <rect x="450" y="12" width="714" height="48" rx="24" fill="url(#progressOrange)" filter="url(#progressShadow)"/>
            
            <line x1="1500" y1="3" x2="1500" y2="69" stroke="#2C3E50" stroke-width="3" stroke-dasharray="4,2"/>
            
            <text x="1575" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="30" font-weight="bold" fill="#FF9800">
                <tspan>68%</tspan>
            </text>
            
            <rect x="1665" y="12" width="105" height="48" rx="24" fill="#FFF3E0"/>
            <text x="1718" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="20" fill="#FF9800" text-anchor="middle">
                <tspan>滞后</tspan>
            </text>
        </g>
        
        <!-- 进度条5: 成本控制 55% -->
        <g transform="translate(90, 735)">
            <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="27" font-weight="600" fill="#2C3E50">
                <tspan>成本控制</tspan>
            </text>
            <text x="0" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="21" fill="#7F8C8D">
                <tspan>目标: 降低20% | 实际: 降低11%</tspan>
            </text>
            
            <rect x="450" y="12" width="1050" height="48" rx="24" fill="#EEEEEE"/>
            <rect x="450" y="12" width="578" height="48" rx="24" fill="url(#progressRed)" filter="url(#progressShadow)"/>
            
            <line x1="1500" y1="3" x2="1500" y2="69" stroke="#2C3E50" stroke-width="3" stroke-dasharray="4,2"/>
            
            <text x="1575" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="30" font-weight="bold" fill="#f44336">
                <tspan>55%</tspan>
            </text>
            
            <rect x="1665" y="12" width="105" height="48" rx="24" fill="#FFEBEE"/>
            <text x="1718" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="20" fill="#f44336" text-anchor="middle">
                <tspan>风险</tspan>
            </text>
        </g>
        
        <!-- 进度条6: 品牌建设 66% -->
        <g transform="translate(90, 862)">
            <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="27" font-weight="600" fill="#2C3E50">
                <tspan>品牌建设</tspan>
            </text>
            <text x="0" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="21" fill="#7F8C8D">
                <tspan>目标: 知名度+30% | 实际: +20%</tspan>
            </text>
            
            <rect x="450" y="12" width="1050" height="48" rx="24" fill="#EEEEEE"/>
            <rect x="450" y="12" width="693" height="48" rx="24" fill="url(#progressOrange)" filter="url(#progressShadow)"/>
            
            <line x1="1500" y1="3" x2="1500" y2="69" stroke="#2C3E50" stroke-width="3" stroke-dasharray="4,2"/>
            
            <text x="1575" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="30" font-weight="bold" fill="#FF9800">
                <tspan>66%</tspan>
            </text>
            
            <rect x="1665" y="12" width="105" height="48" rx="24" fill="#FFF3E0"/>
            <text x="1718" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="20" fill="#FF9800" text-anchor="middle">
                <tspan>滞后</tspan>
            </text>
        </g>
    </g>
    
    <!-- 图例 -->
    <g id="legend" transform="translate(90, 990)">
        <rect x="0" y="0" width="24" height="24" rx="6" fill="url(#progressGreen)"/>
        <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>达标/超前 (≥80%)</tspan></text>
        
        <rect x="240" y="0" width="24" height="24" rx="6" fill="url(#progressBlue)"/>
        <text x="276" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>进行中 (70-80%)</tspan></text>
        
        <rect x="480" y="0" width="24" height="24" rx="6" fill="url(#progressOrange)"/>
        <text x="516" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>滞后 (60-70%)</tspan></text>
        
        <rect x="705" y="0" width="24" height="24" rx="6" fill="url(#progressRed)"/>
        <text x="741" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>风险 (&lt;60%)</tspan></text>
    </g>
    
    <!-- 数据来源 -->
    <text x="1830" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#95A5A6" text-anchor="end">
        <tspan>数据来源: OKR管理系统</tspan>
    </text>
</svg>

