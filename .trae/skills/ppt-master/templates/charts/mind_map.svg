<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!--
    思维导图模板
    用途: 中心主题发散、知识结构、头脑风暴
    适用场景: 主题拆解、知识体系、会议纪要梳理
    支持: 1中心+4分支 (推荐3-6分支)
    -->

    <defs>
        <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#EEF1F5;stop-opacity:1"/>
        </linearGradient>
        <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#A29BFE;stop-opacity:1"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <!-- 标题 -->
    <text x="90" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="42" font-weight="700" fill="#1A252F">产品战略思维导图</text>
    <text x="90" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">Mind Map · 核心战略四大维度拆解</text>

    <!-- 连接线 (曲线) -->
    <!-- 中心→右上(产品) -->
    <path d="M 990,540 Q 1170,420 1305,315" stroke="#00B894" stroke-width="4" fill="none" stroke-opacity="0.5"/>
    <!-- 中心→右下(市场) -->
    <path d="M 990,555 Q 1185,645 1305,750" stroke="#FDCB6E" stroke-width="4" fill="none" stroke-opacity="0.5"/>
    <!-- 中心→左上(技术) -->
    <path d="M 870,525 Q 690,405 570,300" stroke="#74B9FF" stroke-width="4" fill="none" stroke-opacity="0.5"/>
    <!-- 中心→左下(运营) -->
    <path d="M 870,570 Q 675,660 555,765" stroke="#E17055" stroke-width="4" fill="none" stroke-opacity="0.5"/>

    <!-- 分支→子节点 连接线 -->
    <!-- 产品分支 -->
    <line x1="1455" y1="285" x2="1575" y2="210" stroke="#00B894" stroke-width="2.2" stroke-opacity="0.35"/>
    <line x1="1455" y1="315" x2="1575" y2="315" stroke="#00B894" stroke-width="2.2" stroke-opacity="0.35"/>
    <line x1="1455" y1="345" x2="1575" y2="420" stroke="#00B894" stroke-width="2.2" stroke-opacity="0.35"/>
    <!-- 市场分支 -->
    <line x1="1455" y1="735" x2="1575" y2="660" stroke="#FDCB6E" stroke-width="2.2" stroke-opacity="0.35"/>
    <line x1="1455" y1="765" x2="1575" y2="765" stroke="#FDCB6E" stroke-width="2.2" stroke-opacity="0.35"/>
    <line x1="1455" y1="795" x2="1575" y2="870" stroke="#FDCB6E" stroke-width="2.2" stroke-opacity="0.35"/>
    <!-- 技术分支 -->
    <line x1="420" y1="285" x2="300" y2="210" stroke="#74B9FF" stroke-width="2.2" stroke-opacity="0.35"/>
    <line x1="420" y1="315" x2="300" y2="315" stroke="#74B9FF" stroke-width="2.2" stroke-opacity="0.35"/>
    <line x1="420" y1="345" x2="300" y2="420" stroke="#74B9FF" stroke-width="2.2" stroke-opacity="0.35"/>
    <!-- 运营分支 -->
    <line x1="420" y1="750" x2="300" y2="675" stroke="#E17055" stroke-width="2.2" stroke-opacity="0.35"/>
    <line x1="420" y1="780" x2="300" y2="780" stroke="#E17055" stroke-width="2.2" stroke-opacity="0.35"/>
    <line x1="420" y1="810" x2="300" y2="885" stroke="#E17055" stroke-width="2.2" stroke-opacity="0.35"/>

    <!-- 中心节点 -->
    <circle cx="930" cy="548" r="98" fill="url(#centerGrad)" filter="url(#nodeShadow)"/>
    <text x="930" y="537" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="800" fill="#FFFFFF">产品</text>
    <text x="930" y="573" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="800" fill="#FFFFFF">战略</text>

    <!-- 分支1: 产品 (右上) -->
    <rect x="1305" y="255" width="150" height="90" rx="45" fill="#00B894" filter="url(#nodeShadow)"/>
    <text x="1380" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#FFFFFF">产品</text>
    <!-- 子节点 -->
    <rect x="1575" y="183" width="255" height="54" rx="27" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <rect x="1575" y="183" width="8" height="54" rx="4" fill="#00B894"/>
    <text x="1605" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#2C3E50">用户体验优化</text>
    <rect x="1575" y="288" width="255" height="54" rx="27" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <rect x="1575" y="288" width="8" height="54" rx="4" fill="#00B894"/>
    <text x="1605" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#2C3E50">功能迭代路线</text>
    <rect x="1575" y="393" width="255" height="54" rx="27" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <rect x="1575" y="393" width="8" height="54" rx="4" fill="#00B894"/>
    <text x="1605" y="429" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#2C3E50">质量标准体系</text>

    <!-- 分支2: 市场 (右下) -->
    <rect x="1305" y="720" width="150" height="90" rx="45" fill="#D4A537" filter="url(#nodeShadow)"/>
    <text x="1380" y="776" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#FFFFFF">市场</text>
    <rect x="1575" y="633" width="255" height="54" rx="27" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <rect x="1575" y="633" width="8" height="54" rx="4" fill="#D4A537"/>
    <text x="1605" y="669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#2C3E50">品牌定位策略</text>
    <rect x="1575" y="738" width="255" height="54" rx="27" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <rect x="1575" y="738" width="8" height="54" rx="4" fill="#D4A537"/>
    <text x="1605" y="774" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#2C3E50">渠道拓展计划</text>
    <rect x="1575" y="843" width="255" height="54" rx="27" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <rect x="1575" y="843" width="8" height="54" rx="4" fill="#D4A537"/>
    <text x="1605" y="879" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#2C3E50">竞品分析跟踪</text>

    <!-- 分支3: 技术 (左上) -->
    <rect x="420" y="255" width="150" height="90" rx="45" fill="#74B9FF" filter="url(#nodeShadow)"/>
    <text x="495" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#FFFFFF">技术</text>
    <rect x="45" y="183" width="255" height="54" rx="27" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <rect x="292" y="183" width="8" height="54" rx="4" fill="#74B9FF"/>
    <text x="72" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#2C3E50">架构升级方案</text>
    <rect x="45" y="288" width="255" height="54" rx="27" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <rect x="292" y="288" width="8" height="54" rx="4" fill="#74B9FF"/>
    <text x="72" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#2C3E50">AI能力集成</text>
    <rect x="45" y="393" width="255" height="54" rx="27" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <rect x="292" y="393" width="8" height="54" rx="4" fill="#74B9FF"/>
    <text x="72" y="429" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#2C3E50">安全合规建设</text>

    <!-- 分支4: 运营 (左下) -->
    <rect x="420" y="735" width="150" height="90" rx="45" fill="#E17055" filter="url(#nodeShadow)"/>
    <text x="495" y="790" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#FFFFFF">运营</text>
    <rect x="45" y="648" width="255" height="54" rx="27" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <rect x="292" y="648" width="8" height="54" rx="4" fill="#E17055"/>
    <text x="72" y="684" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#2C3E50">用户增长策略</text>
    <rect x="45" y="753" width="255" height="54" rx="27" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <rect x="292" y="753" width="8" height="54" rx="4" fill="#E17055"/>
    <text x="72" y="789" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#2C3E50">供应链优化</text>
    <rect x="45" y="858" width="255" height="54" rx="27" fill="#FFFFFF" filter="url(#nodeShadow)"/>
    <rect x="292" y="858" width="8" height="54" rx="4" fill="#E17055"/>
    <text x="72" y="894" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#2C3E50">数据驱动决策</text>

    <!-- 底部注释 -->
    <text x="960" y="1035" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#BDC3C7">中心主题向四大维度发散，每个维度下展开细分子项</text>
</svg>