<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    漏斗图模板
    用途: 转化流程分析
    适用场景: 销售漏斗、用户转化、流程效率
    支持: 4个阶段 (推荐3-5个)
    -->
    
    <defs>
        <!-- 漏斗渐变 -->
        <linearGradient id="funnelGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#005587;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#003A5C;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="funnelGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#0076A8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#005587;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="funnelGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4A90A4;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3B7A8F;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="funnelGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#E89207;stop-opacity:1" />
        </linearGradient>
        
        <!-- 阴影 -->
        <filter id="funnelShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="3"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- 箭头 -->
        <marker id="arrowLoss" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,9 L14,4 z" fill="#E74C3C" />
        </marker>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>销售转化漏斗</tspan>
    </text>
    
    <text x="90" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>2025年第三季度 · 总线索数 10,000</tspan>
    </text>
    
    <!-- 漏斗图 -->
    <g id="funnelChart">
        <!--
        漏斗中心线: x=640
        阶段间距: 110px
        阶段高度: 80px
        
        阶段数据:
        1. 潜在客户: 10,000 (100%) - 宽度 600px
        2. 意向客户: 4,500 (45%) - 宽度 450px
        3. 商务洽谈: 1,800 (18%) - 宽度 320px
        4. 成交客户: 650 (6.5%) - 宽度 180px
        -->
        
        <!-- 阶段1: 潜在客户 (y: 160-240) -->
        <path d="M 510,240 L 1410,240 L 1342,360 L 578,360 Z" 
              fill="url(#funnelGrad1)" filter="url(#funnelShadow)"/>
        <text x="960" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan>潜在客户: 10,000</tspan>
        </text>
        <text x="960" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" fill="#FFFFFF" text-anchor="middle" opacity="0.9">
            <tspan>100%</tspan>
        </text>
        
        <!-- 阶段2: 意向客户 (y: 270-350) -->
        <path d="M 578,405 L 1342,405 L 1275,525 L 645,525 Z" 
              fill="url(#funnelGrad2)" filter="url(#funnelShadow)"/>
        <text x="960" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan>意向客户: 4,500</tspan>
        </text>
        <text x="960" y="507" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" fill="#FFFFFF" text-anchor="middle" opacity="0.9">
            <tspan>45%</tspan>
        </text>
        
        <!-- 阶段3: 商务洽谈 (y: 380-460) -->
        <path d="M 645,570 L 1275,570 L 1208,690 L 712,690 Z" 
              fill="url(#funnelGrad3)" filter="url(#funnelShadow)"/>
        <text x="960" y="638" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan>商务洽谈: 1,800</tspan>
        </text>
        <text x="960" y="672" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" fill="#FFFFFF" text-anchor="middle" opacity="0.9">
            <tspan>18%</tspan>
        </text>
        
        <!-- 阶段4: 成交客户 (y: 490-570) -->
        <path d="M 712,735 L 1208,735 L 1140,855 L 780,855 Z" 
              fill="url(#funnelGrad4)" filter="url(#funnelShadow)"/>
        <text x="960" y="802" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="bold" fill="#2C3E50" text-anchor="middle">
            <tspan>成交客户: 650</tspan>
        </text>
        <text x="960" y="837" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" fill="#2C3E50" text-anchor="middle">
            <tspan>6.5%</tspan>
        </text>
    </g>
    
    <!-- 右侧流失标注 -->
    <g id="lossAnnotations">
        <!-- 流失1: 10,000 -> 4,500 (流失5,500, 55%) -->
        <line x1="1425" y1="375" x2="1530" y2="375" stroke="#E74C3C" stroke-width="3" marker-end="url(#arrowLoss)"/>
        <text x="1545" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="600" fill="#E74C3C">
            <tspan>流失 5,500</tspan>
        </text>
        <text x="1545" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" fill="#7F8C8D">
            <tspan>转化率: 45%</tspan>
        </text>
        
        <!-- 流失2: 4,500 -> 1,800 (流失2,700, 40%) -->
        <line x1="1358" y1="540" x2="1462" y2="540" stroke="#E74C3C" stroke-width="3" marker-end="url(#arrowLoss)"/>
        <text x="1478" y="532" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="600" fill="#E74C3C">
            <tspan>流失 2,700</tspan>
        </text>
        <text x="1478" y="562" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" fill="#7F8C8D">
            <tspan>转化率: 40%</tspan>
        </text>
        
        <!-- 流失3: 1,800 -> 650 (流失1,150, 36%) -->
        <line x1="1290" y1="705" x2="1395" y2="705" stroke="#E74C3C" stroke-width="3" marker-end="url(#arrowLoss)"/>
        <text x="1410" y="698" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="600" fill="#E74C3C">
            <tspan>流失 1,150</tspan>
        </text>
        <text x="1410" y="728" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" fill="#7F8C8D">
            <tspan>转化率: 36%</tspan>
        </text>
    </g>
    
    <!-- 左侧关键指标卡片 -->
    <g id="keyMetrics">
        <!-- 卡片背景 -->
        <rect x="90" y="270" width="330" height="570" rx="12" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="2"/>
        
        <text x="255" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>关键指标</tspan>
        </text>
        
        <!-- 指标1: 总转化率 -->
        <rect x="120" y="368" width="6" height="75" rx="3" fill="#F5A623"/>
        <text x="142" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>总转化率</tspan>
        </text>
        <text x="142" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="48" font-weight="bold" fill="#F5A623">
            <tspan>6.5%</tspan>
        </text>
        
        <!-- 指标2: 平均客单价 -->
        <rect x="120" y="480" width="6" height="75" rx="3" fill="#2196F3"/>
        <text x="142" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>平均客单价</tspan>
        </text>
        <text x="142" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="42" font-weight="bold" fill="#2196F3">
            <tspan>¥125K</tspan>
        </text>
        
        <!-- 指标3: 总成交额 -->
        <rect x="120" y="592" width="6" height="75" rx="3" fill="#4CAF50"/>
        <text x="142" y="615" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>总成交额</tspan>
        </text>
        <text x="142" y="652" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="42" font-weight="bold" fill="#4CAF50">
            <tspan>¥81.3M</tspan>
        </text>
        
        <!-- 指标4: 转化周期 -->
        <rect x="120" y="705" width="6" height="75" rx="3" fill="#9C27B0"/>
        <text x="142" y="728" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>平均周期</tspan>
        </text>
        <text x="142" y="765" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="42" font-weight="bold" fill="#9C27B0">
            <tspan>42天</tspan>
        </text>
    </g>
    
    <!-- 底部洞察 -->
    <g id="insight">
        <rect x="480" y="915" width="1320" height="90" rx="9" fill="#FFF3E0" stroke="#F5A623" stroke-width="3"/>
        <text x="510" y="952" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50">
            <tspan>💡 关键发现: </tspan>
        </text>
        <text x="668" y="952" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" fill="#5D6D7E">
            <tspan>意向客户到商务洽谈阶段转化率偏低(40%)，建议加强跟进频率和提案质量</tspan>
        </text>
        <text x="510" y="982" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" fill="#5D6D7E">
            <tspan>与商务洽谈到成交的转化率(36%)，需优化报价策略和商务条款灵活性</tspan>
        </text>
    </g>
    
    <!-- 数据来源 -->
    <text x="90" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" fill="#95A5A6">
        <tspan>数据来源: CRM系统统计</tspan>
    </text>
</svg>

