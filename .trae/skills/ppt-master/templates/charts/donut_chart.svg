<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    环形图模板
    用途: 占比和构成分析
    适用场景: 市场份额、预算分配、结构分析
    支持: 5个分块 (推荐3-6个)
    -->
    
    <defs>
        <!-- 扇区阴影 -->
        <filter id="sectorShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="3"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.25"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>产品线营收占比</tspan>
    </text>
    
    <text x="90" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>2025年第三季度 · 总收入 5.2亿元</tspan>
    </text>
    
    <!-- 环形图中心 -->
    <g id="donutChart" transform="translate(600, 615)">
        <!-- 
        圆心: (400, 410)
        外半径: 180px
        内半径: 100px
        起始角度: -90° (12点方向)
        
        数据:
        1. 企业服务: 35% (蓝色 #2196F3) - 角度: 126°
        2. 消费电子: 28% (绿色 #4CAF50) - 角度: 100.8°
        3. 云计算: 20% (橙色 #FF9800) - 角度: 72°
        4. 物联网: 12% (紫色 #9C27B0) - 角度: 43.2°
        5. 其他: 5% (灰色 #95A5A6) - 角度: 18°
        -->
        
        <!-- 扇区1: 企业服务 35% (从-90°到36°) -->
        <path d="M 0,-270 A 270,270 0 0,2 234.54,132.27 L 130.31,73.56 A 150,150 0 0,0 0,-150 Z" 
              fill="#2196F3" filter="url(#sectorShadow)"/>
        
        <!-- 扇区2: 消费电子 28% (从36°到136.8°) -->
        <path d="M 234.54,132.27 A 270,270 0 0,2 -185.15,195.21 L -102.85,108.45 A 150,150 0 0,0 130.31,73.56 Z" 
              fill="#4CAF50" filter="url(#sectorShadow)"/>
        
        <!-- 扇区3: 云计算 20% (从136.8°到208.8°) -->
        <path d="M -185.15,195.21 A 270,270 0 0,2 -263.04,-77.64 L -146.13,-43.14 A 150,150 0 0,0 -102.85,108.45 Z" 
              fill="#FF9800" filter="url(#sectorShadow)"/>
        
        <!-- 扇区4: 物联网 12% (从208.8°到252°) -->
        <path d="M -263.04,-77.64 A 270,270 0 0,2 -81.69,-257.31 L -45.39,-142.95 A 150,150 0 0,0 -146.13,-43.14 Z" 
              fill="#9C27B0" filter="url(#sectorShadow)"/>
        
        <!-- 扇区5: 其他 5% (从252°到270°/360°-90°) -->
        <path d="M -81.69,-257.31 A 270,270 0 0,2 0,-270 L 0,-150 A 150,150 0 0,0 -45.39,-142.95 Z" 
              fill="#95A5A6" filter="url(#sectorShadow)"/>
        
        <!-- 中心白色圆 -->
        <circle cx="0" cy="0" r="150" fill="#FFFFFF"/>
        
        <!-- 中心文字 -->
        <text x="0" y="-22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="72" font-weight="bold" fill="#2C3E50" text-anchor="middle">
            <tspan>5.2亿</tspan>
        </text>
        <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" fill="#7F8C8D" text-anchor="middle">
            <tspan>总收入</tspan>
        </text>
    </g>
    
    <!-- 百分比标签 -->
    <!-- 标签1: 企业服务 35% -->
    <g>
        <line x1="795" y1="442" x2="930" y2="375" stroke="#2196F3" stroke-width="2.2"/>
        <circle cx="795" cy="442" r="4" fill="#2196F3"/>
        <text x="945" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="600" fill="#2196F3">
            <tspan>35%</tspan>
        </text>
    </g>
    
    <!-- 标签2: 消费电子 28% -->
    <g>
        <line x1="765" y1="750" x2="930" y2="810" stroke="#4CAF50" stroke-width="2.2"/>
        <circle cx="765" cy="750" r="4" fill="#4CAF50"/>
        <text x="945" y="818" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="600" fill="#4CAF50">
            <tspan>28%</tspan>
        </text>
    </g>
    
    <!-- 标签3: 云计算 20% -->
    <g>
        <line x1="375" y1="720" x2="225" y2="780" stroke="#FF9800" stroke-width="2.2"/>
        <circle cx="375" cy="720" r="4" fill="#FF9800"/>
        <text x="210" y="788" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="600" fill="#FF9800" text-anchor="end">
            <tspan>20%</tspan>
        </text>
    </g>
    
    <!-- 标签4: 物联网 12% -->
    <g>
        <line x1="465" y1="398" x2="300" y2="330" stroke="#9C27B0" stroke-width="2.2"/>
        <circle cx="465" cy="398" r="4" fill="#9C27B0"/>
        <text x="285" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="600" fill="#9C27B0" text-anchor="end">
            <tspan>12%</tspan>
        </text>
    </g>
    
    <!-- 标签5: 其他 5% -->
    <g>
        <line x1="562" y1="360" x2="510" y2="270" stroke="#95A5A6" stroke-width="2.2"/>
        <circle cx="562" cy="360" r="4" fill="#95A5A6"/>
        <text x="495" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="600" fill="#95A5A6" text-anchor="end">
            <tspan>5%</tspan>
        </text>
    </g>
    
    <!-- 右侧详细列表 -->
    <g id="detailList">
        <!-- 列表标题 -->
        <text x="1125" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="33" font-weight="600" fill="#2C3E50">
            <tspan>详细数据</tspan>
        </text>
        
        <!-- 项目1: 企业服务 -->
        <rect x="1125" y="375" width="12" height="60" rx="6" fill="#2196F3"/>
        <text x="1162" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" fill="#5D6D7E">
            <tspan>企业服务</tspan>
        </text>
        <text x="1650" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="600" fill="#2C3E50" text-anchor="end">
            <tspan>¥1.82亿</tspan>
        </text>
        <text x="1770" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" fill="#2196F3" text-anchor="end">
            <tspan>35%</tspan>
        </text>
        
        <!-- 项目2: 消费电子 -->
        <rect x="1125" y="465" width="12" height="60" rx="6" fill="#4CAF50"/>
        <text x="1162" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" fill="#5D6D7E">
            <tspan>消费电子</tspan>
        </text>
        <text x="1650" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="600" fill="#2C3E50" text-anchor="end">
            <tspan>¥1.46亿</tspan>
        </text>
        <text x="1770" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" fill="#4CAF50" text-anchor="end">
            <tspan>28%</tspan>
        </text>
        
        <!-- 项目3: 云计算 -->
        <rect x="1125" y="555" width="12" height="60" rx="6" fill="#FF9800"/>
        <text x="1162" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" fill="#5D6D7E">
            <tspan>云计算</tspan>
        </text>
        <text x="1650" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="600" fill="#2C3E50" text-anchor="end">
            <tspan>¥1.04亿</tspan>
        </text>
        <text x="1770" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" fill="#FF9800" text-anchor="end">
            <tspan>20%</tspan>
        </text>
        
        <!-- 项目4: 物联网 -->
        <rect x="1125" y="645" width="12" height="60" rx="6" fill="#9C27B0"/>
        <text x="1162" y="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" fill="#5D6D7E">
            <tspan>物联网</tspan>
        </text>
        <text x="1650" y="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="600" fill="#2C3E50" text-anchor="end">
            <tspan>¥0.62亿</tspan>
        </text>
        <text x="1770" y="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" fill="#9C27B0" text-anchor="end">
            <tspan>12%</tspan>
        </text>
        
        <!-- 项目5: 其他 -->
        <rect x="1125" y="735" width="12" height="60" rx="6" fill="#95A5A6"/>
        <text x="1162" y="765" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" fill="#5D6D7E">
            <tspan>其他</tspan>
        </text>
        <text x="1650" y="765" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="600" fill="#2C3E50" text-anchor="end">
            <tspan>¥0.26亿</tspan>
        </text>
        <text x="1770" y="765" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" fill="#95A5A6" text-anchor="end">
            <tspan>5%</tspan>
        </text>
        
        <!-- 分隔线 -->
        <line x1="1125" y1="825" x2="1770" y2="825" stroke="#E0E0E0" stroke-width="3"/>
        
        <!-- 合计 -->
        <text x="1162" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="600" fill="#2C3E50">
            <tspan>合计</tspan>
        </text>
        <text x="1650" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="bold" fill="#2C3E50" text-anchor="end">
            <tspan>¥5.20亿</tspan>
        </text>
        <text x="1770" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="600" fill="#2C3E50" text-anchor="end">
            <tspan>100%</tspan>
        </text>
    </g>
    
    <!-- 数据来源 -->
    <text x="90" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" fill="#95A5A6">
        <tspan>数据来源: 财务部门季度报告</tspan>
    </text>
</svg>

