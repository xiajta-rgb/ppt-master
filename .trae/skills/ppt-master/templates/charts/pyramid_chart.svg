<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    金字塔层级图模板
    用途: 层级结构、价值递增、战略分层展示
    适用场景: 马斯洛需求层次、企业战略分层、能力成熟度模型
    支持: 5层 (推荐3-6层)
    -->
    
    <defs>
        <!-- 卡片阴影 -->
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.12"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- 背景渐变 -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#EEF1F5;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#bgGrad)"/>
    
    <!-- 标题区域 -->
    <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="700" fill="#1A252F" letter-spacing="-0.8">战略能力金字塔</text>
    <text x="90" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" fill="#7F8C8D">Strategic Capability Pyramid · 从基础到顶层的五级递进</text>
    
    <!-- 金字塔主体 (居左, x中心=380) -->
    <!-- 第5层 (顶) -->
    <polygon points="570,210 660,330 480,330" fill="#6C5CE7"/>
    <text x="570" y="297" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" font-weight="700" fill="#FFFFFF">愿景引领</text>
    
    <!-- 第4层 -->
    <polygon points="480,348 660,348 735,480 405,480" fill="#A29BFE"/>
    <text x="570" y="429" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" font-weight="700" fill="#FFFFFF">创新驱动</text>
    
    <!-- 第3层 -->
    <polygon points="405,498 735,498 810,630 330,630" fill="#74B9FF"/>
    <text x="570" y="579" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="22" font-weight="700" fill="#FFFFFF">品牌影响力</text>
    
    <!-- 第2层 -->
    <polygon points="330,648 810,648 885,780 255,780" fill="#55EFC4"/>
    <text x="570" y="729" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="22" font-weight="700" fill="#FFFFFF">技术研发能力</text>
    
    <!-- 第1层 (底) -->
    <polygon points="255,798 885,798 960,930 180,930" fill="#FDCB6E"/>
    <text x="570" y="879" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" font-weight="700" fill="#FFFFFF">基础运营体系</text>
    
    <!-- 右侧说明卡片 -->
    <!-- 第5层说明 -->
    <g filter="url(#cardShadow)">
        <rect x="1050" y="195" width="780" height="120" rx="15" fill="#FFFFFF"/>
        <rect x="1050" y="195" width="9" height="120" rx="4" fill="#6C5CE7"/>
        <text x="1089" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#1A252F">愿景引领</text>
        <text x="1089" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">确立行业地位与长期方向，统领全局战略布局</text>
    </g>
    <line x1="660" y1="270" x2="1050" y2="255" stroke="#6C5CE7" stroke-width="2" stroke-dasharray="4,3" stroke-opacity="0.4"/>
    
    <!-- 第4层说明 -->
    <g filter="url(#cardShadow)">
        <rect x="1050" y="342" width="780" height="120" rx="15" fill="#FFFFFF"/>
        <rect x="1050" y="342" width="9" height="120" rx="4" fill="#A29BFE"/>
        <text x="1089" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#1A252F">创新驱动</text>
        <text x="1089" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">构建持续创新机制，探索前沿技术与商业模式</text>
    </g>
    <line x1="735" y1="414" x2="1050" y2="402" stroke="#A29BFE" stroke-width="2" stroke-dasharray="4,3" stroke-opacity="0.4"/>
    
    <!-- 第3层说明 -->
    <g filter="url(#cardShadow)">
        <rect x="1050" y="489" width="780" height="120" rx="15" fill="#FFFFFF"/>
        <rect x="1050" y="489" width="9" height="120" rx="4" fill="#74B9FF"/>
        <text x="1089" y="531" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#1A252F">品牌影响力</text>
        <text x="1089" y="567" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">打造行业领先品牌认知，建立客户信任与忠诚</text>
    </g>
    <line x1="810" y1="564" x2="1050" y2="549" stroke="#74B9FF" stroke-width="2" stroke-dasharray="4,3" stroke-opacity="0.4"/>
    
    <!-- 第2层说明 -->
    <g filter="url(#cardShadow)">
        <rect x="1050" y="636" width="780" height="120" rx="15" fill="#FFFFFF"/>
        <rect x="1050" y="636" width="9" height="120" rx="4" fill="#55EFC4"/>
        <text x="1089" y="678" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#1A252F">技术研发能力</text>
        <text x="1089" y="714" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">500+核心专利，深厚技术积累支撑产品竞争力</text>
    </g>
    <line x1="885" y1="714" x2="1050" y2="696" stroke="#55EFC4" stroke-width="2" stroke-dasharray="4,3" stroke-opacity="0.4"/>
    
    <!-- 第1层说明 -->
    <g filter="url(#cardShadow)">
        <rect x="1050" y="783" width="780" height="120" rx="15" fill="#FFFFFF"/>
        <rect x="1050" y="783" width="9" height="120" rx="4" fill="#FDCB6E"/>
        <text x="1089" y="825" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#1A252F">基础运营体系</text>
        <text x="1089" y="861" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D">精细化运营管理，全球化供应链与智能仓储体系</text>
    </g>
    <line x1="960" y1="864" x2="1050" y2="843" stroke="#FDCB6E" stroke-width="2" stroke-dasharray="4,3" stroke-opacity="0.4"/>

    <!-- 底部注释 -->
    <text x="90" y="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" fill="#BDC3C7">层级越高代表战略价值越大，底层是上层的支撑基础</text>
</svg>