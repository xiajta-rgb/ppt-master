<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    气泡图模板
    用途: 三维数据展示（X轴、Y轴、气泡大小）
    适用场景: 市场规模vs增长率vs份额、风险评估、竞品分析
    支持: 多个气泡，大小代表第三维度数据
    -->
    
    <defs>
        <!-- 气泡渐变（蓝色） -->
        <radialGradient id="bubbleGrad1" cx="30%" cy="30%">
            <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:#1976D2;stop-opacity:0.7" />
        </radialGradient>
        
        <!-- 气泡渐变（绿色） -->
        <radialGradient id="bubbleGrad2" cx="30%" cy="30%">
            <stop offset="0%" style="stop-color:#81C784;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:#388E3C;stop-opacity:0.7" />
        </radialGradient>
        
        <!-- 气泡渐变（橙色） -->
        <radialGradient id="bubbleGrad3" cx="30%" cy="30%">
            <stop offset="0%" style="stop-color:#FFB74D;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:#F57C00;stop-opacity:0.7" />
        </radialGradient>
        
        <!-- 气泡渐变（紫色） -->
        <radialGradient id="bubbleGrad4" cx="30%" cy="30%">
            <stop offset="0%" style="stop-color:#BA68C8;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:0.7" />
        </radialGradient>
        
        <!-- 气泡渐变（红色） -->
        <radialGradient id="bubbleGrad5" cx="30%" cy="30%">
            <stop offset="0%" style="stop-color:#EF5350;stop-opacity:0.9" />
            <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:0.7" />
        </radialGradient>
        
        <!-- 气泡阴影 -->
        <filter id="bubbleShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="4"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>产品线市场定位分析</tspan>
    </text>
    
    <text x="90" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>市场规模 vs 增长率 vs 市场份额 · 气泡大小代表市场份额</tspan>
    </text>
    
    <!-- 图表区域 -->
    <g id="chartArea">
        <!-- 象限背景 -->
        <rect x="240" y="195" width="660" height="322" fill="#FFEBEE" opacity="0.3"/>
        <rect x="900" y="195" width="660" height="322" fill="#E8F5E9" opacity="0.3"/>
        <rect x="240" y="518" width="660" height="322" fill="#FFF3E0" opacity="0.3"/>
        <rect x="900" y="518" width="660" height="322" fill="#E3F2FD" opacity="0.3"/>
        
        <!-- 象限标签 -->
        <text x="570" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#C62828" text-anchor="middle"><tspan>低规模 · 高增长</tspan></text>
        <text x="570" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#E57373" text-anchor="middle"><tspan>明星产品 ⭐</tspan></text>
        
        <text x="1230" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#2E7D32" text-anchor="middle"><tspan>高规模 · 高增长</tspan></text>
        <text x="1230" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#81C784" text-anchor="middle"><tspan>金牛产品 🐂</tspan></text>
        
        <text x="570" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#EF6C00" text-anchor="middle"><tspan>低规模 · 低增长</tspan></text>
        <text x="570" y="822" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#FFB74D" text-anchor="middle"><tspan>问题产品 ❓</tspan></text>
        
        <text x="1230" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#1565C0" text-anchor="middle"><tspan>高规模 · 低增长</tspan></text>
        <text x="1230" y="822" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#64B5F6" text-anchor="middle"><tspan>现金牛 💰</tspan></text>
        
        <!-- 网格线 -->
        <line x1="240" y1="518" x2="1560" y2="518" stroke="#BDC3C7" stroke-width="3" stroke-dasharray="6,3"/>
        <line x1="900" y1="195" x2="900" y2="840" stroke="#BDC3C7" stroke-width="3" stroke-dasharray="6,3"/>
        
        <!-- Y轴网格线 -->
        <line x1="240" y1="300" x2="1560" y2="300" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="240" y1="405" x2="1560" y2="405" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="240" y1="630" x2="1560" y2="630" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="240" y1="735" x2="1560" y2="735" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- X轴网格线 -->
        <line x1="420" y1="195" x2="420" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="600" y1="195" x2="600" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="780" y1="195" x2="780" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="1080" y1="195" x2="1080" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="1260" y1="195" x2="1260" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="1440" y1="195" x2="1440" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- Y轴刻度标签 -->
        <text x="218" y="848" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>-10%</tspan></text>
        <text x="218" y="742" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>0%</tspan></text>
        <text x="218" y="638" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>10%</tspan></text>
        <text x="218" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#95A5A6" text-anchor="end"><tspan>20%</tspan></text>
        <text x="218" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>30%</tspan></text>
        <text x="218" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>40%</tspan></text>
        <text x="218" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>50%</tspan></text>
        
        <!-- Y轴标题 -->
        <text x="52" y="518" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="22" fill="#5D6D7E" text-anchor="middle" transform="rotate(-135, 52, 518)">
            <tspan>市场增长率 (%)</tspan>
        </text>
        
        <!-- X轴刻度标签 -->
        <text x="240" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>0</tspan></text>
        <text x="420" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>20</tspan></text>
        <text x="600" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>40</tspan></text>
        <text x="780" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>60</tspan></text>
        <text x="900" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#95A5A6" text-anchor="middle"><tspan>80</tspan></text>
        <text x="1080" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>100</tspan></text>
        <text x="1260" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>120</tspan></text>
        <text x="1440" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>140</tspan></text>
        <text x="1560" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>160</tspan></text>
        
        <!-- X轴标题 -->
        <text x="900" y="938" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="22" fill="#5D6D7E" text-anchor="middle">
            <tspan>市场规模（亿元）</tspan>
        </text>
        
        <!-- 坐标轴 -->
        <line x1="240" y1="195" x2="240" y2="840" stroke="#95A5A6" stroke-width="3"/>
        <line x1="240" y1="840" x2="1560" y2="840" stroke="#95A5A6" stroke-width="3"/>
        
        <!-- 
        气泡数据：
        X: 市场规模（亿元）0-160，每20亿=120px
        Y: 增长率 -10%到50%，每10%=70px，基线(0%)在y=490
        气泡大小: 市场份额 5%-35%，半径15-60px
        
        产品A: 规模120亿, 增长35%, 份额28% -> x=820, y=245, r=50
        产品B: 规模85亿, 增长25%, 份额18% -> x=630, y=315, r=38
        产品C: 规模45亿, 增长42%, 份额12% -> x=430, y=196, r=28
        产品D: 规模130亿, 增长8%, 份额25% -> x=880, y=434, r=45
        产品E: 规模30亿, 增长-5%, 份额8% -> x=340, y=525, r=22
        产品F: 规模65亿, 增长15%, 份额9% -> x=550, y=385, r=24
        -->
        
        <!-- 气泡F: 产品F (绿色，中等位置) -->
        <circle cx="825" cy="578" r="36" fill="url(#bubbleGrad2)" filter="url(#bubbleShadow)"/>
        <text x="825" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>F</tspan></text>
        
        <!-- 气泡E: 产品E (红色，问题象限) -->
        <circle cx="510" cy="788" r="33" fill="url(#bubbleGrad5)" filter="url(#bubbleShadow)"/>
        <text x="510" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>E</tspan></text>
        
        <!-- 气泡C: 产品C (橙色，明星象限) -->
        <circle cx="645" cy="294" r="42" fill="url(#bubbleGrad3)" filter="url(#bubbleShadow)"/>
        <text x="645" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>C</tspan></text>
        
        <!-- 气泡B: 产品B (紫色，金牛象限边缘) -->
        <circle cx="945" cy="472" r="57" fill="url(#bubbleGrad4)" filter="url(#bubbleShadow)"/>
        <text x="945" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>B</tspan></text>
        
        <!-- 气泡D: 产品D (蓝色，现金牛象限) -->
        <circle cx="1320" cy="651" r="68" fill="url(#bubbleGrad1)" filter="url(#bubbleShadow)"/>
        <text x="1320" y="658" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>D</tspan></text>
        
        <!-- 气泡A: 产品A (绿色，最大，金牛象限) -->
        <circle cx="1230" cy="368" r="75" fill="url(#bubbleGrad2)" filter="url(#bubbleShadow)"/>
        <text x="1230" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>A</tspan></text>
    </g>
    
    <!-- 产品列表 -->
    <g id="productList" transform="translate(1590, 195)">
        <rect x="0" y="0" width="270" height="480" rx="12" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="2"/>
        
        <text x="135" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle"><tspan>产品列表</tspan></text>
        
        <line x1="22" y1="63" x2="248" y2="63" stroke="#E0E0E0" stroke-width="2"/>
        
        <!-- 产品A -->
        <circle cx="45" cy="105" r="18" fill="url(#bubbleGrad2)"/>
        <text x="75" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50"><tspan>产品A</tspan></text>
        <text x="75" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D"><tspan>120亿 | +35% | 28%</tspan></text>
        
        <!-- 产品B -->
        <circle cx="45" cy="172" r="15" fill="url(#bubbleGrad4)"/>
        <text x="75" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50"><tspan>产品B</tspan></text>
        <text x="75" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D"><tspan>85亿 | +25% | 18%</tspan></text>
        
        <!-- 产品C -->
        <circle cx="45" cy="240" r="12" fill="url(#bubbleGrad3)"/>
        <text x="75" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50"><tspan>产品C</tspan></text>
        <text x="75" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D"><tspan>45亿 | +42% | 12%</tspan></text>
        
        <!-- 产品D -->
        <circle cx="45" cy="308" r="16" fill="url(#bubbleGrad1)"/>
        <text x="75" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50"><tspan>产品D</tspan></text>
        <text x="75" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D"><tspan>130亿 | +8% | 25%</tspan></text>
        
        <!-- 产品E -->
        <circle cx="45" cy="375" r="10" fill="url(#bubbleGrad5)"/>
        <text x="75" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50"><tspan>产品E</tspan></text>
        <text x="75" y="393" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D"><tspan>30亿 | -5% | 8%</tspan></text>
        
        <!-- 产品F -->
        <circle cx="45" cy="442" r="10" fill="url(#bubbleGrad2)"/>
        <text x="75" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50"><tspan>产品F</tspan></text>
        <text x="75" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D"><tspan>65亿 | +15% | 9%</tspan></text>
    </g>
    
    <!-- 气泡大小图例 -->
    <g id="sizeLegend" transform="translate(1590, 705)">
        <rect x="0" y="0" width="270" height="135" rx="12" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="2"/>
        <text x="135" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#7F8C8D" text-anchor="middle"><tspan>气泡大小 = 市场份额</tspan></text>
        
        <circle cx="60" cy="90" r="15" fill="#BDC3C7"/>
        <text x="60" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="15" fill="#7F8C8D" text-anchor="middle"><tspan>10%</tspan></text>
        
        <circle cx="135" cy="82" r="27" fill="#BDC3C7"/>
        <text x="135" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="15" fill="#7F8C8D" text-anchor="middle"><tspan>20%</tspan></text>
        
        <circle cx="218" cy="72" r="38" fill="#BDC3C7"/>
        <text x="218" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="15" fill="#7F8C8D" text-anchor="middle"><tspan>30%</tspan></text>
    </g>
    
    <!-- 数据来源 -->
    <text x="90" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#95A5A6">
        <tspan>数据来源: 市场研究部门</tspan>
    </text>
</svg>

