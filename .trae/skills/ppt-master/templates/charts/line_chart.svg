<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    折线图模板
    用途: 趋势和变化展示
    适用场景: 时间序列分析、增长趋势、多指标对比
    支持: 双折线对比
    -->
    
    <defs>
        <!-- 线条渐变 -->
        <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
        </linearGradient>
        
        <!-- 区域填充渐变 -->
        <linearGradient id="areaGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#2196F3;stop-opacity:0.05" />
        </linearGradient>
        
        <linearGradient id="areaGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:0.05" />
        </linearGradient>
        
        <!-- 数据点阴影 -->
        <filter id="dotShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.4"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>营收与利润趋势</tspan>
    </text>
    
    <text x="90" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>2024年 1月 - 12月 · 单位：百万元</tspan>
    </text>
    
    <!-- 图表区域 -->
    <g id="chartArea">
        <!-- 网格线 -->
        <line x1="210" y1="825" x2="1740" y2="825" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="705" x2="1740" y2="705" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="585" x2="1740" y2="585" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="465" x2="1740" y2="465" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="345" x2="1740" y2="345" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="225" x2="1740" y2="225" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- Y轴刻度标签 -->
        <text x="188" y="832" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>0</tspan>
        </text>
        <text x="188" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>20</tspan>
        </text>
        <text x="188" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>40</tspan>
        </text>
        <text x="188" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>60</tspan>
        </text>
        <text x="188" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>80</tspan>
        </text>
        <text x="188" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>100</tspan>
        </text>
        
        <!-- 坐标轴 -->
        <line x1="210" y1="225" x2="210" y2="825" stroke="#95A5A6" stroke-width="3"/>
        <line x1="210" y1="825" x2="1740" y2="825" stroke="#95A5A6" stroke-width="3"/>
        
        <!-- X轴月份标签 (12个月, 间距85px) -->
        <text x="338" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>1月</tspan>
        </text>
        <text x="465" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>2月</tspan>
        </text>
        <text x="592" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>3月</tspan>
        </text>
        <text x="720" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>4月</tspan>
        </text>
        <text x="848" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>5月</tspan>
        </text>
        <text x="975" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>6月</tspan>
        </text>
        <text x="1102" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>7月</tspan>
        </text>
        <text x="1230" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>8月</tspan>
        </text>
        <text x="1358" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>9月</tspan>
        </text>
        <text x="1485" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>10月</tspan>
        </text>
        <text x="1612" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>11月</tspan>
        </text>
        <text x="1740" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle">
            <tspan>12月</tspan>
        </text>
        
        <!-- 折线1区域填充 (营收) - 数据点: 32,38,45,52,58,62,68,75,78,82,88,92 -->
        <path d="M 338,633 L 465,597 L 592,555 L 720,513 L 848,477 L 975,453 L 1102,417 L 1230,375 L 1358,357 L 1485,333 L 1612,297 L 1740,273 L 1740,825 L 338,825 Z" 
              fill="url(#areaGrad1)" opacity="0.3"/>
        
        <!-- 折线1 (营收) -->
        <polyline points="338,633 465,597 592,555 720,513 848,477 975,453 1102,417 1230,375 1358,357 1485,333 1612,297 1740,273" 
                  fill="none" stroke="url(#lineGrad1)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- 折线1数据点 -->
        <circle cx="338" cy="633" r="8" fill="#2196F3" filter="url(#dotShadow)"/>
        <circle cx="465" cy="597" r="8" fill="#2196F3" filter="url(#dotShadow)"/>
        <circle cx="592" cy="555" r="8" fill="#2196F3" filter="url(#dotShadow)"/>
        <circle cx="720" cy="513" r="8" fill="#2196F3" filter="url(#dotShadow)"/>
        <circle cx="848" cy="477" r="8" fill="#2196F3" filter="url(#dotShadow)"/>
        <circle cx="975" cy="453" r="8" fill="#2196F3" filter="url(#dotShadow)"/>
        <circle cx="1102" cy="417" r="8" fill="#2196F3" filter="url(#dotShadow)"/>
        <circle cx="1230" cy="375" r="8" fill="#2196F3" filter="url(#dotShadow)"/>
        <circle cx="1358" cy="357" r="8" fill="#2196F3" filter="url(#dotShadow)"/>
        <circle cx="1485" cy="333" r="8" fill="#2196F3" filter="url(#dotShadow)"/>
        <circle cx="1612" cy="297" r="8" fill="#2196F3" filter="url(#dotShadow)"/>
        <circle cx="1740" cy="273" r="8" fill="#2196F3" filter="url(#dotShadow)"/>
        
        <!-- 折线2区域填充 (利润) - 数据点: 12,15,18,22,25,28,32,36,38,42,48,52 -->
        <path d="M 338,753 L 465,735 L 592,717 L 720,693 L 848,675 L 975,657 L 1102,633 L 1230,609 L 1358,597 L 1485,573 L 1612,537 L 1740,513 L 1740,825 L 338,825 Z" 
              fill="url(#areaGrad2)" opacity="0.3"/>
        
        <!-- 折线2 (利润) -->
        <polyline points="338,753 465,735 592,717 720,693 848,675 975,657 1102,633 1230,609 1358,597 1485,573 1612,537 1740,513" 
                  fill="none" stroke="url(#lineGrad2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- 折线2数据点 -->
        <circle cx="338" cy="753" r="8" fill="#4CAF50" filter="url(#dotShadow)"/>
        <circle cx="465" cy="735" r="8" fill="#4CAF50" filter="url(#dotShadow)"/>
        <circle cx="592" cy="717" r="8" fill="#4CAF50" filter="url(#dotShadow)"/>
        <circle cx="720" cy="693" r="8" fill="#4CAF50" filter="url(#dotShadow)"/>
        <circle cx="848" cy="675" r="8" fill="#4CAF50" filter="url(#dotShadow)"/>
        <circle cx="975" cy="657" r="8" fill="#4CAF50" filter="url(#dotShadow)"/>
        <circle cx="1102" cy="633" r="8" fill="#4CAF50" filter="url(#dotShadow)"/>
        <circle cx="1230" cy="609" r="8" fill="#4CAF50" filter="url(#dotShadow)"/>
        <circle cx="1358" cy="597" r="8" fill="#4CAF50" filter="url(#dotShadow)"/>
        <circle cx="1485" cy="573" r="8" fill="#4CAF50" filter="url(#dotShadow)"/>
        <circle cx="1612" cy="537" r="8" fill="#4CAF50" filter="url(#dotShadow)"/>
        <circle cx="1740" cy="513" r="8" fill="#4CAF50" filter="url(#dotShadow)"/>
    </g>
    
    <!-- 图例 -->
    <g id="legend">
        <line x1="1380" y1="945" x2="1425" y2="945" stroke="#2196F3" stroke-width="4"/>
        <circle cx="1402" cy="945" r="8" fill="#2196F3"/>
        <text x="1440" y="952" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" fill="#5D6D7E">
            <tspan>营收</tspan>
        </text>
        
        <line x1="1560" y1="945" x2="1605" y2="945" stroke="#4CAF50" stroke-width="4"/>
        <circle cx="1582" cy="945" r="8" fill="#4CAF50"/>
        <text x="1620" y="952" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" fill="#5D6D7E">
            <tspan>净利润</tspan>
        </text>
    </g>
    
    <!-- 数据来源 -->
    <text x="90" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" fill="#95A5A6">
        <tspan>数据来源: 财务部门月度报告</tspan>
    </text>
</svg>

