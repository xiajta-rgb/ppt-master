<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    Bullet Chart Template
    Purpose: Target vs Actual comparison, more space-efficient than gauges
    Use cases: KPI achievement, sales targets, budget execution, performance evaluation
    Supports: 5 metrics displayed in parallel
    -->
    
    <defs>
        <linearGradient id="bulletExcellent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="bulletGood" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#FFF8E1;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FFE082;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="bulletFair" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#FFEBEE;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FFCDD2;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="actualBar" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="actualBarGreen" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#388E3C;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="actualBarOrange" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#F57C00;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <text x="960" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50" text-anchor="middle">
        <tspan>2025 Annual KPI Achievement Status</tspan>
    </text>
    
    <text x="960" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D" text-anchor="middle">
        <tspan>Target vs Actual - As of Q4</tspan>
    </text>
    
    <!-- Legend -->
    <g id="legend" transform="translate(1350, 150)">
        <rect x="0" y="0" width="30" height="18" fill="#FFCDD2" rx="3"/>
        <text x="42" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E"><tspan>Fair (0-60%)</tspan></text>
        
        <rect x="180" y="0" width="30" height="18" fill="#FFE082" rx="3"/>
        <text x="222" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E"><tspan>Good (60-80%)</tspan></text>
        
        <rect x="375" y="0" width="30" height="18" fill="#C8E6C9" rx="3"/>
        <text x="417" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E"><tspan>Excellent (80-100%+)</tspan></text>
    </g>
    
    <!-- Bullet 1: Sales Revenue 92% -->
    <g id="bullet1" transform="translate(120, 210)">
        <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="27" font-weight="600" fill="#2C3E50">
            <tspan>Sales Revenue</tspan>
        </text>
        <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D">
            <tspan>Target: $100M</tspan>
        </text>
        
        <rect x="270" y="30" width="1350" height="75" fill="url(#bulletFair)" rx="6"/>
        <rect x="270" y="30" width="1080" height="75" fill="url(#bulletGood)" rx="6"/>
        <rect x="270" y="30" width="810" height="75" fill="url(#bulletExcellent)" rx="6"/>
        <rect x="270" y="48" width="1242" height="39" fill="url(#actualBarGreen)" rx="4"/>
        <line x1="1620" y1="22" x2="1620" y2="112" stroke="#E74C3C" stroke-width="6"/>
        <text x="1530" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF">
            <tspan>$92M</tspan>
        </text>
        <text x="1680" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="bold" fill="#4CAF50">
            <tspan>92%</tspan>
        </text>
    </g>
    
    <!-- Bullet 2: New Customers 97% -->
    <g id="bullet2" transform="translate(120, 360)">
        <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="27" font-weight="600" fill="#2C3E50">
            <tspan>New Customers</tspan>
        </text>
        <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D">
            <tspan>Target: 500</tspan>
        </text>
        
        <rect x="270" y="30" width="1350" height="75" fill="url(#bulletFair)" rx="6"/>
        <rect x="270" y="30" width="1080" height="75" fill="url(#bulletGood)" rx="6"/>
        <rect x="270" y="30" width="810" height="75" fill="url(#bulletExcellent)" rx="6"/>
        <rect x="270" y="48" width="1310" height="39" fill="url(#actualBarGreen)" rx="4"/>
        <line x1="1620" y1="22" x2="1620" y2="112" stroke="#E74C3C" stroke-width="6"/>
        <text x="1575" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF">
            <tspan>485</tspan>
        </text>
        <text x="1680" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="bold" fill="#4CAF50">
            <tspan>97%</tspan>
        </text>
    </g>
    
    <!-- Bullet 3: Customer Satisfaction 98% -->
    <g id="bullet3" transform="translate(120, 510)">
        <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="27" font-weight="600" fill="#2C3E50">
            <tspan>Customer Satisfaction</tspan>
        </text>
        <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D">
            <tspan>Target: 90%</tspan>
        </text>
        
        <rect x="270" y="30" width="1350" height="75" fill="url(#bulletFair)" rx="6"/>
        <rect x="270" y="30" width="1080" height="75" fill="url(#bulletGood)" rx="6"/>
        <rect x="270" y="30" width="810" height="75" fill="url(#bulletExcellent)" rx="6"/>
        <rect x="270" y="48" width="1320" height="39" fill="url(#actualBarGreen)" rx="4"/>
        <line x1="1485" y1="22" x2="1485" y2="112" stroke="#E74C3C" stroke-width="6"/>
        <text x="1575" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF">
            <tspan>88%</tspan>
        </text>
        <text x="1680" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="bold" fill="#4CAF50">
            <tspan>98%</tspan>
        </text>
    </g>
    
    <!-- Bullet 4: Market Share 72% -->
    <g id="bullet4" transform="translate(120, 660)">
        <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="27" font-weight="600" fill="#2C3E50">
            <tspan>Market Share</tspan>
        </text>
        <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D">
            <tspan>Target: 25%</tspan>
        </text>
        
        <rect x="270" y="30" width="1350" height="75" fill="url(#bulletFair)" rx="6"/>
        <rect x="270" y="30" width="1080" height="75" fill="url(#bulletGood)" rx="6"/>
        <rect x="270" y="30" width="810" height="75" fill="url(#bulletExcellent)" rx="6"/>
        <rect x="270" y="48" width="972" height="39" fill="url(#actualBarOrange)" rx="4"/>
        <line x1="1620" y1="22" x2="1620" y2="112" stroke="#E74C3C" stroke-width="6"/>
        <text x="1222" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF">
            <tspan>18%</tspan>
        </text>
        <text x="1680" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="bold" fill="#FF9800">
            <tspan>72%</tspan>
        </text>
    </g>
    
    <!-- Bullet 5: Cost Control 119% (Over budget) -->
    <g id="bullet5" transform="translate(120, 810)">
        <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="27" font-weight="600" fill="#2C3E50">
            <tspan>Cost Control</tspan>
        </text>
        <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D">
            <tspan>Budget: $80M</tspan>
        </text>
        
        <rect x="270" y="30" width="1350" height="75" fill="url(#bulletExcellent)" rx="6"/>
        <rect x="1080" y="30" width="540" height="75" fill="url(#bulletGood)" rx="6"/>
        <rect x="1350" y="30" width="270" height="75" fill="url(#bulletFair)" rx="6"/>
        <rect x="270" y="48" width="1282" height="39" fill="#E74C3C" rx="4"/>
        <line x1="1080" y1="22" x2="1080" y2="112" stroke="#4CAF50" stroke-width="6"/>
        <text x="1530" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF">
            <tspan>$95M</tspan>
        </text>
        <text x="1680" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="bold" fill="#E74C3C">
            <tspan>119%</tspan>
        </text>
    </g>
    
    <!-- Insight box -->
    <g id="insight">
        <rect x="120" y="945" width="1680" height="90" rx="9" fill="#E3F2FD" stroke="#2196F3" stroke-width="3"/>
        <text x="150" y="982" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50">
            <tspan>Summary:</tspan>
        </text>
        <text x="300" y="982" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="22" fill="#5D6D7E">
            <tspan>3 KPIs exceeded targets. Market share growth needs strengthening. Cost control requires attention.</tspan>
        </text>
        <text x="150" y="1017" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#7F8C8D">
            <tspan>Recommendation: Prioritize cutting non-core project expenses while increasing marketing budget.</tspan>
        </text>
    </g>
</svg>
