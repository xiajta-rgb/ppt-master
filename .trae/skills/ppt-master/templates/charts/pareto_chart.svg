<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    Pareto Chart Template
    Purpose: 80/20 analysis, identify key factors
    Use cases: Quality issue analysis, sales contribution, cost structure, defect attribution
    Supports: Bar chart + cumulative line chart combination
    -->
    
    <defs>
        <linearGradient id="paretoBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="paretoBarHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="cumulativeLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="areaFill80" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:0.8" />
            <stop offset="100%" style="stop-color:#FFE0B2;stop-opacity:0.3" />
        </linearGradient>
    </defs>
    
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <text x="960" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50" text-anchor="middle">
        <tspan>Product Quality Issue Pareto Analysis</tspan>
    </text>
    
    <text x="960" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D" text-anchor="middle">
        <tspan>2025 Q4 - Customer Complaint Attribution (Total: 1,000 cases)</tspan>
    </text>
    
    <!-- Legend -->
    <g id="legend" transform="translate(225, 150)">
        <rect x="0" y="0" width="30" height="21" fill="url(#paretoBarHighlight)" rx="3"/>
        <text x="42" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>Key Factors (80%)</tspan></text>
        
        <rect x="255" y="0" width="30" height="21" fill="url(#paretoBarGrad)" rx="3"/>
        <text x="297" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>Minor Factors</tspan></text>
        
        <line x1="480" y1="10" x2="510" y2="10" stroke="#E74C3C" stroke-width="4"/>
        <circle cx="495" cy="10" r="8" fill="#E74C3C"/>
        <text x="522" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>Cumulative %</tspan></text>
    </g>
    
    <!-- Y-axis (Left - Count) -->
    <line x1="195" y1="195" x2="195" y2="870" stroke="#E0E0E0" stroke-width="3"/>
    <text x="105" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="24" font-weight="600" fill="#2C3E50" text-anchor="middle" transform="rotate(-135, 105, 540)">
        <tspan>Complaint Count</tspan>
    </text>
    
    <!-- Y-axis ticks (Left) -->
    <text x="180" y="878" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>0</tspan></text>
    <text x="180" y="735" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>100</tspan></text>
    <text x="180" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>200</tspan></text>
    <text x="180" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>300</tspan></text>
    <text x="180" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>400</tspan></text>
    <text x="180" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>450</tspan></text>
    
    <!-- Y-axis (Right - Percentage) -->
    <line x1="1725" y1="195" x2="1725" y2="870" stroke="#E0E0E0" stroke-width="3"/>
    <text x="1815" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="24" font-weight="600" fill="#E74C3C" text-anchor="middle" transform="rotate(135, 1815, 540)">
        <tspan>Cumulative %</tspan>
    </text>
    
    <!-- Y-axis ticks (Right) -->
    <text x="1740" y="878" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#E74C3C"><tspan>0%</tspan></text>
    <text x="1740" y="705" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#E74C3C"><tspan>25%</tspan></text>
    <text x="1740" y="532" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#E74C3C"><tspan>50%</tspan></text>
    <text x="1740" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#E74C3C"><tspan>75%</tspan></text>
    <text x="1740" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#E74C3C"><tspan>100%</tspan></text>
    
    <!-- X-axis -->
    <line x1="195" y1="870" x2="1725" y2="870" stroke="#E0E0E0" stroke-width="3"/>
    
    <!-- Grid lines -->
    <line x1="195" y1="735" x2="1725" y2="735" stroke="#F0F0F0" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="195" y1="592" x2="1725" y2="592" stroke="#F0F0F0" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="195" y1="450" x2="1725" y2="450" stroke="#F0F0F0" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="195" y1="308" x2="1725" y2="308" stroke="#F0F0F0" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- 80% reference line -->
    <line x1="195" y1="330" x2="1725" y2="330" stroke="#FF9800" stroke-width="3" stroke-dasharray="10,5"/>
    <text x="218" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" font-weight="600" fill="#FF9800"><tspan>80% Key Factor Line</tspan></text>
    
    <!-- 80% area fill -->
    <rect x="195" y="330" width="960" height="540" fill="url(#areaFill80)" opacity="0.3"/>
    
    <!-- Bar chart data (sorted by frequency high to low) -->
    <!-- 1. Function Error: 350 (35%) - Cumulative 35% -->
    <rect x="255" y="345" width="150" height="525" fill="url(#paretoBarHighlight)" rx="6"/>
    <text x="330" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" font-weight="bold" fill="#F57C00" text-anchor="middle"><tspan>350</tspan></text>
    <text x="330" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#2C3E50" text-anchor="middle"><tspan>Function Error</tspan></text>
    <text x="330" y="942" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" fill="#7F8C8D" text-anchor="middle"><tspan>(35%)</tspan></text>
    
    <!-- 2. Appearance Defect: 220 (22%) - Cumulative 57% -->
    <rect x="450" y="540" width="150" height="330" fill="url(#paretoBarHighlight)" rx="6"/>
    <text x="525" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" font-weight="bold" fill="#F57C00" text-anchor="middle"><tspan>220</tspan></text>
    <text x="525" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#2C3E50" text-anchor="middle"><tspan>Appearance</tspan></text>
    <text x="525" y="942" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" fill="#7F8C8D" text-anchor="middle"><tspan>(22%)</tspan></text>
    
    <!-- 3. Missing Parts: 150 (15%) - Cumulative 72% -->
    <rect x="645" y="645" width="150" height="225" fill="url(#paretoBarHighlight)" rx="6"/>
    <text x="720" y="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" font-weight="bold" fill="#F57C00" text-anchor="middle"><tspan>150</tspan></text>
    <text x="720" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#2C3E50" text-anchor="middle"><tspan>Missing Parts</tspan></text>
    <text x="720" y="942" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" fill="#7F8C8D" text-anchor="middle"><tspan>(15%)</tspan></text>
    
    <!-- 4. Shipping Damage: 120 (12%) - Cumulative 84% -->
    <rect x="840" y="690" width="150" height="180" fill="url(#paretoBarHighlight)" rx="6"/>
    <text x="915" y="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" font-weight="bold" fill="#F57C00" text-anchor="middle"><tspan>120</tspan></text>
    <text x="915" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#2C3E50" text-anchor="middle"><tspan>Ship Damage</tspan></text>
    <text x="915" y="942" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" fill="#7F8C8D" text-anchor="middle"><tspan>(12%)</tspan></text>
    
    <!-- 5. Manual Error: 70 (7%) - Cumulative 91% -->
    <rect x="1035" y="765" width="150" height="105" fill="url(#paretoBarGrad)" rx="6"/>
    <text x="1110" y="750" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" font-weight="bold" fill="#1565C0" text-anchor="middle"><tspan>70</tspan></text>
    <text x="1110" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#2C3E50" text-anchor="middle"><tspan>Manual Error</tspan></text>
    <text x="1110" y="942" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" fill="#7F8C8D" text-anchor="middle"><tspan>(7%)</tspan></text>
    
    <!-- 6. Packaging Issue: 50 (5%) - Cumulative 96% -->
    <rect x="1230" y="795" width="150" height="75" fill="url(#paretoBarGrad)" rx="6"/>
    <text x="1305" y="780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" font-weight="bold" fill="#1565C0" text-anchor="middle"><tspan>50</tspan></text>
    <text x="1305" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#2C3E50" text-anchor="middle"><tspan>Packaging</tspan></text>
    <text x="1305" y="942" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" fill="#7F8C8D" text-anchor="middle"><tspan>(5%)</tspan></text>
    
    <!-- 7. Other Issues: 40 (4%) - Cumulative 100% -->
    <rect x="1425" y="810" width="150" height="60" fill="url(#paretoBarGrad)" rx="6"/>
    <text x="1500" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" font-weight="bold" fill="#1565C0" text-anchor="middle"><tspan>40</tspan></text>
    <text x="1500" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#2C3E50" text-anchor="middle"><tspan>Other</tspan></text>
    <text x="1500" y="942" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" fill="#7F8C8D" text-anchor="middle"><tspan>(4%)</tspan></text>
    
    <!-- Cumulative line chart -->
    <polyline points="330,630 525,483 720,381 915,308 1110,255 1305,226 1500,195" 
              fill="none" stroke="#E74C3C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cumulative line data points -->
    <circle cx="330" cy="630" r="12" fill="#E74C3C"/>
    <text x="330" y="668" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" font-weight="bold" fill="#E74C3C" text-anchor="middle"><tspan>35%</tspan></text>
    
    <circle cx="525" cy="483" r="12" fill="#E74C3C"/>
    <text x="525" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" font-weight="bold" fill="#E74C3C" text-anchor="middle"><tspan>57%</tspan></text>
    
    <circle cx="720" cy="381" r="12" fill="#E74C3C"/>
    <text x="720" y="363" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" font-weight="bold" fill="#E74C3C" text-anchor="middle"><tspan>72%</tspan></text>
    
    <circle cx="915" cy="308" r="12" fill="#FF9800"/>
    <text x="915" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" font-weight="bold" fill="#FF9800" text-anchor="middle"><tspan>84%</tspan></text>
    
    <circle cx="1110" cy="255" r="9" fill="#E74C3C"/>
    <text x="1110" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="16" font-weight="bold" fill="#E74C3C" text-anchor="middle"><tspan>91%</tspan></text>
    
    <circle cx="1305" cy="226" r="9" fill="#E74C3C"/>
    <text x="1305" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="16" font-weight="bold" fill="#E74C3C" text-anchor="middle"><tspan>96%</tspan></text>
    
    <circle cx="1500" cy="195" r="9" fill="#E74C3C"/>
    <text x="1500" y="177" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="16" font-weight="bold" fill="#E74C3C" text-anchor="middle"><tspan>100%</tspan></text>
    
    <!-- Insight box -->
    <rect x="195" y="982" width="1530" height="75" rx="9" fill="#FFF3E0" stroke="#FF9800" stroke-width="3"/>
    <text x="225" y="1017" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="24" font-weight="600" fill="#E65100">
        <tspan>Key Finding:</tspan>
    </text>
    <text x="405" y="1017" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="22" fill="#5D6D7E">
        <tspan>Top 4 issues account for 84% of complaints - prioritize resolution</tspan>
    </text>
    <text x="225" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="20" fill="#7F8C8D">
        <tspan>Action: Enhance QC process, optimize logistics packaging, improve parts checklist verification</tspan>
    </text>
</svg>
