<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    矩形树图模板
    用途: 层级数据占比可视化
    适用场景: 磁盘空间分析、预算分配、市场份额、组织结构
    支持: 多层级矩形嵌套
    -->
    
    <defs>
        <!-- 阴影 -->
        <filter id="treemapShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.15"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>年度预算分配总览</tspan>
    </text>
    
    <text x="90" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>2025年度预算 · 总额 1,200万元 · 面积代表预算占比</tspan>
    </text>
    
    <!-- 矩形树图区域 -->
    <g id="treemapArea" transform="translate(90, 180)">
        <!-- 
        总面积: 1000×480
        
        主要分类及占比:
        1. 人力成本 40% (400×480 左侧)
        2. 运营成本 25% (右上 600×200)
        3. 营销费用 20% (右中 600×160)
        4. 研发投入 10% (右下左 300×120)
        5. 其他支出 5% (右下右 300×120)
        -->
        
        <!-- 1. 人力成本 40% - 蓝色系 -->
        <g id="hr_cost">
            <rect x="0" y="0" width="600" height="720" rx="9" fill="#1976D2" filter="url(#treemapShadow)"/>
            
            <!-- 子分类 -->
            <!-- 1.1 薪资福利 70% of 40% = 28% (400×336) -->
            <rect x="6" y="6" width="588" height="492" rx="6" fill="#2196F3"/>
            <text x="300" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan>薪资福利</tspan></text>
            <text x="300" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan>336万</tspan></text>
            <text x="300" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="24" fill="#BBDEFB" text-anchor="middle"><tspan>28%</tspan></text>
            
            <!-- 1.2 培训发展 15% of 40% = 6% (200×144) -->
            <rect x="6" y="504" width="291" height="210" rx="6" fill="#42A5F5"/>
            <text x="152" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>培训发展</tspan></text>
            <text x="152" y="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan>72万</tspan></text>
            <text x="152" y="663" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#BBDEFB" text-anchor="middle"><tspan>6%</tspan></text>
            
            <!-- 1.3 招聘成本 15% of 40% = 6% (200×144) -->
            <rect x="303" y="504" width="291" height="210" rx="6" fill="#64B5F6"/>
            <text x="448" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>招聘成本</tspan></text>
            <text x="448" y="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan>72万</tspan></text>
            <text x="448" y="663" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#BBDEFB" text-anchor="middle"><tspan>6%</tspan></text>
            
            <!-- 人力成本总标签 -->
            <text x="300" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="20" fill="#BBDEFB" text-anchor="middle"><tspan>人力成本 480万 (40%)</tspan></text>
        </g>
        
        <!-- 2. 运营成本 25% - 绿色系 -->
        <g id="operation_cost">
            <rect x="606" y="0" width="894" height="300" rx="9" fill="#388E3C" filter="url(#treemapShadow)"/>
            
            <!-- 2.1 办公场地 50% of 25% = 12.5% -->
            <rect x="612" y="6" width="435" height="288" rx="6" fill="#4CAF50"/>
            <text x="830" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>办公场地</tspan></text>
            <text x="830" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="36" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan>150万</tspan></text>
            <text x="830" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#C8E6C9" text-anchor="middle"><tspan>12.5%</tspan></text>
            
            <!-- 2.2 设备采购 30% of 25% = 7.5% -->
            <rect x="1053" y="6" width="262" height="288" rx="6" fill="#66BB6A"/>
            <text x="1185" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>设备采购</tspan></text>
            <text x="1185" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan>90万</tspan></text>
            <text x="1185" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#C8E6C9" text-anchor="middle"><tspan>7.5%</tspan></text>
            
            <!-- 2.3 日常运营 20% of 25% = 5% -->
            <rect x="1322" y="6" width="172" height="288" rx="6" fill="#81C784"/>
            <text x="1408" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>日常</tspan></text>
            <text x="1408" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>运营</tspan></text>
            <text x="1408" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan>60万</tspan></text>
            <text x="1408" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="18" fill="#C8E6C9" text-anchor="middle"><tspan>5%</tspan></text>
        </g>
        
        <!-- 3. 营销费用 20% - 橙色系 -->
        <g id="marketing_cost">
            <rect x="606" y="306" width="894" height="234" rx="9" fill="#F57C00" filter="url(#treemapShadow)"/>
            
            <!-- 3.1 广告投放 60% of 20% = 12% -->
            <rect x="612" y="312" width="525" height="222" rx="6" fill="#FF9800"/>
            <text x="874" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>广告投放</tspan></text>
            <text x="874" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="33" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan>144万</tspan></text>
            <text x="874" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#FFE0B2" text-anchor="middle"><tspan>12%</tspan></text>
            
            <!-- 3.2 品牌活动 40% of 20% = 8% -->
            <rect x="1143" y="312" width="351" height="222" rx="6" fill="#FFB74D"/>
            <text x="1318" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="21" font-weight="600" fill="#E65100" text-anchor="middle"><tspan>品牌活动</tspan></text>
            <text x="1318" y="447" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="30" font-weight="bold" fill="#E65100" text-anchor="middle"><tspan>96万</tspan></text>
            <text x="1318" y="483" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="20" fill="#E65100" text-anchor="middle"><tspan>8%</tspan></text>
        </g>
        
        <!-- 4. 研发投入 10% - 紫色系 -->
        <g id="rd_cost">
            <rect x="606" y="546" width="444" height="174" rx="9" fill="#7B1FA2" filter="url(#treemapShadow)"/>
            
            <rect x="612" y="552" width="432" height="162" rx="6" fill="#9C27B0"/>
            <text x="828" y="615" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>研发投入</tspan></text>
            <text x="828" y="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="36" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan>120万</tspan></text>
            <text x="828" y="698" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#E1BEE7" text-anchor="middle"><tspan>10%</tspan></text>
        </g>
        
        <!-- 5. 其他支出 5% - 灰色系 -->
        <g id="other_cost">
            <rect x="1056" y="546" width="444" height="174" rx="9" fill="#455A64" filter="url(#treemapShadow)"/>
            
            <rect x="1062" y="552" width="432" height="162" rx="6" fill="#607D8B"/>
            <text x="1278" y="615" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan>其他支出</tspan></text>
            <text x="1278" y="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="36" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan>60万</tspan></text>
            <text x="1278" y="698" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#B0BEC5" text-anchor="middle"><tspan>5%</tspan></text>
        </g>
    </g>
    
    <!-- 图例 -->
    <g id="legend" transform="translate(1620, 195)">
        <rect x="0" y="0" width="240" height="360" rx="12" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="2"/>
        
        <text x="120" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle"><tspan>预算分类</tspan></text>
        
        <line x1="22" y1="63" x2="218" y2="63" stroke="#E0E0E0" stroke-width="2"/>
        
        <rect x="30" y="82" width="30" height="30" rx="4" fill="#2196F3"/>
        <text x="75" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>人力成本 40%</tspan></text>
        
        <rect x="30" y="128" width="30" height="30" rx="4" fill="#4CAF50"/>
        <text x="75" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>运营成本 25%</tspan></text>
        
        <rect x="30" y="172" width="30" height="30" rx="4" fill="#FF9800"/>
        <text x="75" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>营销费用 20%</tspan></text>
        
        <rect x="30" y="218" width="30" height="30" rx="4" fill="#9C27B0"/>
        <text x="75" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>研发投入 10%</tspan></text>
        
        <rect x="30" y="262" width="30" height="30" rx="4" fill="#607D8B"/>
        <text x="75" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>其他支出 5%</tspan></text>
        
        <line x1="22" y1="312" x2="218" y2="312" stroke="#E0E0E0" stroke-width="2"/>
        
        <text x="30" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#7F8C8D"><tspan>总预算: 1,200万</tspan></text>
    </g>
    
    <!-- 说明 -->
    <g id="note" transform="translate(1620, 585)">
        <rect x="0" y="0" width="240" height="120" rx="12" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
        <text x="22" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" font-weight="600" fill="#1976D2"><tspan>📊 图表说明</tspan></text>
        <text x="22" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="16" fill="#5D6D7E"><tspan>矩形面积代表预算</tspan></text>
        <text x="22" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="16" fill="#5D6D7E"><tspan>占比大小，颜色区</tspan></text>
        <text x="22" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="16" fill="#5D6D7E"><tspan>分不同预算类别</tspan></text>
    </g>
    
    <!-- 数据来源 -->
    <text x="90" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#95A5A6">
        <tspan>数据来源: 财务部门年度预算报告</tspan>
    </text>
</svg>

