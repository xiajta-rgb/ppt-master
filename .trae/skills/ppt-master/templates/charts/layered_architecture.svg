  <text x="1245" y="609" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#566573">异步解耦 · 事件驱动</text>
  <text x="1245" y="630" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#7F8C8D">Kafka · RocketMQ</text>

