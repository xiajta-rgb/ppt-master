  <text x="945" y="333" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1A252F">开放 API</text>
  <line x1="894" y1="357" x2="1194" y2="357" stroke="#E7E6E6" stroke-width="2"/>
  <text x="894" y="384" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#566573">REST / GraphQL · 对外集成</text>
  <text x="894" y="405" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#7F8C8D">OAuth2 · API Key</text>

  <!-- 模块卡 1.4 -->
  <rect x="1230" y="288" width="330" height="123" fill="#FFFFFF" stroke="#C9D8E9" stroke-width="2"/>
  <rect x="1230" y="288" width="330" height="6" fill="#2E75B6"/>
  <rect x="1245" y="306" width="39" height="39" fill="#5B9BD5"/>
  <text x="1264" y="333" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">C</text>
  <text x="1296" y="333" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1A252F">CLI 工具</text>
  <line x1="1245" y1="357" x2="1545" y2="357" stroke="#E7E6E6" stroke-width="2"/>
  <text x="1245" y="384" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#566573">命令行与自动化脚本入口</text>
  <text x="1245" y="405" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#7F8C8D">面向 DevOps 与 CI/CD</text>

