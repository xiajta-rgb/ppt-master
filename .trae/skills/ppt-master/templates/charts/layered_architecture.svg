<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!--
  分层架构图模板 (Layered Architecture)
  用途: 系统/软件分层架构展示 (应用-服务-数据 / 前端-业务-基础设施)
  适用场景: 技术架构概览、分层职责划分、纵向依赖关系、中台总体视图
  支持: 3 层主干 + 左侧行标签 + 右侧能力出口列 + 底部基础支撑带
  关键约定:
    - 每个模块卡 = 模块标题 + 1 行能力描述；两段文本必须同时填写
    - 左侧行标签给每一层起名（应用层/服务层/数据层）
    - 红色编号徽章标注每一层的序号
    - 右侧"能力输出"列承载跨层对外输出或开放能力
    - 底部"基础支撑"带承载底层共用能力 (日志/监控/权限等)
  -->

  <!-- 背景 -->
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

  <!-- 标题 -->
  <rect x="45" y="33" width="15" height="60" fill="#C00000"/>
  <text x="78" y="82" font-family="Microsoft YaHei, sans-serif" font-size="45" font-weight="700" fill="#C00000">系统分层总体架构视图</text>

  <!-- 副标题带 -->
  <rect x="45" y="117" width="1830" height="69" fill="#F2F2F2"/>
  <text x="960" y="148" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1A252F">
    <tspan x="960" dy="0">自上而下三层能力栈 + 右侧统一能力出口 + 底部共用支撑，上层依赖下层，跨层通过标准契约通信</tspan>
    <tspan x="960" dy="33" fill="#7F8C8D" font-weight="400">每个模块卡 = 模块标题 + 1 行能力描述；缺任一段即退回 icon_grid 或 numbered_steps</tspan>
  </text>

  <!-- ==================== 层 1: 应用层 ==================== -->
  <!-- 左侧行标签 + 编号 -->
  <rect x="45" y="225" width="45" height="45" fill="#C00000"/>
  <text x="68" y="258" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">1</text>
  <text x="48" y="327" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#1A252F">应用</text>
  <text x="48" y="366" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#1A252F">层</text>

  <!-- 主内容区 (左 x=100, 右 x=1050) -->
  <rect x="150" y="225" width="1425" height="210" fill="none" stroke="#2E75B6" stroke-width="2.2" stroke-dasharray="5 5"/>
  <rect x="150" y="225" width="1425" height="42" fill="#EAF1F8"/>
  <text x="862" y="254" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#2E75B6">面向终端用户与第三方的访问入口 · Presentation</text>

  <!-- 模块卡 1.1 -->
  <rect x="177" y="288" width="330" height="123" fill="#FFFFFF" stroke="#C9D8E9" stroke-width="2"/>
  <rect x="177" y="288" width="330" height="6" fill="#2E75B6"/>
  <rect x="192" y="306" width="39" height="39" fill="#5B9BD5"/>
  <text x="212" y="333" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">W</text>
  <text x="243" y="333" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1A252F">Web 控制台</text>
  <line x1="192" y1="357" x2="492" y2="357" stroke="#E7E6E6" stroke-width="2"/>
  <text x="192" y="384" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#566573">React SPA · 管理与可视化界面</text>
  <text x="192" y="405" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#7F8C8D">HTTPS / WebSocket</text>

  <!-- 模块卡 1.2 -->
  <rect x="528" y="288" width="330" height="123" fill="#FFFFFF" stroke="#C9D8E9" stroke-width="2"/>
  <rect x="528" y="288" width="330" height="6" fill="#2E75B6"/>
  <rect x="543" y="306" width="39" height="39" fill="#5B9BD5"/>
  <text x="562" y="333" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">M</text>
  <text x="594" y="333" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1A252F">移动端 App</text>
  <line x1="543" y1="357" x2="843" y2="357" stroke="#E7E6E6" stroke-width="2"/>
  <text x="543" y="384" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#566573">iOS / Android 原生客户端</text>
  <text x="543" y="405" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#7F8C8D">HTTP/2 · 支持离线缓存</text>

  <!-- 模块卡 1.3 -->
  <rect x="879" y="288" width="330" height="123" fill="#FFFFFF" stroke="#C9D8E9" stroke-width="2"/>
  <rect x="879" y="288" width="330" height="6" fill="#2E75B6"/>
  <rect x="894" y="306" width="39" height="39" fill="#5B9BD5"/>
