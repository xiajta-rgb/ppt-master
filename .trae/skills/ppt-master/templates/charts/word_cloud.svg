<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!--
    词云图模板
    用途: 关键词权重可视化、热点话题、标签分布
    适用场景: 用户反馈关键词、行业热点、技术栈概览
    支持: 20-30个关键词 (大小表示权重)
    -->

    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#EEF1F5;stop-opacity:1"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <!-- 标题 -->
    <text x="960" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="45" font-weight="700" fill="#1A252F">行业热点关键词</text>
    <text x="960" y="123" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">Word Cloud · 字号大小反映关键词热度权重</text>

    <!-- 词云主体 (手动排布, 大小=权重) -->
    <!-- Tier 1: 最大 (核心关键词) -->
    <text x="780" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="87" font-weight="800" fill="#6C5CE7" fill-opacity="0.9">人工智能</text>
    <text x="600" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="78" font-weight="800" fill="#0984E3" fill-opacity="0.85">大模型</text>

    <!-- Tier 2: 次大 -->
    <text x="1125" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="63" font-weight="700" fill="#00B894" fill-opacity="0.85">数字化转型</text>
    <text x="270" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="57" font-weight="700" fill="#E17055" fill-opacity="0.8">云计算</text>
    <text x="975" y="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="60" font-weight="700" fill="#D4A537" fill-opacity="0.8">智能制造</text>

    <!-- Tier 3: 中等 -->
    <text x="165" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="45" font-weight="600" fill="#A29BFE" fill-opacity="0.75">数据安全</text>
    <text x="1350" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="48" font-weight="600" fill="#74B9FF" fill-opacity="0.8">自动驾驶</text>
    <text x="210" y="675" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="42" font-weight="600" fill="#55EFC4" fill-opacity="0.8">边缘计算</text>
    <text x="1380" y="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="45" font-weight="600" fill="#E74C3C" fill-opacity="0.7">元宇宙</text>
    <text x="525" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="42" font-weight="600" fill="#0984E3" fill-opacity="0.7">区块链</text>

    <!-- Tier 4: 较小 -->
    <text x="870" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="33" font-weight="500" fill="#6C5CE7" fill-opacity="0.6">量子计算</text>
    <text x="1275" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="33" font-weight="500" fill="#E17055" fill-opacity="0.6">Web3.0</text>
    <text x="1530" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="36" font-weight="500" fill="#00B894" fill-opacity="0.65">物联网</text>
    <text x="120" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="30" font-weight="500" fill="#D63031" fill-opacity="0.6">机器学习</text>
    <text x="960" y="780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="36" font-weight="500" fill="#A29BFE" fill-opacity="0.65">低代码</text>
    <text x="450" y="750" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="33" font-weight="500" fill="#74B9FF" fill-opacity="0.65">数字孪生</text>

    <!-- Tier 5: 最小 -->
    <text x="1170" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="26" font-weight="400" fill="#95A5A6" fill-opacity="0.6">RPA</text>
    <text x="1620" y="705" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="400" fill="#BDC3C7" fill-opacity="0.6">GPT</text>
    <text x="1500" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="400" fill="#A29BFE" fill-opacity="0.55">DevOps</text>
    <text x="195" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="400" fill="#00B894" fill-opacity="0.5">零信任</text>
    <text x="750" y="855" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" font-weight="400" fill="#E17055" fill-opacity="0.55">多模态</text>
    <text x="1320" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="26" font-weight="400" fill="#6C5CE7" fill-opacity="0.5">知识图谱</text>
    <text x="375" y="855" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="400" fill="#D4A537" fill-opacity="0.5">AIGC</text>
    <text x="1575" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="400" fill="#74B9FF" fill-opacity="0.5">联邦学习</text>
    <text x="1050" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="400" fill="#55EFC4" fill-opacity="0.5">隐私计算</text>

    <!-- 图例 -->
    <rect x="90" y="945" width="600" height="82" rx="12" fill="#FFFFFF" fill-opacity="0.6"/>
    <text x="120" y="978" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" font-weight="600" fill="#5F6368">权重等级:</text>
    <text x="240" y="978" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="30" font-weight="800" fill="#6C5CE7">极高</text>
    <text x="330" y="978" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="600" fill="#0984E3">高</text>
    <text x="390" y="978" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" font-weight="500" fill="#00B894">中</text>
    <text x="450" y="978" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" font-weight="400" fill="#95A5A6">低</text>
    <text x="120" y="1011" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#BDC3C7">字号越大代表该关键词在行业讨论中出现频率越高</text>

    <!-- 数据来源 -->
    <text x="1830" y="1035" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#BDC3C7">数据来源: 行业报告与社交媒体分析 · 2025年度</text>
</svg>