<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    矩阵图模板 (2×2) - CRAP 深度优化版
    用途: 四象限分析
    适用场景: 波士顿矩阵、风险评估、优先级分析
    优化重点:
      - 对齐: 网格化布局，统一边距
      - 对比: 强化色彩层次和视觉重量
      - 重复: 统一字体大小、间距、样式
      - 亲密性: 优化元素分组和留白
    -->
    
    <defs>
        <!-- 象限渐变背景 - 优化对比度和饱和度 -->
        <linearGradient id="quadrant1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="quadrant2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFF8E1;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FFE082;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="quadrant3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFEBEE;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FFCDD2;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="quadrant4" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
        </linearGradient>
        
        <!-- 整体背景渐变 -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FAFBFC;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F5F6F8;stop-opacity:1" />
        </linearGradient>
        
        <!-- 数据点阴影 - 柔和深度感 -->
        <filter id="bubbleShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
            <feOffset dx="0" dy="6"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.25"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- 坐标轴箭头标记 -->
        <marker id="arrowX" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
            <path d="M 3,3 L 18,10 L 3,18 Z" fill="#1A252F"/>
        </marker>
        <marker id="arrowY" markerWidth="14" markerHeight="14" refX="7" refY="2" orient="auto">
            <path d="M 3,18 L 10,3 L 18,18 Z" fill="#1A252F"/>
        </marker>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#bgGradient)"/>
    
    <!-- 标题区域 - 增强层级 -->
    <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="54" font-weight="700" fill="#1A252F" letter-spacing="-0.8">
        <tspan>产品组合矩阵分析</tspan>
    </text>
    <text x="90" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="22" fill="#9AA0A6">
        <tspan>Boston Matrix · Product Portfolio Analysis</tspan>
    </text>
    
    <text x="90" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" font-weight="500" fill="#5F6368">
        <tspan>市场增长率 vs 市场占有率 · 气泡大小代表营收规模</tspan>
    </text>
    
    <!-- 矩阵主区域 - 优化布局，中心点 (565, 410) -->
    <g id="matrixArea">
        <!-- 象限背景 - 统一尺寸 480×240，增强边框对比 -->
        <!-- 象限1: 右上 (高增长, 高份额) - 明星 -->
        <rect x="848" y="255" width="720" height="360" fill="url(#quadrant1)" 
              stroke="#FFFFFF" stroke-width="4" rx="3"/>
        
        <!-- 象限2: 左上 (高增长, 低份额) - 问题 -->
        <rect x="128" y="255" width="720" height="360" fill="url(#quadrant2)" 
              stroke="#FFFFFF" stroke-width="4" rx="3"/>
        
        <!-- 象限3: 左下 (低增长, 低份额) - 瘦狗 -->
        <rect x="128" y="615" width="720" height="360" fill="url(#quadrant3)" 
              stroke="#FFFFFF" stroke-width="4" rx="3"/>
        
        <!-- 象限4: 右下 (低增长, 高份额) - 现金牛 -->
        <rect x="848" y="615" width="720" height="360" fill="url(#quadrant4)" 
              stroke="#FFFFFF" stroke-width="4" rx="3"/>
        
        <!-- 坐标轴 - 清晰有力 -->
        <line x1="128" y1="615" x2="1568" y2="615" stroke="#1A252F" stroke-width="6" 
              marker-end="url(#arrowX)"/>
        <line x1="848" y1="255" x2="848" y2="975" stroke="#1A252F" stroke-width="6" 
              marker-start="url(#arrowY)"/>
        
        <!-- X轴标签 - 统一样式层级 -->
        <text x="848" y="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#1A252F" text-anchor="middle">
            <tspan>市场占有率 Market Share</tspan>
        </text>
        <text x="330" y="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="500" fill="#5F6368" text-anchor="middle">
            <tspan>低 Low</tspan>
        </text>
        <text x="1365" y="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="500" fill="#5F6368" text-anchor="middle">
            <tspan>高 High</tspan>
        </text>
        
        <!-- Y轴标签 - 统一样式层级 -->
        <text x="60" y="615" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#1A252F" text-anchor="middle" 
              transform="rotate(-135, 60, 615)">
            <tspan>市场增长率</tspan>
        </text>
        <text x="38" y="615" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#9AA0A6" text-anchor="middle" 
              transform="rotate(-135, 38, 615)">
            <tspan>Growth Rate</tspan>
        </text>
        <!-- Y轴端点标记 - 优化对齐 -->
        <text x="75" y="982" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="500" fill="#5F6368">
            <tspan>低</tspan>
        </text>
        <text x="75" y="1002" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#9AA0A6">
            <tspan>Low</tspan>
        </text>
        
        <text x="75" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="500" fill="#5F6368">
            <tspan>高</tspan>
        </text>
        <text x="75" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#9AA0A6">
            <tspan>High</tspan>
        </text>
        
        <!-- 象限标签 - 对齐优化，统一间距 -->
        <!-- 左上：问题产品 -->
        <text x="158" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="700" fill="#F57C00">
            <tspan>问题产品</tspan>
        </text>
        <text x="158" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#E65100">
            <tspan>Question Marks</tspan>
        </text>
        <text x="158" y="357" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="500" fill="#D84315">
            <tspan>高投入 · 低回报</tspan>
        </text>
        
        <!-- 右上：明星产品 -->
        <text x="878" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="700" fill="#388E3C">
            <tspan>明星产品</tspan>
        </text>
        <text x="878" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#2E7D32">
            <tspan>Stars</tspan>
        </text>
        <text x="878" y="357" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="500" fill="#1B5E20">
            <tspan>高投入 · 高回报</tspan>
        </text>
        
        <!-- 左下：瘦狗产品 -->
        <text x="158" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="700" fill="#D32F2F">
            <tspan>瘦狗产品</tspan>
        </text>
        <text x="158" y="945" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#C62828">
            <tspan>Dogs</tspan>
        </text>
        
        <!-- 右下：现金牛产品 -->
        <text x="878" y="915" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="700" fill="#1976D2">
            <tspan>现金牛产品</tspan>
        </text>
        <text x="878" y="945" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#1565C0">
            <tspan>Cash Cows</tspan>
        </text>
        
        <!-- 数据点 (气泡图) - 重新定位，统一样式 -->
        <!-- 产品A: 明星 (市场份额: 高75%, 增长率: 高35%, 营收: 大) -->
        <circle cx="1318" cy="370" r="82" fill="#4CAF50" opacity="0.9" filter="url(#bubbleShadow)"/>
        <text x="1318" y="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">
            <tspan>产品A</tspan>
        </text>
        <text x="1318" y="394" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#FFFFFF" text-anchor="middle">
            <tspan>¥3.2亿</tspan>
        </text>
        
        <!-- 产品B: 现金牛 (市场份额: 高80%, 增长率: 低8%, 营收: 最大) -->
        <circle cx="1402" cy="816" r="105" fill="#2196F3" opacity="0.9" filter="url(#bubbleShadow)"/>
        <text x="1402" y="810" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">
            <tspan>产品B</tspan>
        </text>
        <text x="1402" y="840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="middle">
            <tspan>¥4.8亿</tspan>
        </text>
        
        <!-- 产品C: 问题 (市场份额: 低25%, 增长率: 高40%, 营收: 中) -->
        <circle cx="404" cy="342" r="63" fill="#FF9800" opacity="0.9" filter="url(#bubbleShadow)"/>
        <text x="404" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">
            <tspan>产品C</tspan>
        </text>
        <text x="404" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">
            <tspan>¥1.6亿</tspan>
        </text>
        
        <!-- 产品D: 问题 (市场份额: 低30%, 增长率: 高28%, 营收: 中) -->
        <circle cx="488" cy="464" r="57" fill="#FF9800" opacity="0.9" filter="url(#bubbleShadow)"/>
        <text x="488" y="459" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">
            <tspan>产品D</tspan>
        </text>
        <text x="488" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">
            <tspan>¥1.2亿</tspan>
        </text>
        
        <!-- 产品E: 瘦狗 (市场份额: 低15%, 增长率: 低5%, 营收: 小) -->
        <circle cx="292" cy="860" r="45" fill="#E74C3C" opacity="0.9" filter="url(#bubbleShadow)"/>
        <text x="292" y="856" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">
            <tspan>产品E</tspan>
        </text>
        <text x="292" y="880" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">
            <tspan>¥0.5亿</tspan>
        </text>
        
        <!-- 产品F: 现金牛 (市场份额: 中60%, 增长率: 低12%, 营收: 中) -->
        <circle cx="1112" cy="759" r="68" fill="#2196F3" opacity="0.9" filter="url(#bubbleShadow)"/>
        <text x="1112" y="754" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">
            <tspan>产品F</tspan>
        </text>
        <text x="1112" y="782" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">
            <tspan>¥1.8亿</tspan>
        </text>
        
        <!-- 产品G: 明星 (市场份额: 中55%, 增长率: 高30%, 营收: 中) -->
        <circle cx="1042" cy="428" r="60" fill="#4CAF50" opacity="0.9" filter="url(#bubbleShadow)"/>
        <text x="1042" y="423" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">
            <tspan>产品G</tspan>
        </text>
        <text x="1042" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">
            <tspan>¥1.4亿</tspan>
        </text>
    </g>
    
    <!-- 战略建议框 - 重新设计，优化亲密性与留白 -->
    <g id="strategicRecommendations">
        <!-- 背景卡片 -->
        <rect x="1605" y="270" width="255" height="360" fill="#FFFFFF" 
              stroke="#E0E0E0" stroke-width="2.2" rx="12" opacity="0.95"/>
        
        <!-- 标题 -->
        <text x="1732" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="700" fill="#1A252F" text-anchor="middle">
            <tspan>战略建议</tspan>
        </text>
        
        <!-- 分隔线 -->
        <line x1="1628" y1="338" x2="1838" y2="338" stroke="#E0E0E0" stroke-width="2"/>
        
        <!-- 明星产品 -->
        <circle cx="1635" cy="375" r="9" fill="#4CAF50" opacity="0.9"/>
        <text x="1658" y="381" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" font-weight="600" fill="#388E3C">
            <tspan>明星: 持续投资</tspan>
        </text>
        
        <!-- 问题产品 -->
        <circle cx="1635" cy="428" r="9" fill="#FF9800" opacity="0.9"/>
        <text x="1658" y="434" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" font-weight="600" fill="#F57C00">
            <tspan>问题: 选择性投资</tspan>
        </text>
        
        <!-- 现金牛产品 -->
        <circle cx="1635" cy="480" r="9" fill="#2196F3" opacity="0.9"/>
        <text x="1658" y="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" font-weight="600" fill="#1976D2">
            <tspan>现金牛: 收割</tspan>
        </text>
        
        <!-- 瘦狗产品 -->
        <circle cx="1635" cy="532" r="9" fill="#E74C3C" opacity="0.9"/>
        <text x="1658" y="538" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" font-weight="600" fill="#D32F2F">
            <tspan>瘦狗: 撤资</tspan>
        </text>
        
        <!-- 底部说明 -->
        <text x="1732" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="15" fill="#9AA0A6" text-anchor="middle">
            <tspan>气泡大小 = 营收规模</tspan>
        </text>
    </g>
    
    <!-- 数据来源 - 优化样式 -->
    <text x="90" y="1058" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#9AA0A6">
        <tspan>数据来源: 市场研究部门分析 | Source: Market Research Department</tspan>
    </text>
</svg>

