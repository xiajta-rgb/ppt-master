<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    组织结构图模板
    用途: 层级关系展示、组织架构、汇报关系
    适用场景: 公司架构、团队结构、项目组织
    支持: 3层结构（可扩展）
    -->
    
    <defs>
        <!-- 卡片阴影 -->
        <filter id="orgShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="3"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.15"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- CEO卡片渐变 -->
        <linearGradient id="ceoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
        </linearGradient>
        
        <!-- 副总裁卡片渐变 -->
        <linearGradient id="vpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#388E3C;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#F8F9FA"/>
    
    <!-- 标题 -->
    <text x="960" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50" text-anchor="middle">
        <tspan>公司组织架构</tspan>
    </text>
    
    <!-- 连接线 - 第1层到第2层 -->
    <line x1="960" y1="262" x2="960" y2="315" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="225" y1="315" x2="1695" y2="315" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="225" y1="315" x2="225" y2="368" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="592" y1="315" x2="592" y2="368" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="960" y1="315" x2="960" y2="368" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="1328" y1="315" x2="1328" y2="368" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="1695" y1="315" x2="1695" y2="368" stroke="#BDC3C7" stroke-width="3"/>
    
    <!-- 连接线 - 第2层到第3层 -->
    <!-- 技术VP → 前端、后端 -->
    <line x1="225" y1="532" x2="225" y2="585" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="150" y1="585" x2="300" y2="585" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="150" y1="585" x2="150" y2="638" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="300" y1="585" x2="300" y2="638" stroke="#BDC3C7" stroke-width="3"/>
    
    <!-- 产品VP → 产品设计、用户研究 -->
    <line x1="592" y1="532" x2="592" y2="585" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="518" y1="585" x2="668" y2="585" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="518" y1="585" x2="518" y2="638" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="668" y1="585" x2="668" y2="638" stroke="#BDC3C7" stroke-width="3"/>
    
    <!-- 销售VP → 华东、华南 -->
    <line x1="960" y1="532" x2="960" y2="585" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="885" y1="585" x2="1035" y2="585" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="885" y1="585" x2="885" y2="638" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="1035" y1="585" x2="1035" y2="638" stroke="#BDC3C7" stroke-width="3"/>
    
    <!-- 财务VP → 财务核算、预算管理 -->
    <line x1="1328" y1="532" x2="1328" y2="585" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="1252" y1="585" x2="1402" y2="585" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="1252" y1="585" x2="1252" y2="638" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="1402" y1="585" x2="1402" y2="638" stroke="#BDC3C7" stroke-width="3"/>
    
    <!-- 人力VP → 招聘培训、薪酬福利 -->
    <line x1="1695" y1="532" x2="1695" y2="585" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="1620" y1="585" x2="1770" y2="585" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="1620" y1="585" x2="1620" y2="638" stroke="#BDC3C7" stroke-width="3"/>
    <line x1="1770" y1="585" x2="1770" y2="638" stroke="#BDC3C7" stroke-width="3"/>
    
    <!-- 第1层 - CEO -->
    <g filter="url(#orgShadow)">
        <rect x="810" y="128" width="300" height="135" rx="12" fill="url(#ceoGrad)"/>
        <text x="960" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan>张三</tspan>
        </text>
        <text x="960" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#E3F2FD" text-anchor="middle">
            <tspan>首席执行官 CEO</tspan>
        </text>
    </g>
    
    <!-- 第2层 - 副总裁们 (宽度180px, 间距调整) -->
    <g filter="url(#orgShadow)">
        <rect x="90" y="368" width="270" height="165" rx="12" fill="url(#vpGrad)"/>
        <text x="225" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan>李四</tspan>
        </text>
        <text x="225" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#E8F5E9" text-anchor="middle">
            <tspan>技术副总裁</tspan>
        </text>
        <text x="225" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#C8E6C9" text-anchor="middle">
            <tspan>VP of Engineering</tspan>
        </text>
    </g>
    
    <g filter="url(#orgShadow)">
        <rect x="458" y="368" width="270" height="165" rx="12" fill="url(#vpGrad)"/>
        <text x="592" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan>王五</tspan>
        </text>
        <text x="592" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#E8F5E9" text-anchor="middle">
            <tspan>产品副总裁</tspan>
        </text>
        <text x="592" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#C8E6C9" text-anchor="middle">
            <tspan>VP of Product</tspan>
        </text>
    </g>
    
    <g filter="url(#orgShadow)">
        <rect x="825" y="368" width="270" height="165" rx="12" fill="url(#vpGrad)"/>
        <text x="960" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan>赵六</tspan>
        </text>
        <text x="960" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#E8F5E9" text-anchor="middle">
            <tspan>销售副总裁</tspan>
        </text>
        <text x="960" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#C8E6C9" text-anchor="middle">
            <tspan>VP of Sales</tspan>
        </text>
    </g>
    
    <g filter="url(#orgShadow)">
        <rect x="1192" y="368" width="270" height="165" rx="12" fill="url(#vpGrad)"/>
        <text x="1328" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan>钱七</tspan>
        </text>
        <text x="1328" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#E8F5E9" text-anchor="middle">
            <tspan>财务副总裁</tspan>
        </text>
        <text x="1328" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#C8E6C9" text-anchor="middle">
            <tspan>VP of Finance</tspan>
        </text>
    </g>
    
    <g filter="url(#orgShadow)">
        <rect x="1560" y="368" width="270" height="165" rx="12" fill="url(#vpGrad)"/>
        <text x="1695" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan>孙八</tspan>
        </text>
        <text x="1695" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#E8F5E9" text-anchor="middle">
            <tspan>人力副总裁</tspan>
        </text>
        <text x="1695" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#C8E6C9" text-anchor="middle">
            <tspan>VP of HR</tspan>
        </text>
    </g>
    
    <!-- 第3层 - 部门负责人 (宽度90px, 避免重叠) -->
    <!-- 技术VP下属 -->
    <g filter="url(#orgShadow)">
        <rect x="82" y="638" width="135" height="105" rx="9" fill="#FFFFFF" stroke="#2196F3" stroke-width="3"/>
        <text x="150" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>前端团队</tspan>
        </text>
        <text x="150" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D" text-anchor="middle">
            <tspan>12人</tspan>
        </text>
    </g>
    
    <g filter="url(#orgShadow)">
        <rect x="232" y="638" width="135" height="105" rx="9" fill="#FFFFFF" stroke="#2196F3" stroke-width="3"/>
        <text x="300" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>后端团队</tspan>
        </text>
        <text x="300" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D" text-anchor="middle">
            <tspan>15人</tspan>
        </text>
    </g>
    
    <!-- 产品VP下属 -->
    <g filter="url(#orgShadow)">
        <rect x="450" y="638" width="135" height="105" rx="9" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3"/>
        <text x="518" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>产品设计</tspan>
        </text>
        <text x="518" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D" text-anchor="middle">
            <tspan>8人</tspan>
        </text>
    </g>
    
    <g filter="url(#orgShadow)">
        <rect x="600" y="638" width="135" height="105" rx="9" fill="#FFFFFF" stroke="#4CAF50" stroke-width="3"/>
        <text x="668" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>用户研究</tspan>
        </text>
        <text x="668" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D" text-anchor="middle">
            <tspan>5人</tspan>
        </text>
    </g>
    
    <!-- 销售VP下属 -->
    <g filter="url(#orgShadow)">
        <rect x="818" y="638" width="135" height="105" rx="9" fill="#FFFFFF" stroke="#FF9800" stroke-width="3"/>
        <text x="885" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>华东区</tspan>
        </text>
        <text x="885" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D" text-anchor="middle">
            <tspan>20人</tspan>
        </text>
    </g>
    
    <g filter="url(#orgShadow)">
        <rect x="968" y="638" width="135" height="105" rx="9" fill="#FFFFFF" stroke="#FF9800" stroke-width="3"/>
        <text x="1035" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>华南区</tspan>
        </text>
        <text x="1035" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D" text-anchor="middle">
            <tspan>18人</tspan>
        </text>
    </g>
    
    <!-- 财务VP下属 -->
    <g filter="url(#orgShadow)">
        <rect x="1185" y="638" width="135" height="105" rx="9" fill="#FFFFFF" stroke="#9C27B0" stroke-width="3"/>
        <text x="1252" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>财务核算</tspan>
        </text>
        <text x="1252" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D" text-anchor="middle">
            <tspan>6人</tspan>
        </text>
    </g>
    
    <g filter="url(#orgShadow)">
        <rect x="1335" y="638" width="135" height="105" rx="9" fill="#FFFFFF" stroke="#9C27B0" stroke-width="3"/>
        <text x="1402" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>预算管理</tspan>
        </text>
        <text x="1402" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D" text-anchor="middle">
            <tspan>4人</tspan>
        </text>
    </g>
    
    <!-- 人力VP下属 -->
    <g filter="url(#orgShadow)">
        <rect x="1552" y="638" width="135" height="105" rx="9" fill="#FFFFFF" stroke="#E91E63" stroke-width="3"/>
        <text x="1620" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>招聘培训</tspan>
        </text>
        <text x="1620" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D" text-anchor="middle">
            <tspan>5人</tspan>
        </text>
    </g>
    
    <g filter="url(#orgShadow)">
        <rect x="1702" y="638" width="135" height="105" rx="9" fill="#FFFFFF" stroke="#E91E63" stroke-width="3"/>
        <text x="1770" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" font-weight="600" fill="#2C3E50" text-anchor="middle">
