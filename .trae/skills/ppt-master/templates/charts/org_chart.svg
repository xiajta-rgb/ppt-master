    <!-- 统计信息 -->
    <text x="960" y="840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" fill="#7F8C8D" text-anchor="middle">
        <tspan>总员工数: 96人 | 管理层: 6人 | 部门: 10个</tspan>
    </text>
    
    <!-- 更新时间 -->
    <text x="90" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" fill="#95A5A6">
        <tspan>更新时间: 2025年12月</tspan>
    </text>
</svg>
