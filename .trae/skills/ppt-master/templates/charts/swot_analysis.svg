<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    SWOT Analysis Chart Template
    Purpose: Strategic analysis, competitive assessment
    Use cases: Business plans, strategic planning, competitor analysis, project evaluation
    Supports: Four quadrant display (Strengths, Weaknesses, Opportunities, Threats)
    -->
    
    <defs>
        <linearGradient id="strengthsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="weaknessesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFEBEE;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FFCDD2;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="opportunitiesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="threatsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FFE0B2;stop-opacity:1" />
        </linearGradient>
        
        <filter id="cardShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="3"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <rect width="1920" height="1080" fill="#FAFBFC"/>
    
    <text x="960" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50" text-anchor="middle">
        <tspan>SWOT Strategic Analysis</tspan>
    </text>
    
    <text x="960" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D" text-anchor="middle">
        <tspan>ABC Tech Company - 2025 Market Competition Assessment</tspan>
    </text>
    
    <!-- Axis labels -->
    <text x="518" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" font-weight="600" fill="#4CAF50" text-anchor="middle">
        <tspan>Helpful</tspan>
    </text>
    <text x="1402" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" font-weight="600" fill="#E74C3C" text-anchor="middle">
        <tspan>Harmful</tspan>
    </text>
    
    <text x="45" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" font-weight="600" fill="#5D6D7E" text-anchor="middle" transform="rotate(-135, 45, 435)">
        <tspan>Internal</tspan>
    </text>
    <text x="45" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" font-weight="600" fill="#5D6D7E" text-anchor="middle" transform="rotate(-135, 45, 795)">
        <tspan>External</tspan>
    </text>
    
    <!-- S - Strengths (Top Left) -->
    <g id="strengths">
        <rect x="90" y="195" width="855" height="360" rx="18" fill="url(#strengthsGrad)" 
              stroke="#4CAF50" stroke-width="4" filter="url(#cardShadow)"/>
        
        <rect x="90" y="195" width="855" height="75" rx="18" fill="#4CAF50"/>
        <rect x="90" y="252" width="855" height="18" fill="#4CAF50"/>
        <text x="135" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="42" font-weight="bold" fill="#FFFFFF">
            <tspan>S</tspan>
        </text>
        <text x="188" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="33" font-weight="bold" fill="#FFFFFF">
            <tspan>Strengths</tspan>
        </text>
        
        <circle cx="128" cy="315" r="9" fill="#4CAF50"/>
        <text x="150" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Strong R&amp;D team, 200+ tech patents</tspan>
        </text>
        
        <circle cx="128" cy="368" r="9" fill="#4CAF50"/>
        <text x="150" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>High brand recognition, 85% customer loyalty</tspan>
        </text>
        
        <circle cx="128" cy="420" r="9" fill="#4CAF50"/>
        <text x="150" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Complete supply chain, 15% cost advantage</tspan>
        </text>
        
        <circle cx="128" cy="472" r="9" fill="#4CAF50"/>
        <text x="150" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Strong cash flow, stable financials</tspan>
        </text>
        
        <circle cx="128" cy="525" r="9" fill="#4CAF50"/>
        <text x="150" y="532" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Efficient management team, strong execution</tspan>
        </text>
    </g>
    
    <!-- W - Weaknesses (Top Right) -->
    <g id="weaknesses">
        <rect x="975" y="195" width="855" height="360" rx="18" fill="url(#weaknessesGrad)" 
              stroke="#E74C3C" stroke-width="4" filter="url(#cardShadow)"/>
        
        <rect x="975" y="195" width="855" height="75" rx="18" fill="#E74C3C"/>
        <rect x="975" y="252" width="855" height="18" fill="#E74C3C"/>
        <text x="1020" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="42" font-weight="bold" fill="#FFFFFF">
            <tspan>W</tspan>
        </text>
        <text x="1080" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="33" font-weight="bold" fill="#FFFFFF">
            <tspan>Weaknesses</tspan>
        </text>
        
        <circle cx="1012" cy="315" r="9" fill="#E74C3C"/>
        <text x="1035" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Insufficient marketing investment</tspan>
        </text>
        
        <circle cx="1012" cy="368" r="9" fill="#E74C3C"/>
        <text x="1035" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Single product line, core product dependency</tspan>
        </text>
        
        <circle cx="1012" cy="420" r="9" fill="#E74C3C"/>
        <text x="1035" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Lack of overseas market experience</tspan>
        </text>
        
        <circle cx="1012" cy="472" r="9" fill="#E74C3C"/>
        <text x="1035" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>High talent turnover rate (12%)</tspan>
        </text>
        
        <circle cx="1012" cy="525" r="9" fill="#E74C3C"/>
        <text x="1035" y="532" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>After-sales response needs improvement</tspan>
        </text>
    </g>
    
    <!-- O - Opportunities (Bottom Left) -->
    <g id="opportunities">
        <rect x="90" y="585" width="855" height="360" rx="18" fill="url(#opportunitiesGrad)" 
              stroke="#2196F3" stroke-width="4" filter="url(#cardShadow)"/>
        
        <rect x="90" y="585" width="855" height="75" rx="18" fill="#2196F3"/>
        <rect x="90" y="642" width="855" height="18" fill="#2196F3"/>
        <text x="135" y="634" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="42" font-weight="bold" fill="#FFFFFF">
            <tspan>O</tspan>
        </text>
        <text x="188" y="634" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="33" font-weight="bold" fill="#FFFFFF">
            <tspan>Opportunities</tspan>
        </text>
        
        <circle cx="128" cy="705" r="9" fill="#2196F3"/>
        <text x="150" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>AI industry growing at 25% CAGR</tspan>
        </text>
        
        <circle cx="128" cy="758" r="9" fill="#2196F3"/>
        <text x="150" y="765" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Increased policy support and subsidies</tspan>
        </text>
        
        <circle cx="128" cy="810" r="9" fill="#2196F3"/>
        <text x="150" y="818" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Strong demand in emerging markets (SEA)</tspan>
        </text>
        
        <circle cx="128" cy="862" r="9" fill="#2196F3"/>
        <text x="150" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Competitors repositioning, market share available</tspan>
        </text>
        
        <circle cx="128" cy="915" r="9" fill="#2196F3"/>
        <text x="150" y="922" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Digital transformation driving enterprise demand</tspan>
        </text>
    </g>
    
    <!-- T - Threats (Bottom Right) -->
    <g id="threats">
        <rect x="975" y="585" width="855" height="360" rx="18" fill="url(#threatsGrad)" 
              stroke="#FF9800" stroke-width="4" filter="url(#cardShadow)"/>
        
        <rect x="975" y="585" width="855" height="75" rx="18" fill="#FF9800"/>
        <rect x="975" y="642" width="855" height="18" fill="#FF9800"/>
        <text x="1020" y="634" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="42" font-weight="bold" fill="#FFFFFF">
            <tspan>T</tspan>
        </text>
        <text x="1072" y="634" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="33" font-weight="bold" fill="#FFFFFF">
            <tspan>Threats</tspan>
        </text>
        
        <circle cx="1012" cy="705" r="9" fill="#FF9800"/>
        <text x="1035" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Intensified competition, giants entering market</tspan>
        </text>
        
        <circle cx="1012" cy="758" r="9" fill="#FF9800"/>
        <text x="1035" y="765" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Rapid technology iterations, R&amp;D pressure</tspan>
        </text>
        
        <circle cx="1012" cy="810" r="9" fill="#FF9800"/>
        <text x="1035" y="818" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Rising raw material costs, margin squeeze</tspan>
        </text>
        
        <circle cx="1012" cy="862" r="9" fill="#FF9800"/>
        <text x="1035" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Stricter regulations, compliance costs rising</tspan>
        </text>
        
        <circle cx="1012" cy="915" r="9" fill="#FF9800"/>
        <text x="1035" y="922" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#2C3E50">
            <tspan>Economic uncertainty, client budgets tightening</tspan>
        </text>
    </g>
    
    <!-- Center logo -->
    <circle cx="960" cy="555" r="60" fill="#2C3E50" filter="url(#cardShadow)"/>
    <text x="960" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
        <tspan>SWOT</tspan>
    </text>
    <text x="960" y="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" fill="#FFFFFF" text-anchor="middle">
        <tspan>Analysis</tspan>
    </text>
    
    <text x="960" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#95A5A6" text-anchor="middle">
        <tspan>Data Source: Strategic Planning Department - 2025 Annual Strategic Analysis Report</tspan>
    </text>
</svg>
