<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    流程图模板 - CRAP 优化版
    用途: 业务流程、决策步骤、操作流程展示
    适用场景: 业务流程图、操作指南、决策树
    优化重点:
      - 对齐: 步骤卡片网格化布局
      - 对比: 不同类型节点视觉区分
      - 重复: 统一的卡片样式和连接线
      - 亲密性: 相关步骤分组，流程线清晰
    复用建议:
      - 连接线箭头继续使用 marker-end / marker-start
      - 若某一处需要“实心粗箭头”强调迁移方向，应增加独立闭合 path / polygon，而不是把 marker 放大

    可复用片段 1: 横向 block arrow（单个强调箭头）
      <path d="M180,240 H780 V165 L1140,420 L780,675 V600 H180 Z"
            fill="#6FA0E8" stroke="#3F76C8" stroke-width="6"/>

    可复用片段 2: 紧凑型 block arrow（卡片间迁移强调）
      <path d="M0,0 H270 V-36 L405,54 L270,144 V108 H0 Z"
            fill="#A7C4F5" stroke="#4A7FD1" stroke-width="4"/>
    -->

    <defs>
        <!-- 整体背景渐变 -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FAFBFC;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F5F6F8;stop-opacity:1" />
        </linearGradient>

        <!-- 主流程卡片渐变 -->
        <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
        </linearGradient>

        <!-- 决策节点渐变 -->
        <linearGradient id="decisionGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
        </linearGradient>

        <!-- 结束节点渐变 -->
        <linearGradient id="endGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
        </linearGradient>

        <!-- 卡片阴影 -->
        <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
            <feOffset dx="0" dy="6" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- 箭头标记 -->
        <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M 0,0 L 15,8 L 0,15 Z" fill="#1976D2" />
        </marker>

        <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M 0,0 L 15,8 L 0,15 Z" fill="#F57C00" />
        </marker>

        <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M 0,0 L 15,8 L 0,15 Z" fill="#388E3C" />
        </marker>
    </defs>

    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#bgGradient)" />

    <!-- 标题区域 -->
    <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54"
        font-weight="700" fill="#1A252F" letter-spacing="-0.8">
        <tspan>业务流程图</tspan>
    </text>
    <text x="90" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22"
        fill="#9AA0A6">
        <tspan>Business Process Flow · 标准化操作流程</tspan>
    </text>

    <!-- 流程主区域 -->
    <g id="processFlow">
        <!-- 第一行：开始 → 步骤1 → 决策 -->

        <!-- 开始节点 -->
        <g id="start">
            <rect x="90" y="240" width="270" height="120" rx="60" fill="url(#cardGradient)" filter="url(#cardShadow)" />
            <text x="225" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27"
                font-weight="600" fill="#FFFFFF" text-anchor="middle">
                <tspan>开始</tspan>
            </text>
            <text x="225" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
                fill="#FFFFFF" text-anchor="middle" opacity="0.9">
                <tspan>Start</tspan>
            </text>
        </g>

        <!-- 箭头: 开始 → 步骤1 -->
        <line x1="360" y1="300" x2="450" y2="300" stroke="#1976D2" stroke-width="4" marker-end="url(#arrowBlue)" />

        <!-- 步骤1：需求收集 -->
        <g id="step1">
            <rect x="450" y="240" width="300" height="120" rx="12" fill="url(#cardGradient)" filter="url(#cardShadow)" />
            <text x="600" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26"
                font-weight="700" fill="#FFFFFF" text-anchor="middle">
                <tspan>需求收集</tspan>
            </text>
            <text x="600" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
                fill="#FFFFFF" text-anchor="middle" opacity="0.9">
                <tspan>Requirement Gathering</tspan>
            </text>
            <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18"
                fill="#FFFFFF" text-anchor="middle" opacity="0.8">
                <tspan>1-2 天</tspan>
            </text>
        </g>

        <!-- 箭头: 步骤1 → 决策 -->
        <line x1="750" y1="300" x2="840" y2="300" stroke="#1976D2" stroke-width="4" marker-end="url(#arrowBlue)" />

        <!-- 决策节点：是否可行 -->
        <g id="decision1">
            <path d="M 990,240 L 1110,300 L 990,360 L 870,300 Z" fill="url(#decisionGradient)"
                filter="url(#cardShadow)" />
            <text x="990" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24"
                font-weight="700" fill="#FFFFFF" text-anchor="middle">
                <tspan>是否可行？</tspan>
            </text>
            <text x="990" y="321" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18"
                fill="#FFFFFF" text-anchor="middle" opacity="0.9">
                <tspan>Feasible?</tspan>
            </text>
        </g>

        <!-- 决策箭头: 是 → 步骤2 -->
        <line x1="1110" y1="300" x2="1200" y2="300" stroke="#1976D2" stroke-width="4" marker-end="url(#arrowBlue)" />
        <text x="1110" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
            font-weight="600" fill="#388E3C">
            <tspan>是 Yes</tspan>
        </text>

        <!-- 决策箭头: 否 → 重新评估 (向下) -->
        <path d="M 990,360 L 990,420" stroke="#F57C00" stroke-width="4" marker-end="url(#arrowOrange)" />
        <text x="1020" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
            font-weight="600" fill="#E74C3C">
            <tspan>否 No</tspan>
        </text>

        <!-- 第二行：步骤2 → 步骤3 → 步骤4 -->

        <!-- 步骤2：方案设计 -->
        <g id="step2">
            <rect x="1200" y="240" width="300" height="120" rx="12" fill="url(#cardGradient)" filter="url(#cardShadow)" />
            <text x="1350" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26"
                font-weight="700" fill="#FFFFFF" text-anchor="middle">
                <tspan>方案设计</tspan>
            </text>
            <text x="1350" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
                fill="#FFFFFF" text-anchor="middle" opacity="0.9">
                <tspan>Solution Design</tspan>
            </text>
            <text x="1350" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18"
                fill="#FFFFFF" text-anchor="middle" opacity="0.8">
                <tspan>3-5 天</tspan>
            </text>
        </g>

        <!-- 箭头: 步骤2 → 下方 -->
        <path d="M 1350,360 L 1350,480" stroke="#1976D2" stroke-width="4" marker-end="url(#arrowBlue)" />

        <!-- 重新评估节点 (第二行左侧) -->
        <g id="reevaluate">
            <rect x="840" y="420" width="300" height="120" rx="12" fill="#FFFFFF" stroke="#F57C00" stroke-width="4"
                filter="url(#cardShadow)" />
            <text x="990" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26"
                font-weight="700" fill="#F57C00" text-anchor="middle">
                <tspan>重新评估</tspan>
            </text>
            <text x="990" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
                fill="#F57C00" text-anchor="middle">
                <tspan>Re-evaluation</tspan>
            </text>
            <text x="990" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18"
                fill="#9AA0A6" text-anchor="middle">
                <tspan>调整需求</tspan>
            </text>
        </g>

        <!-- 箭头: 重新评估 → 步骤1 (回环) - 从左侧折线上升 -->
        <path d="M 840,480 L 420,480 L 420,360 L 450,360" stroke="#F57C00" stroke-width="4" stroke-dasharray="5,5"
            marker-end="url(#arrowOrange)" fill="none" />
        <text x="382" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18"
            font-weight="500" fill="#F57C00">
            <tspan>重新收集</tspan>
        </text>

        <!-- 第三行：步骤3 → 步骤4 → 结束 -->

        <!-- 步骤3：开发实施 -->
        <g id="step3">
            <rect x="1200" y="480" width="300" height="120" rx="12" fill="url(#cardGradient)" filter="url(#cardShadow)" />
            <text x="1350" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26"
                font-weight="700" fill="#FFFFFF" text-anchor="middle">
                <tspan>开发实施</tspan>
            </text>
            <text x="1350" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
                fill="#FFFFFF" text-anchor="middle" opacity="0.9">
                <tspan>Development</tspan>
            </text>
            <text x="1350" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18"
                fill="#FFFFFF" text-anchor="middle" opacity="0.8">
                <tspan>7-14 天</tspan>
            </text>
        </g>

        <!-- 箭头: 步骤3 → 步骤4 -->
        <path d="M 1350,600 L 1350,720" stroke="#1976D2" stroke-width="4" marker-end="url(#arrowBlue)" />

        <!-- 步骤4：测试验收 -->
        <g id="step4">
            <rect x="1200" y="720" width="300" height="120" rx="12" fill="url(#cardGradient)" filter="url(#cardShadow)" />
            <text x="1350" y="768" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26"
                font-weight="700" fill="#FFFFFF" text-anchor="middle">
                <tspan>测试验收</tspan>
            </text>
            <text x="1350" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
                fill="#FFFFFF" text-anchor="middle" opacity="0.9">
                <tspan>Testing &amp; Acceptance</tspan>
            </text>
            <text x="1350" y="820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18"
                fill="#FFFFFF" text-anchor="middle" opacity="0.8">
                <tspan>2-3 天</tspan>
            </text>
        </g>

        <!-- 箭头: 步骤4 → 结束 -->
        <line x1="1500" y1="780" x2="1590" y2="780" stroke="#388E3C" stroke-width="4" marker-end="url(#arrowGreen)" />

        <!-- 结束节点 -->
        <g id="end">
            <rect x="1590" y="720" width="270" height="120" rx="60" fill="url(#endGradient)" filter="url(#cardShadow)" />
            <text x="1725" y="790" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
                font-size="27" font-weight="600" fill="#FFFFFF" text-anchor="middle">
                <tspan>完成</tspan>
            </text>
            <text x="1725" y="818" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
                font-size="20" fill="#FFFFFF" text-anchor="middle" opacity="0.9">
                <tspan>Complete</tspan>
            </text>
        </g>
    </g>

    <!-- 图例说明 -->
    <g id="legend">
        <text x="90" y="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24"
            font-weight="700" fill="#1A252F">
            <tspan>图例说明</tspan>
        </text>

        <!-- 流程步骤 -->
        <rect x="90" y="750" width="120" height="60" rx="9" fill="url(#cardGradient)" />
        <text x="225" y="788" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21"
            font-weight="500" fill="#5F6368">
            <tspan>流程步骤</tspan>
        </text>

        <!-- 决策节点 -->
        <path d="M 150,855 L 195,885 L 150,915 L 105,885 Z" fill="url(#decisionGradient)" />
        <text x="225" y="892" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21"
            font-weight="500" fill="#5F6368">
            <tspan>决策节点</tspan>
        </text>

        <!-- 异常处理 -->
        <rect x="90" y="945" width="120" height="60" rx="9" fill="#FFFFFF" stroke="#F57C00" stroke-width="3" />
        <text x="225" y="982" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21"
            font-weight="500" fill="#5F6368">
            <tspan>异常处理</tspan>
        </text>
    </g>

    <!-- 时间统计 -->
    <g id="timeInfo">
        <rect x="420" y="750" width="300" height="255" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2.2"
            opacity="0.95" />

        <text x="570" y="795" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22"
            font-weight="700" fill="#1A252F" text-anchor="middle">
            <tspan>流程时间统计</tspan>
        </text>

        <line x1="442" y1="818" x2="698" y2="818" stroke="#E0E0E0" stroke-width="2" />

        <text x="442" y="855" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
            fill="#5F6368">
            <tspan>总周期：</tspan>
        </text>
        <text x="660" y="855" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
            font-weight="600" fill="#2196F3" text-anchor="end">
            <tspan>13-24 天</tspan>
        </text>

        <text x="442" y="892" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
            fill="#5F6368">
            <tspan>关键步骤：</tspan>
        </text>
        <text x="660" y="892" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
            font-weight="600" fill="#2196F3" text-anchor="end">
            <tspan>4 个</tspan>
        </text>

        <text x="442" y="930" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
            fill="#5F6368">
            <tspan>决策节点：</tspan>
        </text>
        <text x="660" y="930" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
            font-weight="600" fill="#FF9800" text-anchor="end">
            <tspan>1 个</tspan>
        </text>

        <text x="442" y="968" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
            fill="#5F6368">
            <tspan>风险等级：</tspan>
        </text>
        <text x="660" y="968" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
            font-weight="600" fill="#388E3C" text-anchor="end">
            <tspan>低</tspan>
        </text>
    </g>

    <!-- 数据来源 -->
    <text x="90" y="1058" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20"
        fill="#9AA0A6">
        <tspan>流程版本: v2.1 | 最后更新: 2025-11-09 | Process Management System</tspan>
    </text>
</svg>
