<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!--
  模块组合图模板 (Module Composition)
  用途: "一个大模块包含 N 个子模块，每个子模块有自己的描述" 的展示
  适用场景: 功能拆解、子系统组成、引擎内部架构、核心产品三段式
  支持: 父容器 1 个 + 子模块 3 个 (推荐) 或 4 个 (宽度均分)
  关键约定:
    - 每个子卡 = 编号徽章 + 子模块标题 + 职责定位副标题 + 2-3 条 bullet 描述 + 底部指标
    - 左侧行标签明确父容器的角色 (如"推荐引擎")
    - 红色编号徽章 01/02/03 按执行顺序标注
    - 子卡之间的灰色箭头表示数据流向
    - 若源内容仅有标题没有描述，应退回使用 numbered_steps 或 icon_grid
  -->

  <defs>
    <marker id="mcArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L15,8 L0,15 Z" fill="#B0B8C4"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

  <!-- 标题 -->
  <rect x="45" y="33" width="15" height="60" fill="#C00000"/>
  <text x="78" y="82" font-family="Microsoft YaHei, sans-serif" font-size="45" font-weight="700" fill="#C00000">推荐引擎的三段式组成</text>

  <!-- 副标题带 -->
  <rect x="45" y="117" width="1830" height="69" fill="#F2F2F2"/>
  <text x="960" y="148" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1A252F">
    <tspan x="960" dy="0">父容器声明"做什么"，每个子卡回答"如何做"—— 召回 → 排序 → 重排，三段协同缺一不可</tspan>
    <tspan x="960" dy="33" fill="#7F8C8D" font-weight="400">每子卡 = 编号 + 标题 + 职责定位 + 描述要点 + 关键指标；仅有标题时请改用 numbered_steps</tspan>
  </text>

  <!-- ==================== 左侧行标签 ==================== -->
  <rect x="45" y="225" width="45" height="45" fill="#C00000"/>
  <text x="68" y="258" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">★</text>
  <text x="48" y="330" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#1A252F">推荐</text>
  <text x="48" y="369" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#1A252F">引擎</text>
  <text x="48" y="411" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#7F8C8D">Recommendation</text>
  <text x="48" y="435" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#7F8C8D">Engine</text>

  <!-- ==================== 父容器 ==================== -->
  <rect x="150" y="225" width="1725" height="645" fill="none" stroke="#C00000" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="150" y="225" width="1725" height="57" fill="#FDF3EB"/>
  <text x="1012" y="262" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#1A252F">父容器 · Recommendation Engine Pipeline · 输入用户与物品 → 输出最终曝光序列</text>

  <!-- ==================== 子卡 1: 召回 ==================== -->
  <rect x="180" y="312" width="540" height="528" fill="#FFFFFF" stroke="#2E75B6" stroke-width="2"/>
  <rect x="180" y="312" width="540" height="72" fill="#2E75B6"/>
  <rect x="198" y="327" width="42" height="42" fill="#FFFFFF"/>
  <text x="219" y="357" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#2E75B6">01</text>
  <text x="258" y="357" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">召回 · Recall</text>

  <!-- 职责定位带 -->
  <rect x="180" y="384" width="540" height="51" fill="#EAF1F8"/>
  <text x="450" y="417" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#2E75B6">从海量物品中圈出候选集</text>

  <!-- 描述要点 -->
  <rect x="204" y="459" width="9" height="9" fill="#2E75B6"/>
  <text x="225" y="471" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1A252F">多路并行触发</text>
  <text x="225" y="501" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#566573">覆盖协同过滤、热门、兴趣、地域</text>

  <rect x="204" y="534" width="9" height="9" fill="#2E75B6"/>
  <text x="225" y="546" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1A252F">双通道索引</text>
  <text x="225" y="576" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#566573">向量检索 + 倒排索引融合</text>

  <rect x="204" y="609" width="9" height="9" fill="#2E75B6"/>
  <text x="225" y="621" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1A252F">候选集规模</text>
  <text x="225" y="651" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#566573">单用户输出数百到数千候选</text>

  <!-- 底部指标 -->
  <rect x="204" y="711" width="492" height="108" fill="#F7F9FC"/>
  <line x1="450" y1="729" x2="450" y2="801" stroke="#D9D9D9" stroke-width="2"/>
  <text x="327" y="747" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#7F8C8D">典型耗时</text>
  <text x="327" y="783" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#2E75B6">&lt; 50 ms</text>
  <text x="573" y="747" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#7F8C8D">候选规模</text>
  <text x="573" y="783" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#2E75B6">~2,000</text>

  <!-- ==================== 子卡 2: 排序 ==================== -->
  <rect x="750" y="312" width="540" height="528" fill="#FFFFFF" stroke="#C00000" stroke-width="2"/>
  <rect x="750" y="312" width="540" height="72" fill="#C00000"/>
  <rect x="768" y="327" width="42" height="42" fill="#FFFFFF"/>
  <text x="789" y="357" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#C00000">02</text>
  <text x="828" y="357" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">排序 · Ranking</text>

  <rect x="750" y="384" width="540" height="51" fill="#FDF3EB"/>
  <text x="1020" y="417" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#C00000">对候选精打分、择优输出</text>

  <rect x="774" y="459" width="9" height="9" fill="#C00000"/>
  <text x="795" y="471" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1A252F">深度模型预估</text>
  <text x="795" y="501" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#566573">多塔 DNN 预估 CTR / CVR / 时长</text>

  <rect x="774" y="534" width="9" height="9" fill="#C00000"/>
  <text x="795" y="546" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1A252F">多目标融合</text>
  <text x="795" y="576" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#566573">加权公式或 Pareto 前沿择优</text>

  <rect x="774" y="609" width="9" height="9" fill="#C00000"/>
  <text x="795" y="621" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1A252F">Top-K 精排</text>
  <text x="795" y="651" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#566573">输出 Top-K 的候选进入下一阶段</text>

  <rect x="774" y="711" width="492" height="108" fill="#F7F9FC"/>
  <line x1="1020" y1="729" x2="1020" y2="801" stroke="#D9D9D9" stroke-width="2"/>
  <text x="897" y="747" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#7F8C8D">典型耗时</text>
  <text x="897" y="783" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#C00000">&lt; 100 ms</text>
  <text x="1143" y="747" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#7F8C8D">Top-K 规模</text>
  <text x="1143" y="783" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#C00000">~200</text>

  <!-- ==================== 子卡 3: 重排 ==================== -->
  <rect x="1320" y="312" width="525" height="528" fill="#FFFFFF" stroke="#5B9BD5" stroke-width="2"/>
  <rect x="1320" y="312" width="525" height="72" fill="#5B9BD5"/>
  <rect x="1338" y="327" width="42" height="42" fill="#FFFFFF"/>
  <text x="1359" y="357" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#5B9BD5">03</text>
  <text x="1398" y="357" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">重排 · Rerank</text>

  <rect x="1320" y="384" width="525" height="51" fill="#E9F2FA"/>
  <text x="1582" y="417" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#5B9BD5">策略干预与多样性调优</text>

  <rect x="1344" y="459" width="9" height="9" fill="#5B9BD5"/>
  <text x="1365" y="471" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1A252F">多样性打散</text>
  <text x="1365" y="501" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#566573">避免同质化堆叠，拉开类别与作者</text>

  <rect x="1344" y="534" width="9" height="9" fill="#5B9BD5"/>
  <text x="1365" y="546" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1A252F">业务规则注入</text>
  <text x="1365" y="576" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#566573">扶持 / 过滤 / 定向置顶</text>

  <rect x="1344" y="609" width="9" height="9" fill="#5B9BD5"/>
  <text x="1365" y="621" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1A252F">最终曝光序列</text>
  <text x="1365" y="651" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#566573">生成用户可见的最终排列顺序</text>

  <rect x="1344" y="711" width="477" height="108" fill="#F7F9FC"/>
  <line x1="1582" y1="729" x2="1582" y2="801" stroke="#D9D9D9" stroke-width="2"/>
  <text x="1462" y="747" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#7F8C8D">典型耗时</text>
  <text x="1462" y="783" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#5B9BD5">&lt; 30 ms</text>
  <text x="1702" y="747" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#7F8C8D">最终曝光</text>
  <text x="1702" y="783" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#5B9BD5">~20</text>

  <!-- 子模块之间的流向箭头 -->
  <line x1="723" y1="576" x2="744" y2="576" stroke="#B0B8C4" stroke-width="3.8" marker-end="url(#mcArrow)"/>
  <line x1="1293" y1="576" x2="1314" y2="576" stroke="#B0B8C4" stroke-width="3.8" marker-end="url(#mcArrow)"/>

  <!-- ==================== 底部输入输出摘要 ==================== -->
  <rect x="45" y="915" width="45" height="45" fill="#C00000"/>
  <text x="68" y="948" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">▸</text>
  <text x="48" y="1011" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#1A252F">输入</text>
  <text x="48" y="1044" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#1A252F">输出</text>

  <rect x="150" y="915" width="1725" height="135" fill="none" stroke="#E7E6E6" stroke-width="3"/>
  <text x="1012" y="942" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#1A252F">端到端数据流向 · 上游行为日志 → 引擎内部三段处理 → 下游曝光与点击回流</text>
  <line x1="180" y1="957" x2="1845" y2="957" stroke="#000000" stroke-width="2" stroke-dasharray="2 2"/>

  <rect x="180" y="975" width="300" height="60" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="2"/>
  <text x="330" y="1012" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#1A252F">用户行为日志</text>

  <rect x="510" y="975" width="300" height="60" fill="#FDF3EB" stroke="#F8CBAD" stroke-width="2"/>
  <text x="660" y="1012" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#C00000">用户画像 + 物品特征</text>

  <rect x="840" y="975" width="300" height="60" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="2"/>
  <text x="990" y="1012" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#1A252F">Feed 曝光流</text>

  <rect x="1170" y="975" width="300" height="60" fill="#F2F2F2" stroke="#D9D9D9" stroke-width="2"/>
  <text x="1320" y="1012" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#1A252F">点击 / 停留回流</text>

  <rect x="1500" y="975" width="345" height="60" fill="#FDF3EB" stroke="#F8CBAD" stroke-width="2"/>
  <text x="1672" y="1012" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#C00000">实验平台 A/B 指标</text>
</svg>
