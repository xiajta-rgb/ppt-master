<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    甘特图模板
    用途: 项目进度规划、时间线管理
    适用场景: 项目管理、里程碑跟踪、任务排期
    支持: 8个任务 × 12周时间跨度（可调整）
    -->
    
    <defs>
        <!-- 任务条渐变 -->
        <linearGradient id="taskGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="taskGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="taskGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="taskGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
        </linearGradient>
        
        <!-- 阴影 -->
        <filter id="ganttShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- 今日线图案 -->
        <pattern id="todayPattern" patternUnits="userSpaceOnUse" width="6" height="6">
            <line x1="0" y1="0" x2="6" y2="6" stroke="#E74C3C" stroke-width="2"/>
        </pattern>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="42" font-weight="bold" fill="#2C3E50">
        <tspan>项目进度计划</tspan>
    </text>
    
    <text x="90" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" fill="#7F8C8D">
        <tspan>产品发布项目 · 2025年Q1-Q2</tspan>
    </text>
    
    <!-- 时间轴头部 -->
    <g id="timeHeader">
        <!-- 月份标签背景 -->
        <rect x="420" y="158" width="1440" height="45" fill="#F5F5F5"/>
        
        <!-- 月份分隔线和标签 -->
        <line x1="420" y1="158" x2="420" y2="960" stroke="#E0E0E0" stroke-width="2"/>
        <text x="540" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#5D6D7E" text-anchor="middle">
            <tspan>1月</tspan>
        </text>
        
        <line x1="660" y1="158" x2="660" y2="960" stroke="#E0E0E0" stroke-width="2"/>
        <text x="780" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#5D6D7E" text-anchor="middle">
            <tspan>2月</tspan>
        </text>
        
        <line x1="900" y1="158" x2="900" y2="960" stroke="#E0E0E0" stroke-width="2"/>
        <text x="1020" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#5D6D7E" text-anchor="middle">
            <tspan>3月</tspan>
        </text>
        
        <line x1="1140" y1="158" x2="1140" y2="960" stroke="#E0E0E0" stroke-width="2"/>
        <text x="1260" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#5D6D7E" text-anchor="middle">
            <tspan>4月</tspan>
        </text>
        
        <line x1="1380" y1="158" x2="1380" y2="960" stroke="#E0E0E0" stroke-width="2"/>
        <text x="1500" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#5D6D7E" text-anchor="middle">
            <tspan>5月</tspan>
        </text>
        
        <line x1="1620" y1="158" x2="1620" y2="960" stroke="#E0E0E0" stroke-width="2"/>
        <text x="1740" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#5D6D7E" text-anchor="middle">
            <tspan>6月</tspan>
        </text>
        
        <line x1="1860" y1="158" x2="1860" y2="960" stroke="#E0E0E0" stroke-width="2"/>
    </g>
    
    <!-- 周分隔线（虚线） -->
    <g stroke="#F0F0F0" stroke-width="2" stroke-dasharray="2,2">
        <line x1="480" y1="202" x2="480" y2="960"/>
        <line x1="540" y1="202" x2="540" y2="960"/>
        <line x1="600" y1="202" x2="600" y2="960"/>
        <line x1="720" y1="202" x2="720" y2="960"/>
        <line x1="780" y1="202" x2="780" y2="960"/>
        <line x1="840" y1="202" x2="840" y2="960"/>
        <line x1="960" y1="202" x2="960" y2="960"/>
        <line x1="1020" y1="202" x2="1020" y2="960"/>
        <line x1="1080" y1="202" x2="1080" y2="960"/>
        <line x1="1200" y1="202" x2="1200" y2="960"/>
        <line x1="1260" y1="202" x2="1260" y2="960"/>
        <line x1="1320" y1="202" x2="1320" y2="960"/>
        <line x1="1440" y1="202" x2="1440" y2="960"/>
        <line x1="1500" y1="202" x2="1500" y2="960"/>
        <line x1="1560" y1="202" x2="1560" y2="960"/>
        <line x1="1680" y1="202" x2="1680" y2="960"/>
        <line x1="1740" y1="202" x2="1740" y2="960"/>
        <line x1="1800" y1="202" x2="1800" y2="960"/>
    </g>
    
    <!-- 任务列表区域 -->
    <g id="taskList">
        <!-- 任务行背景（交替色） -->
        <rect x="60" y="202" width="360" height="90" fill="#FFFFFF"/>
        <rect x="60" y="292" width="360" height="90" fill="#FAFAFA"/>
        <rect x="60" y="382" width="360" height="90" fill="#FFFFFF"/>
        <rect x="60" y="472" width="360" height="90" fill="#FAFAFA"/>
        <rect x="60" y="562" width="360" height="90" fill="#FFFFFF"/>
        <rect x="60" y="652" width="360" height="90" fill="#FAFAFA"/>
        <rect x="60" y="742" width="360" height="90" fill="#FFFFFF"/>
        <rect x="60" y="832" width="360" height="90" fill="#FAFAFA"/>
        
        <!-- 任务名称 -->
        <text x="82" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50">
            <tspan>1. 需求分析</tspan>
        </text>
        
        <text x="82" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50">
            <tspan>2. 产品设计</tspan>
        </text>
        
        <text x="82" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50">
            <tspan>3. UI/UX 设计</tspan>
        </text>
        
        <text x="82" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50">
            <tspan>4. 前端开发</tspan>
        </text>
        
        <text x="82" y="618" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50">
            <tspan>5. 后端开发</tspan>
        </text>
        
        <text x="82" y="708" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50">
            <tspan>6. 测试验收</tspan>
        </text>
        
        <text x="82" y="798" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50">
            <tspan>7. 部署上线</tspan>
        </text>
        
        <text x="82" y="888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50">
            <tspan>8. 运营推广</tspan>
        </text>
    </g>
    
    <!-- 甘特条 -->
    <g id="ganttBars">
        <!-- 任务1: 需求分析 (1月第1周 - 1月第3周) -->
        <rect x="420" y="232" width="180" height="36" rx="6" fill="url(#taskGrad1)" filter="url(#ganttShadow)"/>
        <text x="510" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#FFFFFF" text-anchor="middle">
            <tspan>3周</tspan>
        </text>
        
        <!-- 任务2: 产品设计 (1月第2周 - 2月第2周) -->
        <rect x="480" y="322" width="300" height="36" rx="6" fill="url(#taskGrad1)" filter="url(#ganttShadow)"/>
        <text x="630" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#FFFFFF" text-anchor="middle">
            <tspan>5周</tspan>
        </text>
        
        <!-- 任务3: UI/UX 设计 (2月第1周 - 3月第1周) -->
        <rect x="660" y="412" width="300" height="36" rx="6" fill="url(#taskGrad2)" filter="url(#ganttShadow)"/>
        <text x="810" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#FFFFFF" text-anchor="middle">
            <tspan>5周</tspan>
        </text>
        
        <!-- 任务4: 前端开发 (2月第3周 - 4月第2周) -->
        <rect x="780" y="502" width="480" height="36" rx="6" fill="url(#taskGrad3)" filter="url(#ganttShadow)"/>
        <text x="1020" y="528" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#FFFFFF" text-anchor="middle">
            <tspan>8周</tspan>
        </text>
        
        <!-- 任务5: 后端开发 (2月第2周 - 4月第3周) -->
        <rect x="720" y="592" width="600" height="36" rx="6" fill="url(#taskGrad3)" filter="url(#ganttShadow)"/>
        <text x="1020" y="618" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#FFFFFF" text-anchor="middle">
            <tspan>10周</tspan>
        </text>
        
        <!-- 任务6: 测试验收 (4月第1周 - 5月第2周) -->
        <rect x="1140" y="682" width="360" height="36" rx="6" fill="url(#taskGrad4)" filter="url(#ganttShadow)"/>
        <text x="1320" y="708" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#FFFFFF" text-anchor="middle">
            <tspan>6周</tspan>
        </text>
        
        <!-- 任务7: 部署上线 (5月第2周 - 5月第3周) -->
        <rect x="1500" y="772" width="120" height="36" rx="6" fill="url(#taskGrad4)" filter="url(#ganttShadow)"/>
        <text x="1560" y="798" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#FFFFFF" text-anchor="middle">
            <tspan>2周</tspan>
        </text>
        
        <!-- 任务8: 运营推广 (5月第3周 - 6月第4周) -->
        <rect x="1560" y="862" width="300" height="36" rx="6" fill="url(#taskGrad2)" filter="url(#ganttShadow)"/>
        <text x="1710" y="888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#FFFFFF" text-anchor="middle">
            <tspan>5周</tspan>
        </text>
    </g>
    
    <!-- 里程碑标记 -->
    <g id="milestones">
        <!-- 里程碑: 需求评审 -->
        <polygon points="600,248 615,232 630,248 615,262" fill="#E74C3C"/>
        <text x="615" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#E74C3C" text-anchor="middle">
            <tspan>需求评审</tspan>
        </text>
        
        <!-- 里程碑: 设计评审 -->
        <polygon points="960,428 975,412 990,428 975,442" fill="#E74C3C"/>
        <text x="975" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#E74C3C" text-anchor="middle">
            <tspan>设计评审</tspan>
        </text>
        
        <!-- 里程碑: 产品发布 -->
        <polygon points="1605,788 1620,772 1635,788 1620,802" fill="#E74C3C"/>
        <text x="1620" y="825" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#E74C3C" text-anchor="middle">
            <tspan>产品发布</tspan>
        </text>
    </g>
    
    <!-- 今日线 (假设在3月第2周) -->
    <line x1="1020" y1="158" x2="1020" y2="960" stroke="#E74C3C" stroke-width="3" stroke-dasharray="6,3"/>
    <rect x="990" y="142" width="60" height="30" rx="4" fill="#E74C3C"/>
    <text x="1020" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="16" fill="#FFFFFF" text-anchor="middle">
        <tspan>今日</tspan>
    </text>
    
    <!-- 图例 -->
    <g id="legend" transform="translate(90, 975)">
        <rect x="0" y="0" width="24" height="24" rx="3" fill="url(#taskGrad1)"/>
        <text x="38" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5D6D7E">
            <tspan>规划阶段</tspan>
        </text>
        
        <rect x="150" y="0" width="24" height="24" rx="3" fill="url(#taskGrad2)"/>
        <text x="188" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5D6D7E">
            <tspan>设计阶段</tspan>
        </text>
        
        <rect x="300" y="0" width="24" height="24" rx="3" fill="url(#taskGrad3)"/>
        <text x="338" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5D6D7E">
            <tspan>开发阶段</tspan>
        </text>
        
        <rect x="450" y="0" width="24" height="24" rx="3" fill="url(#taskGrad4)"/>
        <text x="488" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5D6D7E">
            <tspan>测试发布</tspan>
        </text>
        
        <polygon points="630,12 645,-3 660,12 645,27" fill="#E74C3C"/>
        <text x="682" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5D6D7E">
            <tspan>里程碑</tspan>
        </text>
    </g>
    
    <!-- 项目信息 -->
    <text x="1830" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" fill="#95A5A6" text-anchor="end">
        <tspan>项目经理: 张三 | 更新日期: 2025-03-15</tspan>
    </text>
</svg>

