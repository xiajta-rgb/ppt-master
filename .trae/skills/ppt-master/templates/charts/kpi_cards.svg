<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    KPI 卡片模板 - 2×2 布局（CRAP 优化版）
    用途: 展示关键业绩指标
    适用场景: 财务指标、业务数据看板、增长率展示
    优化: 强化对齐、对比、重复、亲密性原则
    -->
    
    <defs>
        <!-- 卡片阴影 - 更精致柔和 -->
        <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
            <feOffset dx="0" dy="4" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.15"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- 渐变背景 - 增加层次感 -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ECF0F1;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#bgGradient)"/>
    
    <!-- 标题区域 - 增强对比 -->
    <text x="90" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="54" font-weight="700" fill="#1A252F" letter-spacing="-0.8">
        <tspan>关键业绩指标</tspan>
    </text>
    <text x="90" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" fill="#7F8C8D">
        <tspan>Key Performance Indicators</tspan>
    </text>
    
    <!-- KPI 卡片布局 2×2 - 统一间距 40px -->
    
    <!-- 卡片 1 - 左上 (收入增长) -->
    <g filter="url(#cardShadow)">
        <!-- 卡片背景 - 更圆润的圆角 -->
        <rect x="90" y="225" width="840" height="375" rx="18" fill="#FFFFFF" stroke="#E8EAED" stroke-width="2"/>
        
        <!-- 左侧色块指示器 - 更粗更醒目 -->
        <rect x="114" y="255" width="12" height="105" rx="6" fill="#2196F3"/>
        
        <!-- 指标名称 - 统一左边距 100px -->
        <text x="150" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="500" fill="#5F6368" letter-spacing="0.3">
            <tspan>总收入</tspan>
        </text>
        <text x="150" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#9AA0A6">
            <tspan>Total Revenue</tspan>
        </text>
        
        <!-- 主数值 - 增强视觉权重 -->
        <text x="150" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="96" font-weight="700" fill="#1A252F" letter-spacing="-2">
            <tspan>¥2.45</tspan>
        </text>
        <text x="465" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="42" font-weight="500" fill="#5F6368">
            <tspan>亿</tspan>
        </text>
        
        <!-- 趋势指示 - 优化间距和对齐 -->
        <circle cx="165" cy="510" r="27" fill="#E8F5E9"/>
        <polygon points="165,500 174,520 156,520" fill="#27AE60"/>
        <text x="210" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="700" fill="#27AE60">
            <tspan>+18.5%</tspan>
        </text>
        
        <!-- 同比说明 - 更紧凑的分组 -->
        <text x="368" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" fill="#9AA0A6">
            <tspan>较去年同期</tspan>
        </text>
    </g>
    
    <!-- 卡片 2 - 右上 (用户数量) -->
    <g filter="url(#cardShadow)">
        <!-- 卡片背景 -->
        <rect x="990" y="225" width="840" height="375" rx="18" fill="#FFFFFF" stroke="#E8EAED" stroke-width="2"/>
        
        <!-- 左侧色块指示器 -->
        <rect x="1014" y="255" width="12" height="105" rx="6" fill="#4CAF50"/>
        
        <!-- 指标名称 -->
        <text x="1050" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="500" fill="#5F6368" letter-spacing="0.3">
            <tspan>活跃用户</tspan>
        </text>
        <text x="1050" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#9AA0A6">
            <tspan>Active Users</tspan>
        </text>
        
        <!-- 主数值 -->
        <text x="1050" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="96" font-weight="700" fill="#1A252F" letter-spacing="-2">
            <tspan>128.3</tspan>
        </text>
        <text x="1395" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="42" font-weight="500" fill="#5F6368">
            <tspan>万</tspan>
        </text>
        
        <!-- 趋势指示 -->
        <circle cx="1065" cy="510" r="27" fill="#E8F5E9"/>
        <polygon points="1065,500 1074,520 1056,520" fill="#27AE60"/>
        <text x="1110" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="700" fill="#27AE60">
            <tspan>+12.3%</tspan>
        </text>
        
        <!-- 同比说明 -->
        <text x="1268" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" fill="#9AA0A6">
            <tspan>月同比增长</tspan>
        </text>
    </g>
    
    <!-- 卡片 3 - 左下 (客单价) -->
    <g filter="url(#cardShadow)">
        <!-- 卡片背景 -->
        <rect x="90" y="660" width="840" height="375" rx="18" fill="#FFFFFF" stroke="#E8EAED" stroke-width="2"/>
        
        <!-- 左侧色块指示器 -->
        <rect x="114" y="690" width="12" height="105" rx="6" fill="#FF9800"/>
        
        <!-- 指标名称 -->
        <text x="150" y="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="500" fill="#5F6368" letter-spacing="0.3">
            <tspan>平均客单价</tspan>
        </text>
        <text x="150" y="754" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#9AA0A6">
            <tspan>Avg Order Value</tspan>
        </text>
        
        <!-- 主数值 -->
        <text x="150" y="862" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="96" font-weight="700" fill="#1A252F" letter-spacing="-2">
            <tspan>¥432</tspan>
        </text>
        
        <!-- 趋势指示 - 下降趋势 -->
        <circle cx="165" cy="945" r="27" fill="#FFEBEE"/>
        <polygon points="165,964 174,944 156,944" fill="#E74C3C"/>
        <text x="210" y="958" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="700" fill="#E74C3C">
            <tspan>-3.2%</tspan>
        </text>
        
        <!-- 同比说明 -->
        <text x="352" y="958" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" fill="#9AA0A6">
            <tspan>环比上月</tspan>
        </text>
    </g>
    
    <!-- 卡片 4 - 右下 (转化率) -->
    <g filter="url(#cardShadow)">
        <!-- 卡片背景 -->
        <rect x="990" y="660" width="840" height="375" rx="18" fill="#FFFFFF" stroke="#E8EAED" stroke-width="2"/>
        
        <!-- 左侧色块指示器 -->
        <rect x="1014" y="690" width="12" height="105" rx="6" fill="#9C27B0"/>
        
        <!-- 指标名称 -->
        <text x="1050" y="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="500" fill="#5F6368" letter-spacing="0.3">
            <tspan>转化率</tspan>
        </text>
        <text x="1050" y="754" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#9AA0A6">
            <tspan>Conversion Rate</tspan>
        </text>
        
        <!-- 主数值 -->
        <text x="1050" y="862" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="96" font-weight="700" fill="#1A252F" letter-spacing="-2">
            <tspan>8.7%</tspan>
        </text>
        
        <!-- 趋势指示 -->
        <circle cx="1065" cy="945" r="27" fill="#E8F5E9"/>
        <polygon points="1065,934 1074,956 1056,956" fill="#27AE60"/>
        <text x="1110" y="958" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="30" font-weight="700" fill="#27AE60">
            <tspan>+0.8%</tspan>
        </text>
        
        <!-- 同比说明 -->
        <text x="1252" y="958" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" fill="#9AA0A6">
            <tspan>百分点提升</tspan>
        </text>
    </g>
    
    <!-- 数据来源标注 - 优化样式 -->
    <text x="1740" y="1058" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#9AA0A6" text-anchor="end">
        <tspan>数据截至 2025年11月 | Data as of Nov 2025</tspan>
    </text>
</svg>

