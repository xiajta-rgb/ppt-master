    <!-- 底部注释 -->
    <text x="960" y="1020" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" fill="#BDC3C7">总周期约14周 · 各阶段可根据项目规模灵活调整</text>
</svg>