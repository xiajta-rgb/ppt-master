<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    编号步骤流模板
    用途: 有序步骤、阶段流程、操作指南
    适用场景: 实施路径、操作流程、方法论步骤
    支持: 5步横向流 (推荐3-6步)
    -->
    
    <defs>
        <!-- 卡片阴影 -->
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
            <feOffset dx="0" dy="4" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.12"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- 背景渐变 -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#EEF1F5;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#bgGrad)"/>
    
    <!-- 标题区域 -->
    <text x="960" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="700" fill="#1A252F" letter-spacing="-0.8">实施路径五步法</text>
    <text x="960" y="142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" fill="#7F8C8D">Five-Step Implementation · 从规划到落地的完整路径</text>
    
    <!-- 主连接线 -->
    <line x1="248" y1="398" x2="1672" y2="398" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
    
    <!-- 步骤编号圆 + 连接箭头 -->
    <!-- 步骤间箭头 (polygon三角形) -->
    <polygon points="465,398 447,382 447,412" fill="#D5D8DC"/>
    <polygon points="810,398 792,382 792,412" fill="#D5D8DC"/>
    <polygon points="1155,398 1137,382 1137,412" fill="#D5D8DC"/>
    <polygon points="1500,398 1482,382 1482,412" fill="#D5D8DC"/>
    
    <!-- 步骤1 -->
    <circle cx="248" cy="398" r="57" fill="#6C5CE7" filter="url(#cardShadow)"/>
    <circle cx="248" cy="398" r="48" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.3"/>
    <text x="248" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="36" font-weight="800" fill="#FFFFFF">01</text>
    <text x="248" y="417" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.7">STEP</text>
    
    <!-- 步骤2 -->
    <circle cx="592" cy="398" r="57" fill="#00B894" filter="url(#cardShadow)"/>
    <circle cx="592" cy="398" r="48" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.3"/>
    <text x="592" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="36" font-weight="800" fill="#FFFFFF">02</text>
    <text x="592" y="417" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.7">STEP</text>
    
    <!-- 步骤3 -->
    <circle cx="938" cy="398" r="57" fill="#FDCB6E" filter="url(#cardShadow)"/>
    <circle cx="938" cy="398" r="48" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.3"/>
    <text x="938" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="36" font-weight="800" fill="#FFFFFF">03</text>
    <text x="938" y="417" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.7">STEP</text>
    
    <!-- 步骤4 -->
    <circle cx="1282" cy="398" r="57" fill="#E17055" filter="url(#cardShadow)"/>
    <circle cx="1282" cy="398" r="48" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.3"/>
    <text x="1282" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="36" font-weight="800" fill="#FFFFFF">04</text>
    <text x="1282" y="417" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.7">STEP</text>
    
    <!-- 步骤5 -->
    <circle cx="1628" cy="398" r="57" fill="#0984E3" filter="url(#cardShadow)"/>
    <circle cx="1628" cy="398" r="48" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.3"/>
    <text x="1628" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="36" font-weight="800" fill="#FFFFFF">05</text>
    <text x="1628" y="417" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="14" font-weight="600" fill="#FFFFFF" fill-opacity="0.7">STEP</text>
    
    <!-- 虚线连接到卡片 -->
    <line x1="248" y1="454" x2="248" y2="525" stroke="#6C5CE7" stroke-width="3" stroke-dasharray="4,4" stroke-opacity="0.4"/>
    <line x1="592" y1="454" x2="592" y2="525" stroke="#00B894" stroke-width="3" stroke-dasharray="4,4" stroke-opacity="0.4"/>
    <line x1="938" y1="454" x2="938" y2="525" stroke="#FDCB6E" stroke-width="3" stroke-dasharray="4,4" stroke-opacity="0.4"/>
    <line x1="1282" y1="454" x2="1282" y2="525" stroke="#E17055" stroke-width="3" stroke-dasharray="4,4" stroke-opacity="0.4"/>
    <line x1="1628" y1="454" x2="1628" y2="525" stroke="#0984E3" stroke-width="3" stroke-dasharray="4,4" stroke-opacity="0.4"/>
    
    <!-- 步骤详情卡片 -->
    <!-- 卡片1 -->
    <g filter="url(#cardShadow)">
        <rect x="90" y="532" width="315" height="420" rx="18" fill="#FFFFFF"/>
        <rect x="90" y="532" width="315" height="9" rx="4" fill="#6C5CE7"/>
        <text x="248" y="592" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="26" font-weight="700" fill="#1A252F">需求分析</text>
        <text x="248" y="627" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
