        <line x1="135" y1="652" x2="360" y2="652" stroke="#F0F0F0" stroke-width="2"/>
        <text x="120" y="693" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 梳理业务目标</text>
        <text x="120" y="728" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 调研用户需求</text>
        <text x="120" y="762" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 分析竞品现状</text>
        <text x="120" y="796" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 确定核心指标</text>
        <rect x="135" y="840" width="90" height="33" rx="16" fill="#6C5CE7" fill-opacity="0.1"/>
        <text x="180" y="862" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#6C5CE7">2周</text>
    </g>
    
    <!-- 卡片2 -->
    <g filter="url(#cardShadow)">
        <rect x="435" y="532" width="315" height="420" rx="18" fill="#FFFFFF"/>
        <rect x="435" y="532" width="315" height="9" rx="4" fill="#00B894"/>
        <text x="592" y="592" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="26" font-weight="700" fill="#1A252F">方案设计</text>
        <text x="592" y="627" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#00B894" font-weight="600">Design</text>
        <line x1="480" y1="652" x2="705" y2="652" stroke="#F0F0F0" stroke-width="2"/>
        <text x="465" y="693" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 架构方案评审</text>
        <text x="465" y="728" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 技术选型确认</text>
        <text x="465" y="762" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 里程碑规划</text>
        <text x="465" y="796" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 资源分配方案</text>
        <rect x="480" y="840" width="90" height="33" rx="16" fill="#00B894" fill-opacity="0.1"/>
        <text x="525" y="862" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#00B894">3周</text>
    </g>
    
    <!-- 卡片3 -->
    <g filter="url(#cardShadow)">
        <rect x="780" y="532" width="315" height="420" rx="18" fill="#FFFFFF"/>
        <rect x="780" y="532" width="315" height="9" rx="4" fill="#FDCB6E"/>
        <text x="938" y="592" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="26" font-weight="700" fill="#1A252F">开发实施</text>
        <text x="938" y="627" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#D4A537" font-weight="600">Develop</text>
        <line x1="825" y1="652" x2="1050" y2="652" stroke="#F0F0F0" stroke-width="2"/>
        <text x="810" y="693" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 核心模块开发</text>
        <text x="810" y="728" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 持续集成部署</text>
        <text x="810" y="762" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 代码审查流程</text>
        <text x="810" y="796" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 单元测试覆盖</text>
        <rect x="825" y="840" width="90" height="33" rx="16" fill="#FDCB6E" fill-opacity="0.15"/>
        <text x="870" y="862" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#D4A537">6周</text>
    </g>
    
    <!-- 卡片4 -->
    <g filter="url(#cardShadow)">
        <rect x="1125" y="532" width="315" height="420" rx="18" fill="#FFFFFF"/>
        <rect x="1125" y="532" width="315" height="9" rx="4" fill="#E17055"/>
        <text x="1282" y="592" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="26" font-weight="700" fill="#1A252F">测试验证</text>
        <text x="1282" y="627" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#E17055" font-weight="600">Testing</text>
        <line x1="1170" y1="652" x2="1395" y2="652" stroke="#F0F0F0" stroke-width="2"/>
        <text x="1155" y="693" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 功能回归测试</text>
        <text x="1155" y="728" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 性能压力测试</text>
        <text x="1155" y="762" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 用户验收测试</text>
        <text x="1155" y="796" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· Bug修复闭环</text>
        <rect x="1170" y="840" width="90" height="33" rx="16" fill="#E17055" fill-opacity="0.1"/>
        <text x="1215" y="862" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#E17055">3周</text>
    </g>
    
    <!-- 卡片5 -->
    <g filter="url(#cardShadow)">
        <rect x="1470" y="532" width="315" height="420" rx="18" fill="#FFFFFF"/>
        <rect x="1470" y="532" width="315" height="9" rx="4" fill="#0984E3"/>
        <text x="1628" y="592" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="26" font-weight="700" fill="#1A252F">上线运维</text>
        <text x="1628" y="627" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#0984E3" font-weight="600">Launch</text>
        <line x1="1515" y1="652" x2="1740" y2="652" stroke="#F0F0F0" stroke-width="2"/>
        <text x="1500" y="693" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 灰度发布策略</text>
        <text x="1500" y="728" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 监控告警配置</text>
        <text x="1500" y="762" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 数据效果追踪</text>
        <text x="1500" y="796" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#5F6368">· 持续迭代优化</text>
        <rect x="1515" y="840" width="90" height="33" rx="16" fill="#0984E3" fill-opacity="0.1"/>
        <text x="1560" y="862" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#0984E3">持续</text>
