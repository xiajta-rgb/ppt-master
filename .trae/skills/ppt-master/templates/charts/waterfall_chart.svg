<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    瀑布图模板
    用途: 增减变化分析、财务分解
    适用场景: 利润分解、预算变化、成本分析、收入构成
    支持: 起始值 + 6个变化项 + 结束值
    -->
    
    <defs>
        <!-- 增加项渐变（绿色） -->
        <linearGradient id="increaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
        </linearGradient>
        
        <!-- 减少项渐变（红色） -->
        <linearGradient id="decreaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#EF5350;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
        </linearGradient>
        
        <!-- 总计项渐变（蓝色） -->
        <linearGradient id="totalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
        </linearGradient>
        
        <!-- 阴影 -->
        <filter id="barShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.25"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>年度利润变化分析</tspan>
    </text>
    
    <text x="90" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>2024年 vs 2025年 · 单位：百万元</tspan>
    </text>
    
    <!-- 图例 -->
    <g id="legend" transform="translate(1320, 105)">
        <rect x="0" y="0" width="30" height="30" rx="4" fill="url(#totalGrad)"/>
        <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>起止值</tspan>
        </text>
        
        <rect x="150" y="0" width="30" height="30" rx="4" fill="url(#increaseGrad)"/>
        <text x="192" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>增加</tspan>
        </text>
        
        <rect x="285" y="0" width="30" height="30" rx="4" fill="url(#decreaseGrad)"/>
        <text x="327" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>减少</tspan>
        </text>
    </g>
    
    <!-- 图表区域 -->
    <g id="chartArea">
        <!-- Y轴网格线 -->
        <line x1="210" y1="840" x2="1800" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="720" x2="1800" y2="720" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="600" x2="1800" y2="600" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="480" x2="1800" y2="480" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="360" x2="1800" y2="360" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="240" x2="1800" y2="240" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- Y轴刻度标签 -->
        <text x="188" y="848" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end"><tspan>0</tspan></text>
        <text x="188" y="728" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end"><tspan>100</tspan></text>
        <text x="188" y="608" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end"><tspan>200</tspan></text>
        <text x="188" y="488" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end"><tspan>300</tspan></text>
        <text x="188" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end"><tspan>400</tspan></text>
        <text x="188" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end"><tspan>500</tspan></text>
        
        <!-- 坐标轴 -->
        <line x1="210" y1="195" x2="210" y2="840" stroke="#95A5A6" stroke-width="3"/>
        <line x1="210" y1="840" x2="1800" y2="840" stroke="#95A5A6" stroke-width="3"/>
        
        <!-- 
        数据说明：
        - 2024年利润: 280M (起始)
        - 营收增长: +120M
        - 新产品: +65M
        - 原材料涨价: -45M
        - 人力成本: -35M
        - 营销投入: -25M
        - 运营优化: +40M
        - 2025年利润: 400M (结束)
        
        每100M = 80px
        柱宽: 90px, 间距: 40px
        -->
        
        <!-- 柱1: 2024年利润 280M（起始值，从0开始） -->
        <rect x="262" y="504" width="135" height="336" rx="6" fill="url(#totalGrad)" filter="url(#barShadow)"/>
        <text x="330" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>280</tspan>
        </text>
        <text x="330" y="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>2024年</tspan>
        </text>
        <text x="330" y="927" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>利润</tspan>
        </text>
        
        <!-- 连接线 -->
        <line x1="398" y1="504" x2="458" y2="504" stroke="#BDC3C7" stroke-width="2.2" stroke-dasharray="4,2"/>
        
        <!-- 柱2: 营收增长 +120M（从280开始向上） -->
        <rect x="458" y="360" width="135" height="144" rx="6" fill="url(#increaseGrad)" filter="url(#barShadow)"/>
        <text x="525" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="600" fill="#4CAF50" text-anchor="middle">
            <tspan>+120</tspan>
        </text>
        <text x="525" y="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>营收增长</tspan>
        </text>
        
        <!-- 连接线 -->
        <line x1="592" y1="360" x2="652" y2="360" stroke="#BDC3C7" stroke-width="2.2" stroke-dasharray="4,2"/>
        
        <!-- 柱3: 新产品 +65M（从400开始向上） -->
        <rect x="652" y="282" width="135" height="78" rx="6" fill="url(#increaseGrad)" filter="url(#barShadow)"/>
        <text x="720" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="600" fill="#4CAF50" text-anchor="middle">
            <tspan>+65</tspan>
        </text>
        <text x="720" y="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>新产品</tspan>
        </text>
        
        <!-- 连接线 -->
        <line x1="788" y1="282" x2="848" y2="282" stroke="#BDC3C7" stroke-width="2.2" stroke-dasharray="4,2"/>
        
        <!-- 柱4: 原材料涨价 -45M（从465开始向下） -->
        <rect x="848" y="282" width="135" height="54" rx="6" fill="url(#decreaseGrad)" filter="url(#barShadow)"/>
        <text x="915" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="600" fill="#EF5350" text-anchor="middle">
            <tspan>-45</tspan>
        </text>
        <text x="915" y="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>原材料</tspan>
        </text>
        <text x="915" y="927" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>涨价</tspan>
        </text>
        
        <!-- 连接线 -->
        <line x1="982" y1="336" x2="1042" y2="336" stroke="#BDC3C7" stroke-width="2.2" stroke-dasharray="4,2"/>
        
        <!-- 柱5: 人力成本 -35M（从420开始向下） -->
        <rect x="1042" y="336" width="135" height="42" rx="6" fill="url(#decreaseGrad)" filter="url(#barShadow)"/>
        <text x="1110" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="600" fill="#EF5350" text-anchor="middle">
            <tspan>-35</tspan>
        </text>
        <text x="1110" y="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>人力成本</tspan>
        </text>
        
        <!-- 连接线 -->
        <line x1="1178" y1="378" x2="1238" y2="378" stroke="#BDC3C7" stroke-width="2.2" stroke-dasharray="4,2"/>
        
        <!-- 柱6: 营销投入 -25M（从385开始向下） -->
        <rect x="1238" y="378" width="135" height="30" rx="6" fill="url(#decreaseGrad)" filter="url(#barShadow)"/>
        <text x="1305" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="600" fill="#EF5350" text-anchor="middle">
            <tspan>-25</tspan>
        </text>
        <text x="1305" y="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>营销投入</tspan>
        </text>
        
        <!-- 连接线 -->
        <line x1="1372" y1="408" x2="1432" y2="408" stroke="#BDC3C7" stroke-width="2.2" stroke-dasharray="4,2"/>
        
        <!-- 柱7: 运营优化 +40M（从360开始向上） -->
        <rect x="1432" y="360" width="135" height="48" rx="6" fill="url(#increaseGrad)" filter="url(#barShadow)"/>
        <text x="1500" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="600" fill="#4CAF50" text-anchor="middle">
            <tspan>+40</tspan>
        </text>
        <text x="1500" y="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>运营优化</tspan>
        </text>
        
        <!-- 连接线 -->
        <line x1="1568" y1="360" x2="1628" y2="360" stroke="#BDC3C7" stroke-width="2.2" stroke-dasharray="4,2"/>
        
        <!-- 柱8: 2025年利润 400M（结束值，从0开始） -->
        <rect x="1628" y="360" width="135" height="480" rx="6" fill="url(#totalGrad)" filter="url(#barShadow)"/>
        <text x="1695" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>400</tspan>
        </text>
        <text x="1695" y="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>2025年</tspan>
        </text>
        <text x="1695" y="927" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#5D6D7E" text-anchor="middle">
            <tspan>利润</tspan>
        </text>
    </g>
    
    <!-- 总结卡片 -->
    <g id="summaryCard" transform="translate(90, 960)">
        <rect x="0" y="0" width="750" height="75" rx="12" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
        <text x="30" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#388E3C">
            <tspan>📈 年度利润增长:</tspan>
        </text>
        <text x="225" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#2E7D32">
            <tspan>+120M (+42.9%)</tspan>
        </text>
        <text x="30" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E">
            <tspan>增加项合计: +225M | 减少项合计: -105M | 净增长: +120M</tspan>
        </text>
    </g>
    
    <!-- 数据来源 -->
    <text x="1830" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#95A5A6" text-anchor="end">
        <tspan>数据来源: 财务部门</tspan>
    </text>
</svg>

