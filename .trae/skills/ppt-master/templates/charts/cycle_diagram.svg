<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    循环流程图模板
    用途: 循环往复流程、PDCA、迭代周期
    适用场景: 质量管理循环、敏捷迭代、业务闭环
    支持: 5阶段循环 (推荐4-6个)
    -->
    
    <defs>
        <!-- 节点阴影 -->
        <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
            <feOffset dx="0" dy="4" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.15"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- 卡片阴影 -->
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="3" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.1"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题区域 -->
    <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="700" fill="#1A252F" letter-spacing="-0.8">持续改进循环</text>
    <text x="90" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" fill="#7F8C8D">Continuous Improvement Cycle · 五阶段闭环驱动</text>
    
    <!-- 中心引导圆环 (虚线) -->
    <circle cx="720" cy="615" r="300" fill="none" stroke="#E0E0E0" stroke-width="3" stroke-dasharray="8,4"/>
    <circle cx="720" cy="615" r="195" fill="none" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- 中心文字 -->
    <text x="720" y="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="30" font-weight="800" fill="#2C3E50">持续循环</text>
    <text x="720" y="638" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="20" fill="#95A5A6">Continuous Loop</text>
    
    <!-- 5个节点沿圆环分布 (圆心480,410 r=200) -->
    <!-- 位置: 顶(480,210), 右上(670,350), 右下(600,570), 左下(360,570), 左上(290,350) -->
    
    <!-- 连接弧线箭头 (用弯曲path + polygon三角) -->
    <!-- 1→2 -->
    <path d="M 765,330 Q 930,360 975,510" stroke="#6C5CE7" stroke-width="3.8" fill="none" stroke-opacity="0.5"/>
    <polygon points="982,510 968,498 972,522" fill="#6C5CE7" fill-opacity="0.6"/>
    
    <!-- 2→3 -->
    <path d="M 1005,570 Q 1020,720 915,832" stroke="#00B894" stroke-width="3.8" fill="none" stroke-opacity="0.5"/>
    <polygon points="908,837 927,828 915,848" fill="#00B894" fill-opacity="0.6"/>
    
    <!-- 3→4 -->
    <path d="M 862,870 Q 720,930 562,862" stroke="#FDCB6E" stroke-width="3.8" fill="none" stroke-opacity="0.5"/>
    <polygon points="558,858 570,876 552,870" fill="#FDCB6E" fill-opacity="0.6"/>
    
    <!-- 4→5 -->
    <path d="M 510,832 Q 420,705 428,548" stroke="#E17055" stroke-width="3.8" fill="none" stroke-opacity="0.5"/>
    <polygon points="430,540 417,558 441,552" fill="#E17055" fill-opacity="0.6"/>
    
    <!-- 5→1 -->
    <path d="M 465,510 Q 510,375 690,322" stroke="#0984E3" stroke-width="3.8" fill="none" stroke-opacity="0.5"/>
    <polygon points="693,320 678,309 681,333" fill="#0984E3" fill-opacity="0.6"/>
    
    <!-- 节点1: 调研分析 (顶部) -->
    <circle cx="720" cy="315" r="68" fill="#6C5CE7" filter="url(#nodeShadow)"/>
    <text x="720" y="308" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="42" font-weight="700" fill="#FFFFFF">01</text>
    <text x="720" y="342" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="16" font-weight="600" fill="#FFFFFF" fill-opacity="0.85">调研分析</text>
    
    <!-- 节点2: 方案设计 (右上) -->
    <circle cx="1005" cy="532" r="68" fill="#00B894" filter="url(#nodeShadow)"/>
    <text x="1005" y="525" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="42" font-weight="700" fill="#FFFFFF">02</text>
    <text x="1005" y="560" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="16" font-weight="600" fill="#FFFFFF" fill-opacity="0.85">方案设计</text>
    
    <!-- 节点3: 执行落地 (右下) -->
    <circle cx="900" cy="855" r="68" fill="#FDCB6E" filter="url(#nodeShadow)"/>
    <text x="900" y="848" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="42" font-weight="700" fill="#FFFFFF">03</text>
    <text x="900" y="882" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="16" font-weight="600" fill="#FFFFFF" fill-opacity="0.85">执行落地</text>
    
    <!-- 节点4: 效果评估 (左下) -->
    <circle cx="540" cy="855" r="68" fill="#E17055" filter="url(#nodeShadow)"/>
    <text x="540" y="848" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="42" font-weight="700" fill="#FFFFFF">04</text>
    <text x="540" y="882" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="16" font-weight="600" fill="#FFFFFF" fill-opacity="0.85">效果评估</text>
    
    <!-- 节点5: 迭代优化 (左上) -->
    <circle cx="435" cy="532" r="68" fill="#0984E3" filter="url(#nodeShadow)"/>
    <text x="435" y="525" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="42" font-weight="700" fill="#FFFFFF">05</text>
    <text x="435" y="560" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="16" font-weight="600" fill="#FFFFFF" fill-opacity="0.85">迭代优化</text>
    
    <!-- 右侧说明面板 -->
    <g filter="url(#cardShadow)">
        <rect x="1170" y="225" width="660" height="112" rx="12" fill="#FFFFFF"/>
        <rect x="1170" y="225" width="8" height="112" rx="4" fill="#6C5CE7"/>
        <text x="1203" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="700" fill="#6C5CE7">01 调研分析</text>
        <text x="1203" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D">深入了解现状，收集数据与用户反馈</text>
    </g>
    
    <g filter="url(#cardShadow)">
        <rect x="1170" y="360" width="660" height="112" rx="12" fill="#FFFFFF"/>
        <rect x="1170" y="360" width="8" height="112" rx="4" fill="#00B894"/>
        <text x="1203" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="700" fill="#00B894">02 方案设计</text>
        <text x="1203" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D">制定改进方案，明确目标与关键路径</text>
    </g>
    
    <g filter="url(#cardShadow)">
        <rect x="1170" y="495" width="660" height="112" rx="12" fill="#FFFFFF"/>
        <rect x="1170" y="495" width="8" height="112" rx="4" fill="#FDCB6E"/>
        <text x="1203" y="537" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="700" fill="#D4A537">03 执行落地</text>
        <text x="1203" y="573" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D">推进方案实施，协调资源与跟踪进度</text>
    </g>
    
    <g filter="url(#cardShadow)">
        <rect x="1170" y="630" width="660" height="112" rx="12" fill="#FFFFFF"/>
        <rect x="1170" y="630" width="8" height="112" rx="4" fill="#E17055"/>
        <text x="1203" y="672" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="700" fill="#E17055">04 效果评估</text>
        <text x="1203" y="708" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D">量化成果输出，对比目标达成率</text>
    </g>
    
    <g filter="url(#cardShadow)">
        <rect x="1170" y="765" width="660" height="112" rx="12" fill="#FFFFFF"/>
        <rect x="1170" y="765" width="8" height="112" rx="4" fill="#0984E3"/>
        <text x="1203" y="807" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="22" font-weight="700" fill="#0984E3">05 迭代优化</text>
        <text x="1203" y="843" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D">总结经验教训，进入下一轮改进循环</text>
    </g>

    <!-- 底部注释 -->
    <text x="90" y="1035" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="18" fill="#BDC3C7">每完成一个循环，整体能力向上跃迁一个台阶</text>
</svg>