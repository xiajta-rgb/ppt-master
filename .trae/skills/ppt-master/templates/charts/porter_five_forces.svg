<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    Porter's Five Forces Chart Template
    Purpose: Industry competitive analysis, strategic planning
    Use cases: Industry reports, market entry evaluation, competitive strategy, investment analysis
    Supports: Five forces radial layout
    -->
    
    <defs>
        <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#34495E;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="forceGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="forceGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2980B9;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="forceGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="forceGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="forceGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
        </linearGradient>
        
        <filter id="forceShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="4"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.25"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <path d="M0,0 L0,9 L14,4 z" fill="#7F8C8D"/>
        </marker>
    </defs>
    
    <rect width="1920" height="1080" fill="#FAFBFC"/>
    
    <text x="960" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50" text-anchor="middle">
        <tspan>Porter's Five Forces - Industry Analysis</tspan>
    </text>
    
    <text x="960" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D" text-anchor="middle">
        <tspan>Enterprise SaaS Market - Competitive Landscape Assessment 2025</tspan>
    </text>
    
    <!-- Center circle - Industry Competition -->
    <circle cx="960" cy="570" r="135" fill="url(#centerGrad)" filter="url(#forceShadow)"/>
    <text x="960" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
        <tspan>Industry</tspan>
    </text>
    <text x="960" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
        <tspan>Rivalry</tspan>
    </text>
    <text x="960" y="622" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" fill="#BDC3C7" text-anchor="middle">
        <tspan>High</tspan>
    </text>
    
    <!-- Force 1: Top - Threat of New Entrants -->
    <g id="force1" transform="translate(960, 225)">
        <rect x="-225" y="-82" width="450" height="135" rx="18" fill="url(#forceGrad1)" filter="url(#forceShadow)"/>
        <text x="0" y="-38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan>Threat of New Entrants</tspan>
        </text>
        <rect x="-180" y="-8" width="270" height="15" rx="8" fill="#FFFFFF" fill-opacity="0.3"/>
        <rect x="-180" y="-8" width="135" height="15" rx="8" fill="#FFFFFF"/>
        <text x="105" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" font-weight="bold" fill="#FFFFFF">
            <tspan>Medium</tspan>
        </text>
        <text x="0" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="16" fill="#FFFFFF" fill-opacity="0.9" text-anchor="middle">
            <tspan>Capital barriers, Tech accumulation needed</tspan>
        </text>
    </g>
    <line x1="960" y1="315" x2="960" y2="435" stroke="#7F8C8D" stroke-width="3" marker-end="url(#arrowHead)"/>
    
    <!-- Force 2: Right - Buyer Power -->
    <g id="force2" transform="translate(1425, 570)">
        <rect x="-225" y="-82" width="450" height="135" rx="18" fill="url(#forceGrad2)" filter="url(#forceShadow)"/>
        <text x="0" y="-38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan>Bargaining Power of Buyers</tspan>
        </text>
        <rect x="-180" y="-8" width="270" height="15" rx="8" fill="#FFFFFF" fill-opacity="0.3"/>
        <rect x="-180" y="-8" width="202" height="15" rx="8" fill="#FFFFFF"/>
        <text x="105" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" font-weight="bold" fill="#FFFFFF">
            <tspan>High</tspan>
        </text>
        <text x="0" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="16" fill="#FFFFFF" fill-opacity="0.9" text-anchor="middle">
            <tspan>Many choices, Low switching costs</tspan>
        </text>
    </g>
    <line x1="1095" y1="570" x2="1178" y2="570" stroke="#7F8C8D" stroke-width="3" marker-end="url(#arrowHead)"/>
    
    <!-- Force 3: Bottom - Threat of Substitutes -->
    <g id="force3" transform="translate(960, 915)">
        <rect x="-225" y="-82" width="450" height="135" rx="18" fill="url(#forceGrad3)" filter="url(#forceShadow)"/>
        <text x="0" y="-38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan>Threat of Substitutes</tspan>
        </text>
        <rect x="-180" y="-8" width="270" height="15" rx="8" fill="#FFFFFF" fill-opacity="0.3"/>
        <rect x="-180" y="-8" width="81" height="15" rx="8" fill="#FFFFFF"/>
        <text x="105" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" font-weight="bold" fill="#FFFFFF">
            <tspan>Low</tspan>
        </text>
        <text x="0" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="16" fill="#FFFFFF" fill-opacity="0.9" text-anchor="middle">
            <tspan>Few effective alternatives</tspan>
        </text>
    </g>
    <line x1="960" y1="705" x2="960" y2="810" stroke="#7F8C8D" stroke-width="3" marker-end="url(#arrowHead)"/>
    
    <!-- Force 4: Left - Supplier Power -->
    <g id="force4" transform="translate(495, 570)">
        <rect x="-225" y="-82" width="450" height="135" rx="18" fill="url(#forceGrad4)" filter="url(#forceShadow)"/>
        <text x="0" y="-38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan>Bargaining Power of Suppliers</tspan>
        </text>
        <rect x="-180" y="-8" width="270" height="15" rx="8" fill="#FFFFFF" fill-opacity="0.3"/>
        <rect x="-180" y="-8" width="162" height="15" rx="8" fill="#FFFFFF"/>
        <text x="105" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" font-weight="bold" fill="#FFFFFF">
            <tspan>Medium-High</tspan>
        </text>
        <text x="0" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="16" fill="#FFFFFF" fill-opacity="0.9" text-anchor="middle">
            <tspan>Cloud vendors concentrated</tspan>
        </text>
    </g>
    <line x1="825" y1="570" x2="742" y2="570" stroke="#7F8C8D" stroke-width="3" marker-end="url(#arrowHead)"/>
    
    <!-- Force 5: Top Right Corner - Competitive Rivalry Detail -->
    <g id="force5" transform="translate(1575, 225)">
        <rect x="-225" y="-82" width="450" height="135" rx="18" fill="url(#forceGrad5)" filter="url(#forceShadow)"/>
        <text x="0" y="-38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            <tspan>Competitive Rivalry</tspan>
        </text>
        <rect x="-180" y="-8" width="270" height="15" rx="8" fill="#FFFFFF" fill-opacity="0.3"/>
        <rect x="-180" y="-8" width="243" height="15" rx="8" fill="#FFFFFF"/>
        <text x="105" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" font-weight="bold" fill="#FFFFFF">
            <tspan>Very High</tspan>
        </text>
        <text x="0" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="16" fill="#FFFFFF" fill-opacity="0.9" text-anchor="middle">
            <tspan>Many competitors, Price wars common</tspan>
        </text>
    </g>
    
    <!-- Info panels -->
    <g id="infoPanel">
        <rect x="90" y="780" width="300" height="150" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2" filter="url(#forceShadow)"/>
        <text x="240" y="818" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="bold" fill="#2C3E50" text-anchor="middle">
            <tspan>Overall Assessment</tspan>
        </text>
        <text x="240" y="862" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="42" font-weight="bold" fill="#E74C3C" text-anchor="middle">
            <tspan>3.4 / 5</tspan>
        </text>
        <text x="240" y="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#7F8C8D" text-anchor="middle">
            <tspan>High Competition Intensity</tspan>
        </text>
    </g>
    
    <!-- Strategy recommendations -->
    <g id="recommendations">
        <rect x="90" y="165" width="300" height="180" rx="12" fill="#E8F5E9" stroke="#4CAF50" stroke-width="3"/>
        <text x="240" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="bold" fill="#2E7D32" text-anchor="middle">
            <tspan>Strategic Advice</tspan>
        </text>
        <text x="112" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E">
            <tspan>1. Build technical moats</tspan>
        </text>
        <text x="112" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E">
            <tspan>2. Improve customer stickiness</tspan>
        </text>
        <text x="112" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E">
            <tspan>3. Diversify supply chain</tspan>
        </text>
        <text x="112" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E">
            <tspan>4. Focus on differentiation</tspan>
        </text>
    </g>
    
    <!-- Legend -->
    <g id="legend" transform="translate(90, 952)">
        <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" font-weight="600" fill="#5D6D7E">
            <tspan>Threat Level:</tspan>
        </text>
        <rect x="135" y="8" width="60" height="21" rx="10" fill="#4CAF50"/>
        <text x="207" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#5D6D7E"><tspan>Low</tspan></text>
        <rect x="248" y="8" width="90" height="21" rx="10" fill="#F39C12"/>
        <text x="350" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#5D6D7E"><tspan>Medium</tspan></text>
        <rect x="420" y="8" width="120" height="21" rx="10" fill="#E74C3C"/>
        <text x="552" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#5D6D7E"><tspan>High</tspan></text>
    </g>
    
    <text x="960" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="18" fill="#95A5A6" text-anchor="middle">
        <tspan>Data Source: Industry Research Department - 2025 Market Competition Analysis Report</tspan>
    </text>
</svg>
