    <path d="M 1080,262 C 1350,262 1350,300 1620,300" fill="none" stroke="url(#flowD1)" stroke-width="94" opacity="0.6"/>
    <path d="M 1080,375 C 1350,375 1350,772 1620,772" fill="none" stroke="url(#flowD2)" stroke-width="24" opacity="0.6"/>
    
