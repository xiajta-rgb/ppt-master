    <path d="M 300,735 C 570,735 570,600 840,600" fill="none" stroke="url(#flowB2)" stroke-width="34" opacity="0.6"/>
    <path d="M 300,795 C 570,795 570,818 840,818" fill="none" stroke="url(#flowB3)" stroke-width="34" opacity="0.6"/>
    
