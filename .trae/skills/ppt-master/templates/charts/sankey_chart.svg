    <path d="M 1080,735 C 1350,735 1350,495 1620,495" fill="none" stroke="url(#flowF1)" stroke-width="34" opacity="0.6"/>
    <path d="M 1080,818 C 1350,818 1350,825 1620,825" fill="none" stroke="url(#flowF2)" stroke-width="51" opacity="0.6"/>
    
