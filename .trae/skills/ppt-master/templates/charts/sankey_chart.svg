        <text x="240" y="1046" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#2196F3" text-anchor="middle">
            <tspan>$100M</tspan>
