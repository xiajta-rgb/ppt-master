    <path d="M 1080,510 C 1350,510 1350,435 1620,435" fill="none" stroke="url(#flowE1)" stroke-width="34" opacity="0.6"/>
    <path d="M 1080,600 C 1350,600 1350,622 1620,622" fill="none" stroke="url(#flowE2)" stroke-width="68" opacity="0.6"/>
    
