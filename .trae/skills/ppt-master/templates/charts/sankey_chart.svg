        <text x="600" y="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5D6D7E" text-anchor="middle">
            <tspan>Largest Dept</tspan>
        </text>
        <text x="600" y="1046" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#4CAF50" text-anchor="middle">
            <tspan>R&amp;D 35%</tspan>
        </text>
        
        <text x="960" y="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5D6D7E" text-anchor="middle">
