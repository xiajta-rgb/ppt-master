        </text>
        <text x="960" y="1046" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="bold" fill="#3F51B5" text-anchor="middle">
            <tspan>50%</tspan>
