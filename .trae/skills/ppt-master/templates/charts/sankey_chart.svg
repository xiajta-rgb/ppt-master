    <path d="M 300,262 C 570,262 570,262 840,262" fill="none" stroke="url(#flowA1)" stroke-width="84" opacity="0.6"/>
    <path d="M 300,382 C 570,382 570,510 840,510" fill="none" stroke="url(#flowA2)" stroke-width="60" opacity="0.6"/>
