<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!--
    中心辐射带描述图模板 (Hub with Described Spokes)
    用途: 核心模块 + 外围能力，且每个外围能力需要承载 1-2 行描述
    适用场景: 中台能力、核心引擎 + 衍生服务、平台与生态关系
    支持: 1 中心 + 4-6 辐射子模块 (推荐 6)
    关键约定: 每个辐射卡 = 能力名 + 1 行能力描述；若只有能力名没有描述，应使用更简洁的 hub_spoke 模板而不是本模板
    区别于 hub_spoke: 辐射卡更宽，强制承载描述段
    -->

    <defs>
        <filter id="hdsShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="0" dy="3"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="hdsHubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4A6FDC;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#2C4FB0;stop-opacity:1"/>
        </linearGradient>
    </defs>

    <rect width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 标题 -->
    <text x="960" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="42" font-weight="700" fill="#1A252F">数据中台能力矩阵</text>
    <text x="960" y="117" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="21" fill="#7F8C8D">Hub with Described Spokes · 核心引擎驱动六大能力域，每项能力附简要说明</text>

    <!-- 辐射线：从中心(640,400)到各子卡边缘 -->
    <line x1="960" y1="480" x2="960" y2="255" stroke="#B0B8C4" stroke-width="2.2" stroke-dasharray="4,3"/>
    <line x1="1050" y1="540" x2="1440" y2="315" stroke="#B0B8C4" stroke-width="2.2" stroke-dasharray="4,3"/>
    <line x1="1050" y1="660" x2="1440" y2="885" stroke="#B0B8C4" stroke-width="2.2" stroke-dasharray="4,3"/>
    <line x1="960" y1="720" x2="960" y2="945" stroke="#B0B8C4" stroke-width="2.2" stroke-dasharray="4,3"/>
    <line x1="870" y1="660" x2="480" y2="885" stroke="#B0B8C4" stroke-width="2.2" stroke-dasharray="4,3"/>
    <line x1="870" y1="540" x2="480" y2="315" stroke="#B0B8C4" stroke-width="2.2" stroke-dasharray="4,3"/>

    <!-- 中心 Hub -->
    <circle cx="960" cy="600" r="135" fill="url(#hdsHubGrad)" filter="url(#hdsShadow)"/>
    <circle cx="960" cy="600" r="108" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.35"/>
    <text x="960" y="585" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="30" font-weight="800" fill="#FFFFFF">数据中台</text>
    <text x="960" y="624" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#FFFFFF" fill-opacity="0.85">Data Platform Core</text>

    <!-- 子卡 1: 正上 (数据采集) -->
    <g filter="url(#hdsShadow)">
        <rect x="735" y="165" width="450" height="135" rx="15" fill="#FFFFFF" stroke="#D4DFF7" stroke-width="2.2"/>
        <rect x="735" y="165" width="9" height="135" fill="#4A6FDC"/>
    </g>
    <text x="774" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">数据采集</text>
    <text x="774" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">统一埋点 SDK + 批流一体接入管道</text>
    <text x="774" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">覆盖 Web / App / IoT / 业务库</text>

    <!-- 子卡 2: 右上 (数据治理) -->
    <g filter="url(#hdsShadow)">
        <rect x="1350" y="225" width="450" height="135" rx="15" fill="#FFFFFF" stroke="#CDEAD3" stroke-width="2.2"/>
        <rect x="1350" y="225" width="9" height="135" fill="#2E9E4A"/>
    </g>
    <text x="1389" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">数据治理</text>
    <text x="1389" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">元数据、血缘与质量规则集中管理</text>
    <text x="1389" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">保障准确性、一致性、可追溯性</text>

    <!-- 子卡 3: 右下 (智能分析) -->
    <g filter="url(#hdsShadow)">
        <rect x="1350" y="840" width="450" height="135" rx="15" fill="#FFFFFF" stroke="#F3DFB9" stroke-width="2.2"/>
        <rect x="1350" y="840" width="9" height="135" fill="#D48A1F"/>
    </g>
    <text x="1389" y="882" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">智能分析</text>
    <text x="1389" y="918" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">BI 看板 + AI 归因 + 指标解释</text>
    <text x="1389" y="948" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">业务方可自助探索与下钻</text>

    <!-- 子卡 4: 正下 (数据服务) -->
    <g filter="url(#hdsShadow)">
        <rect x="735" y="900" width="450" height="135" rx="15" fill="#FFFFFF" stroke="#E9C8D3" stroke-width="2.2"/>
        <rect x="735" y="900" width="9" height="135" fill="#C24A6A"/>
    </g>
    <text x="774" y="942" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">数据服务</text>
    <text x="774" y="978" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">统一 API 网关封装数据消费入口</text>
    <text x="774" y="1008" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">限流、鉴权、审计开箱即用</text>

    <!-- 子卡 5: 左下 (指标管理) -->
    <g filter="url(#hdsShadow)">
        <rect x="120" y="840" width="450" height="135" rx="15" fill="#FFFFFF" stroke="#D5D2F1" stroke-width="2.2"/>
        <rect x="120" y="840" width="9" height="135" fill="#6C5CE7"/>
    </g>
    <text x="159" y="882" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">指标管理</text>
    <text x="159" y="918" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">统一指标定义与口径审核流程</text>
    <text x="159" y="948" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">消除跨团队口径分歧</text>

    <!-- 子卡 6: 左上 (数据安全) -->
    <g filter="url(#hdsShadow)">
        <rect x="120" y="225" width="450" height="135" rx="15" fill="#FFFFFF" stroke="#BBE3F1" stroke-width="2.2"/>
        <rect x="120" y="225" width="9" height="135" fill="#1E88A8"/>
    </g>
    <text x="159" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" font-weight="700" fill="#1A252F">数据安全</text>
    <text x="159" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">分级分类、脱敏、访问审计一体化</text>
    <text x="159" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" fill="#566573">合规对齐 GDPR / 等保 / 个保法</text>

    <!-- 装饰性背景环 -->
    <circle cx="960" cy="600" r="270" fill="none" stroke="#E8E8E8" stroke-width="2" stroke-dasharray="5,4"/>
    <circle cx="960" cy="600" r="188" fill="none" stroke="#E8E8E8" stroke-width="2" stroke-dasharray="3,3"/>
</svg>
