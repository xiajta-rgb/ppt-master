<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    热力图模板
    用途: 矩阵数据可视化、相关性分析
    适用场景: 相关性矩阵、时间热力图、用户行为分析
    支持: 7×7 矩阵格子
    -->
    
    <defs>
        <!-- 热力图色阶（从蓝到红） -->
        <linearGradient id="heatGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#1565C0"/>
            <stop offset="25%" style="stop-color:#42A5F5"/>
            <stop offset="50%" style="stop-color:#FFEB3B"/>
            <stop offset="75%" style="stop-color:#FF9800"/>
            <stop offset="100%" style="stop-color:#D32F2F"/>
        </linearGradient>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>用户活跃度热力图</tspan>
    </text>
    
    <text x="90" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>按星期和时段统计 · 数值代表平均在线用户数（千人）</tspan>
    </text>
    
    <!-- 热力图区域 -->
    <g id="heatmapArea" transform="translate(270, 195)">
        <!-- 
        格子大小: 80×60
        列: 7列（周一到周日）
        行: 8行（时段）
        颜色映射: 0-100 -> 蓝到红
        -->
        
        <!-- 列标题（星期） -->
        <text x="60" y="-22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="600" fill="#5D6D7E" text-anchor="middle"><tspan>周一</tspan></text>
        <text x="180" y="-22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="600" fill="#5D6D7E" text-anchor="middle"><tspan>周二</tspan></text>
        <text x="300" y="-22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="600" fill="#5D6D7E" text-anchor="middle"><tspan>周三</tspan></text>
        <text x="420" y="-22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="600" fill="#5D6D7E" text-anchor="middle"><tspan>周四</tspan></text>
        <text x="540" y="-22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="600" fill="#5D6D7E" text-anchor="middle"><tspan>周五</tspan></text>
        <text x="660" y="-22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="600" fill="#E91E63" text-anchor="middle"><tspan>周六</tspan></text>
        <text x="780" y="-22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="600" fill="#E91E63" text-anchor="middle"><tspan>周日</tspan></text>
        
        <!-- 行标题（时段） -->
        <text x="-22" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>6-9时</tspan></text>
        <text x="-22" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>9-12时</tspan></text>
        <text x="-22" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>12-14时</tspan></text>
        <text x="-22" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>14-17时</tspan></text>
        <text x="-22" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>17-19时</tspan></text>
        <text x="-22" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>19-21时</tspan></text>
        <text x="-22" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>21-23时</tspan></text>
        <text x="-22" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="end"><tspan>23-6时</tspan></text>
        
        <!-- 热力图格子 -->
        <!-- 第1行: 6-9时 -->
        <rect x="0" y="8" width="117" height="87" rx="6" fill="#64B5F6"/><text x="60" y="60" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>35</tspan></text>
        <rect x="120" y="8" width="117" height="87" rx="6" fill="#42A5F5"/><text x="180" y="60" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>42</tspan></text>
        <rect x="240" y="8" width="117" height="87" rx="6" fill="#42A5F5"/><text x="300" y="60" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>40</tspan></text>
        <rect x="360" y="8" width="117" height="87" rx="6" fill="#64B5F6"/><text x="420" y="60" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>38</tspan></text>
        <rect x="480" y="8" width="117" height="87" rx="6" fill="#90CAF9"/><text x="540" y="60" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>28</tspan></text>
        <rect x="600" y="8" width="117" height="87" rx="6" fill="#BBDEFB"/><text x="660" y="60" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>15</tspan></text>
        <rect x="720" y="8" width="117" height="87" rx="6" fill="#E3F2FD"/><text x="780" y="60" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>10</tspan></text>
        
        <!-- 第2行: 9-12时 -->
        <rect x="0" y="98" width="117" height="87" rx="6" fill="#FFF176"/><text x="60" y="150" font-size="20" fill="#F57F17" text-anchor="middle"><tspan>58</tspan></text>
        <rect x="120" y="98" width="117" height="87" rx="6" fill="#FFD54F"/><text x="180" y="150" font-size="20" fill="#F57F17" text-anchor="middle"><tspan>65</tspan></text>
        <rect x="240" y="98" width="117" height="87" rx="6" fill="#FFC107"/><text x="300" y="150" font-size="20" fill="#FFFFFF" text-anchor="middle"><tspan>72</tspan></text>
        <rect x="360" y="98" width="117" height="87" rx="6" fill="#FFD54F"/><text x="420" y="150" font-size="20" fill="#F57F17" text-anchor="middle"><tspan>68</tspan></text>
        <rect x="480" y="98" width="117" height="87" rx="6" fill="#FFF176"/><text x="540" y="150" font-size="20" fill="#F57F17" text-anchor="middle"><tspan>55</tspan></text>
        <rect x="600" y="98" width="117" height="87" rx="6" fill="#42A5F5"/><text x="660" y="150" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>45</tspan></text>
        <rect x="720" y="98" width="117" height="87" rx="6" fill="#64B5F6"/><text x="780" y="150" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>38</tspan></text>
        
        <!-- 第3行: 12-14时 -->
        <rect x="0" y="188" width="117" height="87" rx="6" fill="#FFB74D"/><text x="60" y="240" font-size="20" fill="#E65100" text-anchor="middle"><tspan>75</tspan></text>
        <rect x="120" y="188" width="117" height="87" rx="6" fill="#FFA726"/><text x="180" y="240" font-size="20" fill="#FFFFFF" text-anchor="middle"><tspan>82</tspan></text>
        <rect x="240" y="188" width="117" height="87" rx="6" fill="#FF9800"/><text x="300" y="240" font-size="20" fill="#FFFFFF" text-anchor="middle"><tspan>88</tspan></text>
        <rect x="360" y="188" width="117" height="87" rx="6" fill="#FFA726"/><text x="420" y="240" font-size="20" fill="#FFFFFF" text-anchor="middle"><tspan>80</tspan></text>
        <rect x="480" y="188" width="117" height="87" rx="6" fill="#FFB74D"/><text x="540" y="240" font-size="20" fill="#E65100" text-anchor="middle"><tspan>70</tspan></text>
        <rect x="600" y="188" width="117" height="87" rx="6" fill="#FFF176"/><text x="660" y="240" font-size="20" fill="#F57F17" text-anchor="middle"><tspan>60</tspan></text>
        <rect x="720" y="188" width="117" height="87" rx="6" fill="#FFD54F"/><text x="780" y="240" font-size="20" fill="#F57F17" text-anchor="middle"><tspan>65</tspan></text>
        
        <!-- 第4行: 14-17时 -->
        <rect x="0" y="278" width="117" height="87" rx="6" fill="#FFF176"/><text x="60" y="330" font-size="20" fill="#F57F17" text-anchor="middle"><tspan>55</tspan></text>
        <rect x="120" y="278" width="117" height="87" rx="6" fill="#FFD54F"/><text x="180" y="330" font-size="20" fill="#F57F17" text-anchor="middle"><tspan>62</tspan></text>
        <rect x="240" y="278" width="117" height="87" rx="6" fill="#FFD54F"/><text x="300" y="330" font-size="20" fill="#F57F17" text-anchor="middle"><tspan>68</tspan></text>
        <rect x="360" y="278" width="117" height="87" rx="6" fill="#FFF176"/><text x="420" y="330" font-size="20" fill="#F57F17" text-anchor="middle"><tspan>60</tspan></text>
        <rect x="480" y="278" width="117" height="87" rx="6" fill="#42A5F5"/><text x="540" y="330" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>48</tspan></text>
        <rect x="600" y="278" width="117" height="87" rx="6" fill="#FFB74D"/><text x="660" y="330" font-size="20" fill="#E65100" text-anchor="middle"><tspan>72</tspan></text>
        <rect x="720" y="278" width="117" height="87" rx="6" fill="#FFA726"/><text x="780" y="330" font-size="20" fill="#FFFFFF" text-anchor="middle"><tspan>78</tspan></text>
        
        <!-- 第5行: 17-19时 -->
        <rect x="0" y="368" width="117" height="87" rx="6" fill="#64B5F6"/><text x="60" y="420" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>32</tspan></text>
        <rect x="120" y="368" width="117" height="87" rx="6" fill="#64B5F6"/><text x="180" y="420" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>35</tspan></text>
        <rect x="240" y="368" width="117" height="87" rx="6" fill="#64B5F6"/><text x="300" y="420" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>38</tspan></text>
        <rect x="360" y="368" width="117" height="87" rx="6" fill="#64B5F6"/><text x="420" y="420" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>35</tspan></text>
        <rect x="480" y="368" width="117" height="87" rx="6" fill="#90CAF9"/><text x="540" y="420" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>28</tspan></text>
        <rect x="600" y="368" width="117" height="87" rx="6" fill="#FFD54F"/><text x="660" y="420" font-size="20" fill="#F57F17" text-anchor="middle"><tspan>65</tspan></text>
        <rect x="720" y="368" width="117" height="87" rx="6" fill="#FFB74D"/><text x="780" y="420" font-size="20" fill="#E65100" text-anchor="middle"><tspan>70</tspan></text>
        
        <!-- 第6行: 19-21时 (高峰) -->
        <rect x="0" y="458" width="117" height="87" rx="6" fill="#FFA726"/><text x="60" y="510" font-size="20" fill="#FFFFFF" text-anchor="middle"><tspan>78</tspan></text>
        <rect x="120" y="458" width="117" height="87" rx="6" fill="#FF9800"/><text x="180" y="510" font-size="20" fill="#FFFFFF" text-anchor="middle"><tspan>85</tspan></text>
        <rect x="240" y="458" width="117" height="87" rx="6" fill="#FF9800"/><text x="300" y="510" font-size="20" fill="#FFFFFF" text-anchor="middle"><tspan>88</tspan></text>
        <rect x="360" y="458" width="117" height="87" rx="6" fill="#FF9800"/><text x="420" y="510" font-size="20" fill="#FFFFFF" text-anchor="middle"><tspan>86</tspan></text>
        <rect x="480" y="458" width="117" height="87" rx="6" fill="#FFA726"/><text x="540" y="510" font-size="20" fill="#FFFFFF" text-anchor="middle"><tspan>80</tspan></text>
        <rect x="600" y="458" width="117" height="87" rx="6" fill="#EF5350"/><text x="660" y="510" font-size="20" fill="#FFFFFF" text-anchor="middle"><tspan>95</tspan></text>
        <rect x="720" y="458" width="117" height="87" rx="6" fill="#D32F2F"/><text x="780" y="510" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan>98</tspan></text>
        
        <!-- 第7行: 21-23时 -->
        <rect x="0" y="548" width="117" height="87" rx="6" fill="#FFD54F"/><text x="60" y="600" font-size="20" fill="#F57F17" text-anchor="middle"><tspan>62</tspan></text>
        <rect x="120" y="548" width="117" height="87" rx="6" fill="#FFB74D"/><text x="180" y="600" font-size="20" fill="#E65100" text-anchor="middle"><tspan>70</tspan></text>
        <rect x="240" y="548" width="117" height="87" rx="6" fill="#FFB74D"/><text x="300" y="600" font-size="20" fill="#E65100" text-anchor="middle"><tspan>72</tspan></text>
        <rect x="360" y="548" width="117" height="87" rx="6" fill="#FFB74D"/><text x="420" y="600" font-size="20" fill="#E65100" text-anchor="middle"><tspan>68</tspan></text>
        <rect x="480" y="548" width="117" height="87" rx="6" fill="#FFD54F"/><text x="540" y="600" font-size="20" fill="#F57F17" text-anchor="middle"><tspan>65</tspan></text>
        <rect x="600" y="548" width="117" height="87" rx="6" fill="#FF9800"/><text x="660" y="600" font-size="20" fill="#FFFFFF" text-anchor="middle"><tspan>85</tspan></text>
        <rect x="720" y="548" width="117" height="87" rx="6" fill="#FFA726"/><text x="780" y="600" font-size="20" fill="#FFFFFF" text-anchor="middle"><tspan>82</tspan></text>
        
        <!-- 第8行: 23-6时 -->
        <rect x="0" y="638" width="117" height="87" rx="6" fill="#BBDEFB"/><text x="60" y="690" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>18</tspan></text>
        <rect x="120" y="638" width="117" height="87" rx="6" fill="#BBDEFB"/><text x="180" y="690" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>15</tspan></text>
        <rect x="240" y="638" width="117" height="87" rx="6" fill="#BBDEFB"/><text x="300" y="690" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>12</tspan></text>
        <rect x="360" y="638" width="117" height="87" rx="6" fill="#BBDEFB"/><text x="420" y="690" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>15</tspan></text>
        <rect x="480" y="638" width="117" height="87" rx="6" fill="#90CAF9"/><text x="540" y="690" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>22</tspan></text>
        <rect x="600" y="638" width="117" height="87" rx="6" fill="#64B5F6"/><text x="660" y="690" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>35</tspan></text>
        <rect x="720" y="638" width="117" height="87" rx="6" fill="#90CAF9"/><text x="780" y="690" font-size="20" fill="#1565C0" text-anchor="middle"><tspan>28</tspan></text>
    </g>
    
    <!-- 色阶图例 -->
    <g id="colorLegend" transform="translate(1170, 225)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50"><tspan>活跃度色阶</tspan></text>
        
        <rect x="0" y="22" width="300" height="30" rx="6" fill="url(#heatGradient)"/>
        
        <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D"><tspan>低 (0)</tspan></text>
        <text x="135" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D" text-anchor="middle"><tspan>中 (50)</tspan></text>
        <text x="300" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D" text-anchor="end"><tspan>高 (100)</tspan></text>
    </g>
    
    <!-- 统计面板 -->
    <g id="statsPanel" transform="translate(1170, 360)">
        <rect x="0" y="0" width="300" height="270" rx="12" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="2"/>
        
        <text x="150" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle"><tspan>统计摘要</tspan></text>
        
        <line x1="22" y1="63" x2="278" y2="63" stroke="#E0E0E0" stroke-width="2"/>
        
        <text x="30" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>🔥 峰值时段</tspan></text>
        <text x="30" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#D32F2F"><tspan>周日 19-21时 (98K)</tspan></text>
        
        <text x="30" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>❄️ 低谷时段</tspan></text>
        <text x="30" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#1565C0"><tspan>周日 6-9时 (10K)</tspan></text>
        
        <text x="30" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E"><tspan>📊 日均在线</tspan></text>
        <text x="195" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" font-weight="bold" fill="#2C3E50"><tspan>54.2K</tspan></text>
    </g>
    
    <!-- 洞察卡片 -->
    <g id="insightCard" transform="translate(1170, 660)">
        <rect x="0" y="0" width="300" height="180" rx="12" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
        
        <text x="30" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="600" fill="#2E7D32"><tspan>💡 关键洞察</tspan></text>
        
        <text x="30" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E"><tspan>• 周末晚间活跃度最高</tspan></text>
        <text x="30" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E"><tspan>• 工作日午间有小高峰</tspan></text>
        <text x="30" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E"><tspan>• 凌晨时段流量最低</tspan></text>
        <text x="30" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="16" fill="#7F8C8D"><tspan>建议: 周末晚间增加服务器</tspan></text>
    </g>
    
    <!-- 数据来源 -->
    <text x="90" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#95A5A6">
        <tspan>数据来源: 用户行为分析平台</tspan>
    </text>
</svg>

