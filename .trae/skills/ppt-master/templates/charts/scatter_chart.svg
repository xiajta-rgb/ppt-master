<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    散点图模板
    用途: 相关性分析、数据分布展示
    适用场景: 价格vs销量、投入vs产出、身高vs体重
    支持: 2个系列，每系列多个数据点
    -->
    
    <defs>
        <!-- 数据点阴影 -->
        <filter id="scatterShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- 系列1渐变 -->
        <radialGradient id="dotGrad1" cx="30%" cy="30%">
            <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
        </radialGradient>
        
        <!-- 系列2渐变 -->
        <radialGradient id="dotGrad2" cx="30%" cy="30%">
            <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
        </radialGradient>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>广告投入与销售额关系分析</tspan>
    </text>
    
    <text x="90" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>2025年各区域数据 · 样本量 N=24</tspan>
    </text>
    
    <!-- 图例 -->
    <g id="legend" transform="translate(1425, 105)">
        <circle cx="15" cy="15" r="12" fill="url(#dotGrad1)"/>
        <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="22" fill="#5D6D7E">
            <tspan>线上渠道</tspan>
        </text>
        
        <circle cx="195" cy="15" r="12" fill="url(#dotGrad2)"/>
        <text x="222" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="22" fill="#5D6D7E">
            <tspan>线下渠道</tspan>
        </text>
    </g>
    
    <!-- 图表区域 -->
    <g id="chartArea">
        <!-- 网格线 -->
        <!-- 水平网格线 -->
        <line x1="210" y1="840" x2="1650" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="705" x2="1650" y2="705" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="570" x2="1650" y2="570" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="435" x2="1650" y2="435" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="300" x2="1650" y2="300" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- 垂直网格线 -->
        <line x1="450" y1="240" x2="450" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="690" y1="240" x2="690" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="930" y1="240" x2="930" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="1170" y1="240" x2="1170" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="1410" y1="240" x2="1410" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="1650" y1="240" x2="1650" y2="840" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- Y轴刻度标签 -->
        <text x="188" y="848" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end"><tspan>0</tspan></text>
        <text x="188" y="712" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end"><tspan>200</tspan></text>
        <text x="188" y="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end"><tspan>400</tspan></text>
        <text x="188" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end"><tspan>600</tspan></text>
        <text x="188" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end"><tspan>800</tspan></text>
        
        <!-- Y轴标题 -->
        <text x="68" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#5D6D7E" text-anchor="middle" transform="rotate(-135, 68, 540)">
            <tspan>销售额（万元）</tspan>
        </text>
        
        <!-- X轴刻度标签 -->
        <text x="210" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>0</tspan></text>
        <text x="450" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>20</tspan></text>
        <text x="690" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>40</tspan></text>
        <text x="930" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>60</tspan></text>
        <text x="1170" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>80</tspan></text>
        <text x="1410" y="885" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="middle"><tspan>100</tspan></text>
        
        <!-- X轴标题 -->
        <text x="930" y="938" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="24" fill="#5D6D7E" text-anchor="middle">
            <tspan>广告投入（万元）</tspan>
        </text>
        
        <!-- 坐标轴 -->
        <line x1="210" y1="240" x2="210" y2="840" stroke="#95A5A6" stroke-width="3"/>
        <line x1="210" y1="840" x2="1650" y2="840" stroke="#95A5A6" stroke-width="3"/>
        
        <!-- 
        数据点计算：
        X: 140 + (value/100) * 960
        Y: 560 - (value/800) * 400
        -->
        
        <!-- 趋势线（线上渠道） -->
        <line x1="270" y1="758" x2="1530" y2="322" stroke="#2196F3" stroke-width="3" stroke-dasharray="8,4" opacity="0.5"/>
        
        <!-- 趋势线（线下渠道） -->
        <line x1="330" y1="772" x2="1350" y2="442" stroke="#4CAF50" stroke-width="3" stroke-dasharray="8,4" opacity="0.5"/>
        
        <!-- 系列1: 线上渠道数据点（蓝色） -->
        <circle cx="330" cy="705" r="15" fill="url(#dotGrad1)" filter="url(#scatterShadow)"/>
        <circle cx="450" cy="638" r="15" fill="url(#dotGrad1)" filter="url(#scatterShadow)"/>
        <circle cx="510" cy="668" r="15" fill="url(#dotGrad1)" filter="url(#scatterShadow)"/>
        <circle cx="630" cy="570" r="15" fill="url(#dotGrad1)" filter="url(#scatterShadow)"/>
        <circle cx="750" cy="525" r="15" fill="url(#dotGrad1)" filter="url(#scatterShadow)"/>
        <circle cx="810" cy="480" r="15" fill="url(#dotGrad1)" filter="url(#scatterShadow)"/>
        <circle cx="930" cy="465" r="15" fill="url(#dotGrad1)" filter="url(#scatterShadow)"/>
        <circle cx="1050" cy="405" r="15" fill="url(#dotGrad1)" filter="url(#scatterShadow)"/>
        <circle cx="1170" cy="375" r="15" fill="url(#dotGrad1)" filter="url(#scatterShadow)"/>
        <circle cx="1290" cy="345" r="15" fill="url(#dotGrad1)" filter="url(#scatterShadow)"/>
        <circle cx="1410" cy="315" r="15" fill="url(#dotGrad1)" filter="url(#scatterShadow)"/>
        <circle cx="1500" cy="292" r="15" fill="url(#dotGrad1)" filter="url(#scatterShadow)"/>
        
        <!-- 系列2: 线下渠道数据点（绿色） -->
        <circle cx="390" cy="735" r="15" fill="url(#dotGrad2)" filter="url(#scatterShadow)"/>
        <circle cx="480" cy="690" r="15" fill="url(#dotGrad2)" filter="url(#scatterShadow)"/>
        <circle cx="600" cy="645" r="15" fill="url(#dotGrad2)" filter="url(#scatterShadow)"/>
        <circle cx="690" cy="600" r="15" fill="url(#dotGrad2)" filter="url(#scatterShadow)"/>
        <circle cx="810" cy="570" r="15" fill="url(#dotGrad2)" filter="url(#scatterShadow)"/>
        <circle cx="900" cy="548" r="15" fill="url(#dotGrad2)" filter="url(#scatterShadow)"/>
        <circle cx="1020" cy="510" r="15" fill="url(#dotGrad2)" filter="url(#scatterShadow)"/>
        <circle cx="1110" cy="488" r="15" fill="url(#dotGrad2)" filter="url(#scatterShadow)"/>
        <circle cx="1230" cy="458" r="15" fill="url(#dotGrad2)" filter="url(#scatterShadow)"/>
        <circle cx="1320" cy="435" r="15" fill="url(#dotGrad2)" filter="url(#scatterShadow)"/>
        <circle cx="1380" cy="420" r="15" fill="url(#dotGrad2)" filter="url(#scatterShadow)"/>
        <circle cx="1470" cy="398" r="15" fill="url(#dotGrad2)" filter="url(#scatterShadow)"/>
    </g>
    
    <!-- 统计信息卡片 -->
    <g id="statsPanel" transform="translate(1680, 240)">
        <rect x="0" y="0" width="210" height="300" rx="12" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="2"/>
        
        <text x="105" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>统计摘要</tspan>
        </text>
        
        <line x1="22" y1="68" x2="188" y2="68" stroke="#E0E0E0" stroke-width="2"/>
        
        <!-- 线上渠道 -->
        <circle cx="38" cy="105" r="9" fill="url(#dotGrad1)"/>
        <text x="60" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E">
            <tspan>线上渠道</tspan>
        </text>
        <text x="38" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D">
            <tspan>R² = 0.94</tspan>
        </text>
        <text x="38" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D">
            <tspan>斜率 = 6.8</tspan>
        </text>
        
        <!-- 线下渠道 -->
        <circle cx="38" cy="210" r="9" fill="url(#dotGrad2)"/>
        <text x="60" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" fill="#5D6D7E">
            <tspan>线下渠道</tspan>
        </text>
        <text x="38" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D">
            <tspan>R² = 0.91</tspan>
        </text>
        <text x="38" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#7F8C8D">
            <tspan>斜率 = 5.2</tspan>
        </text>
    </g>
    
    <!-- 洞察卡片 -->
    <g id="insightCard" transform="translate(1680, 570)">
        <rect x="0" y="0" width="210" height="150" rx="12" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
        <text x="22" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="20" font-weight="600" fill="#1976D2">
            <tspan>💡 洞察</tspan>
        </text>
        <text x="22" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E">
            <tspan>线上渠道ROI</tspan>
        </text>
        <text x="22" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="18" fill="#5D6D7E">
            <tspan>高于线下 31%</tspan>
        </text>
        <text x="22" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" fill="#7F8C8D">
            <tspan>建议增加线上投入</tspan>
        </text>
    </g>
    
    <!-- 数据来源 -->
    <text x="90" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#95A5A6">
        <tspan>数据来源: 市场营销部门</tspan>
    </text>
</svg>

