<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    功能卡片网格模板
    用途: 功能特性展示、优势清单、服务项列表
    适用场景: 产品功能亮点、团队能力矩阵、服务套餐
    支持: 2×3 网格 (推荐4-9项)
    -->
    
    <defs>
        <!-- 卡片阴影 -->
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
            <feOffset dx="0" dy="4" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.12"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <!-- 背景渐变 -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#EEF1F5;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#bgGrad)"/>
    
    <!-- 标题区域 -->
    <text x="960" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="700" fill="#1A252F" letter-spacing="-0.8">核心产品功能</text>
    <text x="960" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="24" fill="#7F8C8D">Core Features · 六大能力构建完整解决方案</text>
    
    <!-- 卡片布局 2×3 (卡片宽370, 高260, 间距30) -->
    <!-- 第一行 y=120 -->
    
    <!-- 卡片1 - 智能分析 -->
    <g filter="url(#cardShadow)">
        <rect x="90" y="180" width="555" height="390" rx="18" fill="#FFFFFF"/>
        <rect x="90" y="180" width="555" height="8" rx="4" fill="#6C5CE7"/>
        <!-- 图标圆 -->
        <circle cx="172" cy="267" r="45" fill="#6C5CE7" fill-opacity="0.1"/>
        <rect x="152" y="252" width="42" height="6" rx="3" fill="#6C5CE7"/>
        <rect x="152" y="264" width="30" height="6" rx="3" fill="#6C5CE7"/>
        <rect x="152" y="276" width="36" height="6" rx="3" fill="#6C5CE7"/>
        <!-- 标题 -->
        <text x="240" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="700" fill="#1A252F">智能数据分析</text>
        <text x="240" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#6C5CE7" font-weight="600">Smart Analytics</text>
        <!-- 分割线 -->
        <line x1="128" y1="322" x2="608" y2="322" stroke="#F0F0F0" stroke-width="2"/>
        <!-- 描述 -->
        <text x="128" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">基于AI的多维数据分析引擎，</text>
        <text x="128" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">自动发现趋势与异常，生成</text>
        <text x="128" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">可视化洞察报告</text>
        <!-- 标签 -->
        <rect x="128" y="458" width="78" height="33" rx="16" fill="#6C5CE7" fill-opacity="0.1"/>
        <text x="166" y="480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#6C5CE7">核心</text>
    </g>
    
    <!-- 卡片2 - 实时协作 -->
    <g filter="url(#cardShadow)">
        <rect x="682" y="180" width="555" height="390" rx="18" fill="#FFFFFF"/>
        <rect x="682" y="180" width="555" height="8" rx="4" fill="#00B894"/>
        <circle cx="765" cy="267" r="45" fill="#00B894" fill-opacity="0.1"/>
        <circle cx="754" cy="262" r="15" fill="none" stroke="#00B894" stroke-width="3.8"/>
        <circle cx="776" cy="270" r="15" fill="none" stroke="#00B894" stroke-width="3.8"/>
        <text x="832" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="700" fill="#1A252F">实时多人协作</text>
        <text x="832" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#00B894" font-weight="600">Real-time Collaboration</text>
        <line x1="720" y1="322" x2="1200" y2="322" stroke="#F0F0F0" stroke-width="2"/>
        <text x="720" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">支持团队成员同时在线编辑，</text>
        <text x="720" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">实时同步变更，内置评论与</text>
        <text x="720" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">版本回溯功能</text>
        <rect x="720" y="458" width="78" height="33" rx="16" fill="#00B894" fill-opacity="0.1"/>
        <text x="759" y="480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#00B894">核心</text>
    </g>
    
    <!-- 卡片3 - 安全合规 -->
    <g filter="url(#cardShadow)">
        <rect x="1275" y="180" width="555" height="390" rx="18" fill="#FFFFFF"/>
        <rect x="1275" y="180" width="555" height="8" rx="4" fill="#0984E3"/>
        <circle cx="1358" cy="267" r="45" fill="#0984E3" fill-opacity="0.1"/>
        <rect x="1340" y="249" width="36" height="42" rx="6" fill="none" stroke="#0984E3" stroke-width="3.8"/>
        <line x1="1358" y1="249" x2="1358" y2="237" stroke="#0984E3" stroke-width="3.8" stroke-linecap="round"/>
        <text x="1425" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="700" fill="#1A252F">安全与合规</text>
        <text x="1425" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#0984E3" font-weight="600">Security &amp; Compliance</text>
        <line x1="1312" y1="322" x2="1792" y2="322" stroke="#F0F0F0" stroke-width="2"/>
        <text x="1312" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">企业级数据加密、权限管理，</text>
        <text x="1312" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">符合SOC2/GDPR等国际标准，</text>
        <text x="1312" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">审计日志完整留痕</text>
        <rect x="1312" y="458" width="78" height="33" rx="16" fill="#0984E3" fill-opacity="0.1"/>
        <text x="1352" y="480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#0984E3">保障</text>
    </g>
    
    <!-- 第二行 y=405 -->
    
    <!-- 卡片4 - 自动化工作流 -->
    <g filter="url(#cardShadow)">
        <rect x="90" y="608" width="555" height="390" rx="18" fill="#FFFFFF"/>
        <rect x="90" y="608" width="555" height="8" rx="4" fill="#FDCB6E"/>
        <circle cx="172" cy="694" r="45" fill="#FDCB6E" fill-opacity="0.12"/>
        <polygon points="160,682 160,710 183,696" fill="#D4A537"/>
        <text x="240" y="686" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="700" fill="#1A252F">自动化工作流</text>
        <text x="240" y="718" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#D4A537" font-weight="600">Workflow Automation</text>
        <line x1="128" y1="750" x2="608" y2="750" stroke="#F0F0F0" stroke-width="2"/>
        <text x="128" y="788" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">可视化流程编排，无代码配</text>
        <text x="128" y="818" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">置触发条件与动作，消除重</text>
        <text x="128" y="848" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">复性人工操作</text>
        <rect x="128" y="885" width="78" height="33" rx="16" fill="#FDCB6E" fill-opacity="0.15"/>
        <text x="166" y="908" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#D4A537">效率</text>
    </g>
    
    <!-- 卡片5 - 开放集成 -->
    <g filter="url(#cardShadow)">
        <rect x="682" y="608" width="555" height="390" rx="18" fill="#FFFFFF"/>
        <rect x="682" y="608" width="555" height="8" rx="4" fill="#E17055"/>
        <circle cx="765" cy="694" r="45" fill="#E17055" fill-opacity="0.1"/>
        <rect x="747" y="684" width="15" height="24" rx="3" fill="#E17055"/>
        <rect x="768" y="676" width="15" height="39" rx="3" fill="#E17055"/>
        <text x="832" y="686" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="700" fill="#1A252F">开放API集成</text>
        <text x="832" y="718" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#E17055" font-weight="600">Open API Integration</text>
        <line x1="720" y1="750" x2="1200" y2="750" stroke="#F0F0F0" stroke-width="2"/>
        <text x="720" y="788" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">提供200+标准API接口，</text>
        <text x="720" y="818" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">支持主流SaaS/ERP/CRM系统</text>
        <text x="720" y="848" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">无缝对接</text>
        <rect x="720" y="885" width="78" height="33" rx="16" fill="#E17055" fill-opacity="0.1"/>
        <text x="759" y="908" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#E17055">扩展</text>
    </g>
    
    <!-- 卡片6 - 智能报表 -->
    <g filter="url(#cardShadow)">
        <rect x="1275" y="608" width="555" height="390" rx="18" fill="#FFFFFF"/>
        <rect x="1275" y="608" width="555" height="8" rx="4" fill="#A29BFE"/>
        <circle cx="1358" cy="694" r="45" fill="#A29BFE" fill-opacity="0.1"/>
        <rect x="1340" y="681" width="36" height="30" rx="4" fill="none" stroke="#A29BFE" stroke-width="3.8"/>
        <line x1="1347" y1="696" x2="1368" y2="696" stroke="#A29BFE" stroke-width="3" stroke-linecap="round"/>
        <text x="1425" y="686" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="27" font-weight="700" fill="#1A252F">智能报表中心</text>
        <text x="1425" y="718" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="18" fill="#A29BFE" font-weight="600">Smart Reporting</text>
        <line x1="1312" y1="750" x2="1792" y2="750" stroke="#F0F0F0" stroke-width="2"/>
        <text x="1312" y="788" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">一键生成多维度数据报表，</text>
        <text x="1312" y="818" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">支持定时推送与自定义仪表</text>
        <text x="1312" y="848" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#5F6368">板，辅助管理层决策</text>
        <rect x="1312" y="885" width="78" height="33" rx="16" fill="#A29BFE" fill-opacity="0.1"/>
        <text x="1352" y="908" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="16" font-weight="600" fill="#A29BFE">洞察</text>
    </g>
</svg>