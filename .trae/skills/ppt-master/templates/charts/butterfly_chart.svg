<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    对比条形图（蝴蝶图）模板
    用途: 左右对比、双向数据展示
    适用场景: 人口金字塔、AB测试、男女对比、收支对比
    支持: 8个类别，左右两组数据
    -->
    
    <defs>
        <!-- 左侧渐变（蓝色） -->
        <linearGradient id="leftGrad" x1="100%" y1="0%" x2="0%" y2="0%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
        </linearGradient>
        
        <!-- 右侧渐变（粉色） -->
        <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#E91E63;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F06292;stop-opacity:1" />
        </linearGradient>
        
        <!-- 阴影 -->
        <filter id="barShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.2"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="960" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50" text-anchor="middle">
        <tspan>用户年龄分布对比</tspan>
    </text>
    
    <text x="960" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="27" fill="#7F8C8D" text-anchor="middle">
        <tspan>2025年度用户画像分析 · 样本量 N=50,000</tspan>
    </text>
    
    <!-- 图例 -->
    <g id="legend" transform="translate(720, 172)">
        <rect x="0" y="0" width="30" height="30" rx="4" fill="url(#leftGrad)"/>
        <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="22" fill="#5D6D7E">
            <tspan>男性用户</tspan>
        </text>
        
        <rect x="210" y="0" width="30" height="30" rx="4" fill="url(#rightGrad)"/>
        <text x="252" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="22" fill="#5D6D7E">
            <tspan>女性用户</tspan>
        </text>
    </g>
    
    <!-- 图表区域 -->
    <g id="chartArea">
        <!-- 中轴线 -->
        <line x1="960" y1="240" x2="960" y2="930" stroke="#BDC3C7" stroke-width="3"/>
        
        <!-- 左侧X轴刻度 -->
        <text x="240" y="968" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>20%</tspan></text>
        <text x="420" y="968" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>15%</tspan></text>
        <text x="600" y="968" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>10%</tspan></text>
        <text x="780" y="968" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>5%</tspan></text>
        
        <!-- 右侧X轴刻度 -->
        <text x="1140" y="968" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>5%</tspan></text>
        <text x="1320" y="968" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>10%</tspan></text>
        <text x="1500" y="968" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>15%</tspan></text>
        <text x="1680" y="968" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="20" fill="#7F8C8D" text-anchor="middle"><tspan>20%</tspan></text>
        
        <!-- 网格线 -->
        <line x1="240" y1="240" x2="240" y2="930" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="420" y1="240" x2="420" y2="930" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="600" y1="240" x2="600" y2="930" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="780" y1="240" x2="780" y2="930" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="1140" y1="240" x2="1140" y2="930" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="1320" y1="240" x2="1320" y2="930" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="1500" y1="240" x2="1500" y2="930" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="1680" y1="240" x2="1680" y2="930" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- 
        数据说明：
        每个年龄段的条形高度: 50px，间距: 6px
        最大宽度: 480px (代表20%)
        每1% = 24px
        
        男性数据: 3%, 8%, 15%, 18%, 16%, 12%, 6%, 2%
        女性数据: 4%, 10%, 17%, 15%, 14%, 10%, 5%, 3%
        -->
        
        <!-- 年龄段1: 60+ -->
        <g transform="translate(0, 252)">
            <!-- 左侧条形 (男性 3%) -->
            <rect x="852" y="0" width="108" height="75" rx="6" fill="url(#leftGrad)" filter="url(#barShadow)"/>
            <text x="832" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#2196F3" text-anchor="end"><tspan>3%</tspan></text>
            
            <!-- 中间标签 -->
            <text x="960" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="22" font-weight="600" fill="#2C3E50" text-anchor="middle"><tspan>60+</tspan></text>
            
            <!-- 右侧条形 (女性 4%) -->
            <rect x="960" y="0" width="144" height="75" rx="6" fill="url(#rightGrad)" filter="url(#barShadow)"/>
            <text x="1118" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#E91E63"><tspan>4%</tspan></text>
        </g>
        
        <!-- 年龄段2: 50-59 -->
        <g transform="translate(0, 336)">
            <rect x="672" y="0" width="288" height="75" rx="6" fill="url(#leftGrad)" filter="url(#barShadow)"/>
            <text x="652" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#2196F3" text-anchor="end"><tspan>8%</tspan></text>
            
            <text x="960" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="22" font-weight="600" fill="#2C3E50" text-anchor="middle"><tspan>50-59</tspan></text>
            
            <rect x="960" y="0" width="360" height="75" rx="6" fill="url(#rightGrad)" filter="url(#barShadow)"/>
            <text x="1335" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#E91E63"><tspan>10%</tspan></text>
        </g>
        
        <!-- 年龄段3: 40-49 -->
        <g transform="translate(0, 420)">
            <rect x="420" y="0" width="540" height="75" rx="6" fill="url(#leftGrad)" filter="url(#barShadow)"/>
            <text x="400" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#2196F3" text-anchor="end"><tspan>15%</tspan></text>
            
            <text x="960" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="22" font-weight="600" fill="#2C3E50" text-anchor="middle"><tspan>40-49</tspan></text>
            
            <rect x="960" y="0" width="612" height="75" rx="6" fill="url(#rightGrad)" filter="url(#barShadow)"/>
            <text x="1587" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#E91E63"><tspan>17%</tspan></text>
        </g>
        
        <!-- 年龄段4: 30-39 (峰值) -->
        <g transform="translate(0, 504)">
            <rect x="312" y="0" width="648" height="75" rx="6" fill="url(#leftGrad)" filter="url(#barShadow)"/>
            <text x="292" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" font-weight="bold" fill="#2196F3" text-anchor="end"><tspan>18%</tspan></text>
            
            <text x="960" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="22" font-weight="600" fill="#2C3E50" text-anchor="middle"><tspan>30-39</tspan></text>
            
            <rect x="960" y="0" width="540" height="75" rx="6" fill="url(#rightGrad)" filter="url(#barShadow)"/>
            <text x="1515" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#E91E63"><tspan>15%</tspan></text>
        </g>
        
        <!-- 年龄段5: 25-29 -->
        <g transform="translate(0, 588)">
            <rect x="384" y="0" width="576" height="75" rx="6" fill="url(#leftGrad)" filter="url(#barShadow)"/>
            <text x="364" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#2196F3" text-anchor="end"><tspan>16%</tspan></text>
            
            <text x="960" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="22" font-weight="600" fill="#2C3E50" text-anchor="middle"><tspan>25-29</tspan></text>
            
            <rect x="960" y="0" width="504" height="75" rx="6" fill="url(#rightGrad)" filter="url(#barShadow)"/>
            <text x="1479" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#E91E63"><tspan>14%</tspan></text>
        </g>
        
        <!-- 年龄段6: 20-24 -->
        <g transform="translate(0, 672)">
            <rect x="528" y="0" width="432" height="75" rx="6" fill="url(#leftGrad)" filter="url(#barShadow)"/>
            <text x="508" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#2196F3" text-anchor="end"><tspan>12%</tspan></text>
            
            <text x="960" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="22" font-weight="600" fill="#2C3E50" text-anchor="middle"><tspan>20-24</tspan></text>
            
            <rect x="960" y="0" width="360" height="75" rx="6" fill="url(#rightGrad)" filter="url(#barShadow)"/>
            <text x="1335" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#E91E63"><tspan>10%</tspan></text>
        </g>
        
        <!-- 年龄段7: 18-19 -->
        <g transform="translate(0, 756)">
            <rect x="744" y="0" width="216" height="75" rx="6" fill="url(#leftGrad)" filter="url(#barShadow)"/>
            <text x="724" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#2196F3" text-anchor="end"><tspan>6%</tspan></text>
            
            <text x="960" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="22" font-weight="600" fill="#2C3E50" text-anchor="middle"><tspan>18-19</tspan></text>
            
            <rect x="960" y="0" width="180" height="75" rx="6" fill="url(#rightGrad)" filter="url(#barShadow)"/>
            <text x="1155" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#E91E63"><tspan>5%</tspan></text>
        </g>
        
        <!-- 年龄段8: <18 -->
        <g transform="translate(0, 840)">
            <rect x="888" y="0" width="72" height="75" rx="6" fill="url(#leftGrad)" filter="url(#barShadow)"/>
            <text x="868" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#2196F3" text-anchor="end"><tspan>2%</tspan></text>
            
            <text x="960" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
                  font-size="22" font-weight="600" fill="#2C3E50" text-anchor="middle"><tspan>&lt;18</tspan></text>
            
            <rect x="960" y="0" width="108" height="75" rx="6" fill="url(#rightGrad)" filter="url(#barShadow)"/>
            <text x="1083" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
                  font-size="21" fill="#E91E63"><tspan>3%</tspan></text>
        </g>
    </g>
    
    <!-- 统计摘要 -->
    <g id="summary" transform="translate(90, 998)">
        <rect x="0" y="0" width="420" height="60" rx="12" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
        <text x="30" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#1976D2">
            <tspan>👨 男性用户: 52% | 平均年龄: 34岁</tspan>
        </text>
        
        <rect x="450" y="0" width="420" height="60" rx="12" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
        <text x="480" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
              font-size="21" fill="#C2185B">
            <tspan>👩 女性用户: 48% | 平均年龄: 32岁</tspan>
        </text>
    </g>
    
    <!-- 数据来源 -->
    <text x="1830" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" 
          font-size="21" fill="#95A5A6" text-anchor="end">
        <tspan>数据来源: 用户数据分析平台</tspan>
    </text>
</svg>

