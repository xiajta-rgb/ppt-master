<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <!-- 
    柱状图模板
    用途: 类别数据对比
    适用场景: 销售额对比、区域排名、年度数据对比
    支持: 6个柱子（可调整为3-8个）
    -->
    
    <defs>
        <!-- 柱状图渐变 -->
        <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
        </linearGradient>
        
        <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
        </linearGradient>
        
        <!-- 阴影 -->
        <filter id="barShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 标题 -->
    <text x="90" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="48" font-weight="bold" fill="#2C3E50">
        <tspan>各区域销售额对比</tspan>
    </text>
    
    <text x="90" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="27" fill="#7F8C8D">
        <tspan>2025年第三季度 · 单位：百万元</tspan>
    </text>
    
    <!-- 图表区域 -->
    <g id="chartArea">
        <!-- Y轴网格线 -->
        <line x1="210" y1="825" x2="1740" y2="825" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="675" x2="1740" y2="675" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="525" x2="1740" y2="525" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="375" x2="1740" y2="375" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="210" y1="225" x2="1740" y2="225" stroke="#E0E0E0" stroke-width="2" stroke-dasharray="4,4"/>
        
        <!-- Y轴刻度标签 -->
        <text x="188" y="832" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>0</tspan>
        </text>
        <text x="188" y="682" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>50</tspan>
        </text>
        <text x="188" y="532" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>100</tspan>
        </text>
        <text x="188" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>150</tspan>
        </text>
        <text x="188" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#7F8C8D" text-anchor="end">
            <tspan>200</tspan>
        </text>
        
        <!-- X轴和Y轴 -->
        <line x1="210" y1="225" x2="210" y2="825" stroke="#95A5A6" stroke-width="3"/>
        <line x1="210" y1="825" x2="1740" y2="825" stroke="#95A5A6" stroke-width="3"/>
        
        <!-- 柱子数据 (柱宽50px, 间距130px, 总间距180px) -->
        
        <!-- 柱子1: 华东 - 185M (370px高度, 每100M=200px) -->
        <rect x="330" y="270" width="75" height="555" rx="6" fill="url(#barGrad1)" filter="url(#barShadow)"/>
        <text x="368" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>185</tspan>
        </text>
        <text x="368" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" fill="#5D6D7E" text-anchor="middle">
            <tspan>华东</tspan>
        </text>
        
        <!-- 柱子2: 华南 - 142M -->
        <rect x="600" y="399" width="75" height="426" rx="6" fill="url(#barGrad1)" filter="url(#barShadow)"/>
        <text x="638" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>142</tspan>
        </text>
        <text x="638" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" fill="#5D6D7E" text-anchor="middle">
            <tspan>华南</tspan>
        </text>
        
        <!-- 柱子3: 华北 - 128M -->
        <rect x="870" y="441" width="75" height="384" rx="6" fill="url(#barGrad1)" filter="url(#barShadow)"/>
        <text x="908" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>128</tspan>
        </text>
        <text x="908" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" fill="#5D6D7E" text-anchor="middle">
            <tspan>华北</tspan>
        </text>
        
        <!-- 柱子4: 西南 - 96M -->
        <rect x="1140" y="537" width="75" height="288" rx="6" fill="url(#barGrad2)" filter="url(#barShadow)"/>
        <text x="1178" y="514" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>96</tspan>
        </text>
        <text x="1178" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" fill="#5D6D7E" text-anchor="middle">
            <tspan>西南</tspan>
        </text>
        
        <!-- 柱子5: 华中 - 73M -->
        <rect x="1410" y="606" width="75" height="219" rx="6" fill="url(#barGrad2)" filter="url(#barShadow)"/>
        <text x="1448" y="584" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>73</tspan>
        </text>
        <text x="1448" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" fill="#5D6D7E" text-anchor="middle">
            <tspan>华中</tspan>
        </text>
        
        <!-- 柱子6: 东北 - 52M -->
        <rect x="1680" y="669" width="75" height="156" rx="6" fill="url(#barGrad3)" filter="url(#barShadow)"/>
        <text x="1718" y="646" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" font-weight="600" fill="#2C3E50" text-anchor="middle">
            <tspan>52</tspan>
        </text>
        <text x="1718" y="870" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="24" fill="#5D6D7E" text-anchor="middle">
            <tspan>东北</tspan>
        </text>
    </g>
    
    <!-- 图例 -->
    <g id="legend">
        <rect x="1380" y="930" width="24" height="24" rx="3" fill="url(#barGrad1)"/>
        <text x="1418" y="948" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>高增长区域 (&gt;100M)</tspan>
        </text>
        
        <rect x="1380" y="968" width="24" height="24" rx="3" fill="url(#barGrad2)"/>
        <text x="1418" y="986" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>稳定区域 (50-100M)</tspan>
        </text>
        
        <rect x="1380" y="1005" width="24" height="24" rx="3" fill="url(#barGrad3)"/>
        <text x="1418" y="1023" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
              font-size="21" fill="#5D6D7E">
            <tspan>潜力区域 (&lt;50M)</tspan>
        </text>
    </g>
    
    <!-- 数据来源 -->
    <text x="90" y="1042" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="21" fill="#95A5A6">
        <tspan>数据来源: 销售部门统计</tspan>
    </text>
</svg>

