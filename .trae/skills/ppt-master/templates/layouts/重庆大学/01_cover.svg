<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
  <defs>
    <!-- 左侧主渐变 -->
    <linearGradient id="leftGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003D6B"/>
      <stop offset="100%" stop-color="#006BB7"/>
    </linearGradient>
    <!-- 金色渐变 -->
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#D4A84B"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  
  <!-- 左侧色块（占据左边约 35%） -->
  <rect x="0" y="0" width="675" height="1080" fill="url(#leftGradient)"/>
  
  <!-- 左侧色块上的装饰纹理 -->
  <line x1="75" y1="0" x2="75" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05"/>
  <line x1="150" y1="0" x2="150" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03"/>
  <line x1="525" y1="0" x2="525" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05"/>
  <line x1="600" y1="0" x2="600" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03"/>
  
  <!-- 左侧金色装饰竖线 -->
  <rect x="672" y="150" width="6" height="780" fill="url(#goldLine)"/>
  
  <!-- Logo（左侧色块中央，白色版本） -->
  <image x="112" y="390" width="450" height="135" xlink:href="重庆大学logo2.png" preserveAspectRatio="xMidYMid meet"/>
  
  <!-- 左侧底部年份水印 -->
  <text x="338" y="975" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.15" font-family="Arial, sans-serif" font-size="108" font-weight="bold">CQU</text>
  
  <!-- 右侧内容区 -->
  <!-- 主标题 -->
  <text x="1290" y="420" text-anchor="middle" fill="#1A2E44" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="66" font-weight="bold">{{TITLE}}</text>
  
  <!-- 副标题 -->
  <text x="1290" y="510" text-anchor="middle" fill="#6B7B8C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30">{{SUBTITLE}}</text>
  
  <!-- 金色装饰分隔线 -->
  <rect x="1065" y="570" width="450" height="3" fill="url(#goldLine)"/>
  <circle cx="1065" cy="572" r="6" fill="#D4A84B"/>
  <circle cx="1515" cy="572" r="6" fill="#D4A84B"/>
  
  <!-- 答辩人信息 -->
  <text x="1290" y="675" text-anchor="middle" fill="#333D4A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27">
    <tspan fill="#006BB7" font-weight="bold">答辩人</tspan>
    <tspan dx="24">{{AUTHOR}}</tspan>
  </text>
  
  <text x="1290" y="735" text-anchor="middle" fill="#6B7B8C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24">
    <tspan>指导老师：{{ADVISOR}}</tspan>
  </text>
  
  <text x="1290" y="795" text-anchor="middle" fill="#6B7B8C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24">{{INSTITUTION}}</text>
  
  <!-- 日期（底部居中于右侧区域） -->
  <rect x="1170" y="930" width="240" height="54" fill="#F5F7FA" rx="27"/>
  <text x="1290" y="966" text-anchor="middle" fill="#6B7B8C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">{{DATE}}</text>
  
  <!-- 右下角装饰几何 -->
  <polygon points="1920,900 1920,1080 1740,1080" fill="#006BB7" fill-opacity="0.06"/>
  <polygon points="1920,990 1920,1080 1800,1080" fill="#D4A84B" fill-opacity="0.1"/>
  
  <!-- 右上角装饰 -->
  <line x1="1650" y1="90" x2="1860" y2="90" stroke="#006BB7" stroke-width="2" stroke-opacity="0.2"/>
  <line x1="1725" y1="135" x2="1860" y2="135" stroke="#D4A84B" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="1860" cy="90" r="4" fill="#006BB7" fill-opacity="0.3"/>
  <circle cx="1860" cy="135" r="4" fill="#D4A84B" fill-opacity="0.4"/>
</svg>
