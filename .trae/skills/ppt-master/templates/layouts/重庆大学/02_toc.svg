<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
  <defs>
    <!-- 顶部斜切渐变 -->
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#004A82"/>
      <stop offset="100%" stop-color="#006BB7"/>
    </linearGradient>
    <!-- 金色渐变 -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C675"/>
      <stop offset="100%" stop-color="#C49A3D"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#FAFCFF"/>
  
  <!-- 顶部斜切蓝色装饰带 -->
  <polygon points="0,0 1920,0 1920,120 0,150" fill="url(#headerGradient)"/>
  <polygon points="0,150 1920,120 1920,142 0,172" fill="#E3F2FD"/>
  
  <!-- 页面标题 -->
  <text x="90" y="90" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="39" font-weight="bold">{{TOC_TITLE}}</text>
  
  <!-- Logo -->
  <image x="1560" y="22" width="300" height="75" xlink:href="重庆大学logo2.png" preserveAspectRatio="xMidYMid meet"/>
  
  <!-- 目录内容区 -->
  <!-- 左侧大号数字区域 -->
  
  <!-- 目录项 1 -->
  <text x="120" y="300" fill="#006BB7" fill-opacity="0.15" font-family="Arial, sans-serif" font-size="120" font-weight="bold">01</text>
  <rect x="255" y="240" width="6" height="90" fill="url(#goldAccent)"/>
  <text x="285" y="292" fill="#1A2E44" font-family="Microsoft YaHei, Arial, sans-serif" font-size="33" font-weight="bold">{{TOC_ITEM_1_TITLE}}</text>
  <text x="285" y="338" fill="#6B7B8C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">{{TOC_ITEM_1_DESC}}</text>
  
  <!-- 目录项 2 -->
  <text x="1050" y="300" fill="#006BB7" fill-opacity="0.15" font-family="Arial, sans-serif" font-size="120" font-weight="bold">02</text>
  <rect x="1185" y="240" width="6" height="90" fill="url(#goldAccent)"/>
  <text x="1215" y="292" fill="#1A2E44" font-family="Microsoft YaHei, Arial, sans-serif" font-size="33" font-weight="bold">{{TOC_ITEM_2_TITLE}}</text>
  <text x="1215" y="338" fill="#6B7B8C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">{{TOC_ITEM_2_DESC}}</text>
  
  <!-- 目录项 3 -->
  <text x="120" y="510" fill="#006BB7" fill-opacity="0.15" font-family="Arial, sans-serif" font-size="120" font-weight="bold">03</text>
  <rect x="255" y="450" width="6" height="90" fill="url(#goldAccent)"/>
  <text x="285" y="502" fill="#1A2E44" font-family="Microsoft YaHei, Arial, sans-serif" font-size="33" font-weight="bold">{{TOC_ITEM_3_TITLE}}</text>
  <text x="285" y="548" fill="#6B7B8C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">{{TOC_ITEM_3_DESC}}</text>
  
  <!-- 目录项 4 -->
  <text x="1050" y="510" fill="#006BB7" fill-opacity="0.15" font-family="Arial, sans-serif" font-size="120" font-weight="bold">04</text>
  <rect x="1185" y="450" width="6" height="90" fill="url(#goldAccent)"/>
  <text x="1215" y="502" fill="#1A2E44" font-family="Microsoft YaHei, Arial, sans-serif" font-size="33" font-weight="bold">{{TOC_ITEM_4_TITLE}}</text>
  <text x="1215" y="548" fill="#6B7B8C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">{{TOC_ITEM_4_DESC}}</text>
  
  <!-- 目录项 5 -->
  <text x="120" y="720" fill="#006BB7" fill-opacity="0.15" font-family="Arial, sans-serif" font-size="120" font-weight="bold">05</text>
  <rect x="255" y="660" width="6" height="90" fill="url(#goldAccent)"/>
  <text x="285" y="712" fill="#1A2E44" font-family="Microsoft YaHei, Arial, sans-serif" font-size="33" font-weight="bold">{{TOC_ITEM_5_TITLE}}</text>
  <text x="285" y="758" fill="#6B7B8C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">{{TOC_ITEM_5_DESC}}</text>
  
  <!-- 目录项 6（可选，更淡化） -->
  <text x="1050" y="720" fill="#006BB7" fill-opacity="0.08" font-family="Arial, sans-serif" font-size="120" font-weight="bold">06</text>
  <rect x="1185" y="660" width="6" height="90" fill="#D0D7E0"/>
  <text x="1215" y="712" fill="#A0AEC0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="33" font-weight="bold">{{TOC_ITEM_6_TITLE}}</text>
  <text x="1215" y="758" fill="#B0BCC8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">{{TOC_ITEM_6_DESC}}</text>
  
  <!-- 底部波浪装饰 -->
  <path d="M0,1020 Q240,998 480,1020 T960,998 T1440,1020 T1920,998 L1920,1080 L0,1080 Z" fill="#006BB7" fill-opacity="0.06"/>
  
  <!-- 页脚 -->
  <text x="960" y="1020" text-anchor="middle" fill="#6B7B8C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">目录 · CONTENTS</text>
  
  <!-- 页码 -->
  <rect x="1770" y="982" width="60" height="42" fill="#006BB7" rx="6"/>
  <text x="1800" y="1012" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="20" font-weight="bold">{{PAGE_NUM}}</text>
  
  <!-- 左下角金色光点 -->
  <circle cx="75" cy="1005" r="4" fill="#D4A84B" fill-opacity="0.5"/>
  <circle cx="120" cy="1035" r="3" fill="#D4A84B" fill-opacity="0.4"/>
</svg>
