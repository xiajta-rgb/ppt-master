<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 封面页 - Google 风格 -->

    <defs>
        <!-- 背景渐变 -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#E8F0FE;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#E8F5E9;stop-opacity:1" />
        </linearGradient>

        <!-- 标题渐变 -->
        <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#1A73E8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#bgGradient)" />

    <!-- 装饰圆形 - 增加视觉层次 -->
    <circle cx="225" cy="225" r="180" fill="#4285F4" fill-opacity="0.08" />
    <circle cx="1695" cy="855" r="225" fill="#34A853" fill-opacity="0.08" />
    <rect x="1350" y="120" width="270" height="270" rx="30" fill="#FBBC04" fill-opacity="0.06" transform="rotate(22, 1485, 255)" />

    <!-- 左侧四色竖条 -->
    <rect x="0" y="0" width="15" height="270" fill="#4285F4" />
    <rect x="0" y="270" width="15" height="270" fill="#EA4335" />
    <rect x="0" y="540" width="15" height="270" fill="#FBBC04" />
    <rect x="0" y="810" width="15" height="270" fill="#34A853" />

    <!-- 中央内容卡片 -->
    <rect x="420" y="270" width="1080" height="540" rx="36" fill="#FFFFFF" stroke="#E8EAED" stroke-width="2" />

    <!-- 主标题 -->
    <text x="960" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="700" fill="url(#titleGradient)" text-anchor="middle">
        {{TITLE}}
    </text>

    <!-- 副标题 -->
    <text x="960" y="502" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="500" fill="#5F6368" text-anchor="middle">
        {{SUBTITLE}}
    </text>

    <!-- 四色分隔线 -->
    <line x1="570" y1="570" x2="795" y2="570" stroke="#4285F4" stroke-width="4" stroke-linecap="round" />
    <line x1="825" y1="570" x2="930" y2="570" stroke="#EA4335" stroke-width="4" stroke-linecap="round" />
    <line x1="960" y1="570" x2="1065" y2="570" stroke="#FBBC04" stroke-width="4" stroke-linecap="round" />
    <line x1="1095" y1="570" x2="1350" y2="570" stroke="#34A853" stroke-width="4" stroke-linecap="round" />

    <!-- 演讲者姓名 -->
    <text x="960" y="660" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A237E" text-anchor="middle">
        {{SPEAKER_NAME}}
    </text>

    <!-- 演讲者职位 -->
    <text x="960" y="717" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="400" fill="#5F6368" text-anchor="middle">
        {{SPEAKER_TITLE}}
    </text>

    <!-- 日期 -->
    <g transform="translate(960, 765)">
        <circle cx="0" cy="0" r="4" fill="#4285F4" />
        <text x="0" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#5F6368" text-anchor="middle">
            {{DATE}}
        </text>
    </g>

    <!-- 底部四色圆点装饰 -->
    <circle cx="780" cy="945" r="18" fill="#4285F4" fill-opacity="0.9" />
    <circle cx="855" cy="945" r="15" fill="#EA4335" fill-opacity="0.9" />
    <circle cx="915" cy="945" r="21" fill="#FBBC04" fill-opacity="0.9" />
    <circle cx="990" cy="945" r="15" fill="#34A853" fill-opacity="0.9" />
    <circle cx="1050" cy="945" r="18" fill="#4285F4" fill-opacity="0.9" />
    <circle cx="1125" cy="945" r="15" fill="#EA4335" fill-opacity="0.9" />

</svg>
