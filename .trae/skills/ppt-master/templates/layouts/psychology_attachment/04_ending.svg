<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <defs>
        <linearGradient id="endGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1E3A5F" />
            <stop offset="50%" style="stop-color:#2E5C8E" />
            <stop offset="100%" style="stop-color:#3D8B7A" />
        </linearGradient>
    </defs>

    <!-- 背景渐变 -->
    <rect width="1920" height="1080" fill="url(#endGradient)" />

    <!-- 装饰网络图 - 中心点 -->
    <circle cx="960" cy="540" r="12" fill="#FFFFFF" fill-opacity="0.2" />

    <!-- 外围节点 -->
    <circle cx="525" cy="300" r="8" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="675" cy="225" r="6" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="825" cy="270" r="8" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="1095" cy="240" r="6" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="1245" cy="300" r="8" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="1380" cy="375" r="6" fill="#FFFFFF" fill-opacity="0.2" />

    <circle cx="420" cy="525" r="6" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="480" cy="720" r="8" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="675" cy="810" r="6" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="870" cy="870" r="8" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="1050" cy="840" r="6" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="1245" cy="780" r="8" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="1425" cy="675" r="6" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="1500" cy="525" r="8" fill="#FFFFFF" fill-opacity="0.2" />

    <!-- 连接线 - 从中心辐射 -->
    <line x1="960" y1="540" x2="525" y2="300" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="960" y1="540" x2="675" y2="225" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="960" y1="540" x2="825" y2="270" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="960" y1="540" x2="1095" y2="240" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="960" y1="540" x2="1245" y2="300" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="960" y1="540" x2="1380" y2="375" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />

    <line x1="960" y1="540" x2="420" y2="525" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="960" y1="540" x2="480" y2="720" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="960" y1="540" x2="675" y2="810" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="960" y1="540" x2="870" y2="870" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="960" y1="540" x2="1050" y2="840" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="960" y1="540" x2="1245" y2="780" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="960" y1="540" x2="1425" y2="675" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />
    <line x1="960" y1="540" x2="1500" y2="525" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.2" />

    <!-- 连接线 - 外围连接 -->
    <line x1="525" y1="300" x2="675" y2="225" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.15" />
    <line x1="675" y1="225" x2="825" y2="270" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.15" />
    <line x1="1095" y1="240" x2="1245" y2="300" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.15" />
    <line x1="480" y1="720" x2="675" y2="810" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.15" />
    <line x1="870" y1="870" x2="1050" y2="840" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.15" />
    <line x1="1245" y1="780" x2="1425" y2="675" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.15" />

    <!-- 主标题 -->
    <text x="960" y="390" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="84" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle">
        {{THANK_YOU}}
    </text>

    <!-- 副标题 -->
    <text x="960" y="480" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="42" fill="#E5E7EB"
        text-anchor="middle">
        {{ENDING_SUBTITLE}}
    </text>

    <!-- 英文标题 -->
    <text x="960" y="540" font-family="system-ui, sans-serif" font-size="27" fill="#94A3B8" text-anchor="middle">
        {{THANK_YOU_EN}}
    </text>

    <!-- 装饰线 -->
    <rect x="735" y="600" width="450" height="6" rx="3" fill="#E07843" />

    <!-- 感谢语 -->
    <text x="960" y="705" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="48" fill="#FFFFFF"
        text-anchor="middle">
        {{CLOSING_MESSAGE}}
    </text>

    <!-- 信息卡片 -->
    <rect x="660" y="780" width="600" height="150" rx="18" fill="#FFFFFF" fill-opacity="0.1" />

    <text x="960" y="840" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#E5E7EB"
        text-anchor="middle">
        {{CONTACT_INFO}}
    </text>
    <text x="960" y="885" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" fill="#94A3B8"
        text-anchor="middle">
        {{CONTACT_LINE_2}}
    </text>

    <!-- 底部版权 -->
    <text x="960" y="1020" font-family="system-ui, sans-serif" font-size="18" fill="#64748B" text-anchor="middle">
        {{COPYRIGHT}}
    </text>
</svg>
