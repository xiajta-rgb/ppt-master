<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 封面页 - 麦肯锡风格 (精装版) -->
    
    <defs>
        <!-- 顶部渐变条 -->
        <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#005587"/>
            <stop offset="100%" style="stop-color:#0076A8"/>
        </linearGradient>
        <!-- 装饰渐变 -->
        <linearGradient id="decoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#005587;stop-opacity:0.12"/>
            <stop offset="100%" style="stop-color:#0076A8;stop-opacity:0.04"/>
        </linearGradient>
    </defs>
    
    <!-- 白色背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 左侧主装饰条 -->
    <rect x="0" y="0" width="18" height="1080" fill="url(#headerGrad)"/>
    
    <!-- 左侧副装饰条 -->
    <rect x="18" y="0" width="4" height="1080" fill="#F5A623"/>

    <!-- 左上角装饰组合 -->
    <rect x="90" y="82" width="270" height="8" fill="#005587"/>
    <rect x="90" y="98" width="150" height="4" fill="#0076A8" fill-opacity="0.5"/>
    
    <!-- 右侧大面积装饰区 -->
    <rect x="1170" y="0" width="750" height="1080" fill="url(#decoGrad)"/>
    
    <!-- 几何装饰元素 -->
    <rect x="1275" y="180" width="540" height="540" fill="none" stroke="#005587" stroke-width="2" stroke-opacity="0.15"/>
    <rect x="1350" y="255" width="390" height="390" fill="none" stroke="#005587" stroke-width="2" stroke-opacity="0.1"/>
    <rect x="1425" y="330" width="240" height="240" fill="#005587" fill-opacity="0.03"/>
    
    <!-- 三角装饰 -->
    <path d="M 1575,210 L 1830,210 L 1702,480 Z" fill="#005587" fill-opacity="0.06"/>
    <path d="M 1320,600 L 1500,600 L 1410,780 Z" fill="#0076A8" fill-opacity="0.05"/>

    <!-- 主标题区域 -->
    <text x="90" y="390" font-family="Arial, sans-serif" font-size="84" font-weight="bold" fill="#2C3E50" letter-spacing="-2">
        {{TITLE}}
    </text>
    <text x="90" y="495" font-family="Arial, sans-serif" font-size="84" font-weight="bold" fill="#2C3E50" letter-spacing="-2">
        {{TITLE_LINE2}}
    </text>

    <!-- 副标题 -->
    <text x="90" y="600" font-family="Arial, sans-serif" font-size="39" fill="#5D6D7E" letter-spacing="0.8">
        {{SUBTITLE}}
    </text>

    <!-- 分隔线组合 -->
    <line x1="90" y1="675" x2="750" y2="675" stroke="#ECF0F1" stroke-width="3"/>
    <line x1="90" y1="684" x2="300" y2="684" stroke="#005587" stroke-width="3"/>

    <!-- 项目信息区 -->
    <rect x="90" y="780" width="600" height="150" fill="#F8F9FA" rx="6"/>
    <rect x="90" y="780" width="6" height="150" fill="#005587" rx="3"/>
    
    <text x="126" y="832" font-family="Arial, sans-serif" font-size="21" fill="#7F8C8D">PROJECT CODE</text>
    <text x="126" y="870" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#2C3E50">{{PROJECT_CODE}}</text>
    
    <line x1="390" y1="802" x2="390" y2="908" stroke="#ECF0F1" stroke-width="2"/>
    
    <text x="426" y="832" font-family="Arial, sans-serif" font-size="21" fill="#7F8C8D">DATE</text>
    <text x="426" y="870" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#2C3E50">{{DATE}}</text>

    <!-- 底部装饰线 -->
    <line x1="90" y1="1020" x2="1830" y2="1020" stroke="#ECF0F1" stroke-width="2"/>
    
    <!-- 机密标识 -->
    <rect x="1620" y="982" width="210" height="42" fill="#005587" fill-opacity="0.08" rx="6"/>
    <text x="1725" y="1012" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#005587" letter-spacing="2">
        CONFIDENTIAL
    </text>

    <!-- 页码 -->
    <text x="90" y="1050" font-family="Arial, sans-serif" font-size="21" fill="#7F8C8D">{{PAGE_NUM}}</text>

</svg>
