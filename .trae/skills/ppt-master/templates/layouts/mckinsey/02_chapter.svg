<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 章节页 - 麦肯锡风格 (精装版) -->
    
    <defs>
        <!-- 背景渐变 -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#005587"/>
            <stop offset="50%" style="stop-color:#004A75"/>
            <stop offset="100%" style="stop-color:#003A5C"/>
        </linearGradient>
        <!-- 光晕效果 -->
        <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.08"/>
            <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
        </radialGradient>
    </defs>
    
    <!-- 渐变背景 -->
    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <!-- 装饰网格线 -->
    <line x1="0" y1="270" x2="1920" y2="270" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03"/>
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03"/>
    <line x1="0" y1="810" x2="1920" y2="810" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03"/>
    <line x1="480" y1="0" x2="480" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03"/>
    <line x1="960" y1="0" x2="960" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03"/>
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03"/>

    <!-- 装饰圆形 -->
    <circle cx="1650" cy="180" r="270" fill="url(#glowGrad)"/>
    <circle cx="270" cy="900" r="330" fill="url(#glowGrad)"/>
    
    <!-- 装饰几何 -->
    <rect x="1575" y="675" width="225" height="225" fill="#FFFFFF" fill-opacity="0.02" rx="6"/>
    <rect x="120" y="150" width="150" height="150" fill="#FFFFFF" fill-opacity="0.02" rx="6"/>

    <!-- 左侧金色装饰线 -->
    <rect x="90" y="420" width="8" height="240" fill="#F5A623"/>

    <!-- 章节编号背景 -->
    <text x="960" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="420" font-weight="bold" fill="#FFFFFF" fill-opacity="0.05">
        {{CHAPTER_NUM}}
    </text>

    <!-- 章节编号前缀 -->
    <text x="960" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#F5A623" letter-spacing="6">
        SECTION {{CHAPTER_NUM}}
    </text>

    <!-- 装饰横线组 -->
    <line x1="750" y1="510" x2="930" y2="510" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.4"/>
    <line x1="990" y1="510" x2="1170" y2="510" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.4"/>
    <circle cx="960" cy="510" r="9" fill="#F5A623"/>

    <!-- 章节标题 -->
    <text x="960" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
        {{CHAPTER_TITLE}}
    </text>

    <!-- 章节副标题 -->
    <text x="960" y="712" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#FFFFFF" fill-opacity="0.65" letter-spacing="0.8">
        {{CHAPTER_DESC}}
    </text>

    <!-- 底部装饰条 -->
    <rect x="0" y="1020" width="1920" height="60" fill="#FFFFFF" fill-opacity="0.05"/>
    <line x1="0" y1="1020" x2="1920" y2="1020" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1"/>

    <!-- 页码 -->
    <text x="90" y="1058" font-family="Arial, sans-serif" font-size="21" fill="#FFFFFF" fill-opacity="0.5">{{PAGE_NUM}}</text>
    
    <!-- 项目标识 -->
    <text x="1830" y="1058" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.4" letter-spacing="2">{{PROJECT_CODE}}</text>

</svg>
