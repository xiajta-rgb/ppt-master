<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 目录页 - 麦肯锡风格 (精装版) -->
    
    <defs>
        <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#005587"/>
            <stop offset="100%" style="stop-color:#0076A8"/>
        </linearGradient>
    </defs>
    
    <!-- 白色背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 顶部渐变装饰条 -->
    <rect x="0" y="0" width="1920" height="9" fill="url(#headerGrad)"/>

    <!-- 页面标题区 -->
    <text x="90" y="112" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#005587" letter-spacing="4">CONTENTS</text>
    <text x="90" y="172" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#2C3E50">Agenda</text>
    <line x1="90" y1="202" x2="240" y2="202" stroke="#005587" stroke-width="6"/>
    <line x1="248" y1="202" x2="330" y2="202" stroke="#F5A623" stroke-width="6"/>

    <!-- 目录卡片区域 -->
    <!-- 第1章 -->
    <g>
        <rect x="90" y="255" width="840" height="165" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2.2" rx="9"/>
        <rect x="90" y="255" width="9" height="165" fill="#005587" rx="4"/>
        <rect x="120" y="285" width="90" height="90" fill="#005587" fill-opacity="0.08" rx="6"/>
        <text x="165" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#005587">01</text>
        <text x="248" y="327" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C3E50">{{TOC_ITEM_1_TITLE}}</text>
        <text x="248" y="372" font-family="Arial, sans-serif" font-size="21" fill="#5D6D7E">{{TOC_ITEM_1_DESC}}</text>
    </g>

    <!-- 第2章 -->
    <g>
        <rect x="990" y="255" width="840" height="165" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2.2" rx="9"/>
        <rect x="990" y="255" width="9" height="165" fill="#0076A8" rx="4"/>
        <rect x="1020" y="285" width="90" height="90" fill="#0076A8" fill-opacity="0.08" rx="6"/>
        <text x="1065" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#0076A8">02</text>
        <text x="1148" y="327" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C3E50">{{TOC_ITEM_2_TITLE}}</text>
        <text x="1148" y="372" font-family="Arial, sans-serif" font-size="21" fill="#5D6D7E">{{TOC_ITEM_2_DESC}}</text>
    </g>

    <!-- 第3章 -->
    <g>
        <rect x="90" y="450" width="840" height="165" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2.2" rx="9"/>
        <rect x="90" y="450" width="9" height="165" fill="#004D5C" rx="4"/>
        <rect x="120" y="480" width="90" height="90" fill="#004D5C" fill-opacity="0.08" rx="6"/>
        <text x="165" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#004D5C">03</text>
        <text x="248" y="522" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C3E50">{{TOC_ITEM_3_TITLE}}</text>
        <text x="248" y="567" font-family="Arial, sans-serif" font-size="21" fill="#5D6D7E">{{TOC_ITEM_3_DESC}}</text>
    </g>

    <!-- 第4章 -->
    <g>
        <rect x="990" y="450" width="840" height="165" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2.2" rx="9"/>
        <rect x="990" y="450" width="9" height="165" fill="#F5A623" rx="4"/>
        <rect x="1020" y="480" width="90" height="90" fill="#F5A623" fill-opacity="0.08" rx="6"/>
        <text x="1065" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#F5A623">04</text>
        <text x="1148" y="522" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#2C3E50">{{TOC_ITEM_4_TITLE}}</text>
        <text x="1148" y="567" font-family="Arial, sans-serif" font-size="21" fill="#5D6D7E">{{TOC_ITEM_4_DESC}}</text>
    </g>

    <!-- 第5章 (可选) -->
    <g>
        <rect x="90" y="645" width="840" height="165" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6,4" rx="9"/>
        <rect x="120" y="675" width="90" height="90" fill="#E5E7EB" fill-opacity="0.5" rx="6"/>
        <text x="165" y="738" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#BDC3C7">05</text>
        <text x="248" y="732" font-family="Arial, sans-serif" font-size="27" fill="#95A5A6">{{TOC_ITEM_5_TITLE}}</text>
    </g>

    <!-- 第6章 (可选) -->
    <g>
        <rect x="990" y="645" width="840" height="165" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6,4" rx="9"/>
        <rect x="1020" y="675" width="90" height="90" fill="#E5E7EB" fill-opacity="0.5" rx="6"/>
        <text x="1065" y="738" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#BDC3C7">06</text>
        <text x="1148" y="732" font-family="Arial, sans-serif" font-size="27" fill="#95A5A6">{{TOC_ITEM_6_TITLE}}</text>
    </g>

    <!-- 底部装饰 -->
    <rect x="90" y="870" width="1740" height="90" fill="#F8F9FA" rx="9"/>
    <text x="150" y="927" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#005587">💡 KEY FOCUS</text>
    <text x="345" y="927" font-family="Arial, sans-serif" font-size="21" fill="#5D6D7E">{{KEY_FOCUS}}</text>

    <!-- 页脚 -->
    <line x1="90" y1="998" x2="1830" y2="998" stroke="#ECF0F1" stroke-width="2"/>
    <text x="90" y="1042" font-family="Arial, sans-serif" font-size="21" fill="#7F8C8D">{{PAGE_NUM}}</text>
    <text x="1740" y="1042" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#005587" letter-spacing="2">CONFIDENTIAL</text>

</svg>
