<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 背景：深医学蓝，营造专业感和过渡感 -->
    <rect width="1920" height="1080" fill="#004080" />

    <!-- 背景装饰：右侧几何图形，医疗主题 -->
    <path d="M1275 0 L1920 0 L1920 1080 L975 1080 Z" fill="#0066B3" fill-opacity="0.3" />
    <rect x="1800" y="0" width="120" height="1080" fill="#003366" fill-opacity="0.3" />

    <!-- 右侧装饰：抽象医疗十字 -->
    <rect x="1575" y="420" width="180" height="45" fill="#FFFFFF" fill-opacity="0.08" rx="6" />
    <rect x="1642" y="352" width="45" height="180" fill="#FFFFFF" fill-opacity="0.08" rx="6" />

    <!-- 右下角装饰：DNA 双螺旋简化 -->
    <circle cx="1770" cy="825" r="60" fill="none" stroke="#00A86B" stroke-width="3" stroke-opacity="0.2" />
    <circle cx="1770" cy="825" r="38" fill="none" stroke="#00A86B" stroke-width="3" stroke-opacity="0.15" />
    <circle cx="1770" cy="825" r="15" fill="#00A86B" fill-opacity="0.1" />

    <!-- 左侧橙色装饰条 -->
    <rect x="0" y="390" width="18" height="300" fill="#FF6B35" />

    <!-- ==================== 章节信息区域 ==================== -->
    <!-- 章节编号：大号数字，半透明背景字 -->
    <text x="180" y="720" fill="#FFFFFF" fill-opacity="0.08" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="420" font-weight="bold">
        {{CHAPTER_NUM}}
    </text>

    <!-- 装饰线条 -->
    <line x1="570" y1="412" x2="780" y2="412" stroke="#FF6B35" stroke-width="9" />
    <circle cx="795" cy="412" r="9" fill="#00A86B" />

    <!-- 章节标题：醒目白色 -->
    <text x="570" y="540" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="78"
        font-weight="bold">
        {{CHAPTER_TITLE}}
    </text>

    <!-- 章节描述/摘要：浅色 -->
    <text x="570" y="630" fill="#E6F3FA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="33">
        {{CHAPTER_DESC}}
    </text>

    <!-- ==================== 底部信息 ==================== -->
    <line x1="60" y1="998" x2="1860" y2="998" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1" />
    <text x="1860" y="1035" text-anchor="end" fill="#FFFFFF" fill-opacity="0.4"
        font-family="Microsoft YaHei, Arial, sans-serif" font-size="24">
        {{INSTITUTION}}
    </text>
</svg>