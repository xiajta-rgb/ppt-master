<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF" />

    <!-- ==================== 页眉区域 ==================== -->
    <rect x="0" y="0" width="1920" height="105" fill="#0066B3" />
    <rect x="0" y="0" width="9" height="105" fill="#FF6B35" />

    <!-- 页面标题 -->
    <text x="60" y="69" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42"
        font-weight="bold">
        目 录
    </text>

    <!-- 英文副标题 -->
    <text x="195" y="69" fill="#FFFFFF" fill-opacity="0.7" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="24">
        CONTENTS
    </text>

    <!-- 右上角 Logo -->
    <text x="1800" y="69" text-anchor="end" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="24" font-weight="bold">
        {{LOGO}}
    </text>

    <!-- ==================== 目录内容区域 ==================== -->
    <!-- 目录项容器 -->
    <rect x="120" y="150" width="1680" height="780" fill="none" />

    <!-- 目录项 01 -->
    <rect x="120" y="172" width="810" height="142" fill="#E6F3FA" rx="12" />
    <rect x="120" y="172" width="9" height="142" fill="#0066B3" rx="4" />
    <text x="180" y="248" fill="#004080" font-family="Microsoft YaHei, Arial, sans-serif" font-size="54"
        font-weight="bold">01</text>
    <text x="285" y="237" fill="#004080" font-family="Microsoft YaHei, Arial, sans-serif" font-size="33"
        font-weight="bold">{{TOC_ITEM_1_TITLE}}</text>
    <text x="180" y="288" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="21">{{TOC_ITEM_1_DESC}}</text>

    <!-- 目录项 02 -->
    <rect x="990" y="172" width="810" height="142" fill="#E6F3FA" rx="12" />
    <rect x="990" y="172" width="9" height="142" fill="#0066B3" rx="4" />
    <text x="1050" y="248" fill="#004080" font-family="Microsoft YaHei, Arial, sans-serif" font-size="54"
        font-weight="bold">02</text>
    <text x="1155" y="237" fill="#004080" font-family="Microsoft YaHei, Arial, sans-serif" font-size="33"
        font-weight="bold">{{TOC_ITEM_2_TITLE}}</text>
    <text x="1050" y="288" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="21">{{TOC_ITEM_2_DESC}}</text>

    <!-- 目录项 03 -->
    <rect x="120" y="352" width="810" height="142" fill="#E8F5EE" rx="12" />
    <rect x="120" y="352" width="9" height="142" fill="#00A86B" rx="4" />
    <text x="180" y="428" fill="#004080" font-family="Microsoft YaHei, Arial, sans-serif" font-size="54"
        font-weight="bold">03</text>
    <text x="285" y="417" fill="#004080" font-family="Microsoft YaHei, Arial, sans-serif" font-size="33"
        font-weight="bold">{{TOC_ITEM_3_TITLE}}</text>
    <text x="180" y="468" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="21">{{TOC_ITEM_3_DESC}}</text>

    <!-- 目录项 04 -->
    <rect x="990" y="352" width="810" height="142" fill="#E8F5EE" rx="12" />
    <rect x="990" y="352" width="9" height="142" fill="#00A86B" rx="4" />
    <text x="1050" y="428" fill="#004080" font-family="Microsoft YaHei, Arial, sans-serif" font-size="54"
        font-weight="bold">04</text>
    <text x="1155" y="417" fill="#004080" font-family="Microsoft YaHei, Arial, sans-serif" font-size="33"
        font-weight="bold">{{TOC_ITEM_4_TITLE}}</text>
    <text x="1050" y="468" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="21">{{TOC_ITEM_4_DESC}}</text>

    <!-- 目录项 05（可选） -->
    <rect x="120" y="532" width="810" height="142" fill="none" stroke="#D0D7E0" stroke-width="2" stroke-dasharray="4,4"
        rx="12" />
    <text x="525" y="615" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="24">{{TOC_ITEM_5_TITLE}}</text>

    <!-- 目录项 06（可选） -->
    <rect x="990" y="532" width="810" height="142" fill="none" stroke="#D0D7E0" stroke-width="2" stroke-dasharray="4,4"
        rx="12" />
    <text x="1395" y="615" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="24">{{TOC_ITEM_6_TITLE}}</text>

    <!-- ==================== 装饰元素 ==================== -->
    <!-- 底部医疗图标装饰 -->
    <!-- 十字符号 -->
    <rect x="900" y="780" width="120" height="30" fill="#00A86B" fill-opacity="0.2" rx="4" />
    <rect x="945" y="735" width="30" height="120" fill="#00A86B" fill-opacity="0.2" rx="4" />

    <!-- ==================== 页脚区域 ==================== -->
    <line x1="60" y1="998" x2="1860" y2="998" stroke="#E6F3FA" stroke-width="2" />
    <text x="60" y="1042" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">
        {{INSTITUTION}}
    </text>
    <text x="1830" y="1042" text-anchor="end" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif"
        font-size="21">{{PAGE_NUM}}</text>
</svg>
