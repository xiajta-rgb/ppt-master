<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" />

  <!-- Top Red Strip -->
  <rect x="0" y="0" width="1920" height="6" fill="#C00000" />

  <!-- Header Area -->
  <rect x="0" y="6" width="1920" height="114" fill="#FFFFFF" />
  <line x1="0" y1="120" x2="1920" y2="120" stroke="#E7E6E6" stroke-width="2" />

  <!-- Left Red Accent Bar -->
  <rect x="75" y="30" width="12" height="60" fill="#C00000" />

  <!-- Page Title -->
  <text x="108" y="78" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="48" font-weight="bold" fill="#000000">{{PAGE_TITLE}}</text>

  <!-- Content Area -->
  <rect x="75" y="142" width="1770" height="840" rx="6" ry="6" fill="#FFFFFF" stroke="#E7E6E6" stroke-width="2" stroke-dasharray="5 5" />

  <!-- Content Area Placeholder -->
  <text x="960" y="570" text-anchor="middle" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="30" fill="#CCCCCC">{{CONTENT_AREA}}</text>

  <!-- Footer -->
  <rect x="0" y="1020" width="1920" height="60" fill="#F2F2F2" />
  <rect x="0" y="1020" width="6" height="60" fill="#C00000" />

  <!-- Section Name -->
  <text x="90" y="1059" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="21" fill="#666666">{{SECTION_NAME}}</text>

  <!-- Source -->
  <text x="960" y="1059" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="18" fill="#999999" text-anchor="middle">{{SOURCE}}</text>

  <!-- Page Number -->
  <rect x="1815" y="1032" width="45" height="36" fill="#C00000" />
  <text x="1838" y="1059" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF">{{PAGE_NUM}}</text>
</svg>
