<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" />

  <!-- Top Red Banner -->
  <rect x="0" y="0" width="1920" height="12" fill="#C00000" />

  <!-- Left Decorative Red Block -->
  <rect x="0" y="0" width="90" height="540" fill="#C00000" />
  <rect x="0" y="540" width="90" height="540" fill="#2E75B6" />

  <!-- Warm Gray Subtitle Band -->
  <rect x="90" y="420" width="1830" height="90" fill="#F2F2F2" />

  <!-- Title Group -->
  <text x="960" y="330" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="84" font-weight="bold" fill="#C00000" text-anchor="middle">{{TITLE}}</text>

  <!-- Subtitle -->
  <text x="960" y="480" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="33" fill="#666666" text-anchor="middle">{{SUBTITLE}}</text>

  <!-- Decorative Numbered Badges (referencing architecture style) -->
  <rect x="300" y="600" width="60" height="60" fill="#C00000" />
  <text x="330" y="642" font-family="Arial, sans-serif" font-size="33" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>

  <rect x="600" y="600" width="60" height="60" fill="#C00000" />
  <text x="630" y="642" font-family="Arial, sans-serif" font-size="33" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <rect x="900" y="600" width="60" height="60" fill="#C00000" />
  <text x="930" y="642" font-family="Arial, sans-serif" font-size="33" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <rect x="1200" y="600" width="60" height="60" fill="#C00000" />
  <text x="1230" y="642" font-family="Arial, sans-serif" font-size="33" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <rect x="1500" y="600" width="60" height="60" fill="#C00000" />
  <text x="1530" y="642" font-family="Arial, sans-serif" font-size="33" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>

  <!-- Blue Scenario Tags -->
  <rect x="375" y="600" width="180" height="60" fill="#2E75B6" />
  <text x="465" y="640" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle">智能运维</text>

  <rect x="675" y="600" width="180" height="60" fill="#2E75B6" />
  <text x="765" y="640" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle">数字员工</text>

  <rect x="975" y="600" width="180" height="60" fill="#2E75B6" />
  <text x="1065" y="640" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle">自动化测试</text>

  <rect x="1275" y="600" width="180" height="60" fill="#2E75B6" />
  <text x="1365" y="640" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle">故障诊断</text>

  <rect x="1575" y="600" width="180" height="60" fill="#2E75B6" />
  <text x="1665" y="640" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle">开放共享</text>

  <!-- Dashed Separator -->
  <line x1="180" y1="720" x2="1740" y2="720" stroke="#E7E6E6" stroke-width="2" stroke-dasharray="5 5" />

  <!-- Author & Date -->
  <text x="960" y="840" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="30" fill="#333333" text-anchor="middle">{{AUTHOR}}</text>
  <text x="960" y="900" font-family="'Microsoft YaHei', Arial, sans-serif" font-size="27" fill="#999999" text-anchor="middle">{{DATE}}</text>

  <!-- Bottom Blue Band -->
  <rect x="0" y="1035" width="1920" height="45" fill="#2E75B6" />

  <!-- Bottom Warm Accent -->
  <rect x="0" y="1020" width="1920" height="15" fill="#FDF3EB" />
</svg>
