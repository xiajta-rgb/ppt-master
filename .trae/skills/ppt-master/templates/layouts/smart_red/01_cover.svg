<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#F5F5F7" />

  <!-- 1. Top Left: Red Triangle (Primary) -->
  <path d="M0 0 L570 0 L0 570 Z" fill="#DE3545" />
  
  <!-- 1a. Top Left: Small accent triangle -->
  <path d="M0 0 L270 0 L0 270 Z" fill="#E86A76" />

  <!-- 2. Bottom Left: Dark Grey Triangle -->
  <path d="M0 1080 L480 1080 L0 600 Z" fill="#333333" />
  
  <!-- 2a. Bottom Left: Small accent -->
  <path d="M0 1080 L180 1080 L0 900 Z" fill="#555555" />

  <!-- 3. Bottom Right: Red Triangle (Primary) -->
  <path d="M1920 1080 L1920 450 L1290 1080 Z" fill="#DE3545" />
  
  <!-- 3a. Bottom Right: Small accent triangle -->
  <path d="M1920 1080 L1920 780 L1620 1080 Z" fill="#E86A76" />
  
  <!-- 3b. Top Right: Small decorative triangle -->
  <path d="M1920 0 L1800 0 L1920 120 Z" fill="#E97983" />

  <!-- Content Area -->
  <g transform="translate(690, 450)">
    
    <!-- Main Title -->
    <text x="0" y="0" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="108" font-weight="bold" fill="#333333" letter-spacing="6">{{TITLE}}</text>
    
    <!-- Subtitle/English -->
    <text x="8" y="75" font-family="Arial, sans-serif" font-size="30" fill="#DE3545" letter-spacing="4" font-weight="bold">COMPANY INTRODUCTION</text>
    
    <!-- Decorative Line -->
    <line x1="8" y1="117" x2="180" y2="117" stroke="#333333" stroke-width="6" />
    
    <!-- Subtitle CN -->
    <text x="8" y="195" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="48" fill="#666666">{{SUBTITLE}}</text>
    
    <!-- Info -->
    <text x="8" y="375" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="27" fill="#999999">
       汇报人：{{AUTHOR}}
    </text>
    <text x="8" y="420" font-family="'Microsoft YaHei', 'SimHei', sans-serif" font-size="27" fill="#999999">
       时间：{{DATE}}
    </text>
  </g>
</svg>
