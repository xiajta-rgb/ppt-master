<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#F5F5F7" />

  <!-- Header Background (White strip) -->
  <rect x="0" y="0" width="1920" height="120" fill="#FFFFFF" />
  <line x1="0" y1="120" x2="1920" y2="120" stroke="#E0E0E0" stroke-width="2" />

  <!-- Header Accent: Red Shapes on Top Right - Enhanced -->
  <path d="M1920 0 L1770 0 L1920 150 Z" fill="#DE3545" />
  <path d="M1770 0 L1680 0 L1800 120 L1920 120 Z" fill="#EEEEEE"/>
  <path d="M1920 0 L1860 0 L1920 60 Z" fill="#E97983"/>
  
  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="120" fill="#DE3545" />
  
  <!-- Page Title Group -->
  <g transform="translate(90, 60)">
      <!-- Symbol 1: Dark Hollow Triangle -->
      <path d="M0 0 L21 15 L0 30 Z" fill="none" stroke="#333333" stroke-width="3" transform="translate(0, -15)" />
      
      <!-- Symbol 2: Solid Red Triangle -->
      <path d="M27 0 L48 15 L27 30 Z" fill="#DE3545" transform="translate(0, -15)" />

      <!-- Title Text -->
      <text x="75" y="18" font-family="'Microsoft YaHei', sans-serif" font-size="48" font-weight="bold" fill="#333333">{{PAGE_TITLE}}</text>
  </g>
  
  <!-- Content Area Placeholder -->
  <!-- Main Content Card (White Background for content) -->
  <g transform="translate(90, 165)">
    <rect x="0" y="0" width="1740" height="810" rx="12" ry="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2" />
    
    <!-- Red accent line on top of card -->
    <rect x="0" y="0" width="1740" height="6" rx="12" ry="12" fill="#E97983" />
    
    <!-- Visual Guide for Content Area (Dotted Line) -->
    <rect x="45" y="45" width="1650" height="720" rx="6" ry="6" fill="none" stroke="#CCCCCC" stroke-width="2" stroke-dasharray="8,8" />
    
    <text x="870" y="405" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="36" fill="#CCCCCC">
      {{CONTENT_AREA}}
    </text>
  </g>

  <!-- Footer - Enhanced -->
  <g transform="translate(0, 1020)">
    <!-- Footer background bar -->
    <rect x="0" y="0" width="1920" height="60" fill="#FAFAFA"/>
    
    <!-- Red accent -->
    <rect x="0" y="0" width="6" height="60" fill="#DE3545"/>
    
    <text x="105" y="38" font-family="Arial, sans-serif" font-size="21" fill="#999999">COMPANY INTRODUCTION</text>
    
    <!-- Page Number with circle background -->
    <circle cx="1815" cy="30" r="24" fill="#FDE8E9"/>
    <text x="1815" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#333333" font-weight="bold">{{PAGE_NUM}}</text>
  </g>
</svg>
