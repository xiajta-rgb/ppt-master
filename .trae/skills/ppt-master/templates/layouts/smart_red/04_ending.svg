<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#F5F5F7" />

  <!-- 1. Top Left: Red Triangle -->
  <path d="M0 0 L570 0 L0 570 Z" fill="#DE3545" />
  
  <!-- 1a. Top Left: Small accent triangle -->
  <path d="M0 0 L270 0 L0 270 Z" fill="#E86A76" />

  <!-- 2. Bottom Left: Dark Grey Triangle -->
  <path d="M0 1080 L480 1080 L0 600 Z" fill="#333333" />
  
  <!-- 2a. Bottom Left: Small accent -->
  <path d="M0 1080 L180 1080 L0 900 Z" fill="#555555" />

  <!-- 3. Bottom Right: Red Triangle -->
  <path d="M1920 1080 L1920 450 L1290 1080 Z" fill="#DE3545" />
  
  <!-- 3a. Bottom Right: Small accent triangle -->
  <path d="M1920 1080 L1920 780 L1620 1080 Z" fill="#E86A76" />
  
  <!-- 3b. Top Right: Small decorative triangle -->
  <path d="M1920 0 L1800 0 L1920 120 Z" fill="#E97983" />

  <!-- Content Group -->
  <g transform="translate(960, 510)" text-anchor="middle">
      
      <!-- Thank You Text -->
      <text x="0" y="0" font-family="'Microsoft YaHei', sans-serif" font-size="120" font-weight="bold" fill="#333333" letter-spacing="6">{{THANK_YOU}}</text>
      <text x="0" y="90" font-family="Arial, sans-serif" font-size="36" fill="#DE3545" letter-spacing="15">{{ENDING_SUBTITLE}}</text>
      
      <!-- Separator -->
      <line x1="-225" y1="150" x2="225" y2="150" stroke="#CCCCCC" stroke-width="2" />
      
      <!-- Closing Message -->
      <text x="0" y="225" font-family="'Microsoft YaHei', sans-serif" font-size="36" fill="#666666">{{CLOSING_MESSAGE}}</text>
      
      <!-- Contact Info Placeholder -->
      <text x="0" y="300" font-family="Arial, sans-serif" font-size="24" fill="#999999">
        {{CONTACT_INFO}}
      </text>
  </g>
</svg>
