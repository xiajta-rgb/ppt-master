<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 目录页 - 中国电建现代风 (POWERCHINA Modern) -->
    
    <defs>
        <!-- 背景渐变: 浅灰蓝 -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#F8F9FA;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#E9ECEF;stop-opacity:1" />
        </linearGradient>

        <!-- 装饰渐变: 深蓝 -> 科技蓝 -->
        <linearGradient id="decoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00418D;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 背景层 -->
    <rect width="1920" height="1080" fill="url(#bgGrad)"/>

    <!-- 顶栏 -->
    <rect x="0" y="0" width="1920" height="12" fill="url(#decoGrad)"/>

    <!-- 标题区 (Title Component) -->
    <g transform="translate(120, 120)">
        <text x="0" y="0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="72" font-weight="bold" fill="#00418D" letter-spacing="6">
            目录
        </text>
        <text x="0" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#B0C4DE" letter-spacing="12">
            AGENDA
        </text>
        <line x1="0" y1="63" x2="180" y2="63" stroke="#C41E3A" stroke-width="6"/>
    </g>

    <!-- Logo (右上角) -->
    <text x="1800" y="90" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#495057" letter-spacing="3">
        POWERCHINA
    </text>

    <!-- 目录时间轴 (Timeline Layout) -->
    <g transform="translate(0, 300)">
        
        <!-- 连接线 -->
        <line x1="120" y1="180" x2="1800" y2="180" stroke="#CED4DA" stroke-width="3" stroke-dasharray="8,8"/>
        
        <!-- Item 01 -->
        <g transform="translate(195, 0)">
            <circle cx="30" cy="180" r="18" fill="#FFFFFF" stroke="#00418D" stroke-width="6"/>
            <text x="30" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#E9ECEF">01</text>
            <text x="30" y="150" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#00418D">
                {{TOC_ITEM_1_TITLE}}
            </text>
            <text x="30" y="240" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#6C757D">
                {{TOC_ITEM_1_DESC}}
            </text>
        </g>

        <!-- Item 02 -->
        <g transform="translate(570, 0)">
            <circle cx="30" cy="180" r="18" fill="#FFFFFF" stroke="#00418D" stroke-width="6"/>
            <text x="30" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#E9ECEF">02</text>
            <text x="30" y="150" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#00418D">
                {{TOC_ITEM_2_TITLE}}
            </text>
            <text x="30" y="240" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#6C757D">
                {{TOC_ITEM_2_DESC}}
            </text>
        </g>

        <!-- Item 03 -->
        <g transform="translate(945, 0)">
            <circle cx="30" cy="180" r="18" fill="#FFFFFF" stroke="#0066CC" stroke-width="6"/>
            <text x="30" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#E9ECEF">03</text>
            <text x="30" y="150" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#0066CC">
                {{TOC_ITEM_3_TITLE}}
            </text>
             <text x="30" y="240" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#6C757D">
                {{TOC_ITEM_3_DESC}}
            </text>
        </g>
        
        <!-- Item 04 -->
        <g transform="translate(1320, 0)">
            <circle cx="30" cy="180" r="18" fill="#FFFFFF" stroke="#4A90D9" stroke-width="6"/>
            <text x="30" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="#E9ECEF">04</text>
            <text x="30" y="150" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold" fill="#4A90D9">
                {{TOC_ITEM_4_TITLE}}
            </text>
             <text x="30" y="240" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#6C757D">
                {{TOC_ITEM_4_DESC}}
            </text>
        </g>

    </g>

    <!-- 底部数据区 -->
    <g transform="translate(0, 780)">
        <rect width="1920" height="300" fill="#001F45"/>
        <text x="120" y="90" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" opacity="0.6">
            关键数据 | KEY FIGURES
        </text>
        <line x1="120" y1="120" x2="1800" y2="120" stroke="#FFFFFF" stroke-opacity="0.2"/>
        
        <!-- Stat 1 -->
        <text x="180" y="210" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">
            {{STAT_1}}
        </text>
        <text x="180" y="255" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#B0C4DE">
            {{STAT_1_LABEL}}
        </text>

        <!-- Stat 2 -->
        <text x="600" y="210" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#C41E3A">
            {{STAT_2}}
        </text>
        <text x="600" y="255" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#B0C4DE">
            {{STAT_2_LABEL}}
        </text>

        <!-- Stat 3 -->
        <text x="1050" y="210" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#0066CC">
            {{STAT_3}}
        </text>
        <text x="1050" y="255" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#B0C4DE">
            {{STAT_3_LABEL}}
        </text>
        
    </g>

</svg>
