<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 结束页 - 中国电建现代风 (POWERCHINA Modern) -->
    
    <defs>
        <!-- 主背景渐变 -->
        <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
             <stop offset="0%" style="stop-color:#001F45;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#003270;stop-opacity:1" />
        </linearGradient>

        <!-- 光辉金渐变 (Glory Gold) -->
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#mainGrad)"/>
    
    <!-- 精细网格背景 -->
    <defs>
         <pattern id="grid" x="0" y="0" width="150" height="75" patternUnits="userSpaceOnUse">
             <path d="M 0 0 L 150 0 L 150 75" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
        </pattern>
    </defs>
    <rect width="1920" height="1080" fill="url(#grid)"/>

    <!-- 底部基石 (Foundation) -->
    <path d="M0,900 L1920,825 L1920,1080 L0,1080 Z" fill="#000F24"/>
    
    <!-- 装饰金线 (Cooperation Line) -->
    <rect x="0" y="825" width="1920" height="6" fill="url(#goldGrad)"/>

    <!-- 中央内容容器 -->
    <g transform="translate(960, 420)">
        
        <!-- 大 Logo -->
        <text x="0" y="-90" text-anchor="middle" font-family="Arial, sans-serif" font-size="300" font-weight="bold" fill="#FFFFFF" fill-opacity="0.03">
            THANKS
        </text>
        
        <!-- 感谢语 -->
        <text x="0" y="0" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="96" font-weight="bold" fill="#FFFFFF" letter-spacing="6">
            {{THANK_YOU}}
        </text>

        <!-- 装饰短线 -->
        <rect x="-120" y="60" width="240" height="9" fill="#C41E3A"/>
        
        <!-- 结语 (Closing Message) -->
        <text x="0" y="150" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="48" fill="#B0C4DE" letter-spacing="3">
            {{CLOSING_MESSAGE}}
        </text>

        <!-- 联系方式卡片 (Contact Card) -->
        <rect x="-450" y="210" width="900" height="180" fill="#FFFFFF" fill-opacity="0.05" rx="12"/>
        
        <text x="0" y="270" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">
            {{AUTHOR}}
        </text>
        <text x="0" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#CED4DA">
            {{CONTACT_INFO}}
        </text>

    </g>

    <!-- 对角线切角装饰 (Engineering Cut) -->
    <path d="M0,0 L300,0 L0,300 Z" fill="#0066CC" fill-opacity="0.2"/>
    <path d="M1920,1080 L1620,1080 L1920,780 Z" fill="#C41E3A" fill-opacity="0.2"/>

    <!-- 底部双语版权 -->
     <text x="960" y="1035" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6C757D">
        © 2026 POWERCHINA. All Rights Reserved.
    </text>

</svg>
