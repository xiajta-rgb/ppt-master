<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a962"/>
      <stop offset="100%" stop-color="#e0c882"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <g transform="translate(960, 450)">
    <line x1="-300" y1="0" x2="300" y2="0" stroke="#c9a962" stroke-width="2"/>
  </g>

  <text x="960" y="525" text-anchor="middle" fill="url(#accentGradient)" font-family="Space Grotesk, Inter, sans-serif" font-size="72" font-weight="700">{{THANK_YOU}}</text>

  <text x="960" y="630" text-anchor="middle" fill="#86868b" font-family="Inter, -apple-system, sans-serif" font-size="22">{{REPORT_TITLE}}</text>

  <text x="960" y="720" text-anchor="middle" fill="#6e6e73" font-family="Inter, -apple-system, sans-serif" font-size="20">{{DATA_SOURCES}}</text>

  <text x="960" y="780" text-anchor="middle" fill="#6e6e73" font-family="Inter, -apple-system, sans-serif" font-size="20">{{DATE}} | Internal Research Only</text>
</svg>