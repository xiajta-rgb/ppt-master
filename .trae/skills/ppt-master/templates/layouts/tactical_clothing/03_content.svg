<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="accentBoxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(201,169,98,0.08)"/>
      <stop offset="100%" stop-color="rgba(201,169,98,0.03)"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <rect x="72" y="90" width="1776" height="900" fill="none"/>

  <g transform="translate(960, 180)">
    <text x="0" y="0" text-anchor="middle" fill="#c9a962" font-family="Space Grotesk, Inter, sans-serif" font-size="18" font-weight="600" letter-spacing="6">CHAPTER {{CHAPTER_NUM}}</text>
    <text x="0" y="75" text-anchor="middle" fill="#f5f5f7" font-family="Space Grotesk, Inter, sans-serif" font-size="54" font-weight="700">{{PAGE_TITLE}}</text>
    <text x="0" y="135" text-anchor="middle" fill="#86868b" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="400" max-width="600">{{PAGE_DESC}}</text>
  </g>

  <rect x="150" y="420" width="6" height="450" fill="#c9a962"/>

  <text x="195" y="450" fill="#f5f5f7" font-family="Space Grotesk, Inter, sans-serif" font-size="27" font-weight="600">Section {{SECTION_NUM}}</text>

  <text x="195" y="510" fill="#86868b" font-family="Inter, -apple-system, sans-serif" font-size="21">{{CONTENT_BODY}}</text>

  <rect x="195" y="570" width="600" height="180" rx="18" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="240" y="630" fill="#c9a962" font-family="Space Grotesk, Inter, sans-serif" font-size="16" font-weight="600" letter-spacing="3">{{HIGHLIGHT_LABEL}}</text>
  <text x="240" y="675" fill="#f5f5f7" font-family="Inter, -apple-system, sans-serif" font-size="21">{{HIGHLIGHT_TEXT}}</text>

  <g transform="translate(960, 930)">
    <text x="0" y="0" text-anchor="middle" fill="#6e6e73" font-family="Inter, -apple-system, sans-serif" font-size="18">{{PAGE_NUM}}</text>
  </g>
</svg>