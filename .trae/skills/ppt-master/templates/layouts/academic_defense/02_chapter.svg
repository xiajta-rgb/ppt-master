<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- 背景：全屏深蓝，营造过渡感和沉浸感 -->
  <rect width="1920" height="1080" fill="#003366"/>
  
  <!-- 背景装饰：右侧几何图形，增加层次 -->
  <path d="M1200 0 L1920 0 L1920 1080 L900 1080 Z" fill="#004080" fill-opacity="0.3"/>
  <rect x="1800" y="0" width="120" height="1080" fill="#002244" fill-opacity="0.2"/>
  
  <!-- 左侧红色装饰条 -->
  <rect x="0" y="360" width="18" height="360" fill="#CC0000"/>
  
  <!-- ==================== 章节信息区域 ==================== -->
  <!-- 章节编号：大号数字，半透明背景字 -->
  <text x="180" y="720" fill="#FFFFFF" fill-opacity="0.08" font-family="Microsoft YaHei, Arial, sans-serif" font-size="420" font-weight="bold">
    {{CHAPTER_NUM}}
  </text>
  
  <!-- 章节标题：醒目白色 -->
  <text x="570" y="510" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="84" font-weight="bold">
    {{CHAPTER_TITLE}}
  </text>
  
  <!-- 章节描述/摘要：浅灰色 -->
  <text x="570" y="615" fill="#E8F4FC" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36">
    {{CHAPTER_DESC}}
  </text>
  
  <!-- 装饰线条 -->
  <line x1="570" y1="398" x2="750" y2="398" stroke="#CC0000" stroke-width="9"/>
  
  <!-- 底部信息 -->
  <text x="1860" y="1020" text-anchor="end" fill="#FFFFFF" fill-opacity="0.4" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27">
    {{TITLE}}
  </text>
</svg>
