<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  
  <!-- ==================== 顶部装饰区域 ==================== -->
  <!-- 深蓝色主横条 -->
  <rect x="0" y="0" width="1920" height="150" fill="#003366"/>
  <!-- 左侧红色竖条装饰 -->
  <rect x="0" y="0" width="9" height="150" fill="#CC0000"/>
  
  <!-- 右上角 Logo 区域占位 -->
  <rect x="1620" y="38" width="240" height="75" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" rx="6"/>
  <text x="1740" y="87" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27" font-weight="bold">
    {{LOGO}}
  </text>
  
  <!-- ==================== 主内容区域 ==================== -->
  <!-- 主标题 -->
  <text x="960" y="510" text-anchor="middle" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="84" font-weight="bold">
    {{TITLE}}
  </text>
  
  <!-- 副标题 -->
  <text x="960" y="615" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42">
    {{SUBTITLE}}
  </text>
  
  <!-- 装饰分割线 -->
  <line x1="630" y1="675" x2="1290" y2="675" stroke="#0066CC" stroke-width="3"/>
  <circle cx="960" cy="675" r="8" fill="#0066CC"/>
  
  <!-- ==================== 答辩人信息区域 ==================== -->
  <text x="960" y="780" text-anchor="middle" fill="#333333" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36">
    答辩人：{{AUTHOR}}
  </text>
  <text x="960" y="840" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30">
    指导老师：{{ADVISOR}}
  </text>
  <text x="960" y="900" text-anchor="middle" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="27">
    {{INSTITUTION}}
  </text>
  
  <!-- ==================== 底部信息 ==================== -->
  <rect x="0" y="998" width="1920" height="82" fill="#F5F7FA"/>
  <text x="960" y="1047" text-anchor="middle" fill="#999999" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21">
    {{DATE}}
  </text>
</svg>
