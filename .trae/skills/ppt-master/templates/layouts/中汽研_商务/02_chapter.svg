<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 章节过渡页 (Premium Tech Style) -->

    <defs>
        <!-- 径向渐变: 中心亮蓝 -> 边缘深蓝 -->
        <radialGradient id="gradRadial" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:#004098;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#001F4D;stop-opacity:1" />
        </radialGradient>
    </defs>

    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#gradRadial)"/>

    <!-- 装饰背景数字 (极大, 极淡) -->
    <text x="960" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="900" font-weight="bold" fill="#FFFFFF" fill-opacity="0.03">
        {{CHAPTER_NUM}}
    </text>

    <!-- 装饰环 -->
    <circle cx="960" cy="540" r="420" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="3"/>
    <circle cx="960" cy="540" r="480" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="20,10"/>

    <!-- 中央内容组 -->
    <g transform="translate(960, 540)">
        
        <!-- 章节前缀 -->
        <text x="0" y="-120" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#5E9EFF" letter-spacing="6">
            CHAPTER
        </text>
        
        <!-- 章节数字 (正常显示) -->
        <text x="0" y="-30" text-anchor="middle" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#FFFFFF">
            {{CHAPTER_NUM}}
        </text>

        <!-- 装饰线 -->
        <rect x="-60" y="30" width="120" height="6" fill="#D32F2F" />

        <!-- 章节标题 -->
        <text x="0" y="120" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">
            {{CHAPTER_TITLE}}
        </text>
        
        <!-- 英文/副标题 -->
        <text x="0" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#B0C4DE" letter-spacing="2">
            {{CHAPTER_SUBTITLE}}
        </text>
    </g>

    <!-- 底部装饰线 -->
    <rect x="0" y="1071" width="1920" height="9" fill="#0050B3" />

</svg>
