<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 结束页 (Premium Tech Style) -->

    <defs>
        <!-- 主背景渐变: 深蓝 -> 科技蓝 -->
        <linearGradient id="gradEnd" x1="0%" y1="0%" x2="100%" y2="100%">
             <stop offset="0%" style="stop-color:#001F4D;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#004098;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 背景: 深蓝渐变 -->
    <rect width="1920" height="1080" fill="url(#gradEnd)" />

    <!-- 顶部装饰条 -->
    <rect x="0" y="0" width="1920" height="9" fill="#0050B3" />

    <!-- 背景装饰图案 -->
    <!-- 放射状圆环 -->
    <circle cx="960" cy="540" r="450" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="3" />
    <circle cx="960" cy="540" r="600" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="2" stroke-dasharray="10,10"/>
    <circle cx="960" cy="540" r="750" fill="none" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="2" />

    <!-- 中心内容区 -->
    <g transform="translate(960, 480)">
        
        <!-- 大 Logo -->
        <image href="../images/{{LOGO_LARGE}}" x="-225" y="-180" width="450" height="180" preserveAspectRatio="xMidYMid meet"/>
        
        <!-- 感谢词 -->
        <text x="0" y="120" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="96" font-weight="bold" fill="#FFFFFF" letter-spacing="6">
            {{THANK_YOU}}
        </text>
        
        <!-- 英文感谢词 -->
        <text x="0" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" fill="#B0C4DE" letter-spacing="3">
            {{THANK_YOU_EN}}
        </text>

        <!-- 装饰短线 -->
        <rect x="-90" y="240" width="180" height="6" fill="#D32F2F" />

        <!-- 公司信息 / 联系方式 -->
        <text x="0" y="330" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="30" fill="#FFFFFF" fill-opacity="0.8">
            {{AUTHOR}}
        </text>
         <text x="0" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#B0C4DE" fill-opacity="0.6">
            {{CONTACT_INFO}}
        </text>
        
    </g>

    <!-- 底部版权栏 -->
    <rect x="0" y="1020" width="1920" height="60" fill="#000000" fill-opacity="0.2" />
    <text x="960" y="1060" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#FFFFFF" fill-opacity="0.4">
        {{COPYRIGHT}}
    </text>

</svg>
