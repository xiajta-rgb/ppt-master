<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 章节页 - 重庆两江新区发改委风格 -->

    <defs>
        <!-- 深蓝背景渐变 -->
        <linearGradient id="gradChapter" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#003366;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#002244;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#001a33;stop-opacity:1" />
        </linearGradient>
        <!-- 顶部装饰渐变 -->
        <linearGradient id="topDecoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#gradChapter)"/>

    <!-- 装饰元素 - 几何图案 -->
    <circle cx="1800" cy="150" r="375" fill="#FFFFFF" fill-opacity="0.02"/>
    <circle cx="120" cy="930" r="450" fill="#FFFFFF" fill-opacity="0.02"/>
    <circle cx="960" cy="540" r="600" fill="#FFFFFF" fill-opacity="0.015"/>

    <!-- 顶部金红渐变装饰线 -->
    <rect x="0" y="0" width="1920" height="9" fill="url(#topDecoGrad)"/>

    <!-- 网格装饰线 -->
    <line x1="0" y1="360" x2="1920" y2="360" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05"/>
    <line x1="0" y1="720" x2="1920" y2="720" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05"/>
    <line x1="639" y1="0" x2="639" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05"/>
    <line x1="1281" y1="0" x2="1281" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05"/>

    <!-- 左侧装饰竖条 -->
    <rect x="150" y="390" width="9" height="300" fill="#DAA520" fill-opacity="0.8"/>

    <!-- 章节内容 -->
    <g transform="translate(960, 540)">
        <!-- 章节编号 - 大号半透明背景 -->
        <text x="0" y="-90" text-anchor="middle" font-family="Arial" font-size="240" font-weight="bold" fill="#FFFFFF" fill-opacity="0.06">
            0{{CHAPTER_NUM}}
        </text>
        
        <!-- 装饰方块 -->
        <rect x="-75" y="0" width="150" height="9" fill="#DAA520"/>
        
        <!-- 章节标题 -->
        <text x="0" y="105" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">
            {{CHAPTER_TITLE}}
        </text>
        
        <!-- 英文标题/副标题 -->
        <text x="0" y="180" text-anchor="middle" font-family="Arial" font-size="33" fill="#FFFFFF" fill-opacity="0.6" letter-spacing="4">
            {{CHAPTER_SUBTITLE}}
        </text>
    </g>

    <!-- 底部装饰 -->
    <rect x="0" y="1020" width="1920" height="60" fill="#8B0000" fill-opacity="0.6"/>
    <text x="960" y="1060" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#FFFFFF" fill-opacity="0.8">
        {{ORGANIZATION}}
    </text>

</svg>
