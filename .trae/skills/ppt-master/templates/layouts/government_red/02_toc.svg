<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 目录页 - 重庆两江新区发改委风格 -->

    <defs>
        <!-- 顶部装饰渐变 -->
        <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 白色背景 -->
    <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

    <!-- 顶部渐变装饰线 -->
    <rect x="0" y="0" width="1920" height="9" fill="url(#topGrad)"/>

    <!-- 导航栏区域 -->
    <rect x="90" y="45" width="75" height="75" fill="#8B0000"/>
    <text x="128" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">目</text>
    <text x="195" y="98" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="42" font-weight="bold" fill="#1A1A1A">目 录</text>
    <text x="195" y="128" font-family="Arial, sans-serif" font-size="21" fill="#718096">CONTENTS</text>

    <!-- 左侧装饰竖线 -->
    <rect x="420" y="210" width="6" height="720" fill="#8B0000"/>
    <rect x="432" y="210" width="3" height="720" fill="#DAA520" fill-opacity="0.5"/>

    <!-- 目录项 - 第1章 -->
    <g>
        <rect x="465" y="240" width="60" height="60" fill="#8B0000"/>
        <text x="495" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">01</text>
        <text x="555" y="278" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_1_TITLE}}</text>
        <text x="555" y="315" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#718096">{{TOC_ITEM_1_DESC}}</text>
    </g>

    <!-- 目录项 - 第2章 -->
    <g>
        <rect x="465" y="375" width="60" height="60" fill="#8B0000"/>
        <text x="495" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">02</text>
        <text x="555" y="412" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_2_TITLE}}</text>
        <text x="555" y="450" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#718096">{{TOC_ITEM_2_DESC}}</text>
    </g>

    <!-- 目录项 - 第3章 -->
    <g>
        <rect x="465" y="510" width="60" height="60" fill="#8B0000"/>
        <text x="495" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">03</text>
        <text x="555" y="548" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_3_TITLE}}</text>
        <text x="555" y="585" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#718096">{{TOC_ITEM_3_DESC}}</text>
    </g>

    <!-- 目录项 - 第4章 -->
    <g>
        <rect x="465" y="645" width="60" height="60" fill="#8B0000"/>
        <text x="495" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">04</text>
        <text x="555" y="682" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_4_TITLE}}</text>
        <text x="555" y="720" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#718096">{{TOC_ITEM_4_DESC}}</text>
    </g>

    <!-- 目录项 - 第5章 -->
    <g>
        <rect x="465" y="780" width="60" height="60" fill="#8B0000"/>
        <text x="495" y="825" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">05</text>
        <text x="555" y="818" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="bold" fill="#1A1A1A">{{TOC_ITEM_5_TITLE}}</text>
        <text x="555" y="855" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#718096">{{TOC_ITEM_5_DESC}}</text>
    </g>

    <!-- 右侧装饰区域 -->
    <rect x="1320" y="240" width="480" height="660" fill="#F5F7FA" rx="12"/>
    <rect x="1320" y="240" width="9" height="660" fill="#003366"/>
    
    <!-- 右侧统计数据展示 -->
    <text x="1560" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="108" font-weight="bold" fill="#003366" fill-opacity="0.15">{{STAT_NUMBER_1}}</text>
    <text x="1560" y="480" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#4A5568">{{STAT_LABEL_1}}</text>
    
    <line x1="1380" y1="540" x2="1740" y2="540" stroke="#E4E7EB" stroke-width="2"/>
    
    <text x="1560" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#8B0000" fill-opacity="0.2">{{STAT_NUMBER_2}}</text>
    <text x="1560" y="720" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#4A5568">{{STAT_LABEL_2}}</text>

    <!-- 底部装饰线 -->
    <rect x="0" y="1074" width="1920" height="6" fill="#8B0000"/>

    <!-- 页码 -->
    <text x="960" y="1042" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#718096">{{PAGE_NUM}}</text>

</svg>
