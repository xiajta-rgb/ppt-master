<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 封面页 - 重庆两江新区发改委风格 -->

    <defs>
        <!-- 深蓝渐变背景 -->
        <linearGradient id="coverBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#003366;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#002244;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#001a33;stop-opacity:1" />
        </linearGradient>
        <!-- 顶部装饰渐变 -->
        <linearGradient id="topDecoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 背景 -->
    <rect x="0" y="0" width="1920" height="1080" fill="url(#coverBgGrad)" />

    <!-- 装饰元素 - 几何图案 -->
    <circle cx="1800" cy="150" r="450" fill="#FFFFFF" fill-opacity="0.02" />
    <circle cx="120" cy="975" r="300" fill="#FFFFFF" fill-opacity="0.02" />
    <circle cx="960" cy="540" r="675" fill="#FFFFFF" fill-opacity="0.015" />

    <!-- 网格装饰线 -->
    <line x1="0" y1="270" x2="1920" y2="270" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05" />
    <line x1="0" y1="810" x2="1920" y2="810" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05" />
    <line x1="480" y1="0" x2="480" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05" />
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05" />

    <!-- 顶部金色装饰线 -->
    <rect x="0" y="0" width="1920" height="9" fill="url(#topDecoGrad)" />

    <!-- 左侧装饰竖条 -->
    <rect x="90" y="300" width="9" height="480" fill="#DAA520" fill-opacity="0.6" />

    <!-- 主标题区域 -->
    <text x="960" y="450" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="78" font-weight="bold" fill="#FFFFFF">
        {{TITLE}}
    </text>

    <!-- 副标题 -->
    <text x="960" y="555" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" fill="#FFFFFF" fill-opacity="0.85">
        {{SUBTITLE}}
    </text>

    <!-- 分隔线 -->
    <line x1="660" y1="630" x2="1260" y2="630" stroke="#DAA520" stroke-width="3" stroke-opacity="0.8" />

    <!-- 单位名称（中文） -->
    <text x="960" y="735" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" fill="#FFFFFF" fill-opacity="0.9">
        {{AUTHOR}}
    </text>

    <!-- 单位名称（英文） -->
    <text x="960" y="795" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" fill-opacity="0.6">
        {{AUTHOR_EN}}
    </text>

    <!-- 日期 -->
    <text x="960" y="930" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="27" fill="#FFFFFF" fill-opacity="0.7">
        {{DATE}}
    </text>

    <!-- 底部装饰区域 -->
    <rect x="0" y="1035" width="1920" height="45" fill="#8B0000" fill-opacity="0.8" />
    <text x="960" y="1068" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#FFFFFF" fill-opacity="0.8">
        {{ORGANIZATION}}
    </text>

</svg>
