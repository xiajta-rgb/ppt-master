<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 内容页 - 重庆两江新区发改委风格 -->

    <defs>
        <!-- 顶部装饰渐变 -->
        <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 白色背景 -->
    <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" />

    <!-- 顶部渐变装饰线 -->
    <rect x="0" y="0" width="1920" height="9" fill="url(#topGrad)" />

    <!-- 页眉导航栏 -->
    <!-- 章节序号块 - 政府红正方形 -->
    <rect x="90" y="45" width="75" height="75" fill="#8B0000" />
    <text x="128" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">{{CHAPTER_NUM}}</text>

    <!-- 页面标题 -->
    <text x="195" y="98" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="42" font-weight="bold" fill="#1A1A1A">{{PAGE_TITLE}}</text>

    <!-- 右上角单位标识 -->
    <text x="1830" y="82" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#718096">{{ORG_SHORT}}</text>
    <rect x="1660" y="90" width="170" height="3" fill="#8B0000" fill-opacity="0.3"/>

    <!-- 内容区域 - 灵活布局，由 Executor 根据实际内容自由设计 -->
    <!-- 可使用的布局模式：
       - 单栏文字列表
       - 左右双栏对比
       - 卡片式分块（如 2×2 四宫格）
       - 图文混排（左图右文、上图下文、通栏图）
       - 表格
       - 时间轴
       - 流程图
  -->
    <rect x="90" y="150" width="1740" height="840" fill="none" stroke="#E4E7EB" stroke-width="3" stroke-dasharray="8,8" />
    <text x="960" y="540" text-anchor="middle" fill="#CBD5E1" font-size="27" font-family="Microsoft YaHei, sans-serif">
        {{CONTENT_AREA}}
    </text>
    <text x="960" y="592" text-anchor="middle" fill="#CBD5E1" font-size="21" font-family="Microsoft YaHei, sans-serif">
        (由 Executor 根据实际内容自由布局)
    </text>

    <!-- 常用设计元素参考 -->
    <!-- 色块容器: <rect fill="#F5F7FA" rx="12"/> -->
    <!-- 强调色块: <rect fill="#8B0000"/> -->
    <!-- 辅助色块: <rect fill="#003366"/> -->
    <!-- 圆点列表: <circle r="8" fill="#8B0000"/> -->
    <!-- 分隔线: <line stroke="#E4E7EB" stroke-width="2"/> -->
    <!-- 金色点缀: <rect fill="#DAA520"/> -->

    <!-- 底部装饰线 -->
    <rect x="0" y="1074" width="1920" height="6" fill="#8B0000" />

    <!-- 页码 -->
    <text x="960" y="1042" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#718096">{{PAGE_NUM}}</text>

    <!-- 底部单位名称 -->
    <text x="1830" y="1042" text-anchor="end" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#718096" fill-opacity="0.6">{{ORG_SHORT}}</text>

</svg>
