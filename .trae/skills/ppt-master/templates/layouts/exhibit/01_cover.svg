<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#0D1117"/>
  
  <!-- 顶部渐变条 -->
  <defs>
    <linearGradient id="top-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1920" height="9" fill="url(#top-gradient)"/>
  
  <!-- 左侧金色装饰线 -->
  <line x1="180" y1="360" x2="180" y2="720" stroke="#D4AF37" stroke-width="6"/>
  
  <!-- 主标题 -->
  <text x="240" y="480" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="84" font-weight="bold" letter-spacing="3">
    {{TITLE}}
  </text>
  
  <!-- 副标题 -->
  <text x="240" y="570" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="36" letter-spacing="2">
    {{SUBTITLE}}
  </text>
  
  <!-- 项目编号 -->
  <text x="240" y="660" fill="#6366F1" font-family="Arial, sans-serif" font-size="24" letter-spacing="3">
    {{PROJECT_ID}}
  </text>
  
  <!-- 右侧网格装饰 -->
  <g stroke="#1E40AF" stroke-width="0.8" stroke-opacity="0.3">
    <line x1="1200" y1="225" x2="1200" y2="825"/>
    <line x1="1350" y1="225" x2="1350" y2="825"/>
    <line x1="1500" y1="225" x2="1500" y2="825"/>
    <line x1="1650" y1="225" x2="1650" y2="825"/>
    <line x1="1125" y1="375" x2="1725" y2="375"/>
    <line x1="1125" y1="525" x2="1725" y2="525"/>
    <line x1="1125" y1="675" x2="1725" y2="675"/>
  </g>
  
  <!-- 底部信息 -->
  <line x1="180" y1="930" x2="1740" y2="930" stroke="#1F2937" stroke-width="2"/>
  <text x="180" y="1005" fill="#6B7280" font-family="Arial, sans-serif" font-size="21">{{DATE}}</text>
  <text x="960" y="1005" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="18">CONFIDENTIAL</text>
  <text x="1740" y="1005" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="21">{{AUTHOR}}</text>
</svg>
