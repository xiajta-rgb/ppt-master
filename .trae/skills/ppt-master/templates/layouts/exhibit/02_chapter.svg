<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#0D1117"/>
  
  <!-- 顶部渐变条 -->
  <defs>
    <linearGradient id="top-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1920" height="9" fill="url(#top-gradient)"/>
  
  <!-- 左侧金色装饰线 -->
  <line x1="150" y1="420" x2="150" y2="660" stroke="#D4AF37" stroke-width="6"/>
  
  <!-- 章节编号（大号背景） -->
  <text x="210" y="570" fill="#FFFFFF" fill-opacity="0.08" font-family="Arial, sans-serif" font-size="270" font-weight="bold">
    {{CHAPTER_NUM}}
  </text>
  
  <!-- 章节标题 -->
  <text x="240" y="540" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="72" font-weight="bold" letter-spacing="3">
    {{CHAPTER_TITLE}}
  </text>
  
  <!-- 章节描述 -->
  <text x="240" y="630" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="30">
    {{CHAPTER_DESC}}
  </text>
  
  <!-- 右侧网格装饰 -->
  <g stroke="#1E40AF" stroke-width="0.8" stroke-opacity="0.2">
    <line x1="1275" y1="300" x2="1275" y2="780"/>
    <line x1="1425" y1="300" x2="1425" y2="780"/>
    <line x1="1575" y1="300" x2="1575" y2="780"/>
    <line x1="1725" y1="300" x2="1725" y2="780"/>
    <line x1="1200" y1="390" x2="1800" y2="390"/>
    <line x1="1200" y1="540" x2="1800" y2="540"/>
    <line x1="1200" y1="690" x2="1800" y2="690"/>
  </g>
</svg>
