<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  
  <!-- 顶部渐变条 -->
  <defs>
    <linearGradient id="top-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1920" height="6" fill="url(#top-gradient)"/>
  
  <!-- ==================== 核心观点区域 (Exhibit/Takeaway) ==================== -->
  <rect x="60" y="30" width="1800" height="90" fill="#0D1117"/>
  <rect x="60" y="30" width="9" height="90" fill="#D4AF37"/>
  <text x="90" y="87" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="27" font-weight="bold" letter-spacing="2">
    {{KEY_MESSAGE}}
  </text>
  
  <!-- ==================== 内容区域 ==================== -->
  <!-- 
    AI 灵活布局区
    可用空间: x=40, y=100, width=1200, height=520
  -->
  <rect x="60" y="150" width="1800" height="780" fill="#FFFFFF" rx="6"/>
  <rect x="60" y="150" width="1800" height="780" fill="none" stroke="#E5E7EB" stroke-width="2" rx="6" stroke-dasharray="8,4"/>
  <text x="960" y="555" text-anchor="middle" fill="#D1D5DB" font-family="Arial, sans-serif" font-size="21">
    {{CONTENT_AREA}}
  </text>
  
  <!-- ==================== 页脚区域 ==================== -->
  <line x1="60" y1="990" x2="1860" y2="990" stroke="#E5E7EB" stroke-width="2"/>
  <text x="60" y="1042" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="15">Source: {{SOURCE}}</text>
  <text x="960" y="1042" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="15">CONFIDENTIAL</text>
  <text x="1830" y="1042" text-anchor="end" fill="#6B7280" font-family="Arial, sans-serif" font-size="18">{{PAGE_NUM}}</text>
</svg>
