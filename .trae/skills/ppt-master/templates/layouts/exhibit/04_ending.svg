<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#0D1117"/>
  
  <!-- 顶部渐变条 -->
  <defs>
    <linearGradient id="top-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1920" height="9" fill="url(#top-gradient)"/>
  
  <!-- 网格装饰背景 -->
  <g stroke="#1E40AF" stroke-width="0.8" stroke-opacity="0.1">
    <line x1="300" y1="150" x2="300" y2="930"/>
    <line x1="600" y1="150" x2="600" y2="930"/>
    <line x1="900" y1="150" x2="900" y2="930"/>
    <line x1="1200" y1="150" x2="1200" y2="930"/>
    <line x1="1500" y1="150" x2="1500" y2="930"/>
    <line x1="150" y1="300" x2="1770" y2="300"/>
    <line x1="150" y1="540" x2="1770" y2="540"/>
    <line x1="150" y1="780" x2="1770" y2="780"/>
  </g>
  
  <!-- 感谢语 -->
  <text x="960" y="420" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="84" font-weight="bold" letter-spacing="6">
    {{THANK_YOU}}
  </text>
  
  <!-- 金色分隔线 -->
  <line x1="750" y1="480" x2="1170" y2="480" stroke="#D4AF37" stroke-width="4"/>
  
  <!-- 口号 -->
  <text x="960" y="570" text-anchor="middle" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="33" letter-spacing="3">
    {{ENDING_SUBTITLE}}
  </text>
  
  <!-- 联系信息卡片 -->
  <rect x="660" y="660" width="600" height="150" fill="#1F2937" rx="12"/>
  <text x="960" y="735" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    {{CONTACT_NAME}}
  </text>
  <text x="960" y="780" text-anchor="middle" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="21">
    {{CONTACT_INFO}}
  </text>
  
  <!-- 底部 -->
  <line x1="300" y1="960" x2="1620" y2="960" stroke="#1F2937" stroke-width="2"/>
  <text x="960" y="1020" text-anchor="middle" fill="#D4AF37" font-family="Arial, sans-serif" font-size="16">
    CONFIDENTIAL · {{COPYRIGHT}}
  </text>
</svg>
