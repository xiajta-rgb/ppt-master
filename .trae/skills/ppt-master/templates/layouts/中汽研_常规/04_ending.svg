<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 结束页 - 中汽研风格 -->

    <!-- 深蓝色背景 -->
    <rect x="0" y="0" width="1920" height="1080" fill="#004098" />

    <!-- 装饰元素 - 几何图案（低透明度圆形） -->
    <circle cx="150" cy="150" r="300" fill="#FFFFFF" fill-opacity="0.03" />
    <circle cx="1800" cy="900" r="450" fill="#FFFFFF" fill-opacity="0.03" />
    <circle cx="960" cy="540" r="600" fill="#FFFFFF" fill-opacity="0.02" />

    <!-- 顶部装饰线 -->
    <rect x="0" y="0" width="1920" height="6" fill="#FFFFFF" fill-opacity="0.3" />

    <!-- 网格装饰 - 营造专业氛围 -->
    <line x1="0" y1="270" x2="1920" y2="270" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05" />
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05" />
    <line x1="0" y1="810" x2="1920" y2="810" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05" />
    <line x1="480" y1="0" x2="480" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05" />
    <line x1="960" y1="0" x2="960" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05" />
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05" />

    <!-- 大型Logo - 居中 -->
    <image href="../images/{{LOGO_LARGE}}" x="516" y="240" width="888" height="357"
        preserveAspectRatio="xMidYMid meet" />

    <!-- 感谢语（中文） -->
    <text x="960" y="720" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="84"
        font-weight="bold" fill="#FFFFFF">
        {{THANK_YOU}}
    </text>

    <!-- 感谢语（英文） -->
    <text x="960" y="795" text-anchor="middle" font-family="Arial, Georgia, serif" font-size="36" fill="#FFFFFF"
        fill-opacity="0.7">
        {{THANK_YOU_EN}}
    </text>

    <!-- 分隔线 -->
    <line x1="810" y1="840" x2="1110" y2="840" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" />

    <!-- 单位信息（中文） -->
    <text x="960" y="915" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#FFFFFF"
        fill-opacity="0.85">
        {{CONTACT_INFO}}
    </text>

    <!-- 单位信息（英文） -->
    <text x="960" y="960" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#FFFFFF"
        fill-opacity="0.6">
        {{AUTHOR}}
    </text>

    <!-- 底部信息区 -->
    <rect x="0" y="1020" width="1920" height="60" fill="#FFFFFF" fill-opacity="0.1" />
    <text x="960" y="1060" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#FFFFFF"
        fill-opacity="0.6">
        {{ENDING_SUBTITLE}}
    </text>

</svg>
