<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 章节页 - 中汽研风格 -->

    <defs>
        <!-- 深蓝背景渐变 -->
        <linearGradient id="gradChapter" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#004098;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#002A55;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#gradChapter)"/>

    <!-- 装饰元素 - 几何图案 -->
    <circle cx="1800" cy="150" r="300" fill="#FFFFFF" fill-opacity="0.03"/>
    <circle cx="150" cy="930" r="375" fill="#FFFFFF" fill-opacity="0.03"/>

    <!-- 水平装饰线 -->
    <line x1="150" y1="540" x2="1770" y2="540" stroke="white" stroke-width="2" stroke-opacity="0.1"/>

    <!-- 章节内容 -->
    <g transform="translate(960, 540)">
        <!-- 章节编号 - 大号半透明背景 -->
        <text x="0" y="-60" text-anchor="middle" font-family="Arial" font-size="180" font-weight="bold" fill="white" fill-opacity="0.08">
            0{{CHAPTER_NUM}}
        </text>
        
        <!-- 装饰方块 -->
        <rect x="-60" y="15" width="120" height="9" fill="#FFFFFF"/>
        
        <!-- 章节标题 -->
        <text x="0" y="120" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="72" font-weight="bold" fill="white">
            {{CHAPTER_TITLE}}
        </text>
        
        <!-- 英文标题/副标题 -->
        <text x="0" y="195" text-anchor="middle" font-family="Arial" font-size="36" fill="#FFFFFF" fill-opacity="0.7" letter-spacing="3">
            {{CHAPTER_SUBTITLE}}
        </text>
    </g>

    <!-- 底部装饰线 -->
    <rect x="0" y="1074" width="1920" height="6" fill="#FFFFFF" fill-opacity="0.3"/>

</svg>
