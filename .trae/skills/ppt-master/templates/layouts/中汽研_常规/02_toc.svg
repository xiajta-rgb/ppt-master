<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 目录页 - 中汽研风格 -->
  
    <!-- 白色背景 -->
    <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>
  
    <!-- 顶部深蓝色装饰线 -->
    <rect x="0" y="0" width="1920" height="6" fill="#004098"/>
  
    <!-- 导航栏区域 -->
    <rect x="90" y="45" width="75" height="75" fill="#004098"/>
    <text x="128" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">目</text>
    <text x="195" y="98" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="42" font-weight="bold" fill="#333333">目 录</text>
    <image href="../images/{{LOGO_HEADER}}" x="1660" y="45" width="170" height="75" preserveAspectRatio="xMidYMid meet"/>
  
    <!-- 左侧装饰竖线 -->
    <rect x="450" y="210" width="6" height="720" fill="#004098"/>
  
    <!-- 目录项 - 第1章 -->
    <g>
        <text x="495" y="292" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#004098">01</text>
        <text x="578" y="292" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#004098">||</text>
        <text x="645" y="292" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#333333">{{TOC_ITEM_1_TITLE}}</text>
        <text x="645" y="342" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#666666">{{TOC_ITEM_1_DESC}}</text>
    </g>
  
    <!-- 目录项 - 第2章 -->
    <g>
        <text x="495" y="442" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#004098">02</text>
        <text x="578" y="442" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#004098">||</text>
        <text x="645" y="442" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#333333">{{TOC_ITEM_2_TITLE}}</text>
        <text x="645" y="492" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#666666">{{TOC_ITEM_2_DESC}}</text>
    </g>
  
    <!-- 目录项 - 第3章 -->
    <g>
        <text x="495" y="592" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#004098">03</text>
        <text x="578" y="592" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#004098">||</text>
        <text x="645" y="592" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#333333">{{TOC_ITEM_3_TITLE}}</text>
        <text x="645" y="642" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#666666">{{TOC_ITEM_3_DESC}}</text>
    </g>
  
    <!-- 目录项 - 第4章 -->
    <g>
        <text x="495" y="742" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#004098">04</text>
        <text x="578" y="742" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#004098">||</text>
        <text x="645" y="742" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#333333">{{TOC_ITEM_4_TITLE}}</text>
        <text x="645" y="792" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#666666">{{TOC_ITEM_4_DESC}}</text>
    </g>
  
    <!-- 目录项 - 第5章 -->
    <g>
        <text x="495" y="892" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#004098">05</text>
        <text x="578" y="892" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#004098">||</text>
        <text x="645" y="892" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#333333">{{TOC_ITEM_5_TITLE}}</text>
        <text x="645" y="942" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#666666">{{TOC_ITEM_5_DESC}}</text>
    </g>
  
    <!-- 右侧装饰元素（可选统计区） -->
    <rect x="1350" y="270" width="420" height="600" fill="#F5F5F5" fill-opacity="0.5" rx="12"/>
    <text x="1560" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="180" font-weight="bold" fill="#004098" fill-opacity="0.1">{{STAT_NUMBER_1}}</text>
    <text x="1560" y="600" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#666666">{{STAT_LABEL_1}}</text>
    <text x="1560" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#004098" fill-opacity="0.15">{{STAT_NUMBER_2}}</text>
    <text x="1560" y="720" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#666666">{{STAT_LABEL_2}}</text>
  
    <!-- 底部装饰线 -->
    <rect x="0" y="1074" width="1920" height="6" fill="#004098"/>
  
    <!-- 页码 -->
    <text x="1830" y="1058" text-anchor="end" font-family="Arial, sans-serif" font-size="21" fill="#999999">{{PAGE_NUM}}</text>
  
</svg>
