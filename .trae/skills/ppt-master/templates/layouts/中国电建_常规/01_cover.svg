<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
    <!-- 模板: 封面页 - 中国电建经典风格 -->

    <defs>
        <!-- 深蓝渐变背景 -->
        <linearGradient id="coverBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00418D;stop-opacity:1" />
            <stop offset="40%" style="stop-color:#003270;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#001F45;stop-opacity:1" />
        </linearGradient>
        <!-- 顶部装饰渐变 -->
        <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00418D;stop-opacity:1" />
        </linearGradient>
        <!-- 左侧装饰渐变 -->
        <linearGradient id="sideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#0066CC;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4A90D9;stop-opacity:1" />
        </linearGradient>
        <!-- 斜线图案 - 工程感 -->
        <pattern id="diagLines" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="60" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.03"/>
        </pattern>
    </defs>

    <!-- 背景 -->
    <rect x="0" y="0" width="1920" height="1080" fill="url(#coverBgGrad)" />
    
    <!-- 工程感斜线纹理 -->
    <rect x="0" y="0" width="1920" height="1080" fill="url(#diagLines)" />

    <!-- 装饰元素 - 几何图案 -->
    <circle cx="1725" cy="225" r="375" fill="#FFFFFF" fill-opacity="0.02" />
    <circle cx="1800" cy="150" r="225" fill="#4A90D9" fill-opacity="0.04" />
    <circle cx="150" cy="930" r="300" fill="#FFFFFF" fill-opacity="0.02" />

    <!-- 对角线装饰 -->
    <line x1="1200" y1="0" x2="1920" y2="720" stroke="#4A90D9" stroke-width="2" stroke-opacity="0.1" />
    <line x1="1275" y1="0" x2="1920" y2="645" stroke="#4A90D9" stroke-width="2" stroke-opacity="0.08" />
    <line x1="1350" y1="0" x2="1920" y2="570" stroke="#4A90D9" stroke-width="2" stroke-opacity="0.06" />

    <!-- 顶部渐变装饰线 -->
    <rect x="0" y="0" width="1920" height="9" fill="url(#topGrad)" />

    <!-- 左侧装饰竖条组 -->
    <rect x="0" y="225" width="15" height="630" fill="url(#sideGrad)" />
    <rect x="27" y="270" width="6" height="540" fill="#4A90D9" fill-opacity="0.5" />
    <rect x="42" y="315" width="3" height="450" fill="#4A90D9" fill-opacity="0.3" />

    <!-- 企业英文名称 - 顶部 -->
    <text x="1830" y="75" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" fill-opacity="0.6" letter-spacing="6">
        POWERCHINA
    </text>

    <!-- 主标题区域背景 -->
    <rect x="0" y="420" width="1425" height="240" fill="#000000" fill-opacity="0.2" />
    <rect x="0" y="420" width="15" height="240" fill="#C41E3A" />

    <!-- 主标题 -->
    <text x="90" y="525" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">
        {{TITLE}}
    </text>

    <!-- 副标题 -->
    <text x="90" y="615" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" fill="#4A90D9">
        {{SUBTITLE}}
    </text>

    <!-- 分隔线 -->
    <line x1="90" y1="720" x2="450" y2="720" stroke="#4A90D9" stroke-width="3" />
    <line x1="450" y1="720" x2="600" y2="720" stroke="#C41E3A" stroke-width="3" />

    <!-- 汇报单位 -->
    <text x="90" y="795" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#FFFFFF" fill-opacity="0.9">
        {{AUTHOR}}
    </text>

    <!-- 汇报人 -->
    <text x="90" y="848" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#FFFFFF" fill-opacity="0.7">
        汇报人：{{PRESENTER}}
    </text>

    <!-- 日期 -->
    <text x="90" y="900" font-family="Arial, Microsoft YaHei, sans-serif" font-size="24" fill="#4A90D9" fill-opacity="0.8">
        {{DATE}}
    </text>

    <!-- 底部装饰区域 -->
    <rect x="0" y="1035" width="1920" height="45" fill="#002B5C" />
    <rect x="0" y="1035" width="300" height="45" fill="#C41E3A" />
    
    <!-- 底部企业名称 -->
    <text x="960" y="1068" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#FFFFFF" fill-opacity="0.8">
        中国电力建设集团有限公司  POWERCHINA
    </text>

</svg>
