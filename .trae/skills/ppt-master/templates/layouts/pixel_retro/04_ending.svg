<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 模板: 结束页 - 像素复古风格 -->
  
  <defs>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowYellow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- 深空黑背景 -->
  <rect width="1920" height="1080" fill="#0D1117" />
  
  <!-- 顶部装饰线（加粗） -->
  <rect x="0" y="0" width="1920" height="6" fill="#39FF14" fill-opacity="0.8" />
  <rect x="0" y="6" width="1920" height="3" fill="#39FF14" fill-opacity="0.4" />
  
  <!-- 背景扫描线 -->
  <line x1="0" y1="180" x2="1920" y2="180" stroke="#39FF14" stroke-width="2" stroke-opacity="0.05" />
  <line x1="0" y1="360" x2="1920" y2="360" stroke="#39FF14" stroke-width="2" stroke-opacity="0.05" />
  <line x1="0" y1="540" x2="1920" y2="540" stroke="#39FF14" stroke-width="2" stroke-opacity="0.05" />
  <line x1="0" y1="720" x2="1920" y2="720" stroke="#39FF14" stroke-width="2" stroke-opacity="0.05" />
  <line x1="0" y1="900" x2="1920" y2="900" stroke="#39FF14" stroke-width="2" stroke-opacity="0.05" />
  
  <!-- 主标题（霓虹发光） -->
  <text x="960" y="120" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="72" font-weight="bold" fill="#39FF14" filter="url(#glowGreen)">
    🎯 {{THANK_YOU}}
  </text>
  <text x="960" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="30" fill="#8B949E">
    {{END_SUBTITLE}}
  </text>
  
  <!-- 三栏总结卡片 -->
  
  <!-- 卡片 1 -->
  <g transform="translate(90, 240)">
    <rect x="0" y="0" width="570" height="420" fill="#161B22" stroke="#39FF14" stroke-width="4" />
    <!-- 序号方块 -->
    <rect x="0" y="0" width="90" height="90" fill="#39FF14" />
    <text x="45" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="48" font-weight="bold" fill="#0D1117">1</text>
    <!-- 标题 -->
    <text x="120" y="60" font-family="Consolas, monospace" font-size="33" font-weight="bold" fill="#39FF14">{{SUMMARY_1_TITLE}}</text>
    <!-- 分隔线 -->
    <rect x="30" y="105" width="510" height="3" fill="#30363D" />
    <!-- 内容 -->
    <text x="45" y="165" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="27" fill="#E6EDF3">{{SUMMARY_1_LINE_1}}</text>
    <text x="45" y="218" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="27" fill="#E6EDF3">{{SUMMARY_1_LINE_2}}</text>
    <text x="45" y="270" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="27" fill="#E6EDF3">{{SUMMARY_1_LINE_3}}</text>
    <!-- 进度条 -->
    <rect x="45" y="330" width="480" height="38" fill="#0D1117" stroke="#30363D" stroke-width="2" />
    <rect x="48" y="333" width="432" height="32" fill="#39FF14" fill-opacity="0.8" />
    <text x="450" y="358" font-family="Consolas, monospace" font-size="21" fill="#0D1117" font-weight="bold">90%</text>
    <text x="45" y="390" font-family="Consolas, monospace" font-size="18" fill="#8B949E">{{SUMMARY_1_STAT}}</text>
  </g>
  
  <!-- 卡片 2 -->
  <g transform="translate(690, 240)">
    <rect x="0" y="0" width="570" height="420" fill="#161B22" stroke="#00D4FF" stroke-width="4" />
    <rect x="0" y="0" width="90" height="90" fill="#00D4FF" />
    <text x="45" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="48" font-weight="bold" fill="#0D1117">2</text>
    <text x="120" y="60" font-family="Consolas, monospace" font-size="33" font-weight="bold" fill="#00D4FF">{{SUMMARY_2_TITLE}}</text>
    <rect x="30" y="105" width="510" height="3" fill="#30363D" />
    <!-- 功能列表 -->
    <g transform="translate(45, 135)">
      <rect x="0" y="0" width="480" height="52" fill="#0D1117" stroke="#30363D" stroke-width="2" />
      <text x="22" y="36" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="24" fill="#E6EDF3">{{FEATURE_1}}</text>
      
      <rect x="0" y="63" width="480" height="52" fill="#0D1117" stroke="#30363D" stroke-width="2" />
      <text x="22" y="99" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="24" fill="#E6EDF3">{{FEATURE_2}}</text>
      
      <rect x="0" y="126" width="480" height="52" fill="#0D1117" stroke="#30363D" stroke-width="2" />
      <text x="22" y="162" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="24" fill="#E6EDF3">{{FEATURE_3}}</text>
      
      <rect x="0" y="189" width="480" height="52" fill="#0D1117" stroke="#30363D" stroke-width="2" />
      <text x="22" y="225" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="24" fill="#E6EDF3">{{FEATURE_4}}</text>
    </g>
  </g>
  
  <!-- 卡片 3 -->
  <g transform="translate(1290, 240)">
    <rect x="0" y="0" width="570" height="420" fill="#161B22" stroke="#FF2E97" stroke-width="4" />
    <rect x="0" y="0" width="90" height="90" fill="#FF2E97" />
    <text x="45" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="48" font-weight="bold" fill="#0D1117">3</text>
    <text x="120" y="60" font-family="Consolas, monospace" font-size="33" font-weight="bold" fill="#FF2E97">{{SUMMARY_3_TITLE}}</text>
    <rect x="30" y="105" width="510" height="3" fill="#30363D" />
    <!-- 对比表格 -->
    <g transform="translate(45, 135)">
      <!-- 表头 -->
      <rect x="0" y="0" width="232" height="52" fill="#39FF14" fill-opacity="0.2" />
      <text x="116" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#39FF14" font-weight="bold">{{COMPARE_A}}</text>
      <rect x="248" y="0" width="232" height="52" fill="#FF2E97" fill-opacity="0.2" />
      <text x="363" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#FF2E97" font-weight="bold">{{COMPARE_B}}</text>
      <!-- 行 1 -->
      <rect x="0" y="63" width="232" height="52" fill="#0D1117" stroke="#30363D" stroke-width="2" />
      <text x="116" y="99" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="21" fill="#E6EDF3">{{ROW_1_A}}</text>
      <rect x="248" y="63" width="232" height="52" fill="#0D1117" stroke="#30363D" stroke-width="2" />
      <text x="363" y="99" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="21" fill="#E6EDF3">{{ROW_1_B}}</text>
      <!-- 行 2 -->
      <rect x="0" y="126" width="232" height="52" fill="#0D1117" stroke="#30363D" stroke-width="2" />
      <text x="116" y="162" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="21" fill="#E6EDF3">{{ROW_2_A}}</text>
      <rect x="248" y="126" width="232" height="52" fill="#0D1117" stroke="#30363D" stroke-width="2" />
      <text x="363" y="162" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="21" fill="#E6EDF3">{{ROW_2_B}}</text>
      <!-- 行 3 -->
      <rect x="0" y="189" width="232" height="52" fill="#0D1117" stroke="#30363D" stroke-width="2" />
      <text x="116" y="225" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="21" fill="#E6EDF3">{{ROW_3_A}}</text>
      <rect x="248" y="189" width="232" height="52" fill="#0D1117" stroke="#30363D" stroke-width="2" />
      <text x="363" y="225" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="21" fill="#E6EDF3">{{ROW_3_B}}</text>
    </g>
  </g>
  
  <!-- 结束语卡片 -->
  <g transform="translate(90, 720)">
    <rect x="0" y="0" width="1740" height="180" fill="#161B22" stroke="#FFD700" stroke-width="4" />
    <!-- 顶部高亮条 -->
    <rect x="0" y="0" width="1740" height="75" fill="#FFD700" fill-opacity="0.1" />
    <text x="870" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="36" fill="#FFD700" filter="url(#glowYellow)">
      🎮 {{CTA_TEXT}}
    </text>
    <!-- 说明文字 -->
    <text x="870" y="120" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="27" fill="#E6EDF3">
      {{CONTACT_INFO}}
    </text>
    <!-- 按钮组 -->
    <g transform="translate(600, 135)">
      <rect x="0" y="0" width="270" height="38" fill="#39FF14" stroke="#39FF14" stroke-width="3" />
      <text x="135" y="27" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#0D1117" font-weight="bold">GAME SAVED ✓</text>
    </g>
    <g transform="translate(900, 135)">
      <rect x="0" y="0" width="270" height="38" fill="#0D1117" stroke="#39FF14" stroke-width="3" />
      <text x="135" y="27" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#39FF14">CONTINUE →</text>
    </g>
  </g>
  
  <!-- 底部装饰线 -->
  <rect x="0" y="1068" width="1920" height="6" fill="#39FF14" fill-opacity="0.4" />
  <rect x="0" y="1074" width="1920" height="6" fill="#39FF14" fill-opacity="0.8" />
  
  <!-- 左下角像素装饰 -->
  <rect x="60" y="960" width="18" height="18" fill="#39FF14" />
  <rect x="84" y="960" width="18" height="18" fill="#39FF14" fill-opacity="0.6" />
  <rect x="108" y="960" width="18" height="18" fill="#39FF14" fill-opacity="0.3" />
  
  <!-- 右下角像素装饰 -->
  <rect x="1794" y="960" width="18" height="18" fill="#FF2E97" fill-opacity="0.3" />
  <rect x="1818" y="960" width="18" height="18" fill="#FF2E97" fill-opacity="0.6" />
  <rect x="1842" y="960" width="18" height="18" fill="#FF2E97" />
  
  <!-- 页码 -->
  <text x="90" y="1035" font-family="Consolas, monospace" font-size="21" fill="#8B949E">{{PAGE_NUM}}/{{TOTAL_PAGES}}</text>
  
  <!-- 结束标识 -->
  <text x="1830" y="1035" text-anchor="end" font-family="Consolas, monospace" font-size="21" fill="#39FF14">
    THE END - Thank You! 🎉
  </text>

</svg>
