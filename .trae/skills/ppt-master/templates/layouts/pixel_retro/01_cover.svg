<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 模板: 封面页 - 像素复古风格 -->
  
  <defs>
    <!-- 霓虹绿发光效果 -->
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- 赛博粉发光效果 -->
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- 电光蓝发光效果 -->
    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- 深空黑背景 -->
  <rect width="1920" height="1080" fill="#0D1117" />
  
  <!-- 扫描线网格背景（低透明度） -->
  <line x1="0" y1="90" x2="1920" y2="90" stroke="#39FF14" stroke-width="2" stroke-opacity="0.1" />
  <line x1="0" y1="180" x2="1920" y2="180" stroke="#39FF14" stroke-width="2" stroke-opacity="0.1" />
  <line x1="0" y1="270" x2="1920" y2="270" stroke="#39FF14" stroke-width="2" stroke-opacity="0.1" />
  <line x1="0" y1="810" x2="1920" y2="810" stroke="#39FF14" stroke-width="2" stroke-opacity="0.1" />
  <line x1="0" y1="900" x2="1920" y2="900" stroke="#39FF14" stroke-width="2" stroke-opacity="0.1" />
  <line x1="0" y1="990" x2="1920" y2="990" stroke="#39FF14" stroke-width="2" stroke-opacity="0.1" />
  <line x1="90" y1="0" x2="90" y2="1080" stroke="#39FF14" stroke-width="2" stroke-opacity="0.1" />
  <line x1="1830" y1="0" x2="1830" y2="1080" stroke="#39FF14" stroke-width="2" stroke-opacity="0.1" />
  
  <!-- 顶部装饰线（霓虹双线） -->
  <rect x="60" y="45" width="1800" height="12" fill="#39FF14" fill-opacity="0.8" />
  <rect x="60" y="63" width="1800" height="6" fill="#39FF14" fill-opacity="0.4" />
  
  <!-- 左上角像素装饰 -->
  <rect x="60" y="90" width="24" height="24" fill="#39FF14" />
  <rect x="90" y="90" width="24" height="24" fill="#39FF14" fill-opacity="0.6" />
  <rect x="120" y="90" width="24" height="24" fill="#39FF14" fill-opacity="0.3" />
  
  <!-- 右上角像素装饰 -->
  <rect x="1776" y="90" width="24" height="24" fill="#FF2E97" fill-opacity="0.3" />
  <rect x="1806" y="90" width="24" height="24" fill="#FF2E97" fill-opacity="0.6" />
  <rect x="1836" y="90" width="24" height="24" fill="#FF2E97" />
  
  <!-- 中央像素风控制台图形 -->
  <g transform="translate(810, 210)">
    <!-- 控制台外壳 -->
    <rect x="0" y="0" width="300" height="120" fill="#161B22" stroke="#39FF14" stroke-width="4" rx="12" />
    <!-- 左侧按钮（绿色发光） -->
    <rect x="38" y="30" width="60" height="60" fill="#0D1117" stroke="#8B949E" stroke-width="3" rx="6" />
    <circle cx="68" cy="60" r="18" fill="#39FF14" filter="url(#glowGreen)" />
    <!-- 右侧按钮（粉色方块） -->
    <rect x="202" y="30" width="60" height="60" fill="#0D1117" stroke="#8B949E" stroke-width="3" rx="6" />
    <rect x="220" y="48" width="24" height="24" fill="#FF2E97" />
    <!-- 中间连接条 -->
    <rect x="128" y="52" width="45" height="15" fill="#00D4FF" rx="3" />
  </g>
  
  <!-- 主标题（霓虹发光） -->
  <text x="960" y="480" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="78" font-weight="bold" fill="#39FF14" filter="url(#glowGreen)">
    {{TITLE}}
  </text>
  
  <!-- 副标题 -->
  <text x="960" y="570" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif" font-size="42" fill="#E6EDF3">
    {{SUBTITLE}}
  </text>
  
  <!-- 分隔线 -->
  <rect x="660" y="615" width="600" height="4" fill="#00D4FF" fill-opacity="0.8" />
  
  <!-- 功能按钮组 -->
  <g transform="translate(435, 690)">
    <rect x="0" y="0" width="210" height="60" fill="#161B22" stroke="#39FF14" stroke-width="3" />
    <text x="105" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#39FF14">💾 SAVE</text>
  </g>
  <g transform="translate(675, 690)">
    <rect x="0" y="0" width="210" height="60" fill="#161B22" stroke="#00D4FF" stroke-width="3" />
    <text x="105" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#00D4FF">🔀 BRANCH</text>
  </g>
  <g transform="translate(915, 690)">
    <rect x="0" y="0" width="210" height="60" fill="#161B22" stroke="#FF2E97" stroke-width="3" />
    <text x="105" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#FF2E97">⏪ REVERT</text>
  </g>
  <g transform="translate(1155, 690)">
    <rect x="0" y="0" width="210" height="60" fill="#161B22" stroke="#FFD700" stroke-width="3" />
    <text x="105" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="24" fill="#FFD700">🤝 COLLAB</text>
  </g>
  
  <!-- 底部提示语 -->
  <text x="960" y="870" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="36" fill="#8B949E">
    ▶ PRESS START TO LEARN ◀
  </text>
  
  <!-- 作者/单位信息 -->
  <text x="960" y="930" text-anchor="middle" font-family="-apple-system, Microsoft YaHei, sans-serif" font-size="27" fill="#8B949E">
    {{AUTHOR}}
  </text>
  
  <!-- 左下角像素装饰 -->
  <rect x="60" y="960" width="18" height="18" fill="#39FF14" />
  <rect x="84" y="960" width="18" height="18" fill="#39FF14" fill-opacity="0.6" />
  <rect x="108" y="960" width="18" height="18" fill="#39FF14" fill-opacity="0.3" />
  
  <!-- 右下角像素装饰 -->
  <rect x="1794" y="960" width="18" height="18" fill="#FF2E97" fill-opacity="0.3" />
  <rect x="1818" y="960" width="18" height="18" fill="#FF2E97" fill-opacity="0.6" />
  <rect x="1842" y="960" width="18" height="18" fill="#FF2E97" />
  
  <!-- 版本号 -->
  <text x="1800" y="990" text-anchor="end" font-family="Consolas, monospace" font-size="21" fill="#8B949E">
    {{VERSION}}
  </text>
  
  <!-- 页码 -->
  <text x="90" y="990" font-family="Consolas, monospace" font-size="21" fill="#8B949E">
    01/{{TOTAL_PAGES}}
  </text>
  
  <!-- 底部装饰线（霓虹双线） -->
  <rect x="60" y="1020" width="1800" height="6" fill="#39FF14" fill-opacity="0.4" />
  <rect x="60" y="1032" width="1800" height="12" fill="#39FF14" fill-opacity="0.8" />

</svg>
