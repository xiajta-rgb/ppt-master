<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 封面页 (Future Tech Style v3) -->

    <defs>
        <!-- 深邃夜空渐变 -->
        <radialGradient id="gradSky" cx="20%" cy="20%" r="90%" fx="20%" fy="20%">
            <stop offset="0%" style="stop-color:#002B52;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#001529;stop-opacity:1" />
        </radialGradient>
        
        <!-- 霓虹流光渐变 -->
        <linearGradient id="gradNeon" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#1890FF;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00E5FF;stop-opacity:1" />
        </linearGradient>

        <!-- 装饰线遮罩 -->
        <linearGradient id="gradLineFade" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0" />
            <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
            <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
        </linearGradient>
    </defs>

    <!-- 1. 背景层 -->
    <rect width="1920" height="1080" fill="url(#gradSky)" />
    
    <!-- 背部图片 (低透明度融合) -->
    <image href="../images/{{COVER_BG_IMAGE}}" x="0" y="0" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1920" height="1080" fill="url(#gradSky)" fill-opacity="0.7" />
    
    <!-- 2. 右侧几何装饰 (Tech Polymer) -->
    <g transform="translate(960, 0)">
        <!-- 抽象多边形/光束 -->
        <path d="M300,0 L960,0 L960,1080 L0,1080 Z" fill="#000000" fill-opacity="0.2" />
        <path d="M450,0 L960,0 L960,750 L150,1080 Z" fill="#1890FF" fill-opacity="0.05" />
        
        <!-- 定义一些浮动的科技线 -->
        <line x1="150" y1="150" x2="960" y2="150" stroke="url(#gradLineFade)" stroke-width="2" />
        <line x1="75" y1="300" x2="960" y2="300" stroke="url(#gradLineFade)" stroke-width="2" stroke-dasharray="4,4" />
        <line x1="300" y1="900" x2="960" y2="900" stroke="url(#gradLineFade)" stroke-width="3" />
    </g>

    <!-- 3. 左侧内容区 -->
    <g transform="translate(120, 0)">
        
        <!-- 顶部装饰短条 -->
        <rect x="0" y="120" width="90" height="9" fill="url(#gradNeon)" />

        <!-- Logo -->
        <image href="../images/{{LOGO_LARGE}}" x="0" y="180" width="330" height="120" preserveAspectRatio="xMidYMid meet" />

        <!-- 主标题 -->
        <text x="0" y="510" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="102" font-weight="bold" fill="#FFFFFF" letter-spacing="3">
            {{TITLE}}
        </text>

        <!-- 副标题 / 英文标题 -->
        <text x="0" y="615" font-family="Roboto, Arial, sans-serif" font-size="42" font-weight="normal" fill="#00E5FF" letter-spacing="2" opacity="0.9">
            {{SUBTITLE}}
        </text>

        <!-- 装饰性数据点缀 -->
        <g transform="translate(0, 690)">
            <text x="0" y="0" font-family="Arial" font-size="18" fill="#FFFFFF" fill-opacity="0.4">COORD: 39.90N, 116.40E</text>
            <rect x="270" y="-12" width="60" height="12" fill="#FFFFFF" fill-opacity="0.4" />
            <rect x="345" y="-12" width="15" height="12" fill="#00E5FF" fill-opacity="0.4" />
        </g>

        <!-- 底部信息卡片 -->
        <g transform="translate(0, 870)">
            <!-- 竖线装饰 -->
            <rect x="0" y="0" width="6" height="90" fill="url(#gradNeon)" />
            
            <g transform="translate(36, 15)">
                <text x="0" y="0" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#A0AEC0">汇报部门 / DEPT</text>
                <text x="0" y="45" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">{{AUTHOR}}</text>
            </g>
            
            <g transform="translate(450, 15)">
                 <text x="0" y="0" font-family="Microsoft YaHei, sans-serif" font-size="24" fill="#A0AEC0">日期 / DATE</text>
                <text x="0" y="45" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">{{DATE}}</text>
            </g>
        </g>
        
    </g>

</svg>
