<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 内容页 (Clean Tech Interface) -->

    <defs>
        <!-- 标题栏渐变 -->
         <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#001529;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- 背景: 极浅灰护眼色 -->
    <rect x="0" y="0" width="1920" height="1080" fill="#F7F9FC" />

    <!-- 顶栏 (悬浮感) -->
    <g transform="translate(0, 0)">
        <!-- 底色条 -->
        <rect x="0" y="0" width="1920" height="120" fill="url(#gradHeader)" />
        <rect x="0" y="120" width="1920" height="6" fill="#1890FF" />
        
        <!-- Logo -->
        <image href="../images/{{LOGO_HEADER}}" x="1650" y="22" width="180" height="75" preserveAspectRatio="xMidYMid meet"/>
        
        <!-- 页面标题 -->
        <text x="120" y="78" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF">
            {{PAGE_TITLE}}
        </text>
        
        <!-- 章节序号小标 -->
         <rect x="0" y="0" width="90" height="120" fill="#000000" fill-opacity="0.2" />
         <text x="45" y="78" text-anchor="middle" font-family="Arial" font-size="36" font-weight="bold" fill="#00E5FF">
            {{CHAPTER_NUM}}
         </text>
    </g>

    <!-- 内容区域 (Executor Area) -->
    <!-- 留白: Left 80, Right 80 -->
    <rect x="120" y="180" width="1680" height="810" fill="none" stroke="#E5E7EB" stroke-width="3" stroke-dasharray="8,8" rx="12"/>
    
    <text x="960" y="570" text-anchor="middle" fill="#9CA3AF" font-size="27" font-family="Microsoft YaHei, sans-serif">
        {{CONTENT_AREA}}
    </text>

    <!-- 右下角装饰水印 (Tech HUD) -->
    <g transform="translate(1770, 975)">
        <circle cx="0" cy="0" r="60" fill="none" stroke="#000000" stroke-opacity="0.1" stroke-width="3" />
        <path d="M-60,0 L60,0 M0,-60 L0,60" stroke="#000000" stroke-opacity="0.1" stroke-width="2" />
    </g>

    <!-- 页码 -->
    <text x="1800" y="1050" text-anchor="end" font-family="Arial, sans-serif" font-size="21" fill="#6B7280">
        {{PAGE_NUM}}
    </text>

</svg>
