<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080">
    <!-- 模板: 结束页 (Future Tech Ending) -->

    <defs>
        <!-- 主背景渐变 -->
        <radialGradient id="gradEnd" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:#003366;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#001529;stop-opacity:1" />
        </radialGradient>
        
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- 背景 -->
    <rect width="1920" height="1080" fill="url(#gradEnd)" />
    
    <!-- 装饰: 中心光圈 -->
    <g transform="translate(960, 540)">
        <circle r="375" fill="none" stroke="#1890FF" stroke-width="2" stroke-opacity="0.3" />
        <circle r="345" fill="none" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="40,20" />
        <circle r="420" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.05" />
    </g>

    <!-- 内容 -->
    <g transform="translate(960, 480)">
        
        <!-- Logo -->
        <image href="../images/{{LOGO_LARGE}}" x="-225" y="-210" width="450" height="150" preserveAspectRatio="xMidYMid meet"/>
        
        <!-- 感谢词 -->
        <text x="0" y="60" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="84" font-weight="bold" fill="#FFFFFF" letter-spacing="6">
            {{THANK_YOU}}
        </text>
        
        <text x="0" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#00E5FF" letter-spacing="3">
            {{THANK_YOU_EN}}
        </text>

        <!-- 联系信息卡 -->
         <rect x="-450" y="240" width="900" height="2" fill="#FFFFFF" fill-opacity="0.2" />
         
         <text x="0" y="300" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="30" fill="#FFFFFF" fill-opacity="0.9">
            {{AUTHOR}}
        </text>
        
        <text x="0" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#A0AEC0">
            {{CONTACT_INFO}}
        </text>
        
    </g>

    <!-- 底部版权 -->
    <text x="960" y="1020" text-anchor="middle" font-family="Arial" font-size="18" fill="#FFFFFF" opacity="0.3">
        {{COPYRIGHT}}
    </text>

</svg>
