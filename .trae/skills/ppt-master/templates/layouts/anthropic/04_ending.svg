<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 结束页 - Anthropic 风格 -->
    
    <defs>
        <!-- 背景渐变 -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1A1A2E"/>
            <stop offset="50%" style="stop-color:#16213E"/>
            <stop offset="100%" style="stop-color:#0F0F1A"/>
        </linearGradient>
        <!-- 橙色渐变 -->
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#D97757"/>
            <stop offset="100%" style="stop-color:#E8956F"/>
        </linearGradient>
        <!-- 光晕效果 -->
        <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#D97757;stop-opacity:0.2"/>
            <stop offset="100%" style="stop-color:#D97757;stop-opacity:0"/>
        </radialGradient>
        <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:0.15"/>
            <stop offset="100%" style="stop-color:#4A90D9;stop-opacity:0"/>
        </radialGradient>
    </defs>
    
    <!-- 渐变背景 -->
    <rect width="1920" height="1080" fill="url(#bgGradient)"/>
    
    <!-- 网格装饰线 -->
    <g stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="2">
        <line x1="0" y1="270" x2="1920" y2="270"/>
        <line x1="0" y1="540" x2="1920" y2="540"/>
        <line x1="0" y1="810" x2="1920" y2="810"/>
        <line x1="480" y1="0" x2="480" y2="1080"/>
        <line x1="960" y1="0" x2="960" y2="1080"/>
        <line x1="1440" y1="0" x2="1440" y2="1080"/>
    </g>
    
    <!-- 光晕效果 -->
    <ellipse cx="450" cy="300" rx="375" ry="270" fill="url(#glowBlue)"/>
    <ellipse cx="1470" cy="750" rx="420" ry="300" fill="url(#glowOrange)"/>
    
    <!-- 神经网络连接装饰 -->
    <g stroke="#4A90D9" stroke-opacity="0.3" stroke-width="2" fill="none">
        <path d="M225,225 Q375,150 525,270"/>
        <path d="M525,270 Q630,375 570,480"/>
        <path d="M1425,600 Q1575,525 1650,630"/>
        <path d="M1650,630 Q1725,750 1620,825"/>
    </g>
    
    <!-- 节点装饰 -->
    <g fill="#4A90D9" fill-opacity="0.5">
        <circle cx="225" cy="225" r="8"/>
        <circle cx="525" cy="270" r="10"/>
        <circle cx="570" cy="480" r="6"/>
    </g>
    <g fill="#D97757" fill-opacity="0.6">
        <circle cx="1425" cy="600" r="9"/>
        <circle cx="1650" cy="630" r="12"/>
        <circle cx="1620" cy="825" r="8"/>
    </g>
    
    <!-- 感谢语标签 -->
    <text x="960" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#D97757" letter-spacing="4">
        THANK YOU
    </text>
    
    <!-- 主感谢语 -->
    <text x="960" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="78" font-weight="bold" fill="#FFFFFF">
        {{THANK_YOU}}
    </text>
    
    <!-- 装饰分隔线 -->
    <rect x="810" y="525" width="300" height="4" fill="url(#accentGradient)" rx="2.2"/>
    
    <!-- 副标语 -->
    <text x="960" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#FFFFFF" fill-opacity="0.7">
        {{ENDING_SUBTITLE}}
    </text>
    
    <!-- 联系信息卡片 -->
    <rect x="660" y="690" width="600" height="180" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" rx="18"/>
    
    <text x="960" y="758" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF">
        {{CONTACT_INFO}}
    </text>
    <text x="960" y="802" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#FFFFFF" fill-opacity="0.7">
        {{CONTACT_EMAIL}}
    </text>
    <text x="960" y="840" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#FFFFFF" fill-opacity="0.6">
        {{CONTACT_URL}}
    </text>
    
    <!-- 底部分隔线 -->
    <rect x="90" y="960" width="1740" height="2" fill="#FFFFFF" fill-opacity="0.1"/>
    
    <!-- 底部信息 -->
    <text x="90" y="1020" font-family="Arial, sans-serif" font-size="21" fill="#64748B">
        {{DATE}}
    </text>
    <text x="1830" y="1020" text-anchor="end" font-family="Arial, sans-serif" font-size="21" fill="#64748B">
        {{COPYRIGHT}}
    </text>

</svg>
