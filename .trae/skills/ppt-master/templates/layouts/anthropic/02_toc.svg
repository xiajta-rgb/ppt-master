<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- 模板: 目录页 - Anthropic 风格 -->
    
    <defs>
        <linearGradient id="sideAccent" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#D97757"/>
            <stop offset="100%" style="stop-color:#E8956F"/>
        </linearGradient>
    </defs>
    
    <!-- 白色背景 -->
    <rect width="1920" height="1080" fill="#FFFFFF"/>
    
    <!-- 左侧渐变装饰条 -->
    <rect x="0" y="0" width="12" height="1080" fill="url(#sideAccent)"/>
    
    <!-- 页面标签 -->
    <text x="90" y="82" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#D97757" letter-spacing="3">
        AGENDA
    </text>
    
    <!-- 页面标题 -->
    <text x="90" y="150" font-family="Arial, sans-serif" font-size="54" font-weight="bold" fill="#1A1A2E">
        {{PAGE_TITLE}}
    </text>
    
    <!-- 分隔线 -->
    <line x1="90" y1="195" x2="450" y2="195" stroke="#E2E8F0" stroke-width="3"/>
    
    <!-- 目录项列表 -->
    <g font-family="Arial, sans-serif">
        <!-- 第1章 -->
        <g>
            <circle cx="135" cy="300" r="36" fill="#D97757"/>
            <text x="135" y="310" font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
            <text x="195" y="292" font-size="30" font-weight="600" fill="#1A1A2E">{{TOC_ITEM_1_TITLE}}</text>
            <text x="195" y="327" font-size="24" fill="#64748B">{{TOC_ITEM_1_DESC}}</text>
        </g>
        
        <!-- 第2章 -->
        <g>
            <circle cx="135" cy="428" r="36" fill="#D97757"/>
            <text x="135" y="438" font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
            <text x="195" y="420" font-size="30" font-weight="600" fill="#1A1A2E">{{TOC_ITEM_2_TITLE}}</text>
            <text x="195" y="454" font-size="24" fill="#64748B">{{TOC_ITEM_2_DESC}}</text>
        </g>
        
        <!-- 第3章 -->
        <g>
            <circle cx="135" cy="555" r="36" fill="#D97757"/>
            <text x="135" y="566" font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
            <text x="195" y="548" font-size="30" font-weight="600" fill="#1A1A2E">{{TOC_ITEM_3_TITLE}}</text>
            <text x="195" y="582" font-size="24" fill="#64748B">{{TOC_ITEM_3_DESC}}</text>
        </g>
        
        <!-- 第4章 -->
        <g>
            <circle cx="135" cy="682" r="36" fill="#D97757"/>
            <text x="135" y="693" font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
            <text x="195" y="675" font-size="30" font-weight="600" fill="#1A1A2E">{{TOC_ITEM_4_TITLE}}</text>
            <text x="195" y="710" font-size="24" fill="#64748B">{{TOC_ITEM_4_DESC}}</text>
        </g>
        
        <!-- 第5章 -->
        <g>
            <circle cx="135" cy="810" r="36" fill="#D97757"/>
            <text x="135" y="820" font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
            <text x="195" y="802" font-size="30" font-weight="600" fill="#1A1A2E">{{TOC_ITEM_5_TITLE}}</text>
            <text x="195" y="837" font-size="24" fill="#64748B">{{TOC_ITEM_5_DESC}}</text>
        </g>
        
        <!-- 第6章 -->
        <g>
            <circle cx="135" cy="938" r="36" fill="#D97757"/>
            <text x="135" y="948" font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
            <text x="195" y="930" font-size="30" font-weight="600" fill="#1A1A2E">{{TOC_ITEM_6_TITLE}}</text>
            <text x="195" y="964" font-size="24" fill="#64748B">{{TOC_ITEM_6_DESC}}</text>
        </g>
    </g>
    
    <!-- 右侧复杂度递增示意图 -->
    <g transform="translate(1275, 300)">
        <!-- 背景卡片 -->
        <rect x="0" y="0" width="525" height="600" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" rx="24"/>
        
        <!-- 第一层 - Single LLM -->
        <rect x="60" y="60" width="405" height="75" fill="#4A90D9" fill-opacity="0.1" stroke="#4A90D9" stroke-width="3" rx="12"/>
        <text x="262" y="108" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#4A90D9" text-anchor="middle">Single LLM Call</text>
        
        <!-- 箭头1 -->
        <path d="M262,135 L262,180" stroke="#64748B" stroke-width="3" stroke-dasharray="4,2"/>
        <polygon points="262,195 255,180 270,180" fill="#64748B"/>
        
        <!-- 第二层 - Workflows -->
        <rect x="60" y="202" width="405" height="75" fill="#4A90D9" fill-opacity="0.2" stroke="#4A90D9" stroke-width="3" rx="12"/>
        <text x="262" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#4A90D9" text-anchor="middle">Workflows</text>
        
        <!-- 箭头2 -->
        <path d="M262,278 L262,322" stroke="#64748B" stroke-width="3" stroke-dasharray="4,2"/>
        <polygon points="262,338 255,322 270,322" fill="#64748B"/>
        
        <!-- 第三层 - Autonomous Agents -->
        <rect x="60" y="345" width="405" height="75" fill="#D97757" fill-opacity="0.2" stroke="#D97757" stroke-width="3" rx="12"/>
        <text x="262" y="393" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#D97757" text-anchor="middle">Autonomous Agents</text>
        
        <!-- 说明文字 -->
        <text x="262" y="480" font-family="Arial, sans-serif" font-size="21" fill="#64748B" text-anchor="middle">复杂度递增</text>
        <text x="262" y="513" font-family="Arial, sans-serif" font-size="21" fill="#64748B" text-anchor="middle">按需升级</text>
        
        <!-- 侧边箭头 -->
        <path d="M480,150 L510,255 L480,360" stroke="#E2E8F0" stroke-width="3" fill="none"/>
    </g>
    
    <!-- 页码 -->
    <text x="960" y="1042" font-family="Arial, sans-serif" font-size="21" fill="#64748B" text-anchor="middle">
        {{PAGE_NUM}} / {{TOTAL_PAGES}}
    </text>

</svg>
