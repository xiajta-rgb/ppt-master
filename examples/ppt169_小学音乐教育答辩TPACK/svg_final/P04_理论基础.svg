<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="tpackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E86A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#FFFAF5"/>
  
  <!-- Music note background decorations - refined -->
  <g opacity="0.06" fill="#E86A2A">
    <g transform="translate(1700, 180) rotate(-15)">
      <text font-size="100" font-family="serif">♪</text>
    </g>
    <g transform="translate(1780, 580) rotate(12)">
      <text font-size="80" font-family="serif">♫</text>
    </g>
    <g transform="translate(140, 780) rotate(-18)">
      <text font-size="70" font-family="serif">♩</text>
    </g>
    <g transform="translate(1550, 140) rotate(8)">
      <text font-size="55" font-family="serif">♬</text>
    </g>
  </g>
  
  <!-- Header -->
  <text x="96" y="95" font-size="64" fill="#E86A2A" font-family="'Noto Serif SC', serif" font-weight="700">02</text>
  <text x="200" y="88" font-size="40" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">理论基础与研究定位</text>
  <text x="200" y="120" font-size="20" fill="#A08B72" font-family="'Noto Sans SC', sans-serif">Theoretical Foundation</text>
  <line x1="96" y1="140" x2="1824" y2="140" stroke="#E86A2A" stroke-width="2" opacity="0.3"/>
  
  <!-- Left column: Research status -->
  <rect x="96" y="176" width="768" height="200" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="96" y="176" width="6" height="200" rx="3" fill="#F5A623"/>
  
  <g transform="translate(136, 206)">
    <path d="M4 4 L20 8 L36 4 L36 32 L20 36 L4 32 Z" fill="none" stroke="#F5A623" stroke-width="2"/>
    <line x1="20" y1="8" x2="20" y2="36" stroke="#F5A623" stroke-width="2"/>
  </g>
  <text x="196" y="242" font-size="24" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">国外研究现状</text>
  <text x="136" y="288" font-size="18" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">TPACK理论在欧美国家已形成较为成熟的理论框架，</text>
  <text x="136" y="318" font-size="18" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">并成功向理工科、人文社科等多学科教学场景应用拓展。</text>
  <text x="136" y="354" font-size="18" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">Mishra &amp; Koehler (2006) 提出TPACK框架后，该理论迅速</text>
  <text x="136" y="384" font-size="18" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">成为教师教育领域的核心范式。</text>
  
  <rect x="96" y="396" width="768" height="200" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="96" y="396" width="6" height="200" rx="3" fill="#E86A2A"/>
  
  <g transform="translate(136, 426)">
    <path d="M4 4 L20 8 L36 4 L36 32 L20 36 L4 32 Z" fill="none" stroke="#E86A2A" stroke-width="2"/>
    <line x1="20" y1="8" x2="20" y2="36" stroke="#E86A2A" stroke-width="2"/>
  </g>
  <text x="196" y="462" font-size="24" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">国内研究现状</text>
  <text x="136" y="508" font-size="18" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">国内相关研究起步较晚但发展迅速，研究内容多集中于</text>
  <text x="136" y="538" font-size="18" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">理论内涵探讨与教师TPACK能力测评。</text>
  <text x="136" y="574" font-size="18" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">针对小学音乐欣赏教学的系统性实践研究尚显不足，</text>
  <text x="136" y="604" font-size="18" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">缺乏可操作的落地模型。</text>
  
  <rect x="96" y="616" width="768" height="200" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="96" y="616" width="6" height="200" rx="3" fill="#8B7355"/>
  
  <g transform="translate(136, 646)">
    <circle cx="18" cy="18" r="16" fill="none" stroke="#8B7355" stroke-width="2"/>
    <circle cx="18" cy="18" r="10" fill="none" stroke="#8B7355" stroke-width="2"/>
    <circle cx="18" cy="18" r="4" fill="none" stroke="#8B7355" stroke-width="2"/>
    <circle cx="18" cy="18" r="1.5" fill="#8B7355"/>
  </g>
  <text x="196" y="678" font-size="24" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">本研究定位</text>
  <text x="136" y="724" font-size="18" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">聚焦小学音乐欣赏领域，构建并验证一个可落地、</text>
  <text x="136" y="754" font-size="18" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">可操作的TPACK教学实践模型。</text>
  <text x="136" y="790" font-size="18" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">填补"理论-实践"之间的鸿沟，为一线教师提供</text>
  <text x="136" y="820" font-size="18" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">可复制的教学范式。</text>
  
  <!-- Right column: TPACK diagram -->
  <rect x="904" y="176" width="920" height="640" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  
  <g transform="translate(964, 206)">
    <path d="M12 4 L28 4 L36 28 L4 28 Z" fill="none" stroke="#E86A2A" stroke-width="2"/>
    <line x1="16" y1="4" x2="24" y2="4" stroke="#E86A2A" stroke-width="2"/>
    <line x1="20" y1="4" x2="20" y2="8" stroke="#E86A2A" stroke-width="2"/>
  </g>
  <text x="1014" y="242" font-size="24" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">核心理论：TPACK 整合技术的学科教学知识</text>
  
  <!-- TPACK nodes -->
  <circle cx="1040" cy="400" r="80" fill="#E86A2A"/>
  <text x="1040" y="394" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family="'Noto Sans SC', sans-serif">技术知识</text>
  <text x="1040" y="422" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family="'Noto Sans SC', sans-serif">TK</text>
  
  <circle cx="1364" cy="400" r="80" fill="#F5A623"/>
  <text x="1364" y="394" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family="'Noto Sans SC', sans-serif">教学法知识</text>
  <text x="1364" y="422" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family="'Noto Sans SC', sans-serif">PK</text>
  
  <circle cx="1688" cy="400" r="80" fill="#8B7355"/>
  <text x="1688" y="394" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family="'Noto Sans SC', sans-serif">学科内容知识</text>
  <text x="1688" y="422" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="600" font-family="'Noto Sans SC', sans-serif">CK</text>
  
  <!-- Center TPACK -->
  <circle cx="1364" cy="580" r="100" fill="url(#tpackGrad)"/>
  <text x="1364" y="574" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-family="'Noto Sans SC', sans-serif">TPACK</text>
  <text x="1364" y="606" font-size="22" fill="#FFFFFF" text-anchor="middle" font-family="'Noto Sans SC', sans-serif">整合</text>
  
  <!-- Description -->
  <text x="1364" y="760" font-size="18" fill="#5A4A3A" text-anchor="middle" font-family="'Noto Sans SC', sans-serif">非三者的简单线性叠加，而是强调技术与教学内容的深度融合，</text>
  <text x="1364" y="790" font-size="18" fill="#5A4A3A" text-anchor="middle" font-family="'Noto Sans SC', sans-serif">旨在创造出适用于信息化教学环境的新教学知识与实践智慧。</text>
  
  <!-- Footer -->
  <line x1="96" y1="1020" x2="1824" y2="1020" stroke="#E0D5C8" stroke-width="1"/>
  <text x="960" y="1050" font-size="16" text-anchor="middle" fill="#A08B72" font-family="'Noto Sans SC', sans-serif" letter-spacing="1">基于TPACK理论的小学音乐欣赏教学实践研究 · XX师范大学 · 音乐学院</text>
</svg>
