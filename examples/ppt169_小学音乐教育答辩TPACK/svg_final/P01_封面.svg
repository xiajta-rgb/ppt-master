<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E86A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#coverGrad)"/>
  
  <!-- Music note background decorations - refined -->
  <g opacity="0.06" fill="#FFFFFF">
    <g transform="translate(160, 160) rotate(-18)">
      <text font-size="100" font-family="serif">♪</text>
    </g>
    <g transform="translate(1740, 200) rotate(12)">
      <text font-size="85" font-family="serif">♫</text>
    </g>
    <g transform="translate(1620, 860) rotate(-22)">
      <text font-size="75" font-family="serif">♩</text>
    </g>
    <g transform="translate(180, 900) rotate(16)">
      <text font-size="65" font-family="serif">♬</text>
    </g>
  </g>
  
  <!-- Top accent line -->
  <line x1="96" y1="96" x2="1824" y2="96" stroke="#F5A623" stroke-width="3"/>
  
  <!-- Left: Logo placeholder - converted to image element for drag/resize -->
  <image x="120" y="140" width="160" height="160" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  
  <!-- Right: Image placeholder - converted to image element for drag/resize -->
  <image x="1640" y="140" width="160" height="160" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  
  <!-- Content - centered -->
  <text x="960" y="380" font-size="24" text-anchor="middle" fill="#F5A623" letter-spacing="10" font-family="'Noto Sans SC', sans-serif" font-weight="300">硕士学位论文答辩</text>
  
  <text x="960" y="470" font-size="48" text-anchor="middle" fill="#FFFFFF" font-family="'Noto Serif SC', serif" font-weight="700" filter="url(#shadow)">
    <tspan x="960" dy="0">基于TPACK理论的小学</tspan>
    <tspan x="960" dy="72">音乐欣赏教学实践研究</tspan>
  </text>
  
  <text x="960" y="610" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-style="italic" font-family="'Noto Sans SC', sans-serif" letter-spacing="1">
    Research on Primary School Music Appreciation Teaching Practice Based on TPACK Theory
  </text>
  
  <!-- Decorative line -->
  <line x1="640" y1="660" x2="1280" y2="660" stroke="#F5A623" stroke-width="2"/>
  <circle cx="960" cy="660" r="5" fill="#F5A623"/>
  
  <!-- Info bar - simplified 3 columns -->
  <rect x="480" y="710" width="960" height="120" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  
  <line x1="800" y1="710" x2="800" y2="830" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="1120" y1="710" x2="1120" y2="830" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  
  <text x="640" y="755" font-size="16" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="'Noto Sans SC', sans-serif">答辩人</text>
  <text x="640" y="795" font-size="22" text-anchor="middle" fill="#FFFFFF" font-family="'Noto Sans SC', sans-serif" font-weight="600">夏周慧</text>
  
  <text x="960" y="755" font-size="16" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="'Noto Sans SC', sans-serif">指导教师</text>
  <text x="960" y="795" font-size="22" text-anchor="middle" fill="#FFFFFF" font-family="'Noto Sans SC', sans-serif" font-weight="600">XXX 教授</text>
  
  <text x="1280" y="755" font-size="16" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="'Noto Sans SC', sans-serif">日 期</text>
  <text x="1280" y="795" font-size="22" text-anchor="middle" fill="#FFFFFF" font-family="'Noto Sans SC', sans-serif" font-weight="600">2026年5月</text>
  
  <!-- Bottom: University info -->
  <text x="960" y="920" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.5)" letter-spacing="4" font-family="'Noto Sans SC', sans-serif">XX师范大学 音乐学院</text>
  <text x="960" y="950" font-size="13" text-anchor="middle" fill="rgba(255,255,255,0.35)" letter-spacing="2" font-family="'Noto Sans SC', sans-serif">SCHOOL OF MUSIC, XX NORMAL UNIVERSITY</text>
  
  <!-- Bottom accent line -->
  <line x1="96" y1="984" x2="1824" y2="984" stroke="#F5A623" stroke-width="3"/>
</svg>
