<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="practiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E86A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#F8F9FA"/>
  
  <!-- Music note background decorations -->
  <g opacity="0.10" fill="#E86A2A">
    <g transform="translate(1700, 140) rotate(-18)">
      <text font-size="105" font-family="serif">♪</text>
    </g>
    <g transform="translate(1800, 560) rotate(20)">
      <text font-size="88" font-family="serif">♫</text>
    </g>
    <g transform="translate(110, 700) rotate(-25)">
      <text font-size="82" font-family="serif">♩</text>
    </g>
    <g transform="translate(1480, 120) rotate(10)">
      <text font-size="62" font-family="serif">♬</text>
    </g>
    <g transform="translate(1720, 800) rotate(-18)">
      <text font-size="72" font-family="serif">♪</text>
    </g>
    <g transform="translate(210, 210) rotate(16)">
      <text font-size="52" font-family="serif">♫</text>
    </g>
    <g transform="translate(1580, 360) rotate(-28)">
      <text font-size="48" font-family="serif">♩</text>
    </g>
    <g transform="translate(130, 410) rotate(26)">
      <text font-size="44" font-family="serif">♬</text>
    </g>
    <g transform="translate(1850, 310) rotate(-12)">
      <text font-size="58" font-family="serif">♫</text>
    </g>
    <g transform="translate(310, 860) rotate(20)">
      <text font-size="42" font-family="serif">♪</text>
    </g>
  </g>
  
  <!-- Header -->
  <text x="80" y="100" font-size="72" fill="#E86A2A" font-family="'Noto Serif SC', serif" font-weight="700">03</text>
  <text x="190" y="90" font-size="44" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">研究设计与方法</text>
  <text x="190" y="125" font-size="22" fill="#8B7355">Research Design &amp; Methods</text>
  <line x1="80" y1="145" x2="1840" y2="145" stroke="#F5A623" stroke-width="3"/>
  
  <!-- Left card: TPACK model -->
  <rect x="80" y="180" width="860" height="720" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="80" y="180" width="8" height="720" rx="4" fill="#F5A623"/>
  
  <!-- Ant Design style icon: Experiment -->
  <g transform="translate(130, 210)">
    <path d="M12 4 L28 4 L36 28 L4 28 Z" fill="none" stroke="#F5A623" stroke-width="2"/>
    <line x1="16" y1="4" x2="24" y2="4" stroke="#F5A623" stroke-width="2"/>
    <line x1="20" y1="4" x2="20" y2="8" stroke="#F5A623" stroke-width="2"/>
  </g>
  <text x="180" y="248" font-size="28" fill="#2C1810" font-weight="600">核心创新：构建TPACK教学模型</text>
  
  <rect x="130" y="280" width="760" height="110" rx="12" fill="#F0F2F5"/>
  <!-- Ant Design style icon: BarChart -->
  <g transform="translate(180, 310)">
    <rect x="0" y="12" width="8" height="16" rx="2" fill="#F5A623"/>
    <rect x="12" y="6" width="8" height="22" rx="2" fill="#F5A623"/>
    <rect x="24" y="0" width="8" height="28" rx="2" fill="#F5A623"/>
  </g>
  <text x="230" y="318" font-size="24" fill="#2C1810" font-weight="600">基础元素分析</text>
  <text x="230" y="358" font-size="22" fill="#5A5D75">从音乐本体与学情出发，分析教学内容与学生特点</text>
  
  <rect x="130" y="410" width="760" height="110" rx="12" fill="#F0F2F5"/>
  <!-- Ant Design style icon: Link -->
  <g transform="translate(180, 440)">
    <path d="M8 16 L16 8 L24 16 L32 8" fill="none" stroke="#F5A623" stroke-width="2"/>
    <circle cx="8" cy="16" r="4" fill="none" stroke="#F5A623" stroke-width="2"/>
    <circle cx="32" cy="8" r="4" fill="none" stroke="#F5A623" stroke-width="2"/>
  </g>
  <text x="230" y="448" font-size="24" fill="#2C1810" font-weight="600">整合分析</text>
  <text x="230" y="488" font-size="22" fill="#5A5D75">技术与学科深度融合，确定技术介入的最佳时机与方式</text>
  
  <rect x="130" y="540" width="760" height="110" rx="12" fill="#F0F2F5"/>
  <!-- Ant Design style icon: Read -->
  <g transform="translate(180, 570)">
    <path d="M4 4 L20 8 L36 4 L36 32 L20 36 L4 32 Z" fill="none" stroke="#F5A623" stroke-width="2"/>
    <line x1="20" y1="8" x2="20" y2="36" stroke="#F5A623" stroke-width="2"/>
  </g>
  <text x="230" y="578" font-size="24" fill="#2C1810" font-weight="600">教学实践</text>
  <text x="230" y="618" font-size="22" fill="#5A5D75">落实于课堂教学，实施TPACK导向的教学活动</text>
  
  <rect x="130" y="670" width="760" height="110" rx="12" fill="#F0F2F5"/>
  <!-- Ant Design style icon: LineChart -->
  <g transform="translate(180, 700)">
    <polyline points="0,28 10,18 20,22 32,8" fill="none" stroke="#F5A623" stroke-width="2"/>
    <circle cx="0" cy="28" r="3" fill="#F5A623"/>
    <circle cx="10" cy="18" r="3" fill="#F5A623"/>
    <circle cx="20" cy="22" r="3" fill="#F5A623"/>
    <circle cx="32" cy="8" r="3" fill="#F5A623"/>
  </g>
  <text x="230" y="708" font-size="24" fill="#2C1810" font-weight="600">评价反馈</text>
  <text x="230" y="748" font-size="22" fill="#5A5D75">通过多元化手段进行评价，形成闭环优化系统</text>
  
  <!-- Right card: Quasi-experimental research -->
  <rect x="980" y="180" width="860" height="720" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="980" y="180" width="8" height="720" rx="4" fill="#E86A2A"/>
  
  <!-- Ant Design style icon: Team -->
  <g transform="translate(1030, 210)">
    <circle cx="20" cy="10" r="8" fill="none" stroke="#E86A2A" stroke-width="2"/>
    <path d="M4 32 L4 24 C4 20 12 16 20 16 C28 16 36 20 36 24 L36 32" fill="none" stroke="#E86A2A" stroke-width="2"/>
  </g>
  <text x="1080" y="248" font-size="28" fill="#2C1810" font-weight="600">研究方法：准实验研究</text>
  
  <rect x="1030" y="280" width="760" height="130" rx="12" fill="#F0F2F5"/>
  <text x="1080" y="322" font-size="24" fill="#2C1810" font-weight="600">研究对象</text>
  <text x="1080" y="362" font-size="22" fill="#5A5D75">漳州市某小学二年级两个平行班（设实验组/对照组）</text>
  
  <rect x="1030" y="430" width="760" height="130" rx="12" fill="#F0F2F5"/>
  <text x="1080" y="472" font-size="24" fill="#2C1810" font-weight="600">教学案例</text>
  <text x="1080" y="512" font-size="22" fill="#5A5D75">人教版小学音乐《沂蒙山小调》</text>
  
  <rect x="1030" y="580" width="760" height="130" rx="12" fill="#F0F2F5"/>
  <text x="1080" y="622" font-size="24" fill="#2C1810" font-weight="600">实践周期</text>
  <text x="1080" y="662" font-size="22" fill="#5A5D75">为期四周的教学实践</text>
  
  <rect x="1030" y="730" width="760" height="130" rx="12" fill="#F0F2F5"/>
  <text x="1080" y="772" font-size="24" fill="#2C1810" font-weight="600">数据收集</text>
  <text x="1080" y="812" font-size="22" fill="#5A5D75">混合采用课堂观察、学生问卷、教师访谈及课后测试四种方法</text>
  
  <!-- Bottom decorative element -->
  <line x1="80" y1="960" x2="1840" y2="960" stroke="#F5A623" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="960" y="995" font-size="18" text-anchor="middle" fill="#8B7355" letter-spacing="2">基于TPACK理论的小学音乐欣赏教学实践研究</text>
  <text x="960" y="1025" font-size="16" text-anchor="middle" fill="#8B7355" letter-spacing="1">XX师范大学 · 音乐学院</text>
</svg>
