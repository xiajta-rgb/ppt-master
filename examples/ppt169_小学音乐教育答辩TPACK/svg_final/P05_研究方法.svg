<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="practiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E86A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#F8F9FA"/>
  
  <!-- Music note background decorations -->
  <g opacity="0.08" fill="#E86A2A">
    <g transform="translate(1750, 180) rotate(-18)">
      <text font-size="96" font-family="serif">♪</text>
    </g>
    <g transform="translate(1850, 620) rotate(20)">
      <text font-size="80" font-family="serif">♫</text>
    </g>
    <g transform="translate(120, 750) rotate(-25)">
      <text font-size="72" font-family="serif">♩</text>
    </g>
    <g transform="translate(1550, 150) rotate(10)">
      <text font-size="56" font-family="serif">♬</text>
    </g>
    <g transform="translate(1780, 850) rotate(-18)">
      <text font-size="64" font-family="serif">♪</text>
    </g>
    <g transform="translate(240, 240) rotate(16)">
      <text font-size="48" font-family="serif">♫</text>
    </g>
  </g>
  
  <!-- Header -->
  <text x="96" y="108" font-size="64" fill="#E86A2A" font-family="'Noto Serif SC', serif" font-weight="700">03</text>
  <text x="200" y="96" font-size="40" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">研究设计与方法</text>
  <text x="200" y="128" font-size="20" fill="#8B7355">Research Design &amp; Methods</text>
  <line x1="96" y1="152" x2="1824" y2="152" stroke="#F5A623" stroke-width="3"/>
  
  <!-- Left card: TPACK model -->
  <rect x="96" y="184" width="848" height="760" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="96" y="184" width="6" height="760" rx="3" fill="#F5A623"/>
  
  <!-- Icon and title -->
  <g transform="translate(144, 224)">
    <path d="M12 4 L28 4 L36 28 L4 28 Z" fill="none" stroke="#F5A623" stroke-width="2"/>
    <line x1="16" y1="4" x2="24" y2="4" stroke="#F5A623" stroke-width="2"/>
    <line x1="20" y1="4" x2="20" y2="8" stroke="#F5A623" stroke-width="2"/>
  </g>
  <text x="200" y="260" font-size="26" fill="#2C1810" font-weight="600">核心创新：构建TPACK教学模型</text>
  
  <!-- Step items -->
  <rect x="144" y="296" width="752" height="120" rx="10" fill="#F8F9FA"/>
  <g transform="translate(184, 332)">
    <rect x="0" y="8" width="8" height="16" rx="2" fill="#F5A623"/>
    <rect x="12" y="4" width="8" height="20" rx="2" fill="#F5A623"/>
    <rect x="24" y="0" width="8" height="24" rx="2" fill="#F5A623"/>
  </g>
  <text x="232" y="344" font-size="22" fill="#2C1810" font-weight="600">基础元素分析</text>
  <text x="232" y="380" font-size="18" fill="#5A5D75">从音乐本体与学情出发，分析教学内容与学生特点</text>
  
  <rect x="144" y="432" width="752" height="120" rx="10" fill="#F8F9FA"/>
  <g transform="translate(184, 468)">
    <path d="M8 16 L16 8 L24 16 L32 8" fill="none" stroke="#F5A623" stroke-width="2"/>
    <circle cx="8" cy="16" r="4" fill="none" stroke="#F5A623" stroke-width="2"/>
    <circle cx="32" cy="8" r="4" fill="none" stroke="#F5A623" stroke-width="2"/>
  </g>
  <text x="232" y="480" font-size="22" fill="#2C1810" font-weight="600">整合分析</text>
  <text x="232" y="516" font-size="18" fill="#5A5D75">技术与学科深度融合，确定技术介入的最佳时机与方式</text>
  
  <rect x="144" y="568" width="752" height="120" rx="10" fill="#F8F9FA"/>
  <g transform="translate(184, 604)">
    <path d="M4 4 L20 8 L36 4 L36 32 L20 36 L4 32 Z" fill="none" stroke="#F5A623" stroke-width="2"/>
    <line x1="20" y1="8" x2="20" y2="36" stroke="#F5A623" stroke-width="2"/>
  </g>
  <text x="232" y="616" font-size="22" fill="#2C1810" font-weight="600">教学实践</text>
  <text x="232" y="652" font-size="18" fill="#5A5D75">落实于课堂教学，实施TPACK导向的教学活动</text>
  
  <rect x="144" y="704" width="752" height="120" rx="10" fill="#F8F9FA"/>
  <g transform="translate(184, 740)">
    <polyline points="0,28 10,18 20,22 32,8" fill="none" stroke="#F5A623" stroke-width="2"/>
    <circle cx="0" cy="28" r="3" fill="#F5A623"/>
    <circle cx="10" cy="18" r="3" fill="#F5A623"/>
    <circle cx="20" cy="22" r="3" fill="#F5A623"/>
    <circle cx="32" cy="8" r="3" fill="#F5A623"/>
  </g>
  <text x="232" y="752" font-size="22" fill="#2C1810" font-weight="600">评价反馈</text>
  <text x="232" y="788" font-size="18" fill="#5A5D75">通过多元化手段进行评价，形成闭环优化系统</text>
  
  <!-- Right card: Quasi-experimental research -->
  <rect x="976" y="184" width="848" height="760" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="976" y="184" width="6" height="760" rx="3" fill="#E86A2A"/>
  
  <!-- Icon and title -->
  <g transform="translate(1024, 224)">
    <circle cx="20" cy="10" r="8" fill="none" stroke="#E86A2A" stroke-width="2"/>
    <path d="M4 32 L4 24 C4 20 12 16 20 16 C28 16 36 20 36 24 L36 32" fill="none" stroke="#E86A2A" stroke-width="2"/>
  </g>
  <text x="1080" y="260" font-size="26" fill="#2C1810" font-weight="600">研究方法：准实验研究</text>
  
  <!-- Research items -->
  <rect x="1024" y="296" width="752" height="136" rx="10" fill="#F8F9FA"/>
  <text x="1072" y="340" font-size="22" fill="#2C1810" font-weight="600">研究对象</text>
  <text x="1072" y="376" font-size="18" fill="#5A5D75">漳州市某小学二年级两个平行班（设实验组/对照组）</text>
  
  <rect x="1024" y="448" width="752" height="136" rx="10" fill="#F8F9FA"/>
  <text x="1072" y="492" font-size="22" fill="#2C1810" font-weight="600">教学案例</text>
  <text x="1072" y="528" font-size="18" fill="#5A5D75">人教版小学音乐《沂蒙山小调》</text>
  
  <rect x="1024" y="600" width="752" height="136" rx="10" fill="#F8F9FA"/>
  <text x="1072" y="644" font-size="22" fill="#2C1810" font-weight="600">实践周期</text>
  <text x="1072" y="680" font-size="18" fill="#5A5D75">为期四周的教学实践</text>
  
  <rect x="1024" y="752" width="752" height="136" rx="10" fill="#F8F9FA"/>
  <text x="1072" y="796" font-size="22" fill="#2C1810" font-weight="600">数据收集</text>
  <text x="1072" y="832" font-size="18" fill="#5A5D75">混合采用课堂观察、学生问卷、教师访谈及课后测试四种方法</text>
  
  <!-- Footer -->
  <line x1="96" y1="984" x2="1824" y2="984" stroke="#F5A623" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="960" y="1016" font-size="16" text-anchor="middle" fill="#8B7355" letter-spacing="2">基于TPACK理论的小学音乐欣赏教学实践研究</text>
  <text x="960" y="1044" font-size="14" text-anchor="middle" fill="#8B7355" letter-spacing="1">XX师范大学 · 音乐学院</text>
</svg>
