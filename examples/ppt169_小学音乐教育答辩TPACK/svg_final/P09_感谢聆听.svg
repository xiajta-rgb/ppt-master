<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="endGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E86A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="endGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#endGrad)"/>
  <rect width="1920" height="1080" fill="url(#endGlow)"/>
  
  <!-- Music note background decorations -->
  <g opacity="0.06" fill="#FFFFFF">
    <g transform="translate(180, 160) rotate(-22)">
      <text font-size="96" font-family="serif">♪</text>
    </g>
    <g transform="translate(1720, 220) rotate(18)">
      <text font-size="80" font-family="serif">♫</text>
    </g>
    <g transform="translate(1620, 880) rotate(-28)">
      <text font-size="72" font-family="serif">♩</text>
    </g>
    <g transform="translate(220, 900) rotate(25)">
      <text font-size="64" font-family="serif">♬</text>
    </g>
    <g transform="translate(1780, 500) rotate(-15)">
      <text font-size="56" font-family="serif">♪</text>
    </g>
    <g transform="translate(160, 520) rotate(20)">
      <text font-size="48" font-family="serif">♫</text>
    </g>
  </g>
  
  <!-- Academic decorative elements - subtle geometric patterns -->
  <g opacity="0.04">
    <circle cx="240" cy="240" r="120" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="1680" cy="840" r="100" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  </g>
  
  <!-- Heart icon -->
  <g transform="translate(900, 180)">
    <path d="M60 100 C60 100 10 60 10 35 C10 15 30 5 45 20 L60 35 L75 20 C90 5 110 15 110 35 C110 60 60 100 60 100Z" fill="none" stroke="#F5A623" stroke-width="3"/>
  </g>
  
  <!-- Main title -->
  <text x="960" y="380" font-size="72" text-anchor="middle" fill="#FFFFFF" font-family="'Noto Serif SC', serif" font-weight="700" letter-spacing="12">感谢聆听</text>
  
  <!-- Subtitle -->
  <text x="960" y="432" font-size="22" text-anchor="middle" fill="#FFFFFF" opacity="0.75" letter-spacing="4">THANK YOU FOR YOUR ATTENTION</text>
  
  <!-- Decorative line -->
  <line x1="720" y1="468" x2="1200" y2="468" stroke="#F5A623" stroke-width="2"/>
  
  <!-- Request for feedback -->
  <text x="960" y="520" font-size="26" text-anchor="middle" fill="#FFFFFF" opacity="0.85">敬请各位评委老师批评指正</text>
  
  <!-- Info cards -->
  <rect x="520" y="580" width="880" height="160" rx="12" fill="rgba(255,255,255,0.08)" filter="url(#cardShadow)"/>
  
  <!-- Divider lines -->
  <line x1="800" y1="600" x2="800" y2="720" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="1120" y1="600" x2="1120" y2="720" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  
  <!-- Info 1: 答辩人 -->
  <text x="660" y="640" font-size="18" text-anchor="middle" fill="#FFFFFF" opacity="0.65">答辩人</text>
  <text x="660" y="680" font-size="24" text-anchor="middle" fill="#FFFFFF" font-weight="600">夏周慧</text>
  
  <!-- Info 2: 指导教师 -->
  <text x="960" y="640" font-size="18" text-anchor="middle" fill="#FFFFFF" opacity="0.65">指导教师</text>
  <text x="960" y="680" font-size="24" text-anchor="middle" fill="#FFFFFF" font-weight="600">XXX 教授</text>
  
  <!-- Info 3: 日期 -->
  <text x="1260" y="640" font-size="18" text-anchor="middle" fill="#FFFFFF" opacity="0.65">日 期</text>
  <text x="1260" y="680" font-size="24" text-anchor="middle" fill="#FFFFFF" font-weight="600">2026年5月</text>
  
  <!-- Bottom academic info -->
  <line x1="760" y1="800" x2="1160" y2="800" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="960" y="840" font-size="18" text-anchor="middle" fill="#FFFFFF" opacity="0.55" letter-spacing="3">XX师范大学 · 音乐学院</text>
  <text x="960" y="872" font-size="14" text-anchor="middle" fill="#FFFFFF" opacity="0.35" letter-spacing="2">XX NORMAL UNIVERSITY · SCHOOL OF MUSIC</text>
  
  <!-- Quote -->
  <text x="960" y="940" font-size="16" text-anchor="middle" fill="#FFFFFF" opacity="0.45" letter-spacing="2">让音乐与技术共舞，让教育更美好</text>
</svg>
