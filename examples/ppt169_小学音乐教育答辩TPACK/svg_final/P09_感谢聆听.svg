<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="endGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E86A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="endGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#endGrad)"/>
  <rect width="1920" height="1080" fill="url(#endGlow)"/>
  
  <!-- Music note background decorations -->
  <g opacity="0.08" fill="#FFFFFF">
    <g transform="translate(150, 120) rotate(-22)">
      <text font-size="120" font-family="serif">♪</text>
    </g>
    <g transform="translate(1750, 180) rotate(18)">
      <text font-size="100" font-family="serif">♫</text>
    </g>
    <g transform="translate(1650, 850) rotate(-28)">
      <text font-size="90" font-family="serif">♩</text>
    </g>
    <g transform="translate(180, 880) rotate(25)">
      <text font-size="80" font-family="serif">♬</text>
    </g>
    <g transform="translate(1800, 450) rotate(-15)">
      <text font-size="70" font-family="serif">♪</text>
    </g>
    <g transform="translate(120, 480) rotate(20)">
      <text font-size="65" font-family="serif">♫</text>
    </g>
    <g transform="translate(1450, 100) rotate(-12)">
      <text font-size="55" font-family="serif">♩</text>
    </g>
    <g transform="translate(280, 280) rotate(30)">
      <text font-size="50" font-family="serif">♬</text>
    </g>
    <g transform="translate(1550, 600) rotate(-20)">
      <text font-size="60" font-family="serif">♪</text>
    </g>
    <g transform="translate(350, 650) rotate(15)">
      <text font-size="45" font-family="serif">♫</text>
    </g>
  </g>
  
  <!-- Academic decorative elements - subtle geometric patterns -->
  <g opacity="0.05">
    <circle cx="200" cy="200" r="150" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="1720" cy="880" r="120" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="1080" x2="1920" y2="0" stroke="#FFFFFF" stroke-width="1"/>
  </g>
  
  <!-- Ant Design style icon: Heart/Thanks -->
  <g transform="translate(900, 220)">
    <path d="M60 100 C60 100 10 60 10 35 C10 15 30 5 45 20 L60 35 L75 20 C90 5 110 15 110 35 C110 60 60 100 60 100Z" fill="none" stroke="#F5A623" stroke-width="3"/>
  </g>
  
  <!-- Main title -->
  <text x="960" y="420" font-size="80" text-anchor="middle" fill="#FFFFFF" font-family="'Noto Serif SC', serif" font-weight="700" letter-spacing="16">感谢聆听</text>
  
  <!-- Subtitle -->
  <text x="960" y="480" font-size="24" text-anchor="middle" fill="#FFFFFF" opacity="0.8" letter-spacing="6">THANK YOU FOR YOUR ATTENTION</text>
  
  <!-- Decorative line -->
  <line x1="700" y1="520" x2="1220" y2="520" stroke="#F5A623" stroke-width="2"/>
  
  <!-- Request for feedback -->
  <text x="960" y="580" font-size="28" text-anchor="middle" fill="#FFFFFF" opacity="0.9">敬请各位评委老师批评指正</text>
  
  <!-- Info cards -->
  <rect x="500" y="640" width="920" height="180" rx="12" fill="rgba(255,255,255,0.1)" filter="url(#cardShadow)"/>
  
  <!-- Divider lines -->
  <line x1="800" y1="660" x2="800" y2="800" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="1120" y1="660" x2="1120" y2="800" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Info 1: 答辩人 -->
  <text x="650" y="700" font-size="20" text-anchor="middle" fill="#FFFFFF" opacity="0.7">答辩人</text>
  <text x="650" y="745" font-size="26" text-anchor="middle" fill="#FFFFFF" font-weight="600">夏周慧</text>
  
  <!-- Info 2: 指导教师 -->
  <text x="960" y="700" font-size="20" text-anchor="middle" fill="#FFFFFF" opacity="0.7">指导教师</text>
  <text x="960" y="745" font-size="26" text-anchor="middle" fill="#FFFFFF" font-weight="600">XXX 教授</text>
  
  <!-- Info 3: 日期 -->
  <text x="1270" y="700" font-size="20" text-anchor="middle" fill="#FFFFFF" opacity="0.7">日 期</text>
  <text x="1270" y="745" font-size="26" text-anchor="middle" fill="#FFFFFF" font-weight="600">2026年5月</text>
  
  <!-- Bottom academic info -->
  <line x1="760" y1="880" x2="1160" y2="880" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="960" y="920" font-size="18" text-anchor="middle" fill="#FFFFFF" opacity="0.6" letter-spacing="4">XX师范大学 · 音乐学院</text>
  <text x="960" y="950" font-size="14" text-anchor="middle" fill="#FFFFFF" opacity="0.4" letter-spacing="2">XX NORMAL UNIVERSITY · SCHOOL OF MUSIC</text>
  
  <!-- Quote -->
  <text x="960" y="1010" font-size="16" text-anchor="middle" fill="#FFFFFF" opacity="0.5" letter-spacing="2">让音乐与技术共舞，让教育更美好</text>
</svg>
