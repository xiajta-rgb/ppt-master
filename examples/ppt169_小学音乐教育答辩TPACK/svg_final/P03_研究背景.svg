<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <filter id="subtleShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-opacity="0.05"/>
    </filter>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E86A2A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#FFFAF5"/>
  
  <!-- Music note background decorations - refined placement -->
  <g opacity="0.06" fill="#E86A2A">
    <g transform="translate(1720, 200) rotate(-15)">
      <text font-size="120" font-family="serif">♪</text>
    </g>
    <g transform="translate(1780, 580) rotate(12)">
      <text font-size="100" font-family="serif">♫</text>
    </g>
    <g transform="translate(140, 780) rotate(-20)">
      <text font-size="90" font-family="serif">♩</text>
    </g>
    <g transform="translate(1550, 150) rotate(8)">
      <text font-size="70" font-family="serif">♬</text>
    </g>
    <g transform="translate(1700, 880) rotate(-10)">
      <text font-size="75" font-family="serif">♪</text>
    </g>
    <g transform="translate(200, 280) rotate(18)">
      <text font-size="60" font-family="serif">♫</text>
    </g>
  </g>
  
  <!-- Header Section -->
  <text x="96" y="95" font-size="64" fill="#E86A2A" font-family="'Noto Serif SC', serif" font-weight="700">01</text>
  <text x="200" y="88" font-size="40" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">研究缘起与问题提出</text>
  <text x="200" y="120" font-size="20" fill="#A08B72" font-family="'Noto Serif SC', serif">Background &amp; Research Questions</text>
  <line x1="96" y1="140" x2="1824" y2="140" stroke="#E86A2A" stroke-width="2" opacity="0.3"/>
  
  <!-- Three Column Cards Layout -->
  <!-- Card 1: 时代背景 -->
  <rect x="96" y="176" width="544" height="680" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="96" y="176" width="6" height="680" rx="3" fill="#E86A2A"/>
  
  <!-- Card 1 Icon -->
  <g transform="translate(136, 210)">
    <circle cx="18" cy="18" r="16" fill="none" stroke="#E86A2A" stroke-width="2"/>
    <ellipse cx="18" cy="18" rx="9" ry="16" fill="none" stroke="#E86A2A" stroke-width="2"/>
    <line x1="2" y1="18" x2="34" y2="18" stroke="#E86A2A" stroke-width="2"/>
  </g>
  <text x="176" y="246" font-size="26" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">时代背景</text>
  
  <!-- Card 1 Content -->
  <text x="136" y="296" font-size="20" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">• 政策驱动：落实《教育信息化2.0》</text>
  <text x="136" y="332" font-size="20" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">   与《艺术课程标准(2022版)》</text>
  <text x="136" y="378" font-size="20" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">• 核心诉求：推动信息技术与学科</text>
  <text x="136" y="414" font-size="20" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">   教学的深度融合</text>
  <text x="136" y="460" font-size="20" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">• 培养学生审美与信息核心素养</text>
  
  <!-- Card 1 Image Placeholder wrapped in group -->
  <g class="image-placeholder-group" data-editable="true">
    <rect x="136" y="503.9657282741738" width="464" height="320" rx="8" fill="#F8F2EC" stroke="#E0D5C8" stroke-width="1" stroke-dasharray="6,4" pointer-events="all" style="opacity: 1;"/>
  </g>
  
  <!-- Card 2: 研究问题 -->
  <rect x="688" y="176" width="544" height="680" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="688" y="176" width="6" height="680" rx="3" fill="#E86A2A"/>
  
  <!-- Card 2 Icon -->
  <g transform="translate(728, 210)">
    <circle cx="18" cy="18" r="16" fill="none" stroke="#E86A2A" stroke-width="2"/>
    <text x="18" y="26" font-size="22" fill="#E86A2A" text-anchor="middle" font-weight="bold" font-family="'Noto Sans SC', sans-serif">?</text>
  </g>
  <text x="768" y="246" font-size="26" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">研究问题</text>
  
  <!-- Card 2 Content -->
  <text x="728" y="296" font-size="20" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">• 如何实现技术与教学的"深度融合"？</text>
  <text x="728" y="342" font-size="20" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">• 如何破解当前"浅融合"困境？</text>
  <text x="728" y="388" font-size="20" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">• 如何让技术真正赋能音乐欣赏教学？</text>
  
  <!-- Card 2 Image Placeholder wrapped in group -->
  <g class="image-placeholder-group" data-editable="true">
    <rect x="721.6883629191323" y="439.9657282741739" width="464" height="384" rx="8" fill="#F8F2EC" stroke="#E0D5C8" stroke-width="1" stroke-dasharray="6,4" pointer-events="all" style="opacity: 1;"/>
  </g>
  
  <!-- Card 3: 现实困境 -->
  <rect x="1280" y="176" width="544" height="680" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="1280" y="176" width="6" height="680" rx="3" fill="#8B7355"/>
  
  <!-- Card 3 Icon -->
  <g transform="translate(1320, 210)">
    <path d="M18 4 L32 28 L4 28 Z" fill="none" stroke="#8B7355" stroke-width="2"/>
    <line x1="18" y1="12" x2="18" y2="18" stroke="#8B7355" stroke-width="2"/>
    <circle cx="18" cy="23" r="1.5" fill="#8B7355"/>
  </g>
  <text x="1360" y="246" font-size="26" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">现实困境</text>
  
  <!-- Card 3 Content -->
  <text x="1320" y="296" font-size="20" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">• 教学模式固化："播放+聆听"</text>
  <text x="1320" y="332" font-size="20" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">   单向传输为主</text>
  <text x="1320" y="378" font-size="20" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">• 技术应用浅表：多为工具辅助，</text>
  <text x="1320" y="414" font-size="20" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">   缺乏深度整合</text>
  <text x="1320" y="460" font-size="20" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">• 学生参与度低：被动接受，缺失</text>
  <text x="1320" y="496" font-size="20" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">   审美探究体验</text>
  
  <!-- Card 3 Image Placeholder wrapped in group -->
  <g class="image-placeholder-group" data-editable="true">
    <rect x="1321.2623274161735" y="533.3561811505508" width="464" height="284" rx="8" fill="#F8F2EC" stroke="#E0D5C8" stroke-width="1" stroke-dasharray="6,4" pointer-events="all" style="opacity: 1;"/>
  </g>
  
  <!-- Research Objective - Subtle Design -->
  <rect x="96" y="896" width="1728" height="80" rx="8" fill="#FFFFFF" stroke="#E86A2A" stroke-width="1.5" filter="url(#subtleShadow)"/>
  <rect x="96" y="896" width="6" height="80" rx="3" fill="#E86A2A"/>
  <text x="136" y="930" font-size="18" fill="#E86A2A" font-family="'Noto Sans SC', sans-serif" font-weight="700">研究目标：</text>
  <text x="240" y="930" font-size="18" fill="#5A4A3A" font-family="'Noto Sans SC', sans-serif">探索一种能有效整合"技术工具、教学方法与音乐学科内容"的新型教学模式，破解"浅融合"困境，让技术真正赋能小学音乐欣赏教学，提升课堂实效。</text>
  
  <!-- Footer -->
  <line x1="96" y1="1020" x2="1824" y2="1020" stroke="#E0D5C8" stroke-width="1"/>
  <text x="960" y="1050" font-size="16" text-anchor="middle" fill="#A08B72" font-family="'Noto Sans SC', sans-serif" letter-spacing="1">基于TPACK理论的小学音乐欣赏教学实践研究 · XX师范大学 · 音乐学院</text>
</svg>