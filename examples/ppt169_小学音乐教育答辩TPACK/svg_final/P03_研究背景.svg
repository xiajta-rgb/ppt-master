<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8961E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#FFF8F0"/>
  
  <!-- Music note background decorations -->
  <g opacity="0.10" fill="#E86A2A">
    <g transform="translate(1700, 180) rotate(-20)">
      <text font-size="110" font-family="serif">♪</text>
    </g>
    <g transform="translate(1800, 600) rotate(15)">
      <text font-size="95" font-family="serif">♫</text>
    </g>
    <g transform="translate(120, 750) rotate(-25)">
      <text font-size="85" font-family="serif">♩</text>
    </g>
    <g transform="translate(1500, 120) rotate(10)">
      <text font-size="65" font-family="serif">♬</text>
    </g>
    <g transform="translate(1750, 850) rotate(-15)">
      <text font-size="70" font-family="serif">♪</text>
    </g>
    <g transform="translate(250, 250) rotate(20)">
      <text font-size="55" font-family="serif">♫</text>
    </g>
    <g transform="translate(1600, 400) rotate(-30)">
      <text font-size="50" font-family="serif">♩</text>
    </g>
    <g transform="translate(100, 450) rotate(25)">
      <text font-size="45" font-family="serif">♬</text>
    </g>
    <g transform="translate(1850, 350) rotate(-10)">
      <text font-size="60" font-family="serif">♫</text>
    </g>
    <g transform="translate(350, 900) rotate(15)">
      <text font-size="40" font-family="serif">♪</text>
    </g>
  </g>
  
  <!-- Header -->
  <text x="80" y="100" font-size="72" fill="#E86A2A" font-family="'Noto Serif SC', serif" font-weight="700">01</text>
  <text x="190" y="90" font-size="44" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">研究缘起与问题提出</text>
  <text x="190" y="125" font-size="22" fill="#8B7355">Background &amp; Research Questions</text>
  <line x1="80" y1="145" x2="1840" y2="145" stroke="#E86A2A" stroke-width="3"/>
  
  <!-- Card 1: 时代背景 -->
  <rect x="80" y="180" width="560" height="600" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="80" y="180" width="8" height="600" rx="4" fill="#E86A2A"/>
  
  <g transform="translate(140, 210)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#E86A2A" stroke-width="2"/>
    <ellipse cx="20" cy="20" rx="10" ry="18" fill="none" stroke="#E86A2A" stroke-width="2"/>
    <line x1="2" y1="20" x2="38" y2="20" stroke="#E86A2A" stroke-width="2"/>
  </g>
  <text x="190" y="248" font-size="28" fill="#2C1810" font-weight="600">时代背景</text>
  
  <text x="140" y="300" font-size="22" fill="#5A4A3A">• 政策驱动：落实《教育信息化2.0》</text>
  <text x="140" y="340" font-size="22" fill="#5A4A3A">   与《艺术课程标准(2022版)》</text>
  <text x="140" y="390" font-size="22" fill="#5A4A3A">• 核心诉求：推动信息技术与学科</text>
  <text x="140" y="430" font-size="22" fill="#5A4A3A">   教学的深度融合</text>
  <text x="140" y="480" font-size="22" fill="#5A4A3A">• 培养学生审美与信息核心素养</text>
  
  <!-- Image placeholder - larger -->
  <rect x="140" y="520" width="440" height="220" rx="8" fill="#F5EDE5" stroke="#D9C5B0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="360" y="615" font-size="20" text-anchor="middle" fill="#8C7B6A">政策文件/教育信息化相关图片</text>
  <text x="360" y="645" font-size="18" text-anchor="middle" fill="#BFB0A0">IMAGE PLACEHOLDER</text>
  
  <!-- Card 2: 研究问题 -->
  <rect x="680" y="180" width="560" height="600" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="680" y="180" width="8" height="600" rx="4" fill="#E86A2A"/>
  
  <g transform="translate(740, 210)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#E86A2A" stroke-width="2"/>
    <text x="20" y="28" font-size="24" fill="#E86A2A" text-anchor="middle" font-weight="bold">?</text>
  </g>
  <text x="790" y="248" font-size="28" fill="#2C1810" font-weight="600">研究问题</text>
  
  <text x="740" y="300" font-size="22" fill="#5A4A3A">• 如何实现技术与教学的"深度融合"？</text>
  <text x="740" y="350" font-size="22" fill="#5A4A3A">• 如何破解当前"浅融合"困境？</text>
  <text x="740" y="400" font-size="22" fill="#5A4A3A">• 如何让技术真正赋能音乐欣赏教学？</text>
  
  <!-- Image placeholder - larger -->
  <rect x="740" y="450" width="440" height="290" rx="8" fill="#F5EDE5" stroke="#D9C5B0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="960" y="580" font-size="20" text-anchor="middle" fill="#8C7B6A">研究问题框架图/思维导图</text>
  <text x="960" y="610" font-size="18" text-anchor="middle" fill="#BFB0A0">IMAGE PLACEHOLDER</text>
  
  <!-- Card 3: 现实困境 -->
  <rect x="1280" y="180" width="560" height="600" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="1280" y="180" width="8" height="600" rx="4" fill="#8B7355"/>
  
  <g transform="translate(1340, 210)">
    <path d="M20 4 L36 32 L4 32 Z" fill="none" stroke="#8B7355" stroke-width="2"/>
    <line x1="20" y1="14" x2="20" y2="22" stroke="#8B7355" stroke-width="2"/>
    <circle cx="20" cy="27" r="1.5" fill="#8B7355"/>
  </g>
  <text x="1390" y="248" font-size="28" fill="#2C1810" font-weight="600">现实困境</text>
  
  <text x="1340" y="300" font-size="22" fill="#5A4A3A">• 教学模式固化："播放+聆听"</text>
  <text x="1340" y="330" font-size="22" fill="#5A4A3A">   单向传输为主</text>
  <text x="1340" y="380" font-size="22" fill="#5A4A3A">• 技术应用浅表：多为工具辅助，</text>
  <text x="1340" y="410" font-size="22" fill="#5A4A3A">   缺乏深度整合</text>
  <text x="1340" y="460" font-size="22" fill="#5A4A3A">• 学生参与度低：被动接受，缺失</text>
  <text x="1340" y="490" font-size="22" fill="#5A4A3A">   审美探究体验</text>
  
  <!-- Image placeholder - larger -->
  <rect x="1340" y="520" width="440" height="220" rx="8" fill="#F5EDE5" stroke="#D9C5B0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1560" y="615" font-size="20" text-anchor="middle" fill="#8C7B6A">传统课堂现状照片</text>
  <text x="1560" y="645" font-size="18" text-anchor="middle" fill="#BFB0A0">IMAGE PLACEHOLDER</text>
  
  <!-- Summary card -->
  <defs>
    <linearGradient id="summaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E86A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="80" y="820" width="1760" height="120" rx="12" fill="url(#summaryGrad)"/>
  <text x="140" y="865" font-size="22" fill="#F5A623" font-weight="700">研究目标：</text>
  <text x="280" y="865" font-size="22" fill="#FFFFFF">探索一种能有效整合"技术工具、教学方法与音乐学科内容"</text>
  <text x="280" y="900" font-size="22" fill="#FFFFFF">的新型教学模式，破解"浅融合"困境，让技术真正赋能小学</text>
  <text x="280" y="935" font-size="22" fill="#FFFFFF">音乐欣赏教学，提升课堂实效。</text>
  
  <!-- Bottom decorative element -->
  <line x1="80" y1="980" x2="1840" y2="980" stroke="#E86A2A" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="960" y="1015" font-size="18" text-anchor="middle" fill="#8B7355" letter-spacing="2">基于TPACK理论的小学音乐欣赏教学实践研究</text>
  <text x="960" y="1045" font-size="16" text-anchor="middle" fill="#8B7355" letter-spacing="1">XX师范大学 · 音乐学院</text>
</svg>
