<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E86A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#F8F9FA"/>
  
  <!-- Music note background decorations -->
  <g opacity="0.08" fill="#E86A2A">
    <g transform="translate(1750, 200) rotate(-18)">
      <text font-size="88" font-family="serif">♪</text>
    </g>
    <g transform="translate(1820, 650) rotate(22)">
      <text font-size="72" font-family="serif">♫</text>
    </g>
    <g transform="translate(140, 780) rotate(-28)">
      <text font-size="64" font-family="serif">♩</text>
    </g>
    <g transform="translate(1550, 160) rotate(12)">
      <text font-size="52" font-family="serif">♬</text>
    </g>
    <g transform="translate(1780, 880) rotate(-15)">
      <text font-size="56" font-family="serif">♪</text>
    </g>
    <g transform="translate(240, 260) rotate(18)">
      <text font-size="44" font-family="serif">♫</text>
    </g>
  </g>
  
  <!-- Header -->
  <text x="96" y="108" font-size="64" fill="#E86A2A" font-family="'Noto Serif SC', serif" font-weight="700">06</text>
  <text x="200" y="96" font-size="40" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">研究结论与未来展望</text>
  <text x="200" y="128" font-size="20" fill="#8B7355">Conclusion &amp; Future Outlook</text>
  <line x1="96" y1="152" x2="1824" y2="152" stroke="#F5A623" stroke-width="3"/>
  
  <!-- Card 1: 研究结论 -->
  <rect x="96" y="184" width="560" height="760" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="96" y="184" width="6" height="760" rx="3" fill="#F5A623"/>
  
  <g transform="translate(144, 224)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#F5A623" stroke-width="2"/>
    <polyline points="10,20 16,26 30,14" fill="none" stroke="#F5A623" stroke-width="2"/>
  </g>
  <text x="192" y="260" font-size="26" fill="#2C1810" font-weight="600">研究结论</text>
  
  <rect x="144" y="296" width="464" height="120" rx="10" fill="#F8F9FA"/>
  <text x="176" y="336" font-size="20" fill="#2C1810" font-weight="600">模型可行性验证</text>
  <text x="176" y="372" font-size="16" fill="#5A5D75">TPACK理论指导下的音乐欣赏教学模型切实可行</text>
  
  <rect x="144" y="432" width="464" height="120" rx="10" fill="#F8F9FA"/>
  <text x="176" y="472" font-size="20" fill="#2C1810" font-weight="600">技术赋能成效</text>
  <text x="176" y="508" font-size="16" fill="#5A5D75">技术赋能显著提升课堂实效与学生参与度</text>
  
  <rect x="144" y="568" width="464" height="120" rx="10" fill="#F8F9FA"/>
  <text x="176" y="608" font-size="20" fill="#2C1810" font-weight="600">教学路径提供</text>
  <text x="176" y="644" font-size="16" fill="#5A5D75">为小学音乐教师提供可操作的信息化教学路径</text>
  
  <rect x="144" y="704" width="464" height="120" rx="10" fill="#F8F9FA"/>
  <text x="176" y="744" font-size="20" fill="#2C1810" font-weight="600">教师专业发展</text>
  <text x="176" y="780" font-size="16" fill="#5A5D75">促进教师信息技术与学科教学整合能力发展</text>
  
  <!-- Card 2: 研究不足 -->
  <rect x="688" y="184" width="560" height="760" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="688" y="184" width="6" height="760" rx="3" fill="#E86A2A"/>
  
  <g transform="translate(736, 224)">
    <path d="M20 4 L36 32 L4 32 Z" fill="none" stroke="#E86A2A" stroke-width="2"/>
    <line x1="20" y1="14" x2="20" y2="22" stroke="#E86A2A" stroke-width="2"/>
    <circle cx="20" cy="26" r="1.5" fill="#E86A2A"/>
  </g>
  <text x="784" y="260" font-size="26" fill="#2C1810" font-weight="600">研究不足</text>
  
  <rect x="736" y="296" width="464" height="152" rx="10" fill="#F8F9FA"/>
  <text x="768" y="336" font-size="20" fill="#2C1810" font-weight="600">样本局限性</text>
  <text x="768" y="372" font-size="16" fill="#5A5D75">本研究选取的样本仅局限于一所学校的特定年级，</text>
  <text x="768" y="400" font-size="16" fill="#5A5D75">研究结果的外部推广性有待进一步验证</text>
  
  <rect x="736" y="464" width="464" height="152" rx="10" fill="#F8F9FA"/>
  <text x="768" y="504" font-size="20" fill="#2C1810" font-weight="600">时间周期短</text>
  <text x="768" y="540" font-size="16" fill="#5A5D75">教学实践周期相对较短，对于学生音乐审美素养的</text>
  <text x="768" y="568" font-size="16" fill="#5A5D75">长期影响还需长期观察与追踪</text>
  
  <rect x="736" y="632" width="464" height="152" rx="10" fill="#F8F9FA"/>
  <text x="768" y="672" font-size="20" fill="#2C1810" font-weight="600">技术依赖风险</text>
  <text x="768" y="708" font-size="16" fill="#5A5D75">过度依赖技术可能削弱教师主导作用，需平衡技术</text>
  <text x="768" y="736" font-size="16" fill="#5A5D75">与教学本质的关系</text>
  
  <!-- Card 3: 未来展望 -->
  <rect x="1280" y="184" width="560" height="760" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="1280" y="184" width="6" height="760" rx="3" fill="#F5A623"/>
  
  <g transform="translate(1328, 224)">
    <path d="M20 4 C20 4 28 12 28 20 C28 28 20 36 20 36 C20 36 12 28 12 20 C12 12 20 4 20 4Z" fill="none" stroke="#F5A623" stroke-width="2"/>
    <circle cx="20" cy="20" r="4" fill="none" stroke="#F5A623" stroke-width="2"/>
    <line x1="20" y1="36" x2="20" y2="40" stroke="#F5A623" stroke-width="2"/>
  </g>
  <text x="1376" y="260" font-size="26" fill="#2C1810" font-weight="600">未来展望</text>
  
  <rect x="1328" y="296" width="464" height="152" rx="10" fill="#F8F9FA"/>
  <text x="1360" y="336" font-size="20" fill="#2C1810" font-weight="600">拓展应用范围</text>
  <text x="1360" y="372" font-size="16" fill="#5A5D75">将TPACK教学模型推广至小学音乐不同年级段，</text>
  <text x="1360" y="400" font-size="16" fill="#5A5D75">涵盖不同风格、体裁的音乐作品</text>
  
  <rect x="1328" y="464" width="464" height="152" rx="10" fill="#F8F9FA"/>
  <text x="1360" y="504" font-size="20" fill="#2C1810" font-weight="600">融合前沿技术</text>
  <text x="1360" y="540" font-size="16" fill="#5A5D75">积极探索人工智能、虚拟现实等更前沿的信息技术</text>
  <text x="1360" y="568" font-size="16" fill="#5A5D75">手段在音乐欣赏教学中的融合与应用</text>
  
  <rect x="1328" y="632" width="464" height="152" rx="10" fill="#F8F9FA"/>
  <text x="1360" y="672" font-size="20" fill="#2C1810" font-weight="600">跨学科研究</text>
  <text x="1360" y="708" font-size="16" fill="#5A5D75">探索TPACK在其他学科教学中的应用模式，</text>
  <text x="1360" y="736" font-size="16" fill="#5A5D75">形成可推广的跨学科教学框架</text>
  
  <!-- Footer -->
  <line x1="96" y1="984" x2="1824" y2="984" stroke="#F5A623" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="960" y="1016" font-size="16" text-anchor="middle" fill="#8B7355" letter-spacing="2">基于TPACK理论的小学音乐欣赏教学实践研究</text>
  <text x="960" y="1044" font-size="14" text-anchor="middle" fill="#8B7355" letter-spacing="1">XX师范大学 · 音乐学院</text>
</svg>
