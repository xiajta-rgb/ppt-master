<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E86A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#F8F9FA"/>
  
  <!-- Music note background decorations -->
  <g opacity="0.10" fill="#E86A2A">
    <g transform="translate(1680, 160) rotate(-18)">
      <text font-size="110" font-family="serif">♪</text>
    </g>
    <g transform="translate(1750, 580) rotate(22)">
      <text font-size="95" font-family="serif">♫</text>
    </g>
    <g transform="translate(130, 720) rotate(-28)">
      <text font-size="85" font-family="serif">♩</text>
    </g>
    <g transform="translate(1480, 110) rotate(12)">
      <text font-size="65" font-family="serif">♬</text>
    </g>
    <g transform="translate(1720, 820) rotate(-15)">
      <text font-size="70" font-family="serif">♪</text>
    </g>
    <g transform="translate(220, 220) rotate(18)">
      <text font-size="55" font-family="serif">♫</text>
    </g>
    <g transform="translate(1580, 380) rotate(-25)">
      <text font-size="50" font-family="serif">♩</text>
    </g>
    <g transform="translate(120, 420) rotate(28)">
      <text font-size="45" font-family="serif">♬</text>
    </g>
    <g transform="translate(1830, 320) rotate(-8)">
      <text font-size="60" font-family="serif">♫</text>
    </g>
    <g transform="translate(320, 880) rotate(22)">
      <text font-size="40" font-family="serif">♪</text>
    </g>
  </g>
  
  <!-- Header -->
  <text x="80" y="100" font-size="72" fill="#E86A2A" font-family="'Noto Serif SC', serif" font-weight="700">06</text>
  <text x="190" y="90" font-size="44" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">研究结论与未来展望</text>
  <text x="190" y="125" font-size="22" fill="#8B7355">Conclusion &amp; Future Outlook</text>
  <line x1="80" y1="145" x2="1840" y2="145" stroke="#F5A623" stroke-width="3"/>
  
  <!-- Card 1: 研究结论 -->
  <rect x="80" y="180" width="560" height="700" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="80" y="180" width="8" height="700" rx="4" fill="#F5A623"/>
  
  <g transform="translate(130, 210)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#F5A623" stroke-width="2"/>
    <polyline points="10,20 16,26 30,14" fill="none" stroke="#F5A623" stroke-width="2"/>
  </g>
  <text x="180" y="248" font-size="28" fill="#2C1810" font-weight="600">研究结论</text>
  
  <line x1="130" y1="290" x2="590" y2="290" stroke="#F0F2F5" stroke-width="1"/>
  
  <rect x="130" y="320" width="460" height="110" rx="8" fill="#F0F2F5"/>
  <text x="150" y="360" font-size="22" fill="#2C1810" font-weight="600">模型可行性验证</text>
  <text x="150" y="400" font-size="22" fill="#5A5D75">TPACK理论指导下的音乐欣赏教学模型切实可行</text>
  
  <rect x="130" y="450" width="460" height="110" rx="8" fill="#F0F2F5"/>
  <text x="150" y="490" font-size="22" fill="#2C1810" font-weight="600">技术赋能成效</text>
  <text x="150" y="530" font-size="22" fill="#5A5D75">技术赋能显著提升课堂实效与学生参与度</text>
  
  <rect x="130" y="580" width="460" height="110" rx="8" fill="#F0F2F5"/>
  <text x="150" y="620" font-size="22" fill="#2C1810" font-weight="600">教学路径提供</text>
  <text x="150" y="660" font-size="22" fill="#5A5D75">为小学音乐教师提供可操作的信息化教学路径</text>
  
  <rect x="130" y="710" width="460" height="60" rx="8" fill="#F0F2F5"/>
  <text x="150" y="750" font-size="22" fill="#2C1810" font-weight="600">教师专业发展</text>
  
  <!-- Image placeholder - larger -->
  <rect x="130" y="790" width="460" height="80" rx="8" fill="#F0F2F5" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="360" y="835" font-size="18" text-anchor="middle" fill="#8C8C8C">研究结论示意图</text>
  
  <!-- Card 2: 研究不足 -->
  <rect x="680" y="180" width="560" height="700" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="680" y="180" width="8" height="700" rx="4" fill="#E86A2A"/>
  
  <g transform="translate(730, 210)">
    <path d="M20 4 L36 32 L4 32 Z" fill="none" stroke="#E86A2A" stroke-width="2"/>
    <line x1="20" y1="14" x2="20" y2="22" stroke="#E86A2A" stroke-width="2"/>
    <circle cx="20" cy="26" r="1.5" fill="#E86A2A"/>
  </g>
  <text x="780" y="248" font-size="28" fill="#2C1810" font-weight="600">研究不足</text>
  
  <line x1="730" y1="290" x2="1190" y2="290" stroke="#F0F2F5" stroke-width="1"/>
  
  <rect x="730" y="320" width="460" height="140" rx="8" fill="#F0F2F5"/>
  <text x="750" y="360" font-size="22" fill="#2C1810" font-weight="600">样本局限性</text>
  <text x="750" y="400" font-size="20" fill="#5A5D75">本研究选取的样本仅局限于一所学校的特定年级，</text>
  <text x="750" y="435" font-size="20" fill="#5A5D75">研究结果的外部推广性有待进一步验证</text>
  
  <rect x="730" y="480" width="460" height="140" rx="8" fill="#F0F2F5"/>
  <text x="750" y="520" font-size="22" fill="#2C1810" font-weight="600">时间周期短</text>
  <text x="750" y="560" font-size="20" fill="#5A5D75">教学实践周期相对较短，对于学生音乐审美素养的</text>
  <text x="750" y="595" font-size="20" fill="#5A5D75">长期影响还需长期观察与追踪</text>
  
  <rect x="730" y="640" width="460" height="140" rx="8" fill="#F0F2F5"/>
  <text x="750" y="680" font-size="22" fill="#2C1810" font-weight="600">技术依赖风险</text>
  <text x="750" y="720" font-size="20" fill="#5A5D75">过度依赖技术可能削弱教师主导作用，需平衡技术</text>
  <text x="750" y="755" font-size="20" fill="#5A5D75">与教学本质的关系</text>
  
  <!-- Card 3: 未来展望 -->
  <rect x="1280" y="180" width="560" height="700" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="1280" y="180" width="8" height="700" rx="4" fill="#F5A623"/>
  
  <g transform="translate(1330, 210)">
    <path d="M20 4 C20 4 28 12 28 20 C28 28 20 36 20 36 C20 36 12 28 12 20 C12 12 20 4 20 4Z" fill="none" stroke="#F5A623" stroke-width="2"/>
    <circle cx="20" cy="20" r="4" fill="none" stroke="#F5A623" stroke-width="2"/>
    <line x1="20" y1="36" x2="20" y2="40" stroke="#F5A623" stroke-width="2"/>
  </g>
  <text x="1380" y="248" font-size="28" fill="#2C1810" font-weight="600">未来展望</text>
  
  <line x1="1330" y1="290" x2="1790" y2="290" stroke="#F0F2F5" stroke-width="1"/>
  
  <rect x="1330" y="320" width="460" height="140" rx="8" fill="#F0F2F5"/>
  <text x="1350" y="360" font-size="22" fill="#2C1810" font-weight="600">拓展应用范围</text>
  <text x="1350" y="400" font-size="20" fill="#5A5D75">将TPACK教学模型推广至小学音乐不同年级段，</text>
  <text x="1350" y="435" font-size="20" fill="#5A5D75">涵盖不同风格、体裁的音乐作品</text>
  
  <rect x="1330" y="480" width="460" height="140" rx="8" fill="#F0F2F5"/>
  <text x="1350" y="520" font-size="22" fill="#2C1810" font-weight="600">融合前沿技术</text>
  <text x="1350" y="560" font-size="20" fill="#5A5D75">积极探索人工智能、虚拟现实等更前沿的信息技术</text>
  <text x="1350" y="595" font-size="20" fill="#5A5D75">手段在音乐欣赏教学中的融合与应用</text>
  
  <rect x="1330" y="640" width="460" height="140" rx="8" fill="#F0F2F5"/>
  <text x="1350" y="680" font-size="22" fill="#2C1810" font-weight="600">跨学科研究</text>
  <text x="1350" y="720" font-size="20" fill="#5A5D75">探索TPACK在其他学科教学中的应用模式，</text>
  <text x="1350" y="755" font-size="20" fill="#5A5D75">形成可推广的跨学科教学框架</text>
  
  <!-- Bottom decorative element -->
  <line x1="80" y1="920" x2="1840" y2="920" stroke="#F5A623" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="960" y="955" font-size="18" text-anchor="middle" fill="#8B7355" letter-spacing="2">基于TPACK理论的小学音乐欣赏教学实践研究</text>
  <text x="960" y="985" font-size="16" text-anchor="middle" fill="#8B7355" letter-spacing="1">XX师范大学 · 音乐学院</text>
</svg>
