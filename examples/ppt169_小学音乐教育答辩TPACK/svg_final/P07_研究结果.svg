<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#F8F9FA"/>
  
  <!-- Music note background decorations -->
  <g opacity="0.08" fill="#E86A2A">
    <g transform="translate(1720, 180) rotate(-15)">
      <text font-size="88" font-family="serif">♪</text>
    </g>
    <g transform="translate(1840, 600) rotate(20)">
      <text font-size="72" font-family="serif">♫</text>
    </g>
    <g transform="translate(130, 750) rotate(-25)">
      <text font-size="64" font-family="serif">♩</text>
    </g>
    <g transform="translate(1520, 150) rotate(10)">
      <text font-size="52" font-family="serif">♬</text>
    </g>
    <g transform="translate(1760, 850) rotate(-20)">
      <text font-size="56" font-family="serif">♪</text>
    </g>
    <g transform="translate(240, 240) rotate(15)">
      <text font-size="44" font-family="serif">♫</text>
    </g>
  </g>
  
  <!-- Header -->
  <text x="96" y="108" font-size="64" fill="#E86A2A" font-family="'Noto Serif SC', serif" font-weight="700">05</text>
  <text x="200" y="96" font-size="40" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">研究结果与分析</text>
  <text x="200" y="128" font-size="20" fill="#8B7355">Research Results &amp; Analysis</text>
  <line x1="96" y1="152" x2="1824" y2="152" stroke="#F5A623" stroke-width="3"/>
  
  <!-- Left section: Quantitative -->
  <rect x="96" y="184" width="848" height="760" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="96" y="184" width="6" height="760" rx="3" fill="#F5A623"/>
  
  <!-- Icon and title -->
  <g transform="translate(144, 224)">
    <rect x="0" y="12" width="8" height="16" rx="2" fill="#F5A623"/>
    <rect x="12" y="6" width="8" height="22" rx="2" fill="#F5A623"/>
    <rect x="24" y="0" width="8" height="28" rx="2" fill="#F5A623"/>
  </g>
  <text x="200" y="260" font-size="26" fill="#2C1810" font-weight="600">量化数据分析</text>
  
  <!-- Data items - 2 items to make room for 4:3 chart -->
  <rect x="144" y="296" width="752" height="72" rx="8" fill="#F8F9FA"/>
  <text x="184" y="328" font-size="18" fill="#2C1810" font-weight="600">课堂表现</text>
  <text x="184" y="352" font-size="16" fill="#5A5D75">实验组学生在课堂参与度、互动频率上显著高于对照组</text>
  
  <rect x="144" y="384" width="752" height="72" rx="8" fill="#F8F9FA"/>
  <text x="184" y="416" font-size="18" fill="#2C1810" font-weight="600">学习效果</text>
  <text x="184" y="440" font-size="16" fill="#5A5D75">实验组在旋律模唱、音乐知识问答等课后测试中的正确率更高</text>
  
  <!-- Chart placeholder wrapped in group (4:3 ratio 560x420) -->
  <g class="image-placeholder-group" data-editable="true">
    <rect x="244" y="488" width="560" height="420" rx="8" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="6,4"/>
    <text x="524" y="700" font-size="20" text-anchor="middle" fill="#8C8C8C" class="upload-trigger" pointer-events="all" cursor="pointer">📷 上传图片</text>
  </g>
  
  <!-- Right section: Qualitative -->
  <rect x="976" y="184" width="848" height="760" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="976" y="184" width="6" height="760" rx="3" fill="#E86A2A"/>
  
  <!-- Icon and title -->
  <g transform="translate(1024, 224)">
    <path d="M4 4 L36 4 L36 24 L12 24 L4 32 Z" fill="none" stroke="#E86A2A" stroke-width="2"/>
    <line x1="12" y1="12" x2="28" y2="12" stroke="#E86A2A" stroke-width="2"/>
    <line x1="12" y1="18" x2="24" y2="18" stroke="#E86A2A" stroke-width="2"/>
  </g>
  <text x="1080" y="260" font-size="26" fill="#2C1810" font-weight="600">质性分析反馈</text>
  
  <!-- Feedback items - 2 items to make room for 4:3 image -->
  <rect x="1024" y="296" width="752" height="72" rx="8" fill="#F8F9FA"/>
  <text x="1064" y="328" font-size="18" fill="#2C1810" font-weight="600">课堂观察</text>
  <text x="1064" y="352" font-size="16" fill="#5A5D75">实验组课堂氛围活跃，学生主动提问与互动频率高</text>
  
  <rect x="1024" y="384" width="752" height="72" rx="8" fill="#F8F9FA"/>
  <text x="1064" y="416" font-size="18" fill="#2C1810" font-weight="600">教师访谈</text>
  <text x="1064" y="440" font-size="16" fill="#5A5D75">TPACK模型有效整合技术，教学设计更具系统性与针对性</text>
  
  <!-- Image placeholder wrapped in group (4:3 ratio 560x420) -->
  <g class="image-placeholder-group" data-editable="true">
    <rect x="1124" y="488" width="560" height="420" rx="8" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="6,4"/>
    <text x="1404" y="700" font-size="20" text-anchor="middle" fill="#8C8C8C" class="upload-trigger" pointer-events="all" cursor="pointer">📷 上传图片</text>
  </g>
  
  <!-- Footer -->
  <line x1="96" y1="984" x2="1824" y2="984" stroke="#F5A623" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="960" y="1016" font-size="16" text-anchor="middle" fill="#8B7355" letter-spacing="2">基于TPACK理论的小学音乐欣赏教学实践研究</text>
  <text x="960" y="1044" font-size="14" text-anchor="middle" fill="#8B7355" letter-spacing="1">XX师范大学 · 音乐学院</text>
</svg>
