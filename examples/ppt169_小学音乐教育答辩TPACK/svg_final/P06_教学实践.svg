<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="practiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E86A2A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#F8F9FA"/>
  
  <!-- Music note background decorations -->
  <g opacity="0.08" fill="#E86A2A">
    <g transform="translate(1680, 220) rotate(-15)">
      <text font-size="88" font-family="serif">♪</text>
    </g>
    <g transform="translate(1820, 720) rotate(25)">
      <text font-size="72" font-family="serif">♫</text>
    </g>
    <g transform="translate(160, 820) rotate(-30)">
      <text font-size="64" font-family="serif">♪</text>
    </g>
    <g transform="translate(1480, 180) rotate(10)">
      <text font-size="52" font-family="serif">♩</text>
    </g>
    <g transform="translate(1720, 480) rotate(-20)">
      <text font-size="48" font-family="serif"/>
    </g>
    <g transform="translate(220, 320) rotate(15)">
      <text font-size="44" font-family="serif"/>
    </g>
  </g>
  
  <!-- Header -->
  <text x="96" y="108" font-size="64" fill="#E86A2A" font-family="'Noto Serif SC', serif" font-weight="700">04</text>
  <text x="200" y="96" font-size="40" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">教学实践与案例分析</text>
  <text x="200" y="128" font-size="20" fill="#8B7355">Teaching Practice &amp; Case Study</text>
  <line x1="96" y1="152" x2="1824" y2="152" stroke="#F5A623" stroke-width="3"/>
  
  <!-- Left panel -->
  <rect x="96" y="184" width="528" height="760" rx="12" fill="url(#practiceGrad)"/>
  
  <text x="360" y="260" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="600">沂蒙山小调</text>
  <line x1="152" y1="288" x2="568" y2="288" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  
  <text x="152" y="340" font-size="24" fill="#FFFFFF" font-weight="700">教学目标</text>
  <text x="152" y="380" font-size="18" fill="#FFFFFF" opacity="0.9">以音乐学科核心素养为导向，整合设定知识、</text>
  <text x="152" y="410" font-size="18" fill="#FFFFFF" opacity="0.9">过程、情感三维教学目标，实现审美与育人价值的统一。</text>
  
  <text x="152" y="490" font-size="24" fill="#FFFFFF" font-weight="700">教学重难点</text>
  <text x="152" y="530" font-size="18" fill="#FFFFFF" opacity="0.9">深入理解中国传统民歌典型的"起承转合"曲式结构，</text>
  <text x="152" y="560" font-size="18" fill="#FFFFFF" opacity="0.9">并准确掌握"鱼咬尾"（衔尾式）的旋律发展技法。</text>
  
  <line x1="152" y1="660" x2="568" y2="660" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  <text x="360" y="700" font-size="20" fill="#FFFFFF" opacity="0.7" text-anchor="middle">人教版小学音乐 · 二年级</text>
  <text x="360" y="730" font-size="18" fill="#FFFFFF" opacity="0.5" text-anchor="middle">教学实践周期：4周</text>
  
  <!-- Right panel: Steps -->
  <!-- Step 1 -->
  <rect x="656" y="184" width="1168" height="232" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="656" y="184" width="6" height="232" rx="3" fill="#F5A623"/>
  
  <circle cx="720" cy="300" r="36" fill="url(#practiceGrad)"/>
  <text x="720" y="312" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="600">1</text>
  
  <text x="780" y="260" font-size="26" fill="#2C1810" font-weight="600">情景激趣</text>
  <text x="780" y="296" font-size="18" fill="#5A5D75">融合地域文化与现代技术，利用AI数字人与VR全景技术</text>
  <text x="780" y="324" font-size="18" fill="#5A5D75">创设沉浸式沂蒙山情境</text>
  
  <rect x="780" y="344" width="80" height="32" rx="16" fill="#F0F2F5"/>
  <text x="820" y="366" font-size="16" fill="#E86A2A" text-anchor="middle">TCK</text>
  <rect x="870" y="344" width="80" height="32" rx="16" fill="#F0F2F5"/>
  <text x="910" y="366" font-size="16" fill="#E86A2A" text-anchor="middle">TPK</text>
  
  <!-- Image placeholder wrapped in group -->
  <g class="image-placeholder-group" data-editable="true">
    <rect x="1120" y="224" width="400" height="160" rx="8" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4" pointer-events="all" style="opacity: 1;"/>
    <text x="1320" y="312" font-size="20" text-anchor="middle" fill="#8C8C8C" class="upload-trigger" pointer-events="all" cursor="pointer">📷 上传图片</text>
  </g>
  
  <!-- Step 2 -->
  <rect x="656" y="440" width="1168" height="232" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="656" y="440" width="6" height="232" rx="3" fill="#F5A623"/>
  
  <circle cx="720" cy="556" r="36" fill="url(#practiceGrad)"/>
  <text x="720" y="568" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="600">2</text>
  
  <text x="780" y="516" font-size="26" fill="#2C1810" font-weight="600">乐知探究</text>
  <text x="780" y="552" font-size="18" fill="#5A5D75">利用希沃白板动态演示"鱼咬尾"旋律线条；设计</text>
  <text x="780" y="580" font-size="18" fill="#5A5D75">"旋律排序"游戏引导自主发现规律</text>
  
  <rect x="780" y="600" width="100" height="32" rx="16" fill="#F0F2F5"/>
  <text x="830" y="622" font-size="16" fill="#E86A2A" text-anchor="middle">TPACK</text>
  <rect x="890" y="600" width="100" height="32" rx="16" fill="#F0F2F5"/>
  <text x="940" y="622" font-size="16" fill="#E86A2A" text-anchor="middle">深度融合</text>
  
  <!-- Image placeholder wrapped in group -->
  <g class="image-placeholder-group" data-editable="true">
    <rect x="1120" y="480" width="400" height="160" rx="8" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4" pointer-events="all" style="opacity: 1;"/>
    <text x="1320" y="568" font-size="20" text-anchor="middle" fill="#8C8C8C" class="upload-trigger" pointer-events="all" cursor="pointer">📷 上传图片</text>
  </g>
  
  <!-- Step 3 -->
  <rect x="656" y="696" width="1168" height="232" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="656" y="696" width="6" height="232" rx="3" fill="#F5A623"/>
  
  <circle cx="720" cy="812" r="36" fill="url(#practiceGrad)"/>
  <text x="720" y="824" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="600">3</text>
  
  <text x="780" y="772" font-size="26" fill="#2C1810" font-weight="600">拓展审美</text>
  <text x="780" y="808" font-size="18" fill="#5A5D75">借助"库乐队"软件让学生实时切换不同乐器音色</text>
  <text x="780" y="836" font-size="18" fill="#5A5D75">进行演奏对比，提升审美鉴赏能力</text>
  
  <rect x="780" y="856" width="80" height="32" rx="16" fill="#F0F2F5"/>
  <text x="820" y="878" font-size="16" fill="#E86A2A" text-anchor="middle">TPK</text>
  <rect x="870" y="856" width="80" height="32" rx="16" fill="#F0F2F5"/>
  <text x="910" y="878" font-size="16" fill="#E86A2A" text-anchor="middle">TCK</text>
  
  <!-- Image placeholder wrapped in group -->
  <g class="image-placeholder-group" data-editable="true">
    <rect x="1202.0645161290322" y="731.3548387096774" width="400" height="160" rx="8" fill="#F8F9FA" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4" pointer-events="all" style="opacity: 1;"/>
    <text x="1402" y="819" font-size="20" text-anchor="middle" fill="#8C8C8C" class="upload-trigger" pointer-events="all" cursor="pointer">📷 上传图片</text>
  </g>
  
  <!-- Footer -->
  <line x1="96" y1="984" x2="1824" y2="984" stroke="#F5A623" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="960" y="1016" font-size="16" text-anchor="middle" fill="#8B7355" letter-spacing="2">基于TPACK理论的小学音乐欣赏教学实践研究</text>
  <text x="960" y="1044" font-size="14" text-anchor="middle" fill="#8B7355" letter-spacing="1">XX师范大学 · 音乐学院</text>
</svg>