<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="practiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E86A2A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D35400;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="#F8F9FA"/>
  
  <!-- Music note background decorations -->
  <g opacity="0.10" fill="#E86A2A">
    <g transform="translate(1600, 200) rotate(-15)">
      <text font-size="120" font-family="serif">♪</text>
    </g>
    <g transform="translate(1750, 700) rotate(25)">
      <text font-size="100" font-family="serif">♫</text>
    </g>
    <g transform="translate(150, 800) rotate(-30)">
      <text font-size="90" font-family="serif">♪</text>
    </g>
    <g transform="translate(1400, 150) rotate(10)">
      <text font-size="70" font-family="serif">♩</text>
    </g>
    <g transform="translate(1650, 450) rotate(-20)">
      <text font-size="65" font-family="serif">♬</text>
    </g>
    <g transform="translate(200, 300) rotate(15)">
      <text font-size="60" font-family="serif">♫</text>
    </g>
    <g transform="translate(1800, 900) rotate(-10)">
      <text font-size="50" font-family="serif">♪</text>
    </g>
    <g transform="translate(100, 500) rotate(20)">
      <text font-size="45" font-family="serif">♩</text>
    </g>
    <g transform="translate(1550, 850) rotate(-25)">
      <text font-size="55" font-family="serif">♬</text>
    </g>
    <g transform="translate(300, 950) rotate(30)">
      <text font-size="40" font-family="serif">♫</text>
    </g>
  </g>
  
  <!-- Header -->
  <text x="80" y="100" font-size="72" fill="#E86A2A" font-family="'Noto Serif SC', serif" font-weight="700">04</text>
  <text x="190" y="90" font-size="44" fill="#2C1810" font-family="'Noto Serif SC', serif" font-weight="600">教学实践与案例分析</text>
  <text x="190" y="125" font-size="22" fill="#8B7355">Teaching Practice &amp; Case Study</text>
  <line x1="80" y1="145" x2="1840" y2="145" stroke="#F5A623" stroke-width="3"/>
  
  <!-- Left panel -->
  <rect x="80" y="180" width="560" height="720" rx="12" fill="url(#practiceGrad)"/>
  <rect x="80" y="180" width="8" height="720" rx="4" fill="#FFFFFF" opacity="0.2"/>
  <text x="360" y="260" font-size="44" fill="#FFFFFF" text-anchor="middle" font-weight="600">沂蒙山小调</text>
  <line x1="140" y1="290" x2="580" y2="290" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  
  <text x="140" y="350" font-size="28" fill="#FFFFFF" font-weight="700">教学目标</text>
  <text x="140" y="395" font-size="24" fill="#FFFFFF" opacity="0.9">以音乐学科核心素养为导向，整合设定知识、过程、</text>
  <text x="140" y="430" font-size="24" fill="#FFFFFF" opacity="0.9">情感三维教学目标，实现审美与育人价值的统一。</text>
  
  <text x="140" y="520" font-size="28" fill="#FFFFFF" font-weight="700">教学重难点</text>
  <text x="140" y="565" font-size="24" fill="#FFFFFF" opacity="0.9">深入理解中国传统民歌典型的"起承转合"曲式结构，</text>
  <text x="140" y="600" font-size="24" fill="#FFFFFF" opacity="0.9">并准确掌握"鱼咬尾"（衔尾式）的旋律发展技法。</text>
  
  <line x1="140" y1="700" x2="580" y2="700" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  <text x="360" y="745" font-size="22" fill="#FFFFFF" opacity="0.7" text-anchor="middle">人教版小学音乐 · 二年级</text>
  <text x="360" y="780" font-size="20" fill="#FFFFFF" opacity="0.5" text-anchor="middle">教学实践周期：4周</text>
  
  <!-- Right panel: Steps -->
  <!-- Step 1 -->
  <rect x="680" y="180" width="1160" height="240" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="680" y="180" width="8" height="240" rx="4" fill="#F5A623"/>
  <circle cx="740" cy="300" r="40" fill="url(#practiceGrad)"/>
  <text x="740" y="314" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="600">1</text>
  <text x="800" y="270" font-size="30" fill="#2C1810" font-weight="600">情景激趣</text>
  <text x="800" y="310" font-size="24" fill="#5A5D75">融合地域文化与现代技术，利用AI数字人与VR全景技术</text>
  <text x="800" y="345" font-size="24" fill="#5A5D75">创设沉浸式沂蒙山情境</text>
  <rect x="800" y="365" width="95" height="36" rx="18" fill="#F0F2F5"/>
  <text x="847" y="390" font-size="18" fill="#E86A2A" text-anchor="middle">TCK</text>
  <rect x="905" y="365" width="95" height="36" rx="18" fill="#F0F2F5"/>
  <text x="952" y="390" font-size="18" fill="#E86A2A" text-anchor="middle">TPK</text>
  <rect x="1000" y="210" width="480" height="190" rx="8" fill="#F0F2F5" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1240" y="295" font-size="22" text-anchor="middle" fill="#8C8C8C">VR全景教学场景图</text>
  <text x="1240" y="330" font-size="20" text-anchor="middle" fill="#BFBFBF">IMAGE</text>
  
  <!-- Step 2 -->
  <rect x="680" y="440" width="1160" height="240" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="680" y="440" width="8" height="240" rx="4" fill="#F5A623"/>
  <circle cx="740" cy="560" r="40" fill="url(#practiceGrad)"/>
  <text x="740" y="574" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="600">2</text>
  <text x="800" y="530" font-size="30" fill="#2C1810" font-weight="600">乐知探究</text>
  <text x="800" y="570" font-size="24" fill="#5A5D75">利用希沃白板动态演示"鱼咬尾"旋律线条；设计</text>
  <text x="800" y="605" font-size="24" fill="#5A5D75">"旋律排序"游戏引导自主发现规律</text>
  <rect x="800" y="625" width="120" height="36" rx="18" fill="#F0F2F5"/>
  <text x="860" y="650" font-size="18" fill="#E86A2A" text-anchor="middle">TPACK</text>
  <rect x="930" y="625" width="120" height="36" rx="18" fill="#F0F2F5"/>
  <text x="990" y="650" font-size="18" fill="#E86A2A" text-anchor="middle">深度融合</text>
  <rect x="1000" y="470" width="480" height="190" rx="8" fill="#F0F2F5" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1240" y="555" font-size="22" text-anchor="middle" fill="#8C8C8C">希沃白板演示截图</text>
  <text x="1240" y="590" font-size="20" text-anchor="middle" fill="#BFBFBF">IMAGE</text>
  
  <!-- Step 3 -->
  <rect x="680" y="700" width="1160" height="240" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <rect x="680" y="700" width="8" height="240" rx="4" fill="#F5A623"/>
  <circle cx="740" cy="820" r="40" fill="url(#practiceGrad)"/>
  <text x="740" y="834" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="600">3</text>
  <text x="800" y="790" font-size="30" fill="#2C1810" font-weight="600">拓展审美</text>
  <text x="800" y="830" font-size="24" fill="#5A5D75">借助"库乐队"软件让学生实时切换不同乐器音色</text>
  <text x="800" y="865" font-size="24" fill="#5A5D75">进行演奏对比，提升审美鉴赏能力</text>
  <rect x="800" y="885" width="95" height="36" rx="18" fill="#F0F2F5"/>
  <text x="847" y="910" font-size="18" fill="#E86A2A" text-anchor="middle">TPK</text>
  <rect x="905" y="885" width="95" height="36" rx="18" fill="#F0F2F5"/>
  <text x="952" y="910" font-size="18" fill="#E86A2A" text-anchor="middle">TCK</text>
  <rect x="1000" y="730" width="480" height="190" rx="8" fill="#F0F2F5" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="1240" y="815" font-size="22" text-anchor="middle" fill="#8C8C8C">库乐队教学应用截图</text>
  <text x="1240" y="850" font-size="20" text-anchor="middle" fill="#BFBFBF">IMAGE</text>
  
  <!-- Bottom decorative element -->
  <line x1="80" y1="960" x2="1840" y2="960" stroke="#F5A623" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="960" y="995" font-size="18" text-anchor="middle" fill="#8B7355" letter-spacing="2">基于TPACK理论的小学音乐欣赏教学实践研究</text>
  <text x="960" y="1025" font-size="16" text-anchor="middle" fill="#8B7355" letter-spacing="1">XX师范大学 · 音乐学院</text>
</svg>
