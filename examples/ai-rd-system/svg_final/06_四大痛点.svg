    <text x="76" y="66" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="24" font-weight="800" fill="#0F172A">决策无序</text>
    <text x="32" y="120" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" fill="#94A3B8">传统模式</text>
    <text x="32" y="148" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">标准缺失，成果碎片化、难复用，</text>
    <text x="32" y="174" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">决策质量依赖个人经验，波动性大。</text>
    <text x="32" y="220" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" fill="#059669">双引擎方案</text>
    <text x="32" y="248" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#059669">统一决策模型与日志沉淀，形成研发资产，</text>
    <text x="32" y="274" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#059669">让每一次决策都可追溯、可优化、可复用。</text>
  </g>

