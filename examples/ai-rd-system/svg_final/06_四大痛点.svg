    </g>
    <text x="76" y="66" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="24" font-weight="800" fill="#0F172A">认知偏差</text>
    <text x="32" y="120" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" fill="#94A3B8">传统模式</text>
    <text x="32" y="148" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">创新与爆款共用逻辑，新品被存量数据误杀，</text>
    <text x="32" y="174" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">导致高潜力创新项目过早夭折。</text>
    <text x="32" y="220" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" fill="#059669">双引擎方案</text>
    <text x="32" y="248" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#059669">独立数据、推理与权重，兼顾增量与盈利，</text>
    <text x="32" y="274" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#059669">让创新与爆款各循其道、协同发展。</text>
  </g>

  <g transform="translate(970, 260)">
