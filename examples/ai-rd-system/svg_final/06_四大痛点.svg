<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">

  <rect width="1920" height="1080" fill="#F8FAFC"/>
  <text x="80" y="95" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#4F46E5">PAIN POINTS · 行业痛点</text>
  <text x="80" y="160" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="42" font-weight="800" fill="#0F172A">双引擎架构解决的四大核心行业痛点</text>
  <text x="80" y="205" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="18" font-weight="300" fill="#475569">把问题、机制、价值压缩为一眼可读的决策矩阵。</text>

  <g transform="translate(80, 260)">
    <rect width="870" height="320" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <g transform="translate(32, 40) scale(1.75)" fill="#4F46E5">
