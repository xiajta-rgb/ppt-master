    </g>
    <text x="76" y="66" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="24" font-weight="800" fill="#0F172A">设计浅层</text>
    <text x="32" y="120" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" fill="#94A3B8">传统模式</text>
    <text x="32" y="148" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">只复刻外观，持续继承竞品缺陷，陷入</text>
    <text x="32" y="174" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">同质化内卷，无法形成真正差异化优势。</text>
    <text x="32" y="220" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" fill="#059669">双引擎方案</text>
    <text x="32" y="248" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#059669">拆解产品DNA与因果需求，实现优取劣避，</text>
    <text x="32" y="274" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#059669">从根源上构建产品核心竞争力。</text>
  </g>

  <g transform="translate(80, 610)">
    <rect width="870" height="320" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <g transform="translate(32, 40) scale(1.75)" fill="#4F46E5">
