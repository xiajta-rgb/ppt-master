    </g>
    <text x="76" y="66" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="24" font-weight="800" fill="#0F172A">创新乏力</text>
    <text x="32" y="120" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" fill="#94A3B8">传统模式</text>
    <text x="32" y="148" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">依赖成熟赛道，缺少新兴趋势捕捉，</text>
    <text x="32" y="174" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">错失蓝海窗口期，长期增长动能不足。</text>
    <text x="32" y="220" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" fill="#059669">双引擎方案</text>
    <text x="32" y="248" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#059669">全域追踪趋势与供需缺口，提前布局蓝海，</text>
    <text x="32" y="274" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#059669">构建短期盈利与长期增长的双轮驱动。</text>
  </g>

  <g transform="translate(970, 610)">
