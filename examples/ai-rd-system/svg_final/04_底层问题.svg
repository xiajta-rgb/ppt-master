<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">

  <rect width="1920" height="1080" fill="#F8FAFC"/>
  
  <!-- Kicker with icon -->
  <!-- icon: chunk/triangle-exclamation -->
  <g transform="translate(80, 83) scale(1.25)" fill="#4F46E5">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M16 15H0V12L7 0H9L16 12V15ZM7 4H9V9H7V4ZM7 11H9V13H7V11Z"/>
  </g>
  <text x="80" y="95" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#4F46E5">PROBLEM · 问题诊断</text>
  
  <text x="80" y="160" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="42" font-weight="800" fill="#0F172A">传统研发与AI选品的核心底层问题</text>
  <text x="80" y="200" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="18" font-weight="300" fill="#475569">并非设计能力不足，而是研发任务无分层、选品逻辑无拆分、评价体系无适配。</text>

  <g transform="translate(80, 240)">
    <rect width="1760" height="130" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="4" height="130" rx="2" fill="#4F46E5"/>
    <text x="44" y="78" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="38" font-weight="900" fill="#4F46E5">01</text>
    <text x="110" y="58" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="20" font-weight="800" fill="#0F172A">任务无分层</text>
    <text x="110" y="92" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">混淆创新探索与爆款复用两类本质不同的研发场景，用同一套逻辑覆盖全场景。</text>
  </g>

  <g transform="translate(80, 382)">
    <rect width="1760" height="130" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="4" height="130" rx="2" fill="#4F46E5"/>
    <text x="44" y="78" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="38" font-weight="900" fill="#4F46E5">02</text>
    <text x="110" y="58" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="20" font-weight="800" fill="#0F172A">逻辑一刀切</text>
    <text x="110" y="92" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">单权重、单推理链路、单评价体系，放大研发弊端，无法适配两类任务的决策需求。</text>
  </g>

  <g transform="translate(80, 524)">
    <rect width="1760" height="130" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="4" height="130" rx="2" fill="#4F46E5"/>
    <text x="44" y="78" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="38" font-weight="900" fill="#4F46E5">03</text>
    <text x="110" y="58" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="20" font-weight="800" fill="#0F172A">创新款评价失准</text>
    <text x="110" y="92" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">用成熟爆款的市场验证逻辑评判无历史数据的创新新品，优质新兴机会被误判淘汰。</text>
  </g>

  <g transform="translate(80, 666)">
    <rect width="1760" height="130" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="4" height="130" rx="2" fill="#4F46E5"/>
    <text x="44" y="78" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="38" font-weight="900" fill="#4F46E5">04</text>
    <text x="110" y="58" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="20" font-weight="800" fill="#0F172A">爆款拆解浅层化</text>
    <text x="110" y="92" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">仅复刻市面爆款成品外观，不拆解底层成功基因，持续继承竞品缺陷。</text>
  </g>

  <g transform="translate(80, 808)">
    <rect width="1760" height="130" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="4" height="130" rx="2" fill="#4F46E5"/>
    <text x="44" y="78" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="38" font-weight="900" fill="#4F46E5">05</text>
    <text x="110" y="58" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="20" font-weight="800" fill="#0F172A">主观审美 · 无前置风控 · 无差异化模型</text>
    <text x="110" y="92" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">凭数据存量评判产品价值，不预判未来趋势增量，研发投入空耗。</text>
  </g>

  <g transform="translate(80, 1025)">
    <line x1="0" y1="0" x2="1760" y2="0" stroke="#CBD5E1" stroke-width="1"/>
    <text x="0" y="36" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="13" fill="#94A3B8">第一章：认知破局</text>
    <text x="1760" y="36" text-anchor="end" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="13" fill="#94A3B8">04 / 39</text>
  </g>
  <!-- icon: chunk/circle-exclamation -->
  <g transform="translate(1792.0, 64.0) scale(3.0)" fill="#4F46E5">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16ZM7 9V3H9V9H7ZM7 13V11H9V13H7Z"/>
  </g>
</svg>