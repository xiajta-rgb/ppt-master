<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F7F8FA"/><text x="80" y="88" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="800" fill="#1664FF">37</text><line x1="120" y1="82" x2="176" y2="82" stroke="#1664FF" stroke-width="2"/><text x="196" y="88" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="700" fill="#86909C">AI PRODUCT INTELLIGENCE OS</text><text x="80" y="174" font-family="Microsoft YaHei,Arial,sans-serif" font-size="52" font-weight="800" fill="#161823">双引擎分层研发 VS 传统单一研发</text><text x="80" y="228" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="400" fill="#4E5969">从单链路试错升级为分层研发资产：短期盈利有保障，长期创新有布局。</text><line x1="80" y1="1016" x2="1840" y2="1016" stroke="#E5E6EB" stroke-width="2"/><text x="80" y="1050" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="400" fill="#86909C">AI双引擎产品智能研发体系</text><text x="1840" y="1050" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="400" fill="#86909C" text-anchor="end">37 / 39</text><rect x="80" y="300" width="850" height="145" rx="12" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1"/><text x="105" y="342" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="800" fill="#161823">研发逻辑</text><text x="105" y="383" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="800" fill="#F53F3F">传统</text><text x="185" y="383" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="400" fill="#4E5969">一刀切单链路</text><text x="105" y="420" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="800" fill="#1664FF">双引擎</text><text x="185" y="420" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="600" fill="#161823">探索 / 利用独立研判</text><rect x="970" y="300" width="850" height="145" rx="12" fill="#FFFFFF" stroke="#E5