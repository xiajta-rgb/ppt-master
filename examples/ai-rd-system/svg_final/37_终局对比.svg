ont-size="14" font-weight="800" fill="#1664FF">双引擎</text><text x="1075" y="595" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="600" fill="#161823">分层前置风控，降本避险</text><rect x="80" y="650" width="1760" height="145" rx="12" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1"/><text x="105" y="692" font-family="Microsoft YaHei,Arial,sans-serif" font-size="20" font-weight="800" fill="#161823">长期价值</text><text x="105" y="733" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="800" fill="#F53F3F">传统</text><text x="185" y="733" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="400" fill="#4E5969">只能复刻存量</text><text x="105" y="770" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="800" fill="#1664FF">双引擎</text><text x="185" y="770" font-family="Microsoft YaHei,Arial,sans-serif" font-size="17" font-weight="600" fill="#161823">数据、规则与决策经验持续进化</text><rect x="1470" y="52" width="370" height="184" rx="12" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1"/><rect x="1488" y="70" width="112" height="148" rx="8" fill="#F2F3F5"/><path d="M1502 195 L1533 160 L1552 178 L1578 144 L1588 195 Z" fill="#E5E6EB"/><circle cx="1571" cy="100" r="9" fill="#E5E6EB"/><text x="1620" y="98" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="800" fill="#1664FF">VISUAL SLOT</text><line x1="1620" y1="111" x2="1672" y2="111" stroke="#1664FF" stroke-width="2"/><text x="1620" y="145" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="24" fill="#161823">体系复盘 / 管理评估场景</text><text x="1620" y="203" font-family="Microsoft YaHei,Arial,sans-serif" font-size="13" font-weight="400" fill="#86909C">待置入项目情境图</text></svg>