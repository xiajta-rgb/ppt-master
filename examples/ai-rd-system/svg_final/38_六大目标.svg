    <text x="280" y="160" text-anchor="middle" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="24" font-weight="800" fill="#0F172A">沉淀资产</text>
    <text x="40" y="200" text-anchor="start" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">形成企业专属分层研发数字资产</text>
    <text x="40" y="228" text-anchor="start" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">可复用、可迭代、可持续进化</text>
  </g>

  <g transform="translate(1280, 580)">
    <rect width="560" height="330" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="280" cy="80" r="48" fill="#4F46E5" fill-opacity="0.12"/>
    <!-- icon: chunk/rocket -->
    <g transform="translate(250, 48) scale(3.75)" fill="#4F46E5">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M10 16L12 14V10L13.6569 8.34314C15.1571 6.84285 16 4.80802 16 2.68629V0H13.3137C11.192 0 9.15714 0.842855 7.65685 2.34315L6 4H2L0 6L10 16ZM10.5 7C11.3284 7 12 6.32843 12 5.5C12 4.67157 11.3284 4 10.5 4C9.67157 4 9 4.67157 9 5.5C9 6.32843 9.67157 7 10.5 7Z"/>
      <path d="M4.9274 13.7558L2.24423 11.0726L0 15L1 16L4.9274 13.7558Z"/>
