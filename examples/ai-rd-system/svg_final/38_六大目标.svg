    <text x="40" y="200" text-anchor="start" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">双路径精准锁定研发方向，兼顾</text>
    <text x="40" y="228" text-anchor="start" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">创新突破与爆款优化双重目标</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(80, 580)">
