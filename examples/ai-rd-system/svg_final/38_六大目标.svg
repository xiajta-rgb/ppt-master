<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#F8FAFC"/>
  
  <!-- Kicker with icon -->
  <!-- icon: chunk/trophy -->
  <g transform="translate(80, 83) scale(1.25)" fill="#4F46E5">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M4 0H12V2H16V4C16 6.45641 14.2286 8.49909 11.8936 8.92038C11.5537 10.3637 10.432 11.5054 9 11.874V14H12V16H4V14H7V11.874C5.56796 11.5054 4.44628 10.3637 4.1064 8.92038C1.77136 8.49909 0 6.45641 0 4V2H4V0ZM12 6.82929V4H14C14 5.30622 13.1652 6.41746 12 6.82929ZM4 4H2C2 5.30622 2.83481 6.41746 4 6.82929V4Z"/>
  </g>
  <text x="80" y="95" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#4F46E5">SUMMARY · 终极总结</text>
  
  <text x="80" y="160" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="42" font-weight="800" fill="#0F172A">体系终极价值：六大核心目标</text>

  <!-- Row 1 -->
  <g transform="translate(80, 220)">
    <rect width="560" height="330" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Icon circle background -->
    <circle cx="280" cy="80" r="48" fill="#4F46E5" fill-opacity="0.12"/>
    <!-- icon: chunk/coin -->
    <g transform="translate(252, 52) scale(3.5)" fill="#4F46E5">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16ZM9 5H7V11H9V5Z"/>
    </g>
    <text x="280" y="160" text-anchor="middle" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="24" font-weight="800" fill="#0F172A">降本</text>
    <text x="40" y="200" text-anchor="start" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">减少无效立项盲目改版，压缩80%</text>
    <text x="40" y="228" text-anchor="start" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">前置调研时间，降低研发试错成本</text>
  </g>

  <g transform="translate(680, 220)">
    <rect width="560" height="330" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="280" cy="80" r="48" fill="#4F46E5" fill-opacity="0.12"/>
