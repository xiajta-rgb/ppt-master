    <circle cx="280" cy="80" r="48" fill="#4F46E5" fill-opacity="0.12"/>
    <!-- icon: chunk/shield (for 避险) - using shield-check style, but we use shield -->
    <g transform="translate(248, 48) scale(4.0)" fill="#4F46E5">
      <path d="M4.35009 13.3929L8 16L11.6499 13.3929C13.7523 11.8912 15 9.46667 15 6.88306V3L8 0L1 3V6.88306C1 9.46667 2.24773 11.8912 4.35009 13.3929Z"/>
    </g>
    <text x="280" y="160" text-anchor="middle" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="24" font-weight="800" fill="#0F172A">避险</text>
    <text x="40" y="200" text-anchor="start" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">分层前置风控，精准规避创新误区</text>
    <text x="40" y="228" text-anchor="start" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">与爆款复刻缺陷，降低研发风险</text>
  </g>

  <g transform="translate(680, 580)">
    <rect width="560" height="330" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="280" cy="80" r="48" fill="#4F46E5" fill-opacity="0.12"/>
    <!-- icon: chunk/archive-box -->
