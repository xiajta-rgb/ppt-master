<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">

  <rect width="1920" height="1080" fill="#F8FAFC"/>
  <text x="80" y="95" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#4F46E5">DUAL ENGINE · 双引擎差异</text>
  <text x="80" y="160" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="42" font-weight="800" fill="#0F172A">创新选品引擎 vs 爆款选品引擎</text>

  <!-- Left Card: Explore -->
  <g transform="translate(80, 220)">
    <rect width="840" height="720" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="840" height="56" rx="12" fill="#ECFDF5" stroke="transparent"/>
    <!-- icon: chunk/magnifying-glass -->
    <g transform="translate(24, 18) scale(1.5)" fill="#0891B2">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M11.1922 12.6064C10.0236 13.4816 8.57234 14 7 14C3.13401 14 0 10.866 0 7C0 3.13401 3.13401 0 7 0C10.866 0 14 3.13401 14 7C14 8.57234 13.4816 10.0236 12.6064 11.1922L15.7071 14.2929L14.2929 15.7071L11.1922 12.6064ZM5.58579 8.41421L4.17157 9.82843C2.60948 8.26633 2.60948 5.73367 4.17157 4.17157C5.73367 2.60948 8.26633 2.60948 9.82843 4.17157L8.41421 5.58579C7.63316 4.80474 6.36683 4.80474 5.58579 5.58579C4.80474 6.36684 4.80474 7.63316 5.58579 8.41421Z"/>
    </g>
    <text x="56" y="38" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#0891B2">EXPLORE 探索型</text>
    
    <g transform="translate(32, 90)">
      <text x="0" y="0" font-size="16" font-weight="700" fill="#0F172A" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">核心定位</text>
      <text x="0" y="28" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">未知需求正向探索，挖掘未来市场增量</text>
      
      <text x="0" y="80" font-size="16" font-weight="700" fill="#0F172A" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">核心问题</text>
      <text x="0" y="108" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">未来什么会火？用户潜在需求是什么？</text>
      
      <text x="0" y="160" font-size="16" font-weight="700" fill="#0F172A" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">核心逻辑</text>
      <text x="0" y="188" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">新兴趋势信号、用户需求变化、供需空白</text>
      <text x="0" y="212" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">计算、原创产品创新</text>
      
      <text x="0" y="264" font-size="16" font-weight="700" fill="#0F172A" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">数据源</text>
      <text x="0" y="292" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">TikTok/Instagram/WGSN/Google趋势</text>
      <text x="0" y="316" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">时装周/面料技术/专利文献</text>
      
      <text x="0" y="368" font-size="16" font-weight="700" fill="#0F172A" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">评价权重</text>
      <text x="0" y="396" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">趋势势能 40%，需求强度 30%</text>
      <text x="0" y="420" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">供需缺口 20%，技术可行性 10%</text>
    </g>
  </g>

  <!-- Middle Arrow Separator -->
  <!-- icon: chunk/arrows-left-right -->
  <g transform="translate(936, 540) scale(3.0)" fill="#94A3B8">
    <path d="M6 9L6 13L5 13L-3.15903e-06 8L5 3L6 3L6 7L10 7L10 3L11 3L16 8L11 13L10 13L10 9L6 9Z"/>
  </g>

  <!-- Right Card: Utilize -->
  <g transform="translate(1000, 220)">
    <rect width="840" height="720" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="840" height="56" rx="12" fill="#FFFBEB" stroke="transparent"/>
    <!-- icon: chunk/wrench -->
    <g transform="translate(24, 18) scale(1.5)" fill="#D97706">
      <path d="M10 3.5L13.0581 0.441881C12.4304 0.15802 11.7337 0 11 0C8.23858 0 6 2.23858 6 5C6 5.45802 6.06158 5.90165 6.17692 6.32308L0 12.5L3.5 16L9.67692 9.82308C10.0983 9.93842 10.542 10 11 10C13.7614 10 16 7.76142 16 5C16 4.26633 15.842 3.56956 15.5581 2.94188L12.5 6H10V3.5Z"/>
    </g>
    <text x="56" y="38" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#D97706">UTILIZE 利用型</text>
    
    <g transform="translate(32, 90)">
      <text x="0" y="0" font-size="16" font-weight="700" fill="#0F172A" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">核心定位</text>
      <text x="0" y="28" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">成熟机会逆向解析，复制优化现有成功模式</text>
      
      <text x="0" y="80" font-size="16" font-weight="700" fill="#0F172A" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">核心问题</text>
      <text x="0" y="108" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">现在什么卖得好？为什么卖得好？</text>
      
      <text x="0" y="160" font-size="16" font-weight="700" fill="#0F172A" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">核心逻辑</text>
      <text x="0" y="188" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">爆款数据验证、产品DNA拆解、用户因果</text>
      <text x="0" y="212" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">需求挖掘、缺陷优化迭代</text>
      
      <text x="0" y="264" font-size="16" font-weight="700" fill="#0F172A" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">数据源</text>
      <text x="0" y="292" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">亚马逊BSR、销量排名、价格波动</text>
      <text x="0" y="316" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">Review、问答、Listing参数</text>
      
      <text x="0" y="368" font-size="16" font-weight="700" fill="#0F172A" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">评价权重</text>
      <text x="0" y="396" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">市场验证 40%，爆款基因匹配 30%</text>
      <text x="0" y="420" font-size="15" fill="#475569" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif">竞争空间 20%，优化空间 10%</text>
    </g>
  </g>

  <g transform="translate(80, 1025)">
    <line x1="0" y1="0" x2="1760" y2="0" stroke="#CBD5E1" stroke-width="1"/>
