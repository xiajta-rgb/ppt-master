    <text x="24" y="136" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" fill="#475569">捕捉海外新兴穿搭趋势、生活方式变</text>
    <text x="24" y="160" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" fill="#475569">化、面料技术风口，识别增量萌芽赛道。</text>
    <rect x="24" y="620" width="80" height="28" rx="14" fill="#EEF2FF"/>
    <text x="64" y="638" text-anchor="middle" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="11" font-weight="700" fill="#4F46E5">趋势取舍</text>
  </g>

  <g transform="translate(436, 230)">
    <rect width="336" height="680" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
