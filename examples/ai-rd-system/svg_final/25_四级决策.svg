<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <rect width="1920" height="1080" fill="#F8FAFC"/>
    <!-- icon: chunk/list -->
  <g transform="translate(80.0, 83.0) scale(1.0)" fill="#4F46E5">
    <path d="M3 1H1V3H3V1Z"/><path d="M3 5H1V7H3V5Z"/><path d="M1 9H3V11H1V9Z"/><path d="M3 13H1V15H3V13Z"/><path d="M15 1H5V3H15V1Z"/><path d="M15 5H5V7H15V5Z"/><path d="M5 9H15V11H5V9Z"/><path d="M15 13H5V15H15V13Z"/>
  </g>
<text x="80" y="95" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#4F46E5">DECISION · 四级决策</text>
  <text x="80" y="160" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="42" font-weight="800" fill="#0F172A">统一立项四级决策标准</text>
  <text x="80" y="205" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="18" font-weight="300" fill="#475569">两套权重体系、同一立项标准、分层价值解读</text>

  <g transform="translate(80, 260)">
    <rect width="422" height="640" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="422" height="6" fill="#059669"/>
    <text x="32" y="80" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#059669">Tier 01</text>
    <text x="32" y="170" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="64" font-weight="900" fill="#0F172A">80-100</text>
    <text x="32" y="240" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="28" font-weight="800" fill="#0F172A">重仓研发</text>
    <rect x="32" y="290" width="358" height="1" fill="#E2E8F0"/>
    <text x="32" y="350" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">全力投入打版、细化工艺、优先排产、</text>
    <text x="32" y="380" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">重点打磨，确保产品力达到行业顶级</text>
    <text x="32" y="410" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">水平，作为战略级产品推向市场。</text>
    <rect x="32" y="480" width="358" height="1" fill="#E2E8F0"/>
    <text x="32" y="530" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" fill="#059669">适用场景</text>
    <text x="32" y="568" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" fill="#475569">• 创新引擎高潜蓝海项目</text>
    <text x="32" y="594" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" fill="#475569">• 爆款引擎确定性爆款</text>
  </g>

  <g transform="translate(526, 260)">
    <rect width="422" height="640" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="422" height="6" fill="#4F46E5"/>
    <text x="32" y="80" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#4F46E5">Tier 02</text>
    <text x="32" y="170" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="64" font-weight="900" fill="#0F172A">60-79</text>
    <text x="32" y="240" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="28" font-weight="800" fill="#0F172A">常规研发</text>
    <rect x="32" y="290" width="358" height="1" fill="#E2E8F0"/>
    <text x="32" y="350" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">标准流程打版、常规工艺打磨、小批</text>
    <text x="32" y="380" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">量试产，根据市场反馈决定是否扩</text>
    <text x="32" y="410" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">大生产规模。</text>
    <rect x="32" y="480" width="358" height="1" fill="#E2E8F0"/>
    <text x="32" y="530" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" fill="#4F46E5">适用场景</text>
    <text x="32" y="568" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" fill="#475569">• 有一定潜力的创新款</text>
    <text x="32" y="594" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" fill="#475569">• 常规迭代升级产品</text>
  </g>

  <g transform="translate(972, 260)">
    <rect width="422" height="640" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="422" height="6" fill="#D97706"/>
    <text x="32" y="80" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#D97706">Tier 03</text>
    <text x="32" y="170" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="64" font-weight="900" fill="#0F172A">40-59</text>
    <text x="32" y="240" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="28" font-weight="800" fill="#0F172A">谨慎研发</text>
    <rect x="32" y="290" width="358" height="1" fill="#E2E8F0"/>
    <text x="32" y="350" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">简化工艺、极小批量试版、严控研发</text>
    <text x="32" y="380" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">投入，仅用于验证市场反应或补充</text>
    <text x="32" y="410" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">产品线宽度。</text>
    <rect x="32" y="480" width="358" height="1" fill="#E2E8F0"/>
    <text x="32" y="530" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" fill="#D97706">适用场景</text>
    <text x="32" y="568" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" fill="#475569">• 不确定性高的试探款</text>
    <text x="32" y="594" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" fill="#475569">• 边缘品类补充款</text>
  </g>

  <g transform="translate(1418, 260)">
    <rect width="422" height="640" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <rect width="422" height="6" fill="#DC2626"/>
    <text x="32" y="80" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#DC2626">Tier 04</text>
    <text x="32" y="170" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="64" font-weight="900" fill="#0F172A">&lt;40</text>
    <text x="32" y="240" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="28" font-weight="800" fill="#0F172A">终止研发</text>
    <rect x="32" y="290" width="358" height="1" fill="#E2E8F0"/>
    <text x="32" y="350" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">直接驳回立项、停止所有研发投入，</text>
    <text x="32" y="380" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">避免资源浪费在低价值项目上，将</text>
    <text x="32" y="410" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">资源集中到高潜项目。</text>
    <rect x="32" y="480" width="358" height="1" fill="#E2E8F0"/>
    <text x="32" y="530" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" font-weight="700" fill="#DC2626">适用场景</text>
    <text x="32" y="568" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" fill="#475569">• 明显不符合战略方向</text>
    <text x="32" y="594" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="14" fill="#475569">• 市场空间小且无优势</text>
  </g>

  <g transform="translate(80, 1025)">
    <line x1="0" y1="0" x2="1760" y2="0" stroke="#CBD5E1" stroke-width="1"/>
    <text x="0" y="36" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="13" fill="#94A3B8">第三章：工程化打分体系</text>
    <text x="1760" y="36" text-anchor="end" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="13" fill="#94A3B8">25 / 39</text>
  </g>
  <!-- icon: chunk/layers -->
  <g transform="translate(1792.0, 64.0) scale(3.0)" fill="#4F46E5">
    <path d="M1 5V3L8 0L15 3V5L8 8L1 5Z"/>
    <path d="M8 16L1 13V11L8 14L15 11V13L8 16Z"/>
    <path d="M1 9L8 12L15 9V7L8 10L1 7V9Z"/>
  </g>
</svg>