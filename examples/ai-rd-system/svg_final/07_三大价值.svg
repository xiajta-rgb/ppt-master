    <text x="288" y="148" text-anchor="middle" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="26" font-weight="800" fill="#0F172A">标准化沉淀</text>
    <text x="40" y="210" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">两类路径均有可溯源数据、可复现推理</text>
    <text x="40" y="238" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">链路、可复用物料台账、差异化评价标</text>
    <text x="40" y="266" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">准，形成企业专属分层研发数字资产，</text>
    <text x="40" y="294" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="16" fill="#475569">彻底告别经验化、碎片化传统研发模式。</text>
    <rect x="40" y="360" width="496" height="1" fill="#E2E8F0"/>
    <text x="40" y="410" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="15" font-weight="700" fill="#4F46E5">核心收益</text>
    <text x="40" y="448" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="15" fill="#475569">• 决策全链路可追溯</text>
    <text x="40" y="478" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="15" fill="#475569">• 研发资产持续积累</text>
    <text x="40" y="508" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="15" fill="#475569">• 新人上手周期缩短</text>
    <text x="40" y="538" font-family="&quot;Inter&quot;,&quot;Noto Sans SC&quot;,sans-serif" font-size="15" fill="#475569">• 知识沉淀形成壁垒</text>
  </g>

