        <text x="170" y="66" text-anchor="middle" fill="#6e6e73" font-family="Inter, sans-serif" font-size="7">水洗黑</text>

        <rect x="210" y="0" width="60" height="40" rx="4" fill="#C4A882"/>
        <text x="240" y="55" text-anchor="middle" fill="#86868b" font-family="Inter, sans-serif" font-size="8">Sand</text>
        <text x="240" y="66" text-anchor="middle" fill="#6e6e73" font-family="Inter, sans-serif" font-size="7">沙色</text>

        <rect x="280" y="0" width="60" height="40" rx="4" fill="#F5F5DC"/>
        <text x="310" y="55" text-anchor="middle" fill="#86868b" font-family="Inter, sans-serif" font-size="8">Beige</text>
        <text x="310" y="66" text-anchor="middle" fill="#6e6e73" font-family="Inter, sans-serif" font-size="7">米色</text>
