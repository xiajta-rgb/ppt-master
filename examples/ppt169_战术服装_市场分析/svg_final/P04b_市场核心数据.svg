          <rect x="400" y="2" width="218" height="18" rx="3" fill="url(#barGradient)" opacity="0.6"/>
          <text x="628" y="16" fill="#c9a962" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="700">415</text>
          <text x="1040" y="16" fill="#86868b" font-family="Inter, sans-serif" font-size="12">16.9%</text>
        </g>

