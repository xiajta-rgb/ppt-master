<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a962"/>
      <stop offset="100%" stop-color="#e0c882"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(201,169,98,0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGradient)"/>
  <ellipse cx="640" cy="360" rx="600" ry="350" fill="url(#heroGlow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accentGradient)"/>

  <text x="640" y="260" text-anchor="middle" fill="#c9a962" font-family="Space Grotesk, Inter, sans-serif" font-size="14" font-weight="600" letter-spacing="6" opacity="0.6">CHAPTER 05</text>
  <text x="640" y="330" text-anchor="middle" fill="#f5f5f7" font-family="'Space Grotesk', Inter, sans-serif" font-size="48" font-weight="700">品牌竞争格局</text>
  <rect x="540" y="350" width="200" height="3" fill="url(#accentGradient)"/>
  <text x="640" y="400" text-anchor="middle" fill="#86868b" font-family="Inter, sans-serif" font-size="16">价格带矩阵 / 头部品牌策略 / 生命周期研判</text>

  <g transform="translate(640, 470)" fill="#6e6e73" font-family="Inter, sans-serif" font-size="12">
    <text x="-200" y="0">5.1 四档价格带品牌矩阵与定位</text>
    <text x="-200" y="22">5.2 头部品牌差异化策略</text>
    <text x="50" y="0">5.3 行业生命周期阶段研判</text>
  </g>

  <rect x="0" y="716" width="1280" height="4" fill="url(#accentGradient)"/>
</svg>