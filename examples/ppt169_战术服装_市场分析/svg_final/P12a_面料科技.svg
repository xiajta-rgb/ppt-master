      <text x="15" y="82" fill="#c9a962" font-family="Space Grotesk, sans-serif" font-size="10" font-weight="600">克重</text>
      <text x="60" y="82" fill="#86868b" font-family="Inter, sans-serif" font-size="10">200-500D（丹尼尔），工装常用330D/500D</text>
